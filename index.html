<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D4E">
<title>YHCT 15 phút</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#E9EFEB; --card:#F7FAF8; --ink:#1D2A26; --muted:#5E6E68; --line:#C6D2CC;
 --jade:#2F5D4E; --jade-soft:#D5E4DC; --seal:#A3312A; --gold:#A87A2C; --ok:#2E7D57; --bad:#A3312A;
 --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
 --serif:"Noto Serif",Georgia,"Times New Roman",serif;
 --han:"Noto Serif SC","Songti SC","SimSun",serif;
 box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#121917; --card:#1A2421; --ink:#E4ECE8; --muted:#94A69F; --line:#2C3A35;
 --jade:#7DBBA2; --jade-soft:#22352E; --seal:#D4594D; --gold:#D3A653; --ok:#6CC596; --bad:#E07A6F;}}
:root[data-theme="dark"]{--paper:#121917; --card:#1A2421; --ink:#E4ECE8; --muted:#94A69F; --line:#2C3A35;
 --jade:#7DBBA2; --jade-soft:#22352E; --seal:#D4594D; --gold:#D3A653; --ok:#6CC596; --bad:#E07A6F;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);min-height:100%;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.25;margin:0}
h1{font-size:1.75rem} h2{font-size:1.3rem;margin:28px 0 10px} h3{font-size:1.05rem}
p{margin:0 0 12px} .muted{color:var(--muted)} .han{font-family:var(--han);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pg{font-size:.78rem;color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin:4px 0 16px}
th,td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted)}
.tbl{overflow-x:auto}
@media (max-width:440px){table{font-size:.8rem}th,td{padding:6px 3px}td:first-child,th:first-child{padding-left:0}}
.tbl table{min-width:0}
ul{padding-left:20px;margin:0 0 12px} li{margin-bottom:6px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
 padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:10px 4px 12px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
@media (max-width:400px){nav button{font-size:.7rem;white-space:nowrap}}
nav button .ic{font-family:var(--han);font-size:1.25rem;line-height:1}
nav button[aria-current="page"]{color:var(--jade);font-weight:600}

/* seal hero */
.today{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:8px 0 24px}
.seal{width:92px;height:92px;background:var(--seal);color:#FBEFEA;border-radius:6px;display:grid;
 grid-template-columns:1fr 1fr;place-items:center;padding:8px;font-family:var(--han);font-size:1.7rem;line-height:1;
 box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px rgba(255,255,255,.55);transform:rotate(-3deg)}
.today .date{color:var(--muted);font-size:.9rem;margin-bottom:2px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;
 padding:14px 0;border-top:1px solid var(--line);margin:0}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;border:1.5px solid var(--jade);
 color:var(--jade);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.steps li.done::before{content:"✓";background:var(--jade);color:var(--card)}
.steps .t{font-weight:600}.steps .s{font-size:.88rem;color:var(--muted)}
.btn{background:var(--jade);color:var(--card);border:0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--jade);border:1.5px solid var(--jade)}
.btn:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:22px}
.stats div{background:var(--card);padding:12px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:1.4rem}
.stats span{font-size:.8rem;color:var(--muted)}

/* cabinet */
.tang{margin:22px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.tang h3{font-size:1.05rem}
.cab{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;background:#5B3B24;padding:6px;border-radius:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cab{background:#3A271A}}
.dr{aspect-ratio:1.25;background:#C9A57A;border:0;border-radius:2px;position:relative;font-size:.68rem;font-weight:600;color:#4A3020;
 display:flex;align-items:flex-start;justify-content:center;padding-top:4px}
.dr::after{content:"";position:absolute;left:50%;bottom:22%;width:10px;height:4px;border-radius:2px;background:#6B4A2E;transform:translateX(-50%)}
.dr:disabled{opacity:.55;cursor:default}
.dr.ready{background:#E2C79C;box-shadow:0 0 0 2px var(--gold)}
.dr.done{background:var(--jade-soft);color:var(--jade)}
.dr.done::after{background:var(--jade)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}

/* lesson */
.back{background:none;border:0;color:var(--jade);padding:0;margin-bottom:12px;font-weight:600}
.lhead{border-left:4px solid var(--seal);padding-left:12px;margin-bottom:18px}
.lhead .id{font-size:.85rem;color:var(--muted)}
.hook{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-family:var(--serif);font-size:1.02rem}
.sec{font-family:var(--serif);font-size:1.15rem;margin:30px 0 10px;display:flex;align-items:center;gap:8px}
.sec .k{font-family:var(--han);color:var(--seal);font-size:1.2rem}
.check li{list-style:none;margin-left:-20px;padding:6px 0;border-bottom:1px dashed var(--line)}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--jade)}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;margin-bottom:6px}
.opt.right{border-color:var(--ok);background:var(--card);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:var(--card);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.why{font-size:.88rem;color:var(--muted);margin:4px 0 0;display:none}
.answered .why{display:block}
.answered .opt{pointer-events:none}
.answered .opt{cursor:default}
.qscore{font-weight:600;margin:6px 0 0}
textarea{width:100%;min-height:90px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.reveal{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:14px;margin-top:12px}
.terms td:nth-child(2){font-family:var(--han);font-size:1.1rem}
.finish{margin:30px 0 10px;width:100%;padding:13px}
.flags li{font-size:.9rem;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:8px 10px;list-style:none;margin-left:-20px}

/* review */
.fc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 20px;min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.fc .front{font-family:var(--serif);font-size:1.15rem}
.fc .backtxt{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.rate button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:9px 2px;font-size:.85rem}
.rate button small{display:block;color:var(--muted);font-size:.72rem}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}

/* library */
.search{width:100%;font:inherit;color:var(--ink);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--jade);color:var(--card);border-color:var(--jade)}
.tg{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tg img{width:120px;height:90px;object-fit:cover;border-radius:6px;background:var(--line);cursor:zoom-in}
.noimg{width:120px;height:90px;border-radius:6px;background:var(--line)}
.tg .nm{font-weight:600}.tg .nm .han{color:var(--seal);margin-left:6px}
.tg .ds{font-size:.88rem;color:var(--muted);margin:2px 0 4px}
.tg .mn{font-size:.92rem}
.tg .fl{font-size:.8rem;color:var(--gold);margin-top:4px}
.tg .src{font-size:.75rem;color:var(--muted)}
dialog{border:0;border-radius:10px;padding:0;max-width:min(92vw,720px);background:var(--card)}
dialog img{display:block;width:100%}
dialog::backdrop{background:rgba(0,0,0,.6)}
.bk{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.bk h3{margin-bottom:6px}

/* luyện mắt */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.mode button{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:12px 8px;text-align:left}
.mode button b{display:block;font-size:.95rem}.mode button span{font-size:.8rem;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.ph{position:relative;border-radius:8px;overflow:hidden;background:var(--line);margin:8px 0}
.ph img{display:block;width:100%;height:auto}
.phz{position:relative;transform-origin:0 0}
.linkbtn{background:none;border:0;color:var(--jade);text-decoration:underline;padding:0;font-size:inherit}
.bx{position:absolute;border:calc(2px * var(--k,1)) solid #FFD54A;border-radius:3px;box-shadow:0 0 0 calc(1px * var(--k,1)) rgba(0,0,0,.5)}
.bx-t{border-color:#7FD3FF}
.bx i{position:absolute;left:0;top:0;transform:scale(var(--k,1));transform-origin:0 0;background:#FFD54A;color:#222;font-style:normal;font-size:.68rem;padding:1px 4px;border-radius:3px;white-space:nowrap}
.bx-t i{background:#7FD3FF;transform-origin:0 100%}
.ck{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ck label{display:flex;gap:6px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:7px 8px;font-size:.88rem}
.ck label.unsure{border-color:#8E6FC9;border-style:dotted}
.opt.unsure{border-color:#8E6FC9;border-style:dotted}
.giai{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px}
.giai h3{margin-bottom:6px}.giai ul{padding-left:18px}.giai li{margin-bottom:8px;font-size:.92rem}
.gt-k{color:var(--jade);font-weight:600}
.ck label.right{border-color:var(--ok)}.ck label.miss{border-color:var(--gold);border-style:dashed}.ck label.wrong{border-color:var(--bad)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--line);cursor:pointer}
.stat td:nth-child(n+2){text-align:right}
.src-note{font-size:.75rem;color:var(--muted);margin-top:6px}
.note{font-size:.85rem;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.seal{animation:stamp .5s ease-out}
@keyframes stamp{from{transform:scale(1.25) rotate(-8deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}}
</style>
</head>
<body>
<main id="app"></main>
<nav><div class="in" id="nav"></div></nav>
<dialog id="zoom"><img alt="Ảnh lưỡi phóng to" src="data:,"></dialog>
<script>
const LESSON_TITLES = {
1:["Âm dương: nội dung học thuyết","Âm dương: ứng dụng","Ngũ hành: sinh, khắc, thừa, vũ","Ngũ hành: ứng dụng lâm sàng","Thiên nhân hợp nhất","Tinh, khí, thần","Huyết, tân dịch","Tạng Tâm","Tạng Can","Tạng Tỳ","Tạng Phế","Tạng Thận","Lục phủ, phủ kỳ hằng","Quan hệ tạng – tạng","Quan hệ tạng – phủ","Kinh lạc đại cương","Lục dâm (1): phong, hàn, thử","Lục dâm (2): thấp, táo, hỏa","Thất tình","Đàm ẩm, ứ huyết, ăn uống, lao lực","Phòng bệnh"],
2:["Đại cương chẩn đoán","Vọng toàn thân","Vọng từng bộ phận","Vọng chỉ văn, chất tiết","Thiệt chẩn: đại cương","Thiệt chẩn: thần, sắc lưỡi","Thiệt chẩn: hình thái, lạc mạch","Thiệt chẩn: chất rêu","Thiệt chẩn: màu rêu","Thiệt chẩn: kết hợp lưỡi – rêu","Văn chẩn","Vấn hàn nhiệt","Vấn hãn","Vấn đau","Vấn đầu thân, hung phúc","Vấn tai, mắt","Vấn ăn uống","Vấn đại tiểu tiện","Vấn giấc ngủ","Vấn kinh nguyệt, đới hạ","Vấn trẻ em","Mạch: cách bắt, mạch bình thường","Mạch: phù, trầm","Mạch: trì, sác","Mạch: hư, thực","Mạch kiêm, mạch nguy","Xúc chẩn","Bát cương: biểu lý, hàn nhiệt","Bát cương: hư thực, âm dương","Biện chứng khí huyết","Biện chứng tân dịch, đàm ẩm","Tạng phủ: Tâm, Tiểu trường","Tạng phủ: Can, Đởm","Tạng phủ: Tỳ, Vị","Tạng phủ: Phế, Đại trường","Tạng phủ: Thận, Bàng quang","Tạng phủ kiêm bệnh","Biện chứng lục kinh","Vệ khí dinh huyết","Tư duy chẩn đoán 7 bước","Làm bệnh án YHCT"],
3:(()=>{const a=["Trị tắc","Bát pháp","Dược: tứ khí, ngũ vị, quy kinh","Dược: phối ngũ, cấm kỵ, liều"];for(let i=5;i<=30;i++)a.push("Dược theo nhóm thuốc");a.push("Phương tễ đại cương");for(let i=32;i<=60;i++)a.push("Phương tễ theo pháp");a.push("Bào chế: mục đích, phụ liệu","Bào chế: thủy, hỏa chế","Các dạng thuốc","Thuốc độc, quy chế");return a})(),
4:["Cảm mạo","Ho","Hen suyễn","Tăng huyết áp","Mất ngủ","Đau dạ dày","Tiêu chảy","Táo bón","Viêm gan, hoàng đản","Đau lưng","Đau vai gáy","Đau thần kinh tọa","Viêm khớp (tý chứng)","Liệt VII ngoại biên","Di chứng tai biến","Bệnh tiết niệu","Di tinh, liệt dương","Tiêu khát","Phụ khoa, nhi khoa"]
};
const TANG_NAMES={1:"Nền tảng lý luận",2:"Chẩn đoán",3:"Công cụ điều trị",4:"Lâm sàng"};

const LESSONS = {
"2.12": {
 id:"2.12", tang:2, title:"Vấn hàn nhiệt", han:"问寒热", src:"Chẩn đoán YHCT (ĐHYD TP.HCM 2021), tr.109–118",
 hook:"Hai người cùng than “sợ lạnh”. Một người mặc thêm áo thì hết, một người đắp chăn vẫn lạnh. Hai cái “sợ lạnh” này có giống nhau không?",
 reading:`
<p><b>Vì sao hỏi hàn nhiệt đầu tiên?</b> Câu mở đầu của Thập vấn ca (Trương Cảnh Nhạc) là “nhất vấn hàn nhiệt”. Hàn nhiệt cho biết ngay <b>tính chất tà khí</b> và <b>sự thịnh suy của âm dương</b>: dương thịnh thì nhiệt, dương hư thì hàn; âm thịnh thì hàn, âm hư thì nhiệt. <span class="pg">tr.109–111</span></p>
<p><b>Ba mức sợ lạnh</b> <span class="pg">tr.110</span></p>
<table><tr><th>Tên</th><th>Nhận biết</th></tr>
<tr><td>Ố phong</td><td>Gặp gió mới lạnh, tránh gió thì hết</td></tr>
<tr><td>Ố hàn</td><td>Mặc thêm áo, sưởi gần lửa <b>vẫn không hết</b></td></tr>
<tr><td>Úy hàn</td><td>Mặc thêm áo, sưởi <b>thì hết</b></td></tr></table>
<p><b>Bốn loại hàn nhiệt</b> <span class="pg">tr.111–117</span></p>
<table><tr><th>Loại</th><th>Biểu hiện</th><th>Gợi ý</th></tr>
<tr><td>Ố hàn phát nhiệt</td><td>Sợ lạnh và sốt <b>cùng lúc</b></td><td><b>Biểu chứng</b>. Ố hàn nặng, phát nhiệt nhẹ: phong hàn. Phát nhiệt nặng, ố hàn nhẹ: phong nhiệt</td></tr>
<tr><td>Đãn hàn bất nhiệt</td><td>Chỉ lạnh, không sốt</td><td>Mới bị: hàn tà trực trúng. Bệnh lâu, gặp ấm đỡ: <b>dương khí hư suy</b></td></tr>
<tr><td>Đãn nhiệt bất hàn</td><td>Chỉ nóng, không sợ lạnh</td><td><b>Lý nhiệt</b>: tráng nhiệt, triều nhiệt, vi nhiệt</td></tr>
<tr><td>Hàn nhiệt vãng lai</td><td>Lạnh, nóng <b>xen kẽ</b></td><td><b>Bán biểu bán lý</b>. Không theo giờ: Thiếu dương. Có giờ cố định: ngược tật</td></tr></table>
<p><b>Phân biệt trong nhóm “chỉ nóng”</b> <span class="pg">tr.114–115</span></p>
<ul>
<li><b>Tráng nhiệt:</b> sốt cao liên tục, mặt đỏ, khát, mồ hôi nhiều, mạch hồng đại.</li>
<li><b>Triều nhiệt:</b> sốt theo giờ. Tăng lúc 15–17h (giờ Thân): Dương minh phủ thực. Nóng nhẹ sau trưa và nửa đêm, như từ trong xương (cốt chưng): đa phần âm hư hỏa vượng, <i>nhưng cũng có thể do ứ huyết lâu ngày</i>. Nóng nặng về nửa đêm: nhiệt nhập dinh phận.</li>
<li><b>Vi nhiệt:</b> mệt thì nóng hơn, thiểu khí, tự hãn: khí hư. Sắc mặt trắng, chóng mặt, lưỡi nhạt, mạch tế: huyết hư. Gò má đỏ, ngũ tâm phiền nhiệt: âm hư. Nóng khi bực bội, tức ngực, dễ giận: khí uất.</li>
</ul>`,

hook:"Trong một ngày đêm, 3 giờ chiều và 3 giờ sáng: mỗi thời điểm thuộc âm hay dương? Có phải chỉ trả lời được một chữ “âm” hoặc “dương” không?",
reading:`
<p><b>Âm dương là gì?</b> Âm và dương là hai mặt, hai thuộc tính của một sự vật, luôn mâu thuẫn nhưng thống nhất với nhau, làm cho sự vật biến đổi, phát sinh và phát triển không ngừng. Theo Kinh Dịch: Thái cực sinh lưỡng nghi (âm dương), lưỡng nghi sinh tứ tượng, tứ tượng cấu tạo nên ngũ hành. Y học dùng học thuyết này để giải thích cấu tạo cơ thể, sinh lý, bệnh lý, rồi đưa ra chẩn đoán, điều trị, phòng bệnh. <span class="pg">tr.16</span></p>
<p><b>Đặc tính: bảng quy ước</b> <span class="pg">tr.17</span></p>
<table><tr><th>Dương</th><th>Âm</th></tr>
<tr><td>Cao, trời</td><td>Thấp, đất</td></tr><tr><td>Sáng, ngày</td><td>Tối, đêm</td></tr><tr><td>Nóng, lửa</td><td>Lạnh, nước</td></tr>
<tr><td>Trên · Ngoài</td><td>Dưới · Trong</td></tr><tr><td>Bên trái · Phía sau</td><td>Bên phải · Phía trước</td></tr>
<tr><td>Ra, lên · Động</td><td>Vào, xuống · Tĩnh</td></tr><tr><td>Mạnh · Nhẹ · Đực</td><td>Yếu · Nặng · Cái</td></tr>
<tr><td><b>Chức năng</b></td><td><b>Vật chất</b></td></tr></table>
<p><b>Quy ước chỉ mang tính tương đối</b>, vì trong âm có dương, trong dương có âm, và âm dương chuyển hóa cho nhau. Ví dụ của sách về một ngày đêm: <span class="pg">tr.17</span></p>
<table><tr><th>Giờ</th><th>Thuộc</th><th>Vì sao</th></tr>
<tr><td>6–12h</td><td>Dương trong dương</td><td>Mặt trời lên cao dần, nóng tăng dần</td></tr>
<tr><td>12–18h</td><td>Âm trong dương</td><td>Mặt trời hạ dần rồi lặn</td></tr>
<tr><td>18–24h</td><td>Âm trong âm</td><td></td></tr>
<tr><td>24–6h</td><td>Dương trong âm</td><td>Mặt trời lên dần</td></tr></table>
<p><b>Bốn nội dung hoạt động của âm dương</b> <span class="pg">tr.18</span></p>
<ul>
<li><b>Đối lập:</b> chế ước, kìm hãm lẫn nhau. Ví dụ: nóng và lạnh; vật chất (tĩnh) và chức năng (động).</li>
<li><b>Hỗ căn:</b> nương tựa, hỗ trợ nhau để cùng tồn tại. Vật chất (âm) là cơ sở cho chức năng (dương) hoạt động; chức năng bảo vệ và làm vật chất phát triển. Tế bào thần kinh: hưng phấn (dương) phải có ức chế (âm) để được bảo vệ.</li>
<li><b>Tiêu trưởng:</b> âm dương làm sự vật mất đi (tiêu) và phát sinh, lớn lên (trưởng). Ví dụ: đồng hóa (tạo chất dự trữ) là trưởng, dị hóa (dùng chất dự trữ tạo năng lượng) đi song song.</li>
<li><b>Bình hành:</b> âm dương hoạt động cân bằng để sự vật tồn tại, phát triển. Ví dụ: sinh ra đến trưởng thành là thận khí thịnh, ngừng phát triển là quân bình, già yếu là suy, chết là thận khí thoát (âm dương ly thoát).</li></ul>
<p class="muted">Ví von để nhớ (không phải lời sách): hỗ căn như gạo và lửa trong nồi cơm. Có gạo không lửa thì không thành cơm; có lửa không gạo thì cháy nồi.</p>`,

{q:"“Vật chất là cơ sở để chức năng hoạt động; chức năng bảo vệ và làm vật chất phát triển.” Đây là ví dụ cho:",o:[["Đối lập","Sai: ví dụ đối lập là nóng – lạnh."],["Hỗ căn","Đúng: hai mặt nương tựa vào nhau để cùng tồn tại."],["Tiêu trưởng","Sai: ví dụ tiêu trưởng là đồng hóa – dị hóa."],["Bình hành","Sai: ví dụ bình hành là thận khí thịnh – quân bình – suy."]],a:1,p:"18"},
{q:"Đồng hóa tạo chất dự trữ, dị hóa dùng chất dự trữ để tạo năng lượng. Sách dùng ví dụ này cho:",o:[["Bình hành","Sai: bình hành dùng ví dụ các giai đoạn thận khí."],["Đối lập","Sai."],["Hỗ căn","Sai: hỗ căn dùng ví dụ vật chất – chức năng, hưng phấn – ức chế."],["Tiêu trưởng","Đúng: đồng hóa là trưởng, đi song song với quá trình tiêu."]],a:3,p:"18"},

case:{v:"Hai người bệnh. Người A nằm co, thích yên tĩnh, tay chân lạnh, nói nhỏ, yếu sức. Người B vật vã, nói to, mặt đỏ, thấy nóng trong người.",
qs:["Dựa vào bảng đặc tính, xếp từng biểu hiện của A và B vào âm hoặc dương.","Mỗi người thiên về âm hay dương?","Theo chị, biết “thiên về âm/dương” rồi thì bước tiếp theo cần biết thêm điều gì?"],
ans:`<p><b>1–2.</b> A: nằm co, yên tĩnh (tĩnh), lạnh, nói nhỏ, yếu → đều thuộc <b>âm</b>. B: vật vã (động), nói to (mạnh), mặt đỏ, nóng → đều thuộc <b>dương</b>. <span class="pg">LL tr.17</span></p>
<p><b>3.</b> Cần biết <b>vì sao</b> lệch: do một bên <b>thịnh</b> lên hay do bên kia <b>hư</b> đi. Cùng là lạnh, có thể do âm thịnh hoặc do dương hư; cách chữa khác hẳn. Đây là nội dung bài 1.02.</p>`},

"1.02":{id:"1.02",tang:1,title:"Âm dương: ứng dụng trong y học",han:"阴阳学说的应用",src:SRC_LL+", tr.19–21",
hook:"Hai người cùng thấy nóng trong người. Một người sốt cao, mặt đỏ, khát. Một người chỉ nóng nhẹ về chiều, gò má đỏ. Có nên chữa hai người giống nhau không?",
reading:`
<p><b>Cấu tạo cơ thể</b> <span class="pg">tr.19</span></p>
<table><tr><th>Âm</th><th>Dương</th></tr><tr><td>Bên trong, phía trước, ở dưới, bên phải</td><td>Bên ngoài, phía sau, ở trên, bên trái</td></tr>
<tr><td>Bụng, ngực, <b>tạng, huyết</b></td><td>Lưng, <b>phủ, khí</b></td></tr></table>
<p>Trong âm có dương: can là tạng (âm) nhưng có <b>can khí</b> (dương) và <b>can huyết</b> (âm). Vị là phủ (dương) nhưng có <b>vị âm</b> (âm) và <b>vị khí</b> (dương).</p>
<p><b>Sinh lý</b> <span class="pg">tr.19</span>: âm dương đối lập mà hỗ căn. Tiêu hóa (dương) thức ăn (âm): thức ăn là âm, nhai là dương; chất dinh dưỡng là âm, phần tinh hấp thu là dương, cặn bã là âm. Lạnh (âm) và nóng (dương) cân bằng thì thân nhiệt bình thường 37°C.</p>
<p><b>Bệnh lý</b> <span class="pg">tr.19–20</span>: bệnh do <b>mất cân bằng</b> và <b>rối loạn</b> âm dương (âm dương thác tạp: xen lẫn nhau).</p>
<table><tr><th>Cơ chế</th><th>Kết quả</th></tr>
<tr><td>Dương thịnh, hoặc âm hư → dương vượng</td><td>Biểu hiện <b>nhiệt</b></td></tr>
<tr><td>Âm thịnh, hoặc dương hư → âm vượng</td><td>Biểu hiện <b>hàn</b></td></tr>
<tr><td>Thiên suy</td><td><b>Âm hư sinh nội nhiệt, dương hư tất ngoại hàn</b></td></tr>
<tr><td>Thiên thắng</td><td>Dương thắng làm tổn thương âm → có biểu hiện âm hư. Âm thắng làm tổn thương dương → có biểu hiện dương hư</td></tr></table>
<p><b>Chẩn đoán</b> <span class="pg">tr.19–20</span>: bát cương chia <b>lý, hư, hàn thuộc âm</b>; <b>biểu, thực, nhiệt thuộc dương</b>. Trên lâm sàng chúng kết hợp với nhau: biểu hàn, biểu hư, bán biểu bán lý, thực hàn, hư nhiệt, lý hàn, lý nhiệt…</p>
<p><b>Điều trị</b> <span class="pg">tr.20</span>: lập lại cân bằng, điều hòa âm dương.</p>
<ul><li><b>Hư thì bổ</b> (bổ phần đang suy), <b>thực thì tả</b> (đuổi tà khí ra).</li>
<li>Hàn (thực hàn hoặc dương hư) → phép <b>ôn</b>. Nhiệt do dương thịnh dẫn đến lý nhiệt → phép <b>thanh</b>.</li>
<li><b>Dương dược</b>: tính nóng, ấm, trị bệnh hàn thuộc âm. <b>Âm dược</b>: tính lạnh, mát, trị bệnh nhiệt thuộc dương.</li>
<li>Châm cứu: kinh của tạng là kinh âm, kinh của phủ là kinh dương. <b>Bệnh hàn thường cứu, bệnh nhiệt thường châm</b>; hư châm bổ, thực châm tả.</li></ul>
<p><b>Phòng bệnh</b> <span class="pg">tr.20–21</span>: ăn uống điều độ, hợp mùa (mùa nóng ăn đồ mát, bồi phụ tân dịch; mùa rét ăn đồ ấm); nơi ở ấm kín gió mùa đông, thoáng mát mùa hè; tình cảm cân bằng, tránh vui buồn lo âu quá mức.</p>`,

{q:"Biểu hiện của DƯƠNG HƯ là:",o:[["Nội nhiệt","Sai: nội nhiệt là của âm hư."],["Ngoại nhiệt","Sai."],["Nội hàn","Sai."],["Ngoại hàn","Đúng: dương hư tất ngoại hàn."]],a:3,p:"20"},
{q:"“Dương thắng” (thiên thắng) gây hậu quả gì?",o:[["Tổn thương dương, có biểu hiện dương hư","Sai: đó là hậu quả của âm thắng."],["Tổn thương âm, có biểu hiện âm hư","Đúng: dương thắng làm tổn thương âm."],["Âm dương ly thoát","Sai."],["Không ảnh hưởng gì đến âm","Sai."]],a:1,p:"20"},
{q:"Ba cương lĩnh thuộc ÂM trong bát cương:",o:[["Lý, hư, hàn","Đúng."],["Biểu, thực, nhiệt","Sai: đó là ba cương thuộc dương."],["Biểu, hư, hàn","Sai: biểu thuộc dương."],["Lý, hư, nhiệt","Sai: nhiệt thuộc dương."]],a:0,p:"19"},
{q:"Bệnh hàn do thực hàn hoặc dương hư, sách chỉ định dùng phép:",o:[["Thanh","Sai: thanh dùng cho nhiệt do dương thịnh."],["Ôn","Đúng."],["Tả","Sai: tả dùng khi thực, đuổi tà khí."],["Bổ âm","Sai: dương hư thì không bổ âm."]],a:1,p:"20"},
{q:"Trong châm cứu, theo sách:",o:[["Bệnh hàn thường châm, bệnh nhiệt thường cứu","Sai: ngược lại (sách dùng đúng câu này làm câu sai trong phần tự lượng giá)."],["Bệnh hàn thường cứu, bệnh nhiệt thường châm","Đúng."],["Bệnh hư châm tả, bệnh thực châm bổ","Sai: hư châm bổ, thực châm tả."],["Kinh của tạng là kinh dương","Sai: kinh của tạng là kinh âm."]],a:1,p:"20"},
{q:"“Âm dược” theo sách là:",o:[["Thuốc tính nóng ấm trị bệnh hàn","Sai: đó là dương dược."],["Thuốc bổ âm","Sai: sách định nghĩa theo tính thuốc."],["Thuốc tính lạnh mát trị bệnh nhiệt thuộc dương","Đúng."],["Thuốc dùng cho tạng","Sai."]],a:2,p:"20"}
],
case:{v:"Người A: sốt cao liên tục, mặt đỏ, khát, mồ hôi nhiều. Người B: nóng nhẹ về chiều và đêm, gò má đỏ, lòng bàn tay bàn chân nóng. Cả hai đều có “nhiệt”.",
qs:["Theo âm dương, nhiệt của A do đâu? Của B do đâu?","Mỗi người thuộc hư hay thực?","Hướng chữa của mỗi người theo nguyên tắc trong sách?"],
ans:`<p><b>A:</b> <b>dương thịnh</b> → nhiệt, thuộc <b>thực</b>. Nhiệt do dương thịnh dẫn đến lý nhiệt → phép <b>thanh</b>; thực thì tả. <span class="pg">LL tr.19–20</span> (Trong bài Vấn hàn nhiệt, đây là tráng nhiệt <span class="pg">CĐ tr.114</span>.)</p>
<p><b>B:</b> <b>âm hư</b> → dương vượng → <b>âm hư sinh nội nhiệt</b>, thuộc <b>hư</b>. Hư thì <b>bổ</b> phần đang suy (bổ âm). <span class="pg">LL tr.20</span> (Gò má đỏ, ngũ tâm phiền nhiệt là âm hư phát nhiệt <span class="pg">CĐ tr.115</span>.)</p>
<p><b>Bài học:</b> cùng là “nhiệt” nhưng một bên thừa dương, một bên thiếu âm. Thanh nhiệt mạnh cho B là sai hướng.</p>`},
cards:[["Can khí, can huyết thuộc gì?","Can là tạng (âm), nhưng can khí là dương, can huyết là âm."],["Vị âm, vị khí thuộc gì?","Vị là phủ (dương), nhưng vị âm thuộc âm, vị khí thuộc dương."],["Dương thịnh / âm hư biểu hiện gì?","Đều biểu hiện nhiệt (dương hơn âm)."],["Âm thịnh / dương hư biểu hiện gì?","Đều biểu hiện hàn (âm hơn dương)."],["Thiên suy: âm hư …, dương hư …?","Âm hư sinh nội nhiệt, dương hư tất ngoại hàn."],["Thiên thắng: dương thắng …, âm thắng …?","Dương thắng tổn thương âm (có biểu hiện âm hư); âm thắng tổn thương dương (có biểu hiện dương hư)."],["Bát cương: cương nào thuộc âm, cương nào thuộc dương?","Lý, hư, hàn thuộc âm. Biểu, thực, nhiệt thuộc dương."],["Hàn dùng phép gì, nhiệt dùng phép gì?","Hàn (thực hàn, dương hư) dùng phép ôn. Nhiệt do dương thịnh dùng phép thanh."],["Dương dược / âm dược?","Dương dược: nóng ấm, trị bệnh hàn. Âm dược: lạnh mát, trị bệnh nhiệt."],["Châm cứu theo âm dương?","Hàn thường cứu, nhiệt thường châm; hư châm bổ, thực châm tả."]],
terms:[["Dương hư thì ngoại hàn","阳虚则外寒","yáng xū zé wài hán"],["Âm hư thì nội nhiệt","阴虚则内热","yīn xū zé nèi rè"],["Dương thắng thì nhiệt","阳胜则热","yáng shèng zé rè"],["Âm thắng thì hàn","阴胜则寒","yīn shèng zé hán"],["Bát cương","八纲","bā gāng"],["Hư thì bổ","虚则补之","xū zé bǔ zhī"],["Thực thì tả","实则泻之","shí zé xiè zhī"]],

"1.03":{id:"1.03",tang:1,title:"Ngũ hành: sinh, khắc, thừa, vũ",han:"五行学说",src:SRC_LL+", tr.24–26",
hook:"Đất làm dòng sông uốn khúc, nhưng có khúc sông nước lại xói lở bờ đất. Cùng là đất và nước, vì sao lúc thì đất thắng, lúc thì nước thắng?",
reading:`
<p><b>Ngũ hành là gì?</b> Năm loại vật chất cấu tạo nên vũ trụ, vạn vật kể cả con người: mộc (cây), hỏa (lửa), thổ (đất), kim (kim thạch), thủy (nước). Ngũ hành là <b>cụ thể hóa của âm dương</b>: âm dương giải thích nguồn gốc phát sinh, phát triển; ngũ hành giải thích <b>mối quan hệ</b> giữa các sự vật. <span class="pg">tr.24</span></p>
<p><b>Tính âm dương của ngũ hành</b> <span class="pg">tr.24</span>: mộc vươn lên, hỏa nóng bốc → thuộc <b>dương</b>. Kim có tính giáng, thủy lạnh, thổ tàng giữ → thuộc <b>âm</b>.</p>
<p><b>Bảng quy loại</b> <span class="pg">tr.25</span></p>
<table><tr><th></th><th>Mộc</th><th>Hỏa</th><th>Thổ</th><th>Kim</th><th>Thủy</th></tr>
<tr><td>Màu</td><td>Xanh</td><td>Đỏ</td><td>Vàng</td><td>Trắng</td><td>Đen</td></tr>
<tr><td>Vị</td><td>Chua</td><td>Đắng</td><td>Ngọt</td><td>Cay</td><td>Mặn</td></tr>
<tr><td>Mùa</td><td>Xuân</td><td>Hạ</td><td>Cuối hạ</td><td>Thu</td><td>Đông</td></tr>
<tr><td>Phương</td><td>Đông</td><td>Nam</td><td>Trung ương</td><td>Tây</td><td>Bắc</td></tr>
<tr><td>Sinh hóa</td><td>Sinh</td><td>Trưởng</td><td>Hóa</td><td>Thu</td><td>Tàng</td></tr>
<tr><td>Tạng</td><td>Can</td><td>Tâm</td><td>Tỳ</td><td>Phế</td><td>Thận</td></tr>
<tr><td>Phủ</td><td>Đởm</td><td>Tiểu trường</td><td>Vị</td><td>Đại trường</td><td>Bàng quang</td></tr>
<tr><td>Ngũ thể</td><td>Cân</td><td>Mạch</td><td>Nhục</td><td>Bì mao</td><td>Cốt tủy</td></tr>
<tr><td>Ngũ quan</td><td>Mắt</td><td>Lưỡi</td><td>Miệng</td><td>Mũi</td><td>Tai</td></tr>
<tr><td>Ngũ chí</td><td>Nộ (giận)</td><td>Hỷ (mừng)</td><td>Tư (nghĩ)</td><td>Bi (buồn)</td><td>Sợ hãi (kinh sợ)</td></tr></table>
<p><b>Quy luật bình thường</b> <span class="pg">tr.25–26</span></p>
<ul><li><b>Tương sinh</b> (vòng kín): Mộc → Hỏa → Thổ → Kim → Thủy → Mộc. Người xưa quan sát: gỗ làm ra lửa; lửa đốt thành tro (đất); trong đất có đá (kim thạch); hơi nước gặp đá lạnh ngưng thành nước; cây cần nước để sống. Tương sinh là quan hệ <b>mẫu tử</b>: mỗi hành vừa là mẹ vừa là con.</li>
<li><b>Tương khắc</b> (cách một hành): Mộc khắc Thổ (cây hút chất đất), Thổ khắc Thủy (đất làm dòng nước uốn khúc), Thủy khắc Hỏa (nước dập lửa), Hỏa khắc Kim (lửa nung chảy kim thạch), Kim khắc Mộc (cây mọc trên đá rất khó).</li></ul>
<p><b>Quy luật bất thường</b> <span class="pg">tr.26</span></p>
<ul><li><b>Tương thừa:</b> khắc theo đúng chiều nhưng <b>quá mạnh</b>. Rễ cây quá nhiều (mộc mạnh) làm đất chóng bạc màu (thổ yếu).</li>
<li><b>Tương vũ:</b> hành bị khắc <b>khắc ngược lại</b> hành khắc nó, do hành khắc quá yếu hoặc hành bị khắc quá mạnh. Bờ sông bên lở: nước mạnh, đất yếu → thủy vũ thổ.</li></ul>`,
checklist:["Tạng đang bệnh là hành nào?","Mẹ của nó là ai (sinh ra nó)?","Con của nó là ai (nó sinh ra)?","Nó khắc ai, ai khắc nó?","Các tạng đó có đang có triệu chứng không?"],
checkTitle:"Thói quen tư duy: vẽ vòng ngũ hành quanh tạng đang bệnh",
quiz:[
{q:"Thứ tự tương sinh đúng là:",o:[["Mộc → Thổ → Thủy → Hỏa → Kim","Sai: đó là thứ tự tương khắc."],["Mộc → Hỏa → Thổ → Kim → Thủy","Đúng."],["Thủy → Hỏa → Kim → Mộc → Thổ","Sai."],["Hỏa → Mộc → Thổ → Thủy → Kim","Sai."]],a:1,p:"25"},
{q:"Mộc khắc hành nào?",o:[["Hỏa","Sai: hỏa là con của mộc."],["Thủy","Sai: thủy là mẹ của mộc."],["Thổ","Đúng: cây hút chất dinh dưỡng của đất."],["Kim","Sai: kim khắc mộc."]],a:2,p:"26"},
{q:"Thủy khắc hành nào?",o:[["Hỏa","Đúng: nước dập tắt lửa."],["Thổ","Sai: thổ khắc thủy."],["Mộc","Sai: thủy sinh mộc."],["Kim","Sai: kim sinh thủy."]],a:0,p:"26"},
{q:"Mẹ của Kim là:",o:[["Thủy","Sai: thủy là con của kim."],["Thổ","Đúng: thổ sinh kim (trong đất có đá)."],["Hỏa","Sai: hỏa khắc kim."],["Mộc","Sai: kim khắc mộc."]],a:1,p:"25"},
{q:"Rễ cây quá nhiều làm đất chóng bạc màu minh họa cho:",o:[["Tương sinh","Sai."],["Tương vũ","Sai: tương vũ là khắc ngược chiều."],["Tương thừa","Đúng: mộc khắc thổ đúng chiều nhưng quá mạnh."],["Quan hệ mẫu tử","Sai."]],a:2,p:"26"},
{q:"Bờ sông bên lở do nước mạnh, đất yếu minh họa cho:",o:[["Tương vũ (thủy vũ thổ)","Đúng: thủy là hành bị thổ khắc, nay khắc ngược lại thổ."],["Tương thừa (thổ thừa thủy)","Sai: ở đây đất yếu, không khắc quá mạnh."],["Tương khắc bình thường","Sai."],["Tương sinh","Sai."]],a:0,p:"26"},
{q:"Ngũ thể của Kim là:",o:[["Cân","Sai: cân thuộc mộc."],["Mạch","Sai: mạch thuộc hỏa."],["Nhục","Sai: nhục (cơ) thuộc thổ."],["Bì mao","Đúng."]],a:3,p:"25"},
{q:"Ngũ chí ứng với Tỳ là:",o:[["Nộ","Sai: nộ thuộc can."],["Tư","Đúng: tư (nghĩ) thuộc tỳ, thổ."],["Hỷ","Sai: hỷ thuộc tâm."],["Bi","Sai: bi thuộc phế."]],a:1,p:"25"},
{q:"Theo sách, hành có tính “tàng giữ” và thuộc âm là:",o:[["Mộc","Sai: mộc vươn lên, thuộc dương."],["Hỏa","Sai: hỏa nóng bốc, thuộc dương."],["Thổ","Đúng."],["Kim","Sai: kim thuộc âm nhưng vì tính giáng."]],a:2,p:"24"}
],
case:{v:"Bệnh nhân hay cáu gắt, tức sườn. Một thời gian sau thêm ăn kém, bụng đầy.",
qs:["Cáu gắt, tức sườn liên quan tạng nào? Ăn kém, bụng đầy liên quan tạng nào?","Hai tạng này có quan hệ gì trong ngũ hành?","Bệnh từ tạng thứ nhất lan sang tạng thứ hai theo quy luật nào? Nếu lan theo chiều ngược lại thì gọi là gì?"],
ans:`<p><b>1.</b> Nộ (giận) thuộc <b>can</b> <span class="pg">LL tr.25</span>. Ăn uống, vận hóa liên quan <b>tỳ</b> (sẽ học kỹ ở bài 1.10).</p>
<p><b>2.</b> Can mộc <b>khắc</b> tỳ thổ.</p>
<p><b>3.</b> Can quá mạnh lấn tỳ là <b>tương thừa</b>. Sách lấy đúng ví dụ “bệnh ở can truyền sang tỳ” <span class="pg">LL tr.28</span>. Chiều ngược lại (tỳ thổ lấn ngược can mộc) là <b>tương vũ</b>. Cách dùng các quy luật này để xác định tạng gây bệnh và chọn cách chữa nằm ở bài 1.04.</p>`},
cards:[["Ngũ hành là gì?","Năm loại vật chất cấu tạo vũ trụ, vạn vật: mộc, hỏa, thổ, kim, thủy. Là cụ thể hóa của âm dương."],["Âm dương và ngũ hành giải thích điều gì?","Âm dương: nguồn gốc phát sinh, phát triển. Ngũ hành: mối quan hệ giữa các sự vật."],["Hành nào thuộc dương, hành nào thuộc âm?","Mộc, hỏa thuộc dương. Kim, thủy, thổ thuộc âm."],["Vòng tương sinh?","Mộc → Hỏa → Thổ → Kim → Thủy → Mộc."],["Vòng tương khắc?","Mộc khắc Thổ, Thổ khắc Thủy, Thủy khắc Hỏa, Hỏa khắc Kim, Kim khắc Mộc."],["Tương thừa là gì?","Khắc đúng chiều nhưng quá mạnh."],["Tương vũ là gì?","Hành bị khắc khắc ngược lại hành khắc nó."],["Ngũ thể: mộc, hỏa, thổ, kim, thủy?","Cân, mạch, nhục, bì mao, cốt tủy."],["Ngũ quan: mộc, hỏa, thổ, kim, thủy?","Mắt, lưỡi, miệng, mũi, tai."],["Ngũ chí: can, tâm, tỳ, phế, thận?","Nộ (giận), hỷ (mừng), tư (nghĩ), bi (buồn), sợ hãi."]],

"1.04":{id:"1.04",tang:1,title:"Ngũ hành: ứng dụng lâm sàng",han:"五行学说的应用",src:SRC_LL+", tr.27–29",
hook:"Một người mất ngủ. Bệnh ở tâm, nhưng nguyên nhân có thể nằm ở tạng khác. Theo chị có bao nhiêu “đường” để một tạng khác gây mất ngủ?",
reading:`
<p><b>Sinh lý</b> <span class="pg">tr.27</span>: tạng phủ sinh khắc nhau để cơ thể hoạt động bình thường. Nghiên cứu một tạng phải xét cả bản thân tạng đó và quan hệ của nó với các tạng khác.</p>
<p><b>Bệnh lý</b> <span class="pg">tr.27–28</span></p>
<ul><li><b>Theo mùa:</b> xuân hay bệnh can, hạ bệnh tâm, cuối hạ bệnh tỳ, thu bệnh phế, đông bệnh thận.</li>
<li><b>Theo khí hậu:</b> phong hại can, thử nhiệt hại tâm, thấp hại tỳ, táo hại phế, hàn hại thận.</li></ul>
<table><tr><th>Đường truyền bệnh</th><th>Ví dụ của sách</th></tr>
<tr><td>Mẹ truyền sang con</td><td>Thận → can</td></tr><tr><td>Con truyền sang mẹ</td><td>Phế → tỳ</td></tr>
<tr><td>Tạng thắng → tạng thua (tương thừa)</td><td>Can → tỳ</td></tr><tr><td>Tạng thua → tạng thắng (tương vũ)</td><td>Thận → tỳ</td></tr></table>
<p><b>Xác định tạng gây bệnh: năm loại tà</b> <span class="pg">tr.28</span></p>
<table><tr><th>Tà</th><th>Định nghĩa</th><th>Mất ngủ (tâm) do…</th></tr>
<tr><td>Chính tà</td><td>Bản thân tạng đó bệnh</td><td>Tâm</td></tr>
<tr><td>Hư tà</td><td>Tạng mẹ gây bệnh tạng con</td><td>Can hư</td></tr>
<tr><td>Thực tà</td><td>Tạng con gây bệnh tạng mẹ</td><td>Vị thực</td></tr>
<tr><td>Tặc tà</td><td>Tạng khắc nó quá mạnh</td><td>Thận (sách ghi “thận hỏa”, xem ⚠️)</td></tr>
<tr><td>Vi tà</td><td>Tạng bị nó khắc khắc ngược lại</td><td>Phế thực</td></tr></table>
<p><b>Chẩn đoán</b> <span class="pg">tr.28</span></p>
<ul><li><b>Ngũ sắc:</b> đỏ – tâm, xanh – can, vàng – tỳ, trắng – phế, đen – thận.</li>
<li><b>Ngũ vị:</b> ợ chua → bệnh thuộc can. <b>Tình chí:</b> can thì cáu gắt, giận dữ; thận thì sợ hãi.</li>
<li><b>Ngũ thể:</b> cân – can, xương – thận, mạch – tâm, da lông – phế, cơ nhục – tỳ.</li>
<li><b>Chức năng tạng:</b> đau ngực sườn, cáu gắt, hoa mắt, mạch huyền → bệnh thuộc can.</li></ul>
<p><b>Điều trị</b> <span class="pg">tr.28–29</span></p>
<ul><li>Nguyên tắc: <b>hư thì bổ tạng mẹ, thực thì tả tạng con</b>; bệnh ở tạng nào chữa tạng đó; quan hệ hai tạng rối loạn thì tả tạng thực, bổ tạng hư.</li>
<li><b>Dùng thuốc:</b> vị đắng vào tâm, vị mặn vào thận. Bào chế dẫn thuốc: tẩm <b>giấm → can</b>, tẩm <b>mật → tỳ</b>, tẩm <b>muối hoặc đồng tiện → thận</b>.</li>
<li><b>Châm cứu:</b> ho hen do phế khí hư chọn huyệt kinh phế và kinh tỳ (tỳ thổ sinh phế kim; con hư bổ mẹ). Ngũ du huyệt:</li></ul>
<table><tr><th>Kinh</th><th>Tỉnh</th><th>Huỳnh</th><th>Du</th><th>Kinh</th><th>Hợp</th></tr>
<tr><td>Dương</td><td>Kim</td><td>Thủy</td><td>Mộc</td><td>Hỏa</td><td>Thổ</td></tr>
<tr><td>Âm</td><td>Mộc</td><td>Hỏa</td><td>Thổ</td><td>Kim</td><td>Thủy</td></tr></table>
<p><b>Phòng bệnh</b> <span class="pg">tr.29</span>: chữa bệnh khi chưa có bệnh. Không cáu giận để khỏi hại can. Bệnh can có thể truyền sang tỳ, nên làm cho tỳ khỏe trước thì bệnh can không truyền sang được (theo Kim quỹ yếu lược).</p>`,

"1.05":{id:"1.05",tang:1,title:"Thiên nhân hợp nhất",han:"天人合一",src:SRC_LL+", tr.33–36",
hook:"Đợt gió lạnh đầu mùa, cả nhà cùng ra đường, nhưng chỉ một người bị cảm. Nguyên nhân gây bệnh nằm ở gió lạnh hay ở người bị cảm?",
reading:`
<p><b>Học thuyết nói gì?</b> Mối quan hệ giữa con người với hoàn cảnh tự nhiên và xã hội, luôn mâu thuẫn và thống nhất. Con người phải thích nghi, chế ngự, cải tạo hoàn cảnh mới sinh tồn và phát triển. Tố Vấn: con người cần “trên thông thiên văn, dưới tường địa lý, trung chỉ nhân sự” thì mới tồn tại lâu dài. Trong YHCT, học thuyết này là phương châm cho phòng bệnh, tìm nguyên nhân bệnh và điều trị toàn diện. <span class="pg">tr.33</span></p>
<p><b>Hoàn cảnh tự nhiên</b> gồm khí hậu và địa lý. <span class="pg">tr.33–34</span></p>
<ul><li><b>Tứ thời:</b> xuân ấm, hạ nóng (thuộc dương); thu mát, đông lạnh (thuộc âm). Bốn mùa biến đổi là quá trình tiêu trưởng của âm dương, cũng là quá trình Sinh → Lão → Bệnh → Tử của sinh vật.</li>
<li><b>Lục khí:</b> phong, hàn, thử, thấp, táo, hỏa. Bình thường có lợi cho sinh trưởng (Tố Vấn: táo làm cho khô, thử làm bốc lên, hàn làm cứng, hỏa làm ấm). Khi biến đổi <b>bất thường, thái quá hay bất cập</b> thì lục khí thành <b>lục dâm (lục tà)</b>, gây bệnh.</li>
<li><b>Địa lý:</b> mỗi vùng khác thổ nhưỡng, khí hậu, tập quán, nên tác động khác nhau đến sinh lý và bệnh lý.</li></ul>
<p><b>Hoàn cảnh xã hội</b> <span class="pg">tr.34</span>: chính trị, kinh tế, văn hóa tác động đến tư tưởng, tình cảm. Cạnh tranh khốc liệt, tập tục lạc hậu, kinh tế kém làm hại sức khỏe; YHCT coi đó là rối loạn tình chí dẫn đến bệnh.</p>
<p><b>Sự thích ứng của cơ thể: điểm mấu chốt</b> <span class="pg">tr.34–35</span>: bệnh có phát sinh hay không còn tùy khả năng thích ứng của cơ thể. Tố Vấn: <b>“Chính khí tồn nội, tà bất khả can”</b> (chính khí bên trong vững thì tà khí không xâm phạm được). Nội Kinh: <b>“Nội nhân quyết định ngoại nhân”</b>.</p>
<table><tr><th>Nguồn gây bệnh</th><th>Thành bệnh gì</th></tr>
<tr><td>Lục khí thái quá, bất cập → lục dâm</td><td>Bệnh <b>ngoại cảm</b></td></tr>
<tr><td>Hoàn cảnh xã hội xấu → rối loạn bảy tình chí (vui, giận, buồn, lo, nghĩ, kinh, sợ)</td><td>Rối loạn tạng phủ → bệnh <b>nội thương</b></td></tr>
<tr><td>Chính khí bị tổn thương</td><td>Đóng vai trò <b>nội nhân, quyết định</b> bệnh có phát sinh hay không</td></tr></table>
<p><b>Ứng dụng: phòng và trị bệnh</b> <span class="pg">tr.35–36</span></p>
<ul><li>Nâng cao chính khí: rèn ý chí, ăn uống và vệ sinh hợp lý, khí công, dưỡng sinh, thái cực quyền, sinh hoạt nghỉ ngơi khoa học; ăn mặc hợp thời tiết.</li>
<li><b>Chữa bệnh khi chưa có bệnh (trị vị bệnh)</b>; trị kịp thời, không để bệnh nặng mới chữa.</li>
<li>Khi dùng các phương pháp YHCT, luôn chú ý nâng chính khí.</li>
<li>Tuệ Tĩnh (thế kỷ XIV): <b>“Bế tinh, dưỡng khí, tồn thần; Thanh tâm, quả dục, thủ chân, luyện hình.”</b></li></ul>`,

{q:"“Chính khí tồn nội, tà bất khả can” nghĩa là:",o:[["Tà khí luôn thắng chính khí","Sai."],["Chính khí bên trong vững vàng thì tà khí không xâm phạm được","Đúng (Tố Vấn, Thích pháp luận)."],["Phải đuổi tà trước rồi mới bổ chính","Sai: câu này không nói về thứ tự điều trị."],["Bệnh chỉ do yếu tố bên trong","Sai: yếu tố bên ngoài vẫn tác động, nhưng phải qua nội nhân."]],a:1,p:"34"},
{q:"Theo sách, hoàn cảnh xã hội xấu chủ yếu gây ra loại bệnh nào?",o:[["Bệnh ngoại cảm","Sai: ngoại cảm do lục dâm."],["Bệnh nội thương, qua rối loạn tình chí","Đúng."],["Bệnh do trùng thú cắn","Sai."],["Không gây bệnh","Sai."]],a:1,p:"35"},
{q:"Yếu tố nào được sách coi là “nội nhân”, quyết định bệnh có phát sinh hay không?",o:[["Lục dâm","Sai: lục dâm là ngoại nhân."],["Địa lý","Sai."],["Chính khí của cơ thể","Đúng."],["Khí hậu bốn mùa","Sai."]],a:2,p:"35"},
{q:"Câu nào đúng theo tự lượng giá của sách?",o:[["Lục khí là yếu tố nội nhân gây bệnh","Sai: lục khí là yếu tố bên ngoài."],["Rối loạn tình chí là yếu tố ngoại nhân","Sai."],["Nội Kinh viết “Ngoại nhân quyết định nội nhân”","Sai: là “nội nhân quyết định ngoại nhân”."],["Sự rối loạn thất tình dẫn tới các bệnh nội thương","Đúng."]],a:3,p:"35–37"},
{q:"“Trị vị bệnh” là:",o:[["Chữa bệnh khi chưa có bệnh","Đúng."],["Chữa bệnh mạn tính","Sai."],["Chữa vị (dạ dày)","Sai."],["Chữa khi bệnh đã nặng","Sai: sách nhấn mạnh trị kịp thời, không để nặng mới chữa."]],a:0,p:"36"},
{q:"Câu thơ dưỡng sinh của Tuệ Tĩnh mở đầu bằng:",o:[["Thanh tâm, quả dục","Sai: đó là vế sau."],["Bế tinh, dưỡng khí, tồn thần","Đúng."],["Thủ chân, luyện hình","Sai: đó là cuối vế sau."],["Chính khí tồn nội","Sai: câu này của Tố Vấn."]],a:1,p:"35"}
],
case:{v:"Đợt gió lạnh đầu đông, bốn người trong một nhà cùng dự đám cưới ngoài trời. Ông 70 tuổi, vốn hay mệt; chị gái vừa thức đêm nhiều tuần chăm con ốm; hai người còn lại khỏe. Hôm sau ông và chị gái bị cảm, hai người kia không sao.",
qs:["Yếu tố bên ngoài ở đây là gì? Khi nào nó trở thành nguyên nhân gây bệnh?","Vì sao chỉ hai người bị bệnh?","Theo học thuyết, nên phòng và chữa thế nào cho hai người này?"],
ans:`<p><b>1.</b> Phong, hàn của khí hậu (lục khí). Khi biến đổi bất thường, thái quá hoặc bất cập thì thành <b>lục dâm</b>, gây bệnh ngoại cảm. <span class="pg">LL tr.34–35</span></p>
<p><b>2.</b> Ông cao tuổi hay mệt, chị gái lao lực mất ngủ kéo dài: <b>chính khí</b> giảm, cơ thể không thích ứng kịp. “Chính khí tồn nội, tà bất khả can”; nội nhân quyết định ngoại nhân. <span class="pg">LL tr.34–36</span></p>
<p><b>3.</b> Chữa kịp thời, không để bệnh nặng; trong điều trị luôn chú ý nâng chính khí. Về lâu dài: nghỉ ngơi hợp lý, ăn uống, ăn mặc theo thời tiết, rèn luyện (trị vị bệnh). <span class="pg">LL tr.35–36</span> Cách chữa cảm cụ thể theo từng thể sẽ học ở Tầng 4 (bài Cảm mạo).</p>`},
cards:[["Học thuyết thiên nhân hợp nhất nói gì?","Quan hệ mâu thuẫn và thống nhất giữa con người với hoàn cảnh tự nhiên và xã hội."],["Tứ thời: mùa nào thuộc dương, mùa nào thuộc âm?","Xuân ấm, hạ nóng thuộc dương; thu mát, đông lạnh thuộc âm."],["Lục khí gồm những gì?","Phong, hàn, thử, thấp, táo, hỏa."],["Khi nào lục khí thành lục dâm?","Khi biến đổi bất thường, thái quá hoặc bất cập."],["“Chính khí tồn nội, tà bất khả can” nghĩa là?","Chính khí bên trong vững thì tà khí không xâm phạm được (Tố Vấn)."],["Nội nhân và ngoại nhân, cái nào quyết định?","Nội nhân quyết định ngoại nhân; chính khí là nội nhân."],["Lục dâm gây bệnh gì? Rối loạn tình chí gây bệnh gì?","Lục dâm: bệnh ngoại cảm. Rối loạn tình chí: bệnh nội thương."],["Câu thơ dưỡng sinh của Tuệ Tĩnh?","Bế tinh, dưỡng khí, tồn thần; Thanh tâm, quả dục, thủ chân, luyện hình."],["Trị vị bệnh là gì?","Chữa bệnh khi chưa có bệnh."]],

"1.06":{id:"1.06",tang:1,title:"Tinh, khí, thần",han:"精气神",src:SRC_LL+", tr.61–66",
hook:"Người xưa gọi tinh, khí, thần là “tam bảo”. Nếu phải nói trong một câu, chị phân biệt ba thứ này thế nào?",
reading:`
<p><b>Tinh</b> <span class="pg">tr.61–62</span>: vật chất cấu tạo và nuôi dưỡng cơ thể, luôn bị tiêu hao và luôn được bổ sung.</p>
<ul><li><b>Tinh tiên thiên:</b> bẩm thụ từ cha mẹ, “cái đến với sự sống gọi là tinh” (Linh khu, Bản thần).</li>
<li><b>Tinh hậu thiên:</b> tinh dinh dưỡng do đồ ăn thức uống hóa sinh.</li>
<li>Tinh của tạng phủ dồi dào thì quy về thận; thận nhận tinh của lục phủ ngũ tạng mà giữ lấy.</li>
<li>Tinh là <b>chân âm</b>, cơ sở vật chất của nguyên khí nên gọi là <b>nguyên âm</b>: lo sinh sản, sinh trưởng, phát dục và chống bệnh. Tinh đủ thì sức sống mạnh, dễ có con, chống đỡ bệnh tốt; tinh thiếu thì ngược lại.</li></ul>
<p><b>Khí</b> <span class="pg">tr.62–65</span> có hai nghĩa: chất dinh dưỡng li ti vận hành trong cơ thể, và động lực thúc đẩy hoạt động (khí của tạng phủ, kinh mạch). Khí <b>tiên thiên</b> (nguyên khí) bẩm thụ từ cha mẹ; khí <b>hậu thiên</b> từ đồ ăn do tỳ vị vận hóa và khí trời do phế hít vào.</p>
<p>Năm tác dụng của khí: <b>thúc đẩy</b> (huyết vận hành, sinh trưởng); <b>ôn ấm</b>; <b>cố nhiếp</b> (giữ huyết trong mạch; giữ tân dịch, nước tiểu, nước bọt, dịch vị, dịch ruột; giữ tinh dịch: thận khí hư thì di tinh); <b>khí hóa</b>; <b>dinh dưỡng</b>.</p>
<table><tr><th>Loại khí</th><th>Nguồn, nơi chứa</th><th>Việc chính</th></tr>
<tr><td>Nguyên khí</td><td>Tiên thiên (nguyên âm, nguyên dương), chứa ở thận, nhờ kinh tam tiêu đi khắp</td><td>Thúc đẩy hoạt động các cơ quan; nguồn gốc sinh mệnh</td></tr>
<tr><td>Tông khí</td><td>Hậu thiên: khí trời + khí thủy cốc; chứa ở khí hải giữa ngực</td><td>Quản lý <b>hô hấp, thanh âm, ngôn ngữ</b>; cùng huyết nuôi dưỡng, thúc đẩy</td></tr>
<tr><td>Dinh khí</td><td>Tinh khí (âm) của thủy cốc, từ trung tiêu; đi <b>trong mạch</b></td><td><b>Nuôi dưỡng</b> ngũ tạng lục phủ</td></tr>
<tr><td>Vệ khí</td><td>Khí mạnh (dương) của thủy cốc, do thượng tiêu phân bố; đi <b>ngoài mạch</b></td><td>Ôn dưỡng cơ nhục, da; điều lý <b>đóng mở lỗ chân lông</b>; bảo vệ cơ biểu, chống ngoại tà</td></tr></table>
<p>Dinh và vệ cùng nguồn, khác đường, chuyển hóa lẫn nhau; chuyển hóa trở ngại thì thành bệnh <b>dinh vệ bất hòa</b>. Mỗi ngày đêm dinh khí đi 50 vòng; vệ khí đi 50 vòng (25 vòng ban ngày ở phần dương, 25 vòng ban đêm ở phần âm). <span class="pg">tr.64–65</span></p>
<p><b>Thần</b> <span class="pg">tr.66</span>: hoạt động sống của con người (tinh thần, ý thức, tri giác, vận động). Thần do tinh tiên thiên sinh ra, được tinh hậu thiên nuôi dưỡng. Ngũ tạng điều hòa, tinh huyết đủ thì thần mới vượng. <b>Thần còn thì sống, thần mất thì chết.</b></p>
<p><b>Quan hệ tinh, khí, thần:</b> sinh mệnh <b>bắt nguồn từ tinh</b>, <b>duy trì nhờ khí</b>, <b>chủ là thần</b>. Tinh là cơ sở của thần; khí từ tinh hóa ra; thần là mặt biểu hiện của khí. Tinh khí đủ thì thần vượng, hao thì thần suy. <span class="pg">tr.66</span></p>`,
checkTitle:"Khi khám, nhìn tinh, khí, thần qua đâu",
checklist:["Thần: tỉnh táo, ánh mắt, phản ứng, sắc mặt có tươi không?","Tông khí: hơi thở, giọng nói to hay nhỏ, nói nhiều có mệt không?","Vệ khí: có hay ra mồ hôi, sợ gió, dễ cảm không?","Cố nhiếp: có chảy máu khó cầm, tiểu nhiều, di tinh không?","Tinh: sức khỏe sinh sản, phát triển (với trẻ), sự suy yếu theo tuổi?"],

{q:"Thận khí hư gây di tinh là do khí mất tác dụng nào?",o:[["Ôn ấm","Sai."],["Thúc đẩy","Sai."],["Cố nhiếp","Đúng: khí đủ thì xuất tinh bình thường, thận khí hư thì di tinh."],["Dinh dưỡng","Sai."]],a:2,p:"63"},

{q:"Nguyên khí chứa ở đâu và nhờ đường nào đi khắp cơ thể?",o:[["Ở phế, nhờ kinh phế","Sai."],["Ở thận, nhờ kinh tam tiêu","Đúng."],["Ở tỳ vị, nhờ trung tiêu","Sai: đó là nguồn của dinh khí."],["Ở giữa ngực, nhờ tâm mạch","Sai: đó là tông khí."]],a:1,p:"63"},
{q:"Khí đi NGOÀI mạch, điều lý đóng mở lỗ chân lông, chống ngoại tà là:",o:[["Vệ khí","Đúng: thuộc dương, nhanh, cương nên đi ngoài mạch."],["Dinh khí","Sai: dinh khí thuộc âm, đi trong mạch."],["Tông khí","Sai."],["Nguyên khí","Sai."]],a:0,p:"64"},
{q:"Dinh khí và vệ khí quan hệ thế nào?",o:[["Khác nguồn, cùng đường","Sai."],["Cùng nguồn, khác đường, chuyển hóa lẫn nhau","Đúng: chuyển hóa trở ngại thì thành dinh vệ bất hòa."],["Hoàn toàn độc lập","Sai."],["Vệ khí sinh ra dinh khí","Sai: cả hai cùng từ đồ ăn thức uống."]],a:1,p:"64–65"},

qs:["Dễ cảm, mồ hôi tự ra liên quan đến loại khí nào? Vì sao?","Nói mệt, giọng nhỏ, hơi ngắn liên quan đến loại khí nào?","Mồ hôi tự ra còn liên quan đến tác dụng nào của khí?"],
ans:`<p><b>1.</b> <b>Vệ khí:</b> đi ngoài mạch, điều lý đóng mở lỗ chân lông, bảo vệ cơ biểu chống ngoại tà. Vệ khí yếu thì lỗ chân lông không đóng chặt, ngoại tà dễ vào. <span class="pg">LL tr.64</span></p>
<p><b>2.</b> <b>Tông khí:</b> quản lý hô hấp, thanh âm, ngôn ngữ. <span class="pg">LL tr.63</span></p>
<p><b>3.</b> <b>Cố nhiếp:</b> khí giữ tân dịch không cho thoát ra; mồ hôi hóa từ tân dịch. <span class="pg">LL tr.63, 65</span></p>
<p class="muted">Đọc tiếp: bài 2.13 (Vấn hãn) sẽ phân biệt tự hãn với đạo hãn, và bài 2.30 (Biện chứng khí huyết) sẽ đặt tên hội chứng cho ca này.</p>`},

"1.07":{id:"1.07",tang:1,title:"Huyết và tân dịch",han:"血 · 津液",src:SRC_LL+", tr.62, 65",
hook:"Một người tiêu chảy nhiều ngày rồi bị cảm. Người nhà định cho uống thuốc cho ra mồ hôi để giải cảm. Chị có đồng ý không?",
reading:`
<p><b>Huyết</b> <span class="pg">tr.62</span>: chất quan trọng duy trì sự sống, nuôi dưỡng thân thể, tuần hoàn trong mạch dưới tác động của <b>tâm</b> (tâm chủ huyết mạch) và sự hỗ trợ của <b>phế</b> (phế chủ khí).</p>
<ul><li><b>Nguồn sinh huyết:</b> (1) đồ ăn vào vị hóa thành tinh vi, qua <b>tỳ</b> vận hóa dồn vào mạch thành huyết (Linh khu: “Trung tiêu thụ khí, giữ lấy chất tinh vi biến hóa ra đỏ gọi là huyết”); (2) <b>thận tinh sinh tủy, tủy sinh huyết</b>.</li>
<li><b>Công năng:</b> theo mạch đi khắp tạng phủ, da lông, cân xương để nuôi dưỡng. Tuần hoàn trở ngại: da thiếu huyết thì <b>tê bì</b>; chân tay thiếu huyết thì <b>lạnh</b>, nặng thì liệt, vận động kém.</li></ul>
<p><b>Tân dịch</b> <span class="pg">tr.65</span>: cùng sinh ra từ đồ ăn thức uống, nhưng khác nhau:</p>
<table><tr><th></th><th>Tân</th><th>Dịch</th></tr>
<tr><td>Tính chất</td><td>Trong, lỏng</td><td>Đặc, đục</td></tr>
<tr><td>Đường đi</td><td>Theo khí tam tiêu ra phần biểu, khoảng cơ nhục, bì phu</td><td>Theo huyết, từ trong mạch thấm ra; chứa ở khớp, tủy, não, các khiếu</td></tr>
<tr><td>Việc chính</td><td>Ôn dưỡng cơ nhục, tươi nhuận da lông</td><td>Nhuận trơn khớp, bổ ích não tủy, nhu nhuận tai, mắt, mũi</td></tr></table>
<p>Trên lâm sàng không phân biệt rạch ròi mà gọi chung là <b>tân dịch</b>. <b>Mồ hôi và nước tiểu đều hóa từ tân dịch</b>: ra qua tấu lý là mồ hôi, thấm xuống bàng quang là nước tiểu.</p>
<p><b>Tân bị tổn thương</b> thì nước tiểu, mồ hôi ít; ngược lại mồ hôi, nước tiểu ra quá nhiều cũng làm hao tân. <b>Ra nhiều mồ hôi là mất tân.</b> Vì vậy <b>nôn nhiều, tiêu chảy nhiều phải kiêng thuốc phát hãn</b>. <span class="pg">tr.65</span></p>
<p><b>Đường tuần hoàn tân dịch</b> <span class="pg">tr.65</span>: phế đưa tân dịch ra bì mao thành mồ hôi, thở ra cũng mang theo một phần; phế túc giáng, thông điều thủy đạo, đưa tân dịch qua tam tiêu xuống thận, bàng quang. Thận chủ thủy: phần <b>thanh</b> hóa khí đưa lên phế để phân bố lại, phần <b>trọc</b> thành nước tiểu. Tuần hoàn này trở ngại thì sinh <b>đàm ẩm, thủy thũng</b>.</p>`,
checkTitle:"Khi khám, hỏi để đánh giá huyết và tân dịch",

case:{v:"Ca A: nữ 30 tuổi, sau sinh mất máu nhiều, nay tê bì ngoài da, tay chân lạnh, ăn uống kém. Ca B: người tiêu chảy nhiều ngày rồi bị cảm; người nhà định cho uống thuốc ra mồ hôi để giải cảm.",
qs:["Ca A: giải thích tê bì, tay chân lạnh theo công năng của huyết.","Ca A: muốn bồi huyết, theo nguồn sinh huyết cần chú ý những tạng nào?","Ca B: có nên cho phát hãn mạnh không? Vì sao?"],
ans:`<p><b>1.</b> Huyết đi theo mạch nuôi dưỡng da, chân tay. Da không được huyết nuôi dưỡng thì tê bì; chân tay không được nuôi dưỡng thì lạnh. <span class="pg">LL tr.62</span></p>
<p><b>2.</b> <b>Tỳ vị</b> (tinh vi thủy cốc qua tỳ vận hóa thành huyết; người này lại ăn kém) và <b>thận</b> (thận tinh sinh tủy, tủy sinh huyết). <span class="pg">LL tr.62</span></p>
<p><b>3.</b> <b>Không nên.</b> Tiêu chảy nhiều đã làm hao tân; ra nhiều mồ hôi là mất tân thêm. Sách dặn nôn nhiều, tiêu chảy nhiều phải kiêng thuốc phát hãn. <span class="pg">LL tr.65</span></p>`},
cards:[["Huyết tuần hoàn nhờ gì?","Tâm (chủ huyết mạch), có phế (chủ khí) hỗ trợ."],["Hai nguồn sinh huyết?","Tinh vi thủy cốc qua tỳ vận hóa; thận tinh sinh tủy, tủy sinh huyết."],["“Trung tiêu thụ khí… biến hóa ra đỏ gọi là huyết” nói về điều gì?","Nguồn sinh huyết từ tinh vi thủy cốc qua trung tiêu (Linh khu; sách ghi thiên “Quyết kết luận”, thường biết là thiên Quyết khí)."],["Thiếu huyết nuôi dưỡng: da? chân tay?","Da tê bì; chân tay lạnh, nặng thì liệt."],["Tân khác dịch thế nào?","Tân trong lỏng, ra phần biểu, nhuận da cơ. Dịch đặc đục, ở khớp, tủy, các khiếu."],["Mồ hôi, nước tiểu từ đâu?","Đều hóa từ tân dịch."],["Vì sao nôn, tiêu chảy nhiều kiêng phát hãn?","Ra nhiều mồ hôi là mất tân; nôn, tiêu chảy đã hao tân."],["Ở thận, thủy dịch chia thế nào?","Thanh hóa khí lên phế phân bố lại; trọc thành nước tiểu xuống bàng quang."],["Tân dịch tuần hoàn trở ngại sinh bệnh gì?","Đàm ẩm, thủy thũng."]],

"1.08":{id:"1.08",tang:1,title:"Tạng Tâm (và Tâm bào, Đản trung)",han:"心",src:SRC_LL+", tr.40–42",
hook:"Một người mất ngủ, hay quên, sắc mặt nhợt. Ba dấu hiệu ấy rất khác nhau. Có thể quy cả ba về một tạng không?",
reading:`
<p><b>Tạng tượng là gì?</b> “Tạng” là tổ chức cơ quan bên trong; “tượng” là biểu hiện của hình thái, sinh lý, bệnh lý nội tạng ra bên ngoài. Mỗi tạng không chỉ là cơ quan giải phẫu mà chủ yếu là <b>chức năng</b> và mối liên hệ với các tạng khác. Ngũ tạng đều <b>tàng chứa tinh khí</b>, cần cất giữ, không nên hao tán. <span class="pg">tr.40–41</span></p>
<p>Tâm giữ chức <b>quân chủ</b>: tâm hoạt động tốt thì các tạng phủ khác mới hoạt động theo quy luật. <span class="pg">tr.41–42</span></p>
<table><tr><th>Chức năng</th><th>Bình thường</th><th>Khi bệnh</th></tr>
<tr><td><b>Chủ huyết mạch</b>, tinh hoa biểu hiện ra <b>mặt</b></td><td>Tâm thúc đẩy huyết trong mạch (vai trò chủ động); sắc mặt hồng nhuận, sáng bóng, có thần</td><td>Mặt nhợt nhạt, không tươi. Huyết ngưng trệ: mặt xám đen; ngưng trệ, mất dinh dưỡng: xám đen mà khô</td></tr>
<tr><td><b>Chủ thần minh</b></td><td>Làm chủ ý thức, tư duy; chỉ đạo ngũ tạng lục phủ nhịp nhàng</td><td>Hoảng sợ, mất ngủ, nói sảng, hôn mê, cười nói huyên thuyên… phần nhiều quy vào tâm. Tâm huyết hư: tinh thần trì trệ. Lo buồn tư lự quá độ thì tổn thương tâm</td></tr>
<tr><td><b>Khai khiếu ra lưỡi</b></td><td>Biệt lạc kinh tâm thông ra lưỡi</td><td>Đầu lưỡi đỏ: tâm nhiệt. Chất lưỡi nhợt: tâm huyết hư. Lưỡi xanh có điểm ứ: tâm huyết ứ trệ</td></tr></table>
<p><b>Phân vùng lưỡi theo sách</b> <span class="pg">tr.42</span>: đầu lưỡi – tâm, phế (thượng tiêu); giữa lưỡi – tỳ, vị (trung tiêu); cuống lưỡi – thận (hạ tiêu); hai bên – can, đởm.</p>
<p><b>Quan hệ:</b> can mộc sinh tâm hỏa, tâm hỏa sinh tỳ thổ; thận thủy khắc tâm hỏa, tâm hỏa khắc phế kim. Tâm và <b>tiểu trường</b> biểu lý. <span class="pg">tr.42</span></p>
<p><b>Tâm bào (lạc):</b> màng bọc tim, bảo vệ tâm. Tà từ ngoài vào trước tiên phạm tâm bào; triệu chứng tâm và tâm bào tương đối giống nhau. Hôn mê trong ôn bệnh gọi là <b>“nhiệt nhập tâm bào”</b>. <span class="pg">tr.42</span></p>
<p><b>Đản trung:</b> giữa hai vú, nơi tập trung tông khí (khí hải). Khí hải không đủ thì thiếu khí, không đủ hơi để nói. Khí ứ ở ngực ảnh hưởng phế thì khó thở, ảnh hưởng tâm thì mặt đỏ. <span class="pg">tr.42</span></p>`,
checkTitle:"Khi khám, nghĩ đến tâm khi thấy",
checklist:["Sắc mặt: hồng nhuận hay nhợt, xám đen, khô?","Giấc ngủ, trí nhớ, mức tỉnh táo; có hoảng sợ, nói sảng không?","Đầu lưỡi đỏ? Chất lưỡi nhợt? Lưỡi có điểm ứ?","Có lo buồn, tư lự kéo dài không?","Hơi thở, tiếng nói có đủ hơi không (đản trung, tông khí)?"],
quiz:[
{q:"Tinh hoa của tâm (chủ huyết mạch) biểu hiện ra đâu?",o:[["Môi","Sai: môi là nơi tỳ vinh nhuận."],["Mặt","Đúng: dựa vào sắc thái ở mặt biết được thịnh suy của tâm và huyết mạch."],["Tóc","Sai: tóc liên quan thận."],["Móng","Sai: móng liên quan can."]],a:1,p:"41"},
{q:"Theo sách, mất ngủ, nói sảng, hôn mê, cười nói huyên thuyên phần nhiều quy vào chức năng nào?",o:[["Tâm chủ huyết mạch","Sai."],["Tâm chủ thần minh","Đúng: tâm làm chủ ý thức, tư duy."],["Can chủ sơ tiết","Sai."],["Thận tàng tinh","Sai."]],a:1,p:"41"},
{q:"Huyết vận hành trở ngại, ngưng trệ thì sắc mặt:",o:[["Hồng nhuận","Sai: đó là tâm khỏe."],["Vàng","Sai."],["Xám đen","Đúng; nếu ngưng trệ mà mất dinh dưỡng thì xám đen và khô."],["Đỏ","Sai."]],a:2,p:"41"},
{q:"Đầu lưỡi đỏ theo sách gợi ý:",o:[["Tâm nhiệt","Đúng."],["Tâm huyết hư","Sai: tâm huyết hư thì chất lưỡi nhợt."],["Tâm huyết ứ trệ","Sai: ứ trệ thì lưỡi xanh có điểm ứ."],["Can nhiệt","Sai: can xem ở hai bên lưỡi."]],a:0,p:"42"},
{q:"Theo phân vùng lưỡi của sách, hai bên lưỡi phản ánh:",o:[["Tâm, phế","Sai: đầu lưỡi."],["Tỳ, vị","Sai: giữa lưỡi."],["Thận","Sai: cuống lưỡi."],["Can, đởm","Đúng."]],a:3,p:"42"},
{q:"Tâm có quan hệ biểu lý với:",o:[["Đởm","Sai: đởm biểu lý với can."],["Tiểu trường","Đúng."],["Đại trường","Sai: đại trường biểu lý với phế."],["Bàng quang","Sai: bàng quang biểu lý với thận."]],a:1,p:"42"},
{q:"Hôn mê trong bệnh ôn có sốt, sách gọi là:",o:[["Nhiệt nhập tâm bào","Đúng."],["Tâm huyết hư","Sai."],["Can phong nội động","Sai: không phải thuật ngữ sách dùng ở đây."],["Khí hải không đủ","Sai."]],a:0,p:"42"},
{q:"Đản trung, nơi tập trung tông khí, nằm ở:",o:[["Dưới rốn","Sai."],["Trên ngực, giữa hai vú","Đúng."],["Vùng thượng vị","Sai."],["Sau lưng","Sai."]],a:1,p:"42"},
{q:"Theo sách, cảm xúc nào quá độ thì tổn thương tâm?",o:[["Giận dữ","Sai: giận hại can (bài 1.04)."],["Lo buồn, tư lự","Đúng: sách viết lo buồn tư lự quá độ thì tổn thương tâm."],["Sợ hãi","Sai."],["Không cảm xúc nào","Sai."]],a:1,p:"42"}
],
case:{v:"Nữ, 40 tuổi, lo nghĩ nhiều tháng nay. Khó ngủ, hay quên, đầu óc chậm chạp, sắc mặt nhợt không tươi, chất lưỡi nhợt.",
qs:["Các dấu hiệu này quy về tạng nào?","Giải thích từng dấu hiệu theo chức năng của tạng đó.","Nếu thay vì lưỡi nhợt, chị thấy đầu lưỡi đỏ, thì hướng suy nghĩ thay đổi thế nào?"],
ans:`<p><b>1.</b> <b>Tâm.</b></p>
<p><b>2.</b> Khó ngủ, hay quên, chậm chạp: <b>tâm chủ thần minh</b>; tâm huyết hư thì tinh thần trì trệ. Mặt nhợt: <b>tâm chủ huyết mạch, tinh hoa ra mặt</b>. Lưỡi nhợt: <b>tâm khai khiếu ra lưỡi</b>, chất lưỡi nhợt là tâm huyết hư. Nguyên nhân gợi ý: lo buồn tư lự quá độ tổn thương tâm. <span class="pg">LL tr.41–42</span></p>
<p><b>3.</b> Đầu lưỡi đỏ là <b>tâm nhiệt</b>: hướng suy nghĩ chuyển từ “thiếu” (huyết hư) sang “nhiệt” (bài 1.02: cần phân biệt nhiệt do thực hay do âm hư). <span class="pg">LL tr.42</span> Tên hội chứng cụ thể sẽ học ở bài 2.32.</p>`},

"1.09":{id:"1.09",tang:1,title:"Tạng Can",han:"肝",src:SRC_LL+", tr.43–44",
hook:"Vì sao một người hay bực bội lại thường kèm tức sườn, và có khi cả đau bụng, tiêu chảy mỗi khi tức giận?",
reading:`
<p>Can giữ chức <b>tướng quân</b>: khí của can thường cấp bức, dễ cang thịnh, thích vươn thoải mái mà ghét gò bó, uất trệ; tương ứng khí sinh phát của mùa xuân. <span class="pg">tr.43</span></p>
<table><tr><th>Chức năng</th><th>Bình thường</th><th>Khi bệnh</th></tr>
<tr><td><b>Chủ sơ tiết</b></td><td>Làm khí cơ các tạng phủ thông suốt, thăng giáng điều hòa; quản lý phân bố khí toàn thân</td><td>Can khí suy: hay sợ sệt, nhút nhát. <b>Can khí uất kết</b>: ngực sườn đầy tức. <b>Can khí nghịch</b>: thượng xung gây đau đầu, hoa mắt, chóng mặt; hoặc <b>hoành nghịch phạm tỳ vị</b> gây ợ, nôn, đau bụng, ỉa chảy</td></tr>
<tr><td><b>Tàng huyết</b></td><td>Tàng trữ và <b>điều tiết lượng huyết</b>: hoạt động thì đưa huyết đi, nghỉ thì huyết về can. “Người ta ngủ thì huyết trở về can” (Tố Vấn)</td><td><b>Can huyết không đủ</b>: hoa mắt chóng mặt, chân tay co quắp, kinh nguyệt ít, có thể bế kinh. <b>Can huyết có nhiệt, hỏa</b>: huyết đi sai đường gây nôn ra máu, chảy máu cam, băng huyết, rong huyết</td></tr>
<tr><td><b>Chủ cân</b>, vinh nhuận ra <b>móng</b></td><td>Cân nhờ can huyết nuôi dưỡng nên vận động tốt; móng khỏe, nhuận</td><td>Can huyết hư: cân yếu, tê bại, chân tay run, co quắp, động tác chậm chạp; móng nhợt, khô, dễ gãy. Can nhiệt: móng thô. Co giật cấp tính thường liên quan <b>can phong</b></td></tr>
<tr><td><b>Khai khiếu ra mắt</b></td><td>Can tàng huyết, kinh can lên mắt</td><td>Can nhiệt: mắt đỏ, sưng đau. Can huyết hư: quáng gà, giảm thị lực. Can phong: miệng méo, mắt lác</td></tr></table>
<p><b>Phân biệt:</b> <b>tâm chủ huyết</b> là chỉ sự vận hành tuần hoàn huyết; <b>can tàng huyết</b> là tàng trữ và điều tiết lượng huyết. <span class="pg">tr.43</span></p>
<p><b>Quan hệ:</b> can biểu lý với <b>đởm</b>. Thận thủy sinh can mộc, can mộc sinh tâm hỏa; phế kim khắc can mộc, can mộc khắc tỳ thổ. <span class="pg">tr.44</span></p>`,

case:{v:"Nữ, 35 tuổi. Hay cáu, ngực sườn đầy tức. Kinh nguyệt ít dần. Hay hoa mắt chóng mặt, buổi tối nhìn kém. Móng tay nhợt, khô, dễ gãy. Mỗi lần bực tức thì đau bụng, đi ngoài phân lỏng.",
qs:["Liệt kê từng chức năng của can bị ảnh hưởng và dấu hiệu tương ứng.","Đau bụng, phân lỏng mỗi khi bực tức giải thích thế nào?","Ca này thiên về “khí” hay “huyết” của can, hay cả hai?"],
ans:`<p><b>1.</b> <b>Sơ tiết</b>: hay cáu (nộ thuộc can, bài 1.03), ngực sườn đầy tức (can khí uất kết). <b>Tàng huyết</b>: kinh ít, hoa mắt chóng mặt (can huyết không đủ). <b>Chủ cân, vinh ra móng</b>: móng nhợt khô dễ gãy (can huyết hư). <b>Khai khiếu ra mắt</b>: tối nhìn kém (can huyết hư). <span class="pg">LL tr.43–44</span></p>
<p><b>2.</b> Can khí <b>hoành nghịch</b> làm rối loạn tỳ vị, gây đau bụng, ỉa chảy. Theo ngũ hành là can mộc lấn tỳ thổ (tương thừa, bài 1.03). <span class="pg">LL tr.43</span></p>
<p><b>3.</b> Cả hai: có biểu hiện <b>khí</b> (uất kết, hoành nghịch) và <b>huyết</b> (huyết không đủ). Cách đặt tên và chọn pháp cho kiểu phối hợp này sẽ học ở bài 2.33 (biện chứng can đởm).</p>`},
cards:[["Can giữ chức gì? Tính của can khí?","Tướng quân. Cấp bức, dễ cang thịnh; thích vươn thoải mái, ghét gò bó uất trệ."],["Can chủ sơ tiết là gì?","Làm khí cơ tạng phủ thông suốt, thăng giáng điều hòa."],["Can khí uất / thượng xung / hoành nghịch?","Uất: ngực sườn đầy tức. Thượng xung: đau đầu, hoa mắt, chóng mặt. Hoành nghịch: phạm tỳ vị gây ợ, nôn, đau bụng, ỉa chảy."],["Can tàng huyết là gì?","Tàng trữ và điều tiết lượng huyết; ngủ thì huyết về can."],["Can huyết không đủ?","Hoa mắt chóng mặt, chân tay co quắp, kinh ít, có thể bế kinh."],["Can huyết có nhiệt, hỏa?","Huyết đi sai đường: nôn ra máu, chảy máu cam, băng huyết, rong huyết."],["Can chủ cân: can huyết hư biểu hiện ở cân, móng?","Cân yếu, tê bại, run, co quắp; móng nhợt, khô, dễ gãy."],["Can khai khiếu ra mắt: ba dấu hiệu?","Can nhiệt: mắt đỏ sưng đau. Can huyết hư: quáng gà, giảm thị lực. Can phong: miệng méo, mắt lác."],["Can biểu lý với?","Đởm."]],
