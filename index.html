{q:"Theo 中医诊断学, đang nhiệt chứng (sốt cao) mà tay chân lại lạnh giá có nghĩa:",o:[["Dương hư hàn thịnh","Sai."],["Nhiệt thịnh, dương khí bế ở trong không đạt ra ngoài (nhiệt càng sâu quyết càng sâu): chân nhiệt giả hàn","Đúng."],["Bệnh nhẹ","Sai."],["Biểu hàn","Sai."]],a:1,p:"ZD 按手足"}
],
case:{v:`A: nam 40 tuổi, sốt 3 ngày; sờ trán rất nóng, mu bàn tay nóng hơn lòng bàn tay, sờ lúc đầu nóng, sờ lâu thì bớt. B: nữ 55 tuổi, nóng về chiều; sờ da không thấy nóng, lòng bàn tay nóng hơn trán. C: nam 35 tuổi, sốt rất cao, bụng nóng hầm hập, táo bón, khát; nhưng tay chân lạnh ngắt.`,
qs:["A và B: ngoại nhiệt hay nội nhiệt? Căn cứ?","C: tay chân lạnh có phải là hàn không?","Một người khác có khối ở bụng dưới, cứng, ấn đau, không di chuyển: gợi ý gì và cần làm gì?"],
ans:`<p><b>1.</b> A: <b>ngoại nhiệt</b> (trán nóng, mu tay nóng hơn lòng tay, sờ lâu bớt nóng). B: <b>hư nhiệt, nội nhiệt</b> (da không nóng mà người thấy nóng, lòng tay nóng hơn trán). <span class="pg">CĐ tr.235, 237</span></p>
<p><b>2.</b> Không. Nhiệt thịnh ở trong (bụng nóng, táo, khát) làm dương khí bị bế, không đạt ra tay chân: <b>chân nhiệt giả hàn</b>. Đây là tình trạng nặng. <span class="pg">ZD 按手足</span></p>
<p><b>3.</b> Khối cứng, đau, cố định: <b>huyết ứ</b>. Cần khám Tây y (siêu âm, chẩn đoán hình ảnh) để loại trừ khối u. <span class="pg">CĐ tr.239, 241</span></p>`},
cards:[["3 kỹ thuật xúc chẩn?","Sờ (nhẹ, da), vuốt (vừa, cơ nhục), ấn (mạnh, sâu)."],["Sờ lâu: nóng giảm / tăng?","Giảm: ngoại nhiệt. Tăng, lan tỏa: nội nhiệt."],["Hư nhiệt khi sờ?","Da không nóng mà người thấy nóng; ấn sâu đến xương mới nóng."],["Lạnh lên quá gối khuỷu / chỉ dưới gối khuỷu?","Dương hư (hư hàn) / thực hàn hoặc khí trệ."],["Mu tay nóng / lòng tay nóng?","Ngoại nhiệt / nội nhiệt (hư nhiệt)."],["Thủy thũng / khí thũng?","Ấn để lại vết lõm / ấn xong đầy lên ngay."],["Nhọt: âm thư / dương thư / thành mủ?","Sưng không nóng đỏ / sưng nóng đỏ đau / cứng xung quanh mềm giữa."],["Khối ở bụng cố định / không cố định?","Huyết ứ / khí trệ."],["Nhiệt chứng mà tay chân lạnh (ZD)?","Nhiệt sâu, dương bế ở trong: chân nhiệt giả hàn."]],

// Tầng 2 – Bát cương 2.28–2.29. Nguồn: 中医诊断学 (ZD) chương 八纲辨证; Lý luận YHCT (LL) tr.119–122; CĐ tr.256–257.
const SRC_ZD="中医诊断学 (十三五), chương 八纲辨证";
Object.assign(LESSONS,{
"2.28":{id:"2.28",tang:2,title:"Bát cương (1): biểu – lý, hàn – nhiệt",han:"八纲 · 表里 寒热",src:SRC_ZD+"; "+SRC_LL+", tr.119–121; "+SRC_CD+", tr.256",
hook:"“Nhiệt ngộ nhiệt tắc cuồng, hàn ngộ hàn tắc tử.” Chẩn sai hàn nhiệt thì hậu quả là gì? Và vì sao lại có câu: bệnh ở biểu mà chữa theo lý thì đưa tà vào trong?",
reading:`
<p><b>Bát cương</b> là bước biện chứng <b>đầu tiên và cơ bản nhất</b> sau tứ chẩn, làm nền cho mọi phép biện chứng khác. <span class="pg">CĐ tr.256</span> Bốn cặp: <b>biểu – lý</b> (vị trí nông sâu), <b>hàn – nhiệt</b> (tính chất), <b>hư – thực</b> (thịnh suy chính tà), <b>âm – dương</b> (tổng cương). <span class="pg">LL tr.119</span> Bát cương cho kết luận khái quát; muốn điều trị cụ thể còn cần biện chứng khí huyết, tạng phủ… (ZD).</p>
<p><b>Biểu – lý: vị trí bệnh</b> (ZD)</p>
<table><tr><th></th><th>Biểu chứng</th><th>Bán biểu bán lý</th><th>Lý chứng</th></tr>
<tr><td>Là gì</td><td>Tà mới xâm nhập qua bì mao, mũi miệng; chính khí chống tà ở cơ biểu</td><td>Tà không hẳn ở biểu, chưa hẳn vào lý (Thiếu dương)</td><td>Bệnh ở tạng phủ, khí huyết, cốt tủy</td></tr>
<tr><td>Hàn nhiệt</td><td><b>Sợ lạnh và sốt cùng lúc</b>, mới khởi phát</td><td><b>Hàn nhiệt vãng lai</b></td><td><b>Chỉ sốt không sợ lạnh</b>, hoặc <b>chỉ lạnh không sốt</b></td></tr>
<tr><td>Triệu chứng kèm</td><td>Đau đầu, đau mình, hắt hơi, ngạt mũi, chảy mũi, ngứa họng; triệu chứng tạng phủ không rõ</td><td>Ngực sườn đầy tức, phiền, hay nôn, không muốn ăn, miệng đắng, họng khô, hoa mắt</td><td>Triệu chứng tạng phủ là chính (hồi hộp, ho suyễn, đau bụng, nôn…)</td></tr>
<tr><td>Lưỡi, mạch</td><td>Lưỡi ít thay đổi, rêu mỏng; <b>mạch phù</b></td><td>Lưỡi ít thay đổi; <b>mạch huyền</b></td><td>Lưỡi thường thay đổi; <b>mạch trầm</b> hoặc nhiều loại khác</td></tr>
<tr><td>Đặc điểm</td><td>Khởi phát cấp, vị trí nông, bệnh ngắn</td><td></td><td>Nặng hơn, sâu hơn, dài hơn</td></tr></table>
<p class="muted">Lý chứng hình thành do: biểu chứng không giải, tà truyền vào; tà trực trúng vào tạng phủ; hoặc nội thương (tình chí, ăn uống, lao lực). Trong lý: bệnh ở phủ, ở trên, ở khí thì nông; ở tạng, ở dưới, ở huyết thì sâu (ZD). Chẩn sai: biểu mà chữa theo lý thì <b>đưa tà vào trong</b>; lý mà dùng giải biểu thì <b>làm tổn thương tạng phủ</b>. <span class="pg">LL tr.121</span></p>
<p><b>Hàn – nhiệt: tính chất bệnh</b>. “Dương thịnh thì nhiệt, âm thịnh thì hàn; dương hư thì ngoại hàn, âm hư thì nội nhiệt.” Hàn chứng, nhiệt chứng đều có <b>thực và hư</b>. (ZD)</p>
<table><tr><th></th><th>Hàn chứng</th><th>Nhiệt chứng</th></tr>
<tr><td>Đặc điểm chung (ZD)</td><td><b>Lạnh, trắng, loãng, nhuận, tĩnh</b></td><td><b>Nóng, đỏ (vàng), đặc, khô, động</b></td></tr>
<tr><td>Hàn nhiệt, ưa ghét</td><td>Sợ lạnh, thích ấm, tay chân lạnh, nằm co</td><td>Sốt, sợ nóng, thích mát</td></tr>
<tr><td>Khát</td><td>Không khát, miệng nhạt</td><td>Khát, thích uống</td></tr>
<tr><td>Mặt</td><td>Trắng</td><td>Đỏ</td></tr>
<tr><td>Chất bài tiết</td><td>Đờm, mũi, nước dãi trong loãng; tiểu trong dài; phân lỏng</td><td>Đờm, mũi vàng đặc; tiểu ngắn vàng; phân khô</td></tr>
<tr><td>Tinh thần</td><td>Tĩnh</td><td>Phiền, vật vã</td></tr>
<tr><td>Lưỡi, mạch</td><td>Lưỡi nhạt, rêu trắng nhuận; mạch khẩn hoặc trì</td><td>Lưỡi đỏ ít tân, rêu vàng khô; mạch sác</td></tr>
<tr><td>Thực / hư</td><td>Thực hàn: cảm hàn, cấp, người khỏe. Hư hàn: bệnh lâu, dương hư</td><td>Thực nhiệt: cảm nhiệt, cấp, người khỏe. Hư nhiệt: bệnh lâu, âm hư</td></tr></table>
<p class="muted">ZD nhấn mạnh: <b>hàn tượng, nhiệt tượng</b> (từng triệu chứng sợ lạnh, sốt) khác với <b>hàn chứng, nhiệt chứng</b> (kết luận về bản chất); phải tổng hợp tứ chẩn, không dựa vào một triệu chứng. Chẩn sai: “nhiệt ngộ nhiệt tắc cuồng, hàn ngộ hàn tắc tử” (LL tr.119). Pháp trị: <b>hàn giả nhiệt chi, nhiệt giả hàn chi</b>.</p>`,
checkTitle:"Xác định biểu – lý, hàn – nhiệt",
checklist:["Bệnh mới hay lâu? Sợ lạnh và sốt có cùng lúc không, hay chỉ sốt, chỉ lạnh, hay lúc nóng lúc lạnh?","Có triệu chứng tạng phủ nổi bật không?","Mạch phù, trầm hay huyền? Lưỡi có thay đổi không?","Thích nóng hay thích mát? Khát hay không? Mặt trắng hay đỏ?","Chất bài tiết trong loãng hay vàng đặc? Tiểu, phân thế nào?","Kết luận dựa trên tổng thể, không dựa một triệu chứng"],
quiz:[
{q:"Theo 中医诊断学, dấu hiệu then chốt của biểu chứng là:",o:[["Chỉ sốt không sợ lạnh","Sai: đó là lý chứng."],["Mới khởi phát, sợ lạnh và sốt cùng lúc, mạch phù","Đúng."],["Hàn nhiệt vãng lai","Sai: đó là bán biểu bán lý."],["Triệu chứng tạng phủ nổi bật","Sai."]],a:1,p:"ZD 表证"},
{q:"Hàn nhiệt vãng lai, ngực sườn đầy tức, miệng đắng, họng khô, hoa mắt, mạch huyền là:",o:[["Biểu chứng","Sai."],["Bán biểu bán lý (Thiếu dương)","Đúng."],["Lý thực nhiệt","Sai."],["Hư hàn","Sai."]],a:1,p:"ZD 半表半里证"},
{q:"Theo 中医诊断学, lý chứng có thể hình thành theo những đường nào?",o:[["Chỉ do nội thương","Sai."],["Biểu chứng không giải truyền vào; tà trực trúng tạng phủ; hoặc nội thương","Đúng."],["Chỉ do ngoại cảm","Sai."],["Chỉ do di truyền","Sai."]],a:1,p:"ZD 里证"},
{q:"Theo giáo trình Lý luận, bệnh ở biểu mà chẩn đoán nhầm là lý, dùng phương pháp điều trị lý sẽ:",o:[["Không sao","Sai."],["Đưa nguyên nhân gây bệnh vào trong","Đúng."],["Làm tổn thương tạng phủ","Sai: đó là khi lý mà dùng giải biểu."],["Chữa khỏi nhanh hơn","Sai."]],a:1,p:"121"},
{q:"Theo 中医诊断学, đặc điểm chung của hàn chứng là:",o:[["Nóng, đỏ, đặc, khô, động","Sai: đó là nhiệt chứng."],["Lạnh, trắng, loãng, nhuận, tĩnh","Đúng."],["Đầy, trướng, cứng","Sai."],["Khô, ngứa, chạy chỗ","Sai."]],a:1,p:"ZD 寒证"},
{q:"“Dương hư thì ngoại hàn, âm hư thì nội nhiệt” nghĩa là:",o:[["Hàn, nhiệt chứng chỉ có thể thực","Sai."],["Hàn chứng, nhiệt chứng đều có thể do hư","Đúng: hư hàn do dương hư, hư nhiệt do âm hư."],["Dương hư gây nhiệt","Sai."],["Âm hư gây hàn","Sai."]],a:1,p:"ZD 寒热辨证"},
{q:"Theo giáo trình Lý luận, “nhiệt ngộ nhiệt tắc cuồng” cảnh báo điều gì?",o:[["Bệnh nhiệt mà dùng phép điều trị nhiệt sẽ nặng thêm","Đúng."],["Bệnh hàn dùng thuốc hàn","Sai: đó là “hàn ngộ hàn tắc tử”."],["Không có ý nghĩa","Sai."],["Nên dùng thuốc nóng cho bệnh nhiệt","Sai."]],a:0,p:"119"},
{q:"Tiểu ngắn vàng, phân khô, đờm vàng đặc, khát thích uống, lưỡi đỏ rêu vàng khô, mạch sác:",o:[["Hàn chứng","Sai."],["Nhiệt chứng","Đúng."],["Biểu chứng","Sai."],["Hư hàn","Sai."]],a:1,p:"ZD 热证"},
{q:"Theo giáo trình CĐ, bát cương biện chứng có vai trò:",o:[["Bước đầu tiên, cơ bản, làm nền cho các phép biện chứng khác","Đúng."],["Chỉ dùng cho bệnh ngoại cảm","Sai."],["Thay thế mọi phép biện chứng","Sai: bát cương khái quát, chưa đủ cụ thể để điều trị."],["Chỉ dùng cho châm cứu","Sai."]],a:0,p:"256"}
],
case:{v:`A: nam 25 tuổi, hôm qua dầm mưa, nay sợ lạnh, sốt nhẹ, đau đầu, đau mình, ngạt mũi chảy nước mũi trong; rêu trắng mỏng, mạch phù khẩn. B: ba ngày sau A sốt cao không còn sợ lạnh, khát nước, ho đờm vàng, táo bón; lưỡi đỏ rêu vàng, mạch sác. C: nữ 60 tuổi, lâu nay sợ lạnh, tay chân lạnh, tiểu trong dài, phân lỏng, không khát; lưỡi nhạt, mạch trầm trì vô lực.`,
qs:["A: biểu hay lý, hàn hay nhiệt? Căn cứ chính?","B: bệnh đã chuyển thế nào?","C: biểu hay lý, hàn hay nhiệt, thực hay hư?"],
ans:`<p><b>1.</b> A: <b>biểu hàn</b>: mới bị, sợ lạnh và sốt cùng lúc, đau đầu mình, mạch phù (biểu); nước mũi trong, rêu trắng, mạch khẩn (hàn). <span class="pg">ZD 表证, 寒证</span></p>
<p><b>2.</b> B: hết sợ lạnh, chỉ sốt, khát, ho đờm vàng, táo, lưỡi đỏ rêu vàng, mạch sác: <b>tà từ biểu vào lý, hàn hóa nhiệt</b>, thành <b>lý thực nhiệt</b> (xem chuyển hóa ở bài 2.29). <span class="pg">ZD 表邪入里</span></p>
<p><b>3.</b> C: <b>lý hư hàn</b>: bệnh lâu, chỉ lạnh không sốt, lạnh trắng loãng, mạch trầm (lý), trì vô lực (hư hàn); gốc là dương hư. <span class="pg">ZD 寒证</span></p>`},
cards:[["Bát cương: 4 cặp nói lên gì?","Biểu lý: vị trí. Hàn nhiệt: tính chất. Hư thực: chính tà thịnh suy. Âm dương: tổng cương."],["Biểu chứng: then chốt?","Mới khởi phát, sợ lạnh và sốt cùng lúc, đau đầu mình, mạch phù; triệu chứng tạng phủ không rõ."],["Bán biểu bán lý?","Hàn nhiệt vãng lai, ngực sườn đầy tức, miệng đắng, họng khô, hoa mắt, mạch huyền (Thiếu dương)."],["Lý chứng: then chốt?","Chỉ sốt hoặc chỉ lạnh; triệu chứng tạng phủ nổi bật; mạch trầm."],["3 đường hình thành lý chứng?","Biểu không giải truyền vào; tà trực trúng; nội thương."],["Hàn chứng: 5 chữ? Nhiệt chứng: 5 chữ?","Lạnh, trắng, loãng, nhuận, tĩnh. Nóng, đỏ (vàng), đặc, khô, động."],["Dương thịnh, âm thịnh, dương hư, âm hư?","Dương thịnh: nhiệt. Âm thịnh: hàn. Dương hư: ngoại hàn. Âm hư: nội nhiệt."],["Chẩn sai biểu lý?","Biểu mà chữa lý: đưa tà vào trong. Lý mà giải biểu: tổn thương tạng phủ."],["Nhiệt ngộ nhiệt / hàn ngộ hàn?","Nhiệt ngộ nhiệt tắc cuồng; hàn ngộ hàn tắc tử."]],

"2.29":{id:"2.29",tang:2,title:"Bát cương (2): hư – thực, âm – dương, kết hợp và chân giả",han:"虚实 阴阳 · 相兼 错杂 转化 真假",src:SRC_ZD+"; "+SRC_LL+", tr.120–122",
hook:"Một người sốt cao, mê sảng mà tay chân lạnh giá. Một người bệnh lâu, mặt lại ửng đỏ ở gò má, kêu nóng nhưng đòi đắp chăn. Một người bụng trướng, táo bón như “thực” mà ấn bụng lại dễ chịu. Cái nào là thật, cái nào là giả?",
reading:`
<p><b>Hư – thực: thịnh suy chính tà.</b> “Tà khí thịnh thì thực, tinh khí đoạt thì hư.” Thực chứng thì công, hư chứng thì bổ; sai thì phạm lỗi “thực thực hư hư” (làm thực thêm, hư thêm). (ZD)</p>
<table><tr><th></th><th>Hư chứng</th><th>Thực chứng</th></tr>
<tr><td>Bản chất (ZD)</td><td>Chính khí hư, tà không rõ: <b>bất túc, lỏng lẻo, suy giảm</b></td><td>Tà khí thịnh, chính chưa hư: <b>hữu dư, cang thịnh, ứ đọng</b></td></tr>
<tr><td>Nguyên nhân</td><td>Bẩm sinh yếu; chủ yếu ăn uống thất điều, lao lực, bệnh lâu, mất máu, mồ hôi, tả nhiều</td><td>Lục dâm, dịch lệ xâm nhập; hoặc đàm, ẩm, thủy thấp, ứ huyết, thực tích đọng lại</td></tr>
<tr><td>Biểu hiện (LL)</td><td>Gầy, mệt, ít hoạt động, nói nhỏ, thở yếu, mồ hôi ra, phân nát, tiểu nhiều lần, đêm; lưỡi bệu nhợt; <b>mạch vô lực</b></td><td>Mới mắc, bồn chồn, tiếng to, hơi thở mạnh, chất thải hôi, táo, tiểu ít, <b>đau cự án</b>, rêu dày; <b>mạch có lực</b></td></tr></table>
<p><b>Âm – dương: tổng cương.</b> <b>Biểu, nhiệt, thực thuộc dương; lý, hàn, hư thuộc âm</b>; tuy nhiên chỉ là tương đối (lý nhiệt, lý thực so với lý hàn, lý hư lại thuộc dương). (ZD, LL tr.120)</p>
<ul><li><b>Âm hư</b> (âm hư sinh nội nhiệt): sốt về chiều, gò má đỏ, lòng bàn tay chân nóng, họng khô, khát, táo, tiểu vàng, gầy, mất ngủ; lưỡi đỏ, ít rêu; mạch tế sác. <span class="pg">LL tr.120</span></li>
<li><b>Dương hư</b> (dương hư tất ngoại hàn): sợ lạnh, tay chân lạnh, nằm co, không khát, tiểu trong, tiểu đêm, phân nát; lưỡi bệu nhạt; mạch vi vô lực. <span class="pg">LL tr.121</span></li>
<li><b>Vong âm, vong dương</b>: bệnh nặng, đe dọa tính mạng, <b>cấp cứu</b>. Vong âm: suy kiệt, mồ hôi nóng dính, da khô nóng, chân tay ấm, khát, mạch tế sác. Vong dương: mồ hôi lạnh ra nhiều, sợ lạnh, chân tay lạnh, mạch vi khó bắt. <span class="pg">LL tr.121</span> (liên hệ tuyệt hãn, bài 2.13)</li></ul>
<p><b>Quan hệ giữa các cương</b> (ZD)</p>
<ul><li><b>Tương kiêm</b>: các cương không đối lập đi cùng nhau: biểu thực hàn, lý hư nhiệt…</li>
<li><b>Thác tạp</b> (cùng lúc có hai cương đối lập): <b>biểu lý đồng bệnh</b> (6 kiểu, ví dụ biểu hàn lý nhiệt: sợ lạnh, sốt, không mồ hôi, mà khát, phiền, táo; biểu thực lý hư: người vốn khí huyết hư lại cảm phong hàn); <b>hàn nhiệt thác tạp</b> (thượng nhiệt hạ hàn, thượng hàn hạ nhiệt); <b>hư thực hiệp tạp</b>: hư trung hiệp thực, thực trung hiệp hư, hư thực tịnh trọng. LL ví dụ: sa sinh dục (tỳ hư hạ hãm) có viêm nhiễm (thấp nhiệt). Mấu chốt là phân <b>nhiều ít, hoãn cấp</b> để quyết định công, bổ hay công bổ kiêm. <span class="pg">LL tr.121–122</span></li>
<li><b>Chuyển hóa</b>: biểu vào lý (nặng lên), lý ra biểu (có đường ra, sắp khỏi: ví dụ ra mồ hôi thì hết sốt, sởi mọc ra được); hàn hóa nhiệt (dương khí còn mạnh), <b>nhiệt chuyển hàn</b> (chính không thắng tà, dương suy, có thể vong dương); thực chuyển hư (thường gặp), hư chuyển thực (ít, thường là do hư sinh thực: bản hư tiêu thực).</li></ul>
<p><b>Chân giả: hiện tượng trái với bản chất</b>, thường ở giai đoạn nặng (ZD):</p>
<table><tr><th>Loại</th><th>Bản chất</th><th>“Giả tượng”</th><th>Phân biệt</th></tr>
<tr><td><b>Chân nhiệt giả hàn</b> (nhiệt cực tựa hàn)</td><td>Lý nhiệt thịnh: ngực bụng nóng rát, mê sảng, hơi thở hôi, khát thích lạnh, tiểu vàng, lưỡi đỏ rêu vàng khô</td><td>Tay chân lạnh giá, mạch trầm trì</td><td>Tay chân lạnh mà <b>ngực bụng nóng rát, không muốn đắp</b>; mạch trầm trì mà <b>ấn có lực</b>. “Nhiệt càng sâu quyết càng sâu”</td></tr>
<tr><td><b>Chân hàn giả nhiệt</b> (hàn cực tựa nhiệt)</td><td>Dương suy âm hàn thịnh: tay chân lạnh, tiểu trong, phân lỏng, ỉa ra cả thức ăn, lưỡi nhạt, mạch vô lực</td><td>Tự thấy nóng, mặt đỏ, vật vã, khát, đau họng, mạch phù đại hoặc sác</td><td>Thấy nóng mà <b>sờ ngực bụng không nóng, muốn đắp thêm</b>; mặt đỏ chỉ <b>ở gò má, hồng nhạt, lúc ẩn lúc hiện</b>; khát mà <b>thích uống nóng, uống ít</b>; đau họng mà không sưng đỏ; mạch ấn <b>vô lực</b>. Do dương hư bị đẩy nổi lên trên, ra ngoài</td></tr>
<tr><td><b>Chân thực giả hư</b> (“đại thực hữu luy trạng”)</td><td>Tà tích tụ nhiều (nhiệt, đàm, thực, thấp nhiệt, ứ huyết)</td><td>Lặng lẽ, mệt, ngại nói, mạch trầm tế</td><td>Ít nói mà nói thì tiếng to; mệt mà vận động lại dễ chịu; mạch trầm tế mà ấn có lực; đau cự án, lưỡi già, rêu dày nhớt</td></tr>
<tr><td><b>Chân hư giả thực</b> (“chí hư hữu thịnh hậu”)</td><td>Tạng phủ hư suy, vận hóa vô lực</td><td>Bụng trướng đau, đại tiểu tiện bế, mạch huyền</td><td>Trướng mà lúc giảm (không đầy mãi); đau mà <b>ấn thì đỡ</b>; mạch huyền mà ấn sâu vô lực; mệt, sắc mặt kém, lưỡi non</td></tr></table>
<p class="muted">Nguyên tắc nhận chân giả (ZD): xét toàn bộ diễn biến (giả tượng hay xuất hiện ở giai đoạn sau, nặng); lấy triệu chứng ở <b>bên trong, trung tâm (ngực bụng)</b> làm chính, triệu chứng ở ngoài, tứ chi có thể là giả; với hư thực thì xem <b>mạch ấn sâu có lực hay không</b>, lưỡi già hay non, tiếng nói to hay nhỏ.</p>`,

case:{v:`A: nam 30 tuổi, sốt cao 5 ngày, táo bón, bụng cứng nóng, mê sảng, khát nước đá; tay chân lạnh ngắt; lưỡi đỏ rêu vàng khô, mạch trầm mà ấn có lực. B: nữ 75 tuổi, bệnh lâu, tiêu chảy ra cả thức ăn, tay chân lạnh; hôm nay gò má ửng hồng lúc có lúc không, kêu nóng nhưng đòi đắp chăn, khát nhưng chỉ nhấp vài ngụm nước nóng; mạch phù to, ấn vào trống rỗng. C: nữ 58 tuổi, vốn mệt, ăn kém, phân lỏng nhiều năm; mấy hôm nay lạnh, sốt, đau mình, không mồ hôi.`,
qs:["A: bản chất là gì? Giả tượng là gì? Căn cứ phân biệt?","B: bản chất là gì? Căn cứ?","C: thuộc kiểu kết hợp nào của bát cương? Hướng xử trí chung?"],
ans:`<p><b>1.</b> A: <b>chân nhiệt giả hàn</b>. Bản chất lý thực nhiệt (bụng cứng nóng, mê sảng, khát nước lạnh, lưỡi đỏ rêu vàng khô); tay chân lạnh là giả, do nhiệt bế dương khí ở trong. Căn cứ: ngực bụng nóng, mạch ấn có lực. Cần cấp cứu. <span class="pg">ZD 真热假寒; bài 2.27</span></p>
<p><b>2.</b> B: <b>chân hàn giả nhiệt</b> (hư dương phù việt). Bản chất dương suy âm hàn thịnh (tiêu chảy ra thức ăn, tay chân lạnh); giả tượng: gò má ửng hồng lúc ẩn lúc hiện, kêu nóng mà muốn đắp, khát mà uống ít nước nóng, mạch phù đại ấn rỗng. Rất nặng, cần cấp cứu. <span class="pg">ZD 真寒假热</span></p>
<p><b>3.</b> C: <b>biểu thực lý hư</b> (biểu lý đồng bệnh, hư thực hiệp tạp): nền tỳ khí hư, nay cảm phong hàn. Xử trí phải tính cả hai: giải biểu mà không làm tổn chính, chú ý phù chính; phân bên nào cấp hơn. <span class="pg">ZD 表里同病</span></p>`},
cards:[["Hư / thực theo Nội kinh?","Tà khí thịnh thì thực; tinh khí đoạt thì hư."],["Hư chứng / thực chứng: đặc điểm (ZD)?","Hư: bất túc, lỏng lẻo, suy giảm. Thực: hữu dư, cang thịnh, ứ đọng."],["Âm dương tổng cương?","Biểu, nhiệt, thực thuộc dương; lý, hàn, hư thuộc âm (tương đối)."],["Vong âm / vong dương?","Vong âm: mồ hôi nóng dính, da nóng, chân tay ấm, khát, mạch tế sác. Vong dương: mồ hôi lạnh nhiều, chân tay lạnh, mạch vi."],["Ba kiểu quan hệ giữa các cương?","Tương kiêm, thác tạp, chuyển hóa (và chân giả)."],["Hàn hóa nhiệt / nhiệt chuyển hàn?","Hàn hóa nhiệt: dương khí còn mạnh. Nhiệt chuyển hàn: dương suy, chính không thắng tà, có thể vong dương."],["Chân nhiệt giả hàn: phân biệt?","Tay chân lạnh mà ngực bụng nóng, không muốn đắp; mạch trầm trì ấn có lực."],["Chân hàn giả nhiệt: phân biệt?","Nóng mà muốn đắp, ngực bụng không nóng; gò má hồng nhạt lúc ẩn hiện; khát thích nóng uống ít; mạch ấn vô lực."],["Đại thực hữu luy trạng / chí hư hữu thịnh hậu?","Chân thực giả hư (mạch ấn có lực, cự án) / chân hư giả thực (ấn đỡ đau, mạch ấn sâu vô lực)."]],

// Tầng 2 – Biện chứng khí huyết (2.30), tân dịch – đàm ẩm (2.31). Nguồn: 中医诊断学 chương 病性辨证 (气血辨证, 津液辨证); CĐ tr.257.

"2.30":{id:"2.30",tang:2,title:"Biện chứng khí huyết",han:"气血辨证",src:"中医诊断学 (十三五), chương 病性辨证 mục 气血辨证; "+SRC_CD+", tr.257",
hook:"Một phụ nữ sau sinh mệt, hụt hơi, da xanh, hoa mắt, kinh ít, lại hay chảy máu chân răng, bầm tím dưới da. Là khí hư, huyết hư, hay khí không nhiếp huyết? Và vì sao gọi tên cho đúng lại quyết định cả bài thuốc?",
reading:`
<p><b>Vị trí trong quy trình</b> <span class="pg">CĐ tr.257</span>: sau bát cương (ví dụ “lý hư”), dùng biện chứng khí huyết tân dịch để biết hư cái gì (khí hư, huyết hư…) hay ứ cái gì (khí trệ, huyết ứ…); rồi dùng tạng phủ để biết ở đâu (can huyết hư hay tâm huyết hư). Ôn lại sinh lý khí, huyết ở bài 1.06–1.07.</p>
<p><b>Bệnh của khí</b> (ZD): hai nhóm: <b>khí bất túc</b> (hư, hãm, bất cố, thoát) và <b>khí cơ thất điều</b> (trệ, nghịch, bế).</p>
<table><tr><th>Chứng</th><th>Then chốt</th><th>Biểu hiện chính</th></tr>
<tr><td><b>Khí hư</b></td><td>Mệt, ít hơi, mạch hư</td><td>Mệt mỏi, ngại nói, hụt hơi, choáng, <b>tự hãn</b>, <b>vận động thì nặng hơn</b>; lưỡi nhạt non, mạch hư</td></tr>
<tr><td><b>Khí hãm</b></td><td>Cảm giác sa xuống, tạng sa</td><td>Bụng dưới sa trệ, tiêu chảy lỵ lâu ngày, <b>sa tạng, sa trực tràng, sa tử cung</b>; kèm khí hư</td></tr>
<tr><td><b>Khí bất cố</b></td><td>Không giữ được</td><td>Tự hãn không dứt, chảy dãi; đái dầm, tiểu không tự chủ; đại tiện không tự chủ; <b>xuất huyết</b>, kinh nhiều, rong huyết; sảy thai liên tiếp; di tinh, hoạt tinh</td></tr>
<tr><td><b>Khí thoát</b></td><td>Nguy, sắp thoát</td><td>Thở yếu không đều, mồ hôi ra không ngừng, miệng há mắt nhắm, tay buông, lơ mơ, mặt trắng, đại tiểu tiện không tự chủ, mạch vi: <b>cấp cứu</b></td></tr>
<tr><td><b>Khí trệ</b> (khí uất, khí kết)</td><td>Trướng, đau, mạch huyền</td><td>Ngực sườn thượng vị bụng <b>trướng đau, lúc nặng lúc nhẹ, chạy chỗ</b>, thay đổi theo cảm xúc, <b>đỡ khi ợ, trung tiện, thở dài</b>; mạch huyền; lưỡi ít thay đổi</td></tr>
<tr><td><b>Khí nghịch</b></td><td>Đi ngược lên</td><td>Phế: ho, suyễn. Vị: nấc, ợ, buồn nôn, nôn. Can: đau đầu, choáng, thậm chí ngất, nôn ra máu. Phần lớn là thực, nhưng cũng có khí nghịch do hư</td></tr>
<tr><td><b>Khí bế</b></td><td>Bế tắc đột ngột</td><td>Đột ngột hôn mê, ngất; hoặc đau quặn tạng phủ; bí đại tiểu tiện; thở thô, tiếng to; mạch trầm thực có lực</td></tr></table>
<p><b>Bệnh của huyết</b> (ZD)</p>
<table><tr><th>Chứng</th><th>Biểu hiện chính</th></tr>
<tr><td><b>Huyết hư</b></td><td>Mặt trắng nhợt hoặc vàng úa; <b>mi mắt, môi, móng nhợt</b>; hoa mắt, hồi hộp, mất ngủ mơ nhiều, hay quên, tê chân tay; kinh ít nhạt, chậm, bế kinh; lưỡi nhạt; <b>mạch tế vô lực</b>. Hay gặp tâm huyết hư, can huyết hư</td></tr>
<tr><td><b>Huyết thoát</b></td><td>Sau mất máu nhiều hoặc kéo dài: mặt trắng bệch, choáng, hồi hộp; lưỡi nhạt trắng khô; <b>mạch vi hoặc khâu</b></td></tr>
<tr><td><b>Huyết ứ</b></td><td>Bốn dấu: <b>đau</b> (như kim châm, cự án, cố định, nặng về đêm), <b>khối</b> (ngoài da tím xanh; trong bụng cứng, không di động), <b>xuất huyết</b> (tái phát, tím sẫm, có cục), <b>sắc mạch</b> (mặt sạm đen, môi móng tím, da khô ráp như vảy cá, mạng mạch, bầm dưới da, nổi gân xanh bụng; lưỡi tím, điểm ứ, tĩnh mạch dưới lưỡi giãn; mạch sáp, kết, đại)</td></tr>
<tr><td><b>Huyết nhiệt</b></td><td>Xuất huyết (ho, nôn, chảy máu cam, tiểu, đại tiện ra máu, rong kinh, kinh nhiều hoặc sớm), <b>máu đỏ tươi, đặc</b>; kèm thực nhiệt; lưỡi đỏ thẫm, mạch huyền sác</td></tr>
<tr><td><b>Huyết hàn</b></td><td>Tay chân hoặc tại chỗ <b>lạnh đau, da tím sẫm</b>, ấm thì đỡ; bụng dưới co thắt lạnh đau; thống kinh, kinh muộn, tím sẫm có cục; lưỡi nhạt tím, mạch trầm trì, huyền khẩn hoặc sáp</td></tr></table>
<p><b>Khí huyết đồng bệnh</b> (ZD): <b>khí huyết lưỡng hư</b> (cả hai nhóm triệu chứng); <b>khí hư huyết ứ</b> (khí không đủ đẩy huyết: mệt, ngại nói + đau như châm cố định, lưỡi nhạt tím, mạch sáp); <b>khí không nhiếp huyết</b> (các loại xuất huyết + khí hư; lưỡi nhạt, mạch nhược); <b>khí tùy huyết thoát</b> (mất máu nhiều rồi mặt trắng, thở yếu, mồ hôi đầm đìa, chân tay lạnh, ngất; mạch vi, khâu hoặc tán: <b>cấp cứu</b>); <b>khí trệ huyết ứ</b> (trướng đau chạy chỗ rồi đau như châm cố định, khối, cảm xúc uất; mạch huyền hoặc sáp).</p>
<p class="muted">Phân biệt xuất huyết: <b>huyết nhiệt</b> máu đỏ tươi, đặc, kèm thực nhiệt; <b>khí không nhiếp huyết</b> máu nhạt, kèm mệt, hụt hơi, lưỡi nhạt; <b>huyết ứ</b> máu tím sẫm có cục, tái đi tái lại, kèm đau cố định.</p>`,

case:{v:`Nữ 30 tuổi, sau sinh 3 tháng. Mệt, hụt hơi, ngại nói, đi lại nhiều thì vã mồ hôi. Da xanh, môi và móng tay nhợt, hoa mắt, hồi hộp, ngủ kém. Mấy tuần nay hay chảy máu chân răng, bầm tím dưới da khi va nhẹ, kinh nguyệt trở lại thì ra nhiều, màu nhạt. Lưỡi nhạt, mạch tế nhược.`,
qs:["Những triệu chứng nào thuộc khí hư, triệu chứng nào thuộc huyết hư?","Các biểu hiện xuất huyết thuộc chứng gì? Vì sao không phải huyết nhiệt?","Kết luận chứng tổng hợp. Cần lưu ý gì về Tây y?"],
ans:`<p><b>1.</b> Khí hư: mệt, hụt hơi, ngại nói, vận động vã mồ hôi (tự hãn). Huyết hư: da xanh, môi móng nhợt, hoa mắt, hồi hộp, ngủ kém, lưỡi nhạt, mạch tế. <span class="pg">ZD 气虚证, 血虚证</span></p>
<p><b>2.</b> <b>Khí không nhiếp huyết</b>: xuất huyết nhiều nơi, máu nhạt, kèm khí hư. Không phải huyết nhiệt vì không có máu đỏ tươi đặc, không sốt khát, lưỡi nhạt chứ không đỏ, mạch nhược chứ không sác. <span class="pg">ZD 气不摄血证, 血热证</span></p>
<p><b>3.</b> <b>Khí huyết lưỡng hư kèm khí không nhiếp huyết</b> (sau sinh). Chảy máu chân răng và bầm tím dễ dàng cần xét nghiệm máu (công thức máu, đông máu) để loại trừ bệnh máu trước khi điều trị. <span class="pg">ZD 气血两虚证</span></p>`},
cards:[["Khí bất túc: 4 chứng?","Khí hư, khí hãm, khí bất cố, khí thoát."],["Khí cơ thất điều: 3 chứng?","Khí trệ, khí nghịch, khí bế."],["Khí hư: then chốt?","Mệt, ngại nói, hụt hơi, tự hãn, vận động nặng thêm, mạch hư."],["Khí bất cố gồm gì?","Tự hãn, chảy dãi, tiểu đại tiện không tự chủ, xuất huyết, rong kinh, sảy thai, di tinh."],["Khí trệ: then chốt?","Trướng đau lúc nặng lúc nhẹ, chạy chỗ, theo cảm xúc, đỡ khi ợ, trung tiện, thở dài; mạch huyền."],["Khí nghịch ở phế, vị, can?","Phế: ho suyễn. Vị: nấc, ợ, nôn. Can: đau đầu, choáng, ngất, nôn máu."],["Huyết hư: then chốt?","Mặt, mi mắt, môi, móng, lưỡi nhợt; hoa mắt, hồi hộp, tê; kinh ít; mạch tế."],["Huyết ứ: 4 nhóm dấu?","Đau như châm cố định nặng về đêm; khối; xuất huyết tím có cục; sắc mạch ứ (môi lưỡi tím, mạch sáp)."],["Xuất huyết: huyết nhiệt / khí không nhiếp / huyết ứ?","Đỏ tươi đặc, kèm nhiệt / nhạt, kèm mệt / tím sẫm có cục, kèm đau cố định."]],

"2.31":{id:"2.31",tang:2,title:"Biện chứng tân dịch, đàm ẩm, thủy thũng",han:"津液辨证",src:"中医诊断学 (十三五), chương 病性辨证 mục 津液辨证; "+SRC_CD+", tr.257",
hook:"“Bách bệnh đa nhân đàm tác túy”, “quái bệnh đa đàm”: trăm bệnh phần nhiều do đàm, bệnh lạ phần nhiều có đàm. Nhưng đàm, ẩm, thủy, thấp khác nhau ở đâu, và vì sao phân biệt được lại quan trọng?",
reading:`
<p>Bệnh tân dịch chủ yếu có hai loại: <b>tân dịch hư thiếu</b> và <b>tân dịch phân bố, vận hành trở ngại</b> (sinh đàm, ẩm, thủy). Ôn lại sinh lý tân dịch ở bài 1.08. (ZD)</p>
<p><b>Tân dịch hư (tân dịch khuy hư)</b>: miệng, mũi, môi, lưỡi, họng, da <b>khô</b>; da nhăn mất đàn hồi, <b>mắt trũng</b>; khát muốn uống; <b>tiểu ít vàng, táo bón</b>; lưỡi đỏ ít tân, mạch tế sác vô lực. Do sốt cao, mồ hôi nhiều, nôn nhiều, tiêu chảy nhiều, bỏng; thời tiết khô; uống ít. Nhẹ gọi là <b>thương tân</b>, nặng gọi là <b>dịch thoát</b>. (ZD) Ở trẻ nhỏ, người già tiêu chảy nôn nhiều, mắt trũng, tiểu ít: cần bù nước, khám Tây y.</p>
<table><tr><th></th><th>Đàm</th><th>Ẩm</th><th>Thủy</th></tr>
<tr><td>Tính chất</td><td><b>Đặc, dính</b></td><td><b>Loãng</b>, đọng ở khoang, chỗ trống</td><td>Loãng nhất, <b>tràn ra cơ phu</b></td></tr>
<tr><td>Then chốt (ZD)</td><td>Ho đờm nhiều, tức ngực, buồn nôn, choáng, người béo, <b>khối tròn mềm dưới da</b>; rêu nhớt, mạch hoạt</td><td>Tức ngực, đầy thượng vị, <b>nôn nước trong</b>, ho đờm trong loãng, <b>sườn căng đầy</b>; rêu trắng trơn (hoạt), mạch huyền</td><td><b>Phù</b> (ấn lõm không đầy lên), cổ trướng, <b>tiểu ít</b>, nặng mình; lưỡi nhạt bệu, rêu trắng trơn, mạch nhu hoặc hoãn</td></tr></table>
<p><b>Đàm chứng</b> (ZD): đàm đi khắp nơi nên biểu hiện đa dạng: ở <b>phế</b>: ho đờm; ở <b>vị</b>: đầy thượng vị, buồn nôn, nôn ra đàm dãi; che <b>thanh khiếu</b>: choáng; tràn cơ phu: béo; che <b>tâm thần</b>: hôn mê, điên, cuồng, si ngốc, động kinh; kết dưới da: <b>tràng nhạc, bướu cổ</b> (cổ), <b>đàm hạch</b> (chi), <b>nhũ tích</b> (vú); ở họng: <b>mai hạch khí</b> (cảm giác vướng như hạt mận); ở kinh lạc: tê, liệt nửa người. Phân loại: hàn đàm, nhiệt đàm, thấp đàm, táo đàm, phong đàm, ứ đàm.</p>
<p><b>Ẩm chứng: bốn loại theo vị trí</b> (ZD):</p>
<ul><li><b>Đàm ẩm</b> (nghĩa hẹp): ẩm ở vị trường: đầy bụng, <b>bụng óc ách tiếng nước</b>, nôn nước trong.</li>
<li><b>Huyền ẩm</b>: ẩm ở ngực sườn: sườn căng đầy, <b>ho, thở, xoay người thì đau kéo</b>.</li>
<li><b>Chi ẩm</b>: ẩm ở tâm phế: tức ngực, hồi hộp, <b>thở gấp không nằm được</b>.</li>
<li><b>Dật ẩm</b>: ẩm tràn ra tứ chi: người và khớp nặng đau.</li></ul>
<p><b>Thủy đình (thủy thũng)</b> (ZD): phân <b>dương thủy</b> (thực: phát nhanh, <b>bắt đầu từ mi mắt, mặt, nửa trên nặng hơn</b>; thường do phong tà, phế mất tuyên giáng) và <b>âm thủy</b> (hư: phát từ từ, <b>bắt đầu từ chân, từ thắt lưng trở xuống nặng hơn</b>; do tỳ thận dương hư không khí hóa). Các thể: phong thủy tương bác, tỳ hư thủy đình, thận hư thủy phiếm, thủy khí lăng tâm (bài 2.15). Ứ huyết cũng làm thủy đình (huyết ứ thủy đình).</p>
<p class="muted">Liên hệ: mạch hoạt (đàm), mạch huyền (ẩm), rêu nhớt hoặc trơn ướt, lưỡi bệu có dấu răng (bài 2.07–2.09, 2.25). Phù ấn lõm là thủy thũng, ấn đầy lên ngay là khí thũng (bài 2.27).</p>`,

// Tầng 2 – Biện chứng tạng phủ. Nguồn: 中医诊断学 chương 病位辨证 mục 脏腑辨证; CĐ tr.257–258.

"2.32":{id:"2.32",tang:2,title:"Biện chứng tạng phủ: Tâm, Tiểu trường",han:"心与小肠病辨证",src:"中医诊断学 (十三五), chương 病位辨证 mục 心与小肠病辨证; "+SRC_CD+", tr.257–258",
hook:"Ba người cùng than “hồi hộp, mất ngủ”. Một người da xanh, môi nhợt, hay quên; một người gò má đỏ, ra mồ hôi trộm; một người miệng lở loét, tiểu buốt đỏ. Cùng là bệnh Tâm, ba hướng điều trị khác hẳn nhau.",
reading:`
<p><b>Cách làm biện chứng tạng phủ</b> <span class="pg">CĐ tr.257–258</span>: ghép <b>vị trí</b> (tạng nào: dựa vào chức năng tạng, bài 1.10) với <b>tính chất</b> (hư hay thực; khí, huyết, âm, dương; hàn, nhiệt, đàm, ứ: bài 2.28–2.31). Ví dụ: “huyết hư” + triệu chứng tâm = tâm huyết hư.</p>
<p><b>Triệu chứng của Tâm</b> (tâm chủ huyết mạch, tàng thần): <b>hồi hộp, chinh xung, đau ngực tức ngực, mất ngủ mơ nhiều, hay quên, thần chí bất thường</b> (cuồng, mê), lưỡi lở, mạch kết đại.</p>
<table><tr><th>Chứng</th><th>Triệu chứng Tâm</th><th>Kèm theo (tính chất)</th></tr>
<tr><td><b>Tâm khí hư</b></td><td>Hồi hộp, chinh xung, hụt hơi tức ngực</td><td>Mệt, tự hãn, <b>vận động thì nặng</b>, mặt nhợt; lưỡi nhạt; mạch hư</td></tr>
<tr><td><b>Tâm dương hư</b></td><td>Hồi hộp, tức ngực, có thể đau ngực</td><td>Như khí hư + <b>sợ lạnh, chân tay lạnh</b>; mặt trắng hoặc môi tím; lưỡi nhạt bệu hoặc tím, rêu trắng trơn; mạch nhược hoặc kết đại</td></tr>
<tr><td><b>Tâm dương hư thoát</b></td><td>Đau ngực dữ dội, hồi hộp</td><td>Đột ngột <b>mồ hôi lạnh đầm đìa, chân tay lạnh giá</b>, mặt trắng, thở yếu, lơ mơ hoặc hôn mê, môi lưỡi tím; mạch vi muốn tuyệt: <b>cấp cứu</b></td></tr>
<tr><td><b>Tâm huyết hư</b></td><td>Hồi hộp, mất ngủ, mơ nhiều, hay quên</td><td>Choáng, hoa mắt, mặt trắng nhợt hoặc vàng úa, <b>môi lưỡi nhợt</b>; mạch tế vô lực</td></tr>
<tr><td><b>Tâm âm hư</b></td><td>Hồi hộp, <b>phiền</b>, mất ngủ, mơ nhiều</td><td>Miệng họng khô, gầy, <b>gò má đỏ, lòng bàn tay chân nóng, sốt về chiều, mồ hôi trộm</b>; lưỡi đỏ ít rêu; mạch tế sác</td></tr>
<tr><td><b>Tâm hỏa kháng thịnh</b></td><td>Phiền, mất ngủ; nặng thì cuồng, mê sảng</td><td><b>Lưỡi lở loét đau</b>; hoặc nôn ra máu, chảy máu cam; hoặc tiểu ngắn đỏ, nóng rát; sốt, khát, táo, mặt đỏ; lưỡi đỏ, rêu vàng, mạch sác</td></tr>
<tr><td><b>Tâm mạch tý trở</b></td><td>Hồi hộp, chinh xung, <b>ngực tức đau lan vai lưng, mặt trong cánh tay</b>, lúc có lúc không</td><td>Bốn kiểu theo nguyên nhân: <b>ứ huyết</b> (đau như châm, lưỡi tím, mạch sáp, kết, đại); <b>đàm trọc</b> (tức nặng, béo, nhiều đờm, rêu nhớt, mạch trầm hoạt); <b>hàn ngưng</b> (gặp lạnh đau dữ, ấm thì đỡ, mạch trầm trì hoặc khẩn); <b>khí trệ</b> (đau trướng, theo cảm xúc, hay thở dài, mạch huyền)</td></tr>
<tr><td><b>Đàm mông tâm thần</b></td><td>Đần độn, ý thức mơ hồ, nặng thì hôn mê; hoặc trầm uất, lẩm bẩm, cử chỉ bất thường; hoặc đột ngột ngã, sùi bọt, họng có tiếng đờm</td><td>Mặt tối, tức ngực buồn nôn; rêu trắng nhớt; mạch hoạt</td></tr>
<tr><td><b>Đàm hỏa nhiễu thần</b></td><td>Phiền, mất ngủ, nặng thì mê sảng; hoặc <b>cuồng</b>: đập phá, nói bậy, khóc cười thất thường</td><td>Đờm vàng, họng khò khè, sốt, khát, mặt đỏ mắt đỏ; lưỡi đỏ rêu vàng nhớt; mạch hoạt sác</td></tr>
<tr><td><b>Ứ trở não lạc</b></td><td>Choáng mãi không hết, <b>đau đầu như châm, cố định</b>, lâu không khỏi; hay quên, mất ngủ; hoặc sau chấn thương đầu</td><td>Mặt tối; lưỡi tím, điểm ứ; mạch tế sáp</td></tr>
<tr><td><b>Tiểu trường thực nhiệt</b></td><td>(tâm hỏa chuyển xuống tiểu trường)</td><td><b>Tiểu ngắn đỏ, nóng rát buốt</b>, có thể tiểu ra máu; phiền khát, <b>lưỡi lở</b>; lưỡi đỏ rêu vàng, mạch sác</td></tr></table>
<p class="muted">Ba cặp dễ nhầm: <b>tâm khí hư / tâm dương hư</b> (dương hư thêm lạnh); <b>tâm huyết hư / tâm âm hư</b> (cùng mất ngủ, hồi hộp; huyết hư thì <b>nhợt</b>, âm hư thì <b>đỏ, nóng, mồ hôi trộm</b>); <b>tâm hỏa / tâm âm hư</b> (cùng phiền, lưỡi đỏ; tâm hỏa là thực: rêu vàng, mạch sác có lực; âm hư: ít rêu, mạch tế sác). Đau ngực lan vai, cánh tay trái cần loại trừ nhồi máu cơ tim (bài 2.14).</p>`,

<script>
/* ---------- storage ---------- */
const KEY="yhct15:v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
let S=Object.assign({done:{},cards:{},notes:{},quiz:{},log:{}},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const ymd=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
const today=()=>ymd(new Date());
const addDays=(d,n)=>{const [y,m,dd]=d.split("-").map(Number);return ymd(new Date(y,m-1,dd+n))};
const logToday=()=>{S.log[today()]=(S.log[today()]||0)+1};

/* ---------- simple spaced repetition (demo; app thật dùng FSRS) ---------- */
function addCards(lid){LESSONS[lid].cards.forEach((c,i)=>{const k=lid+"#"+i;if(!S.cards[k])S.cards[k]={due:today(),ivl:0,ease:2.5}})}
const cardExists=k=>{const [lid,i]=k.split("#");return !!(LESSONS[lid]&&LESSONS[lid].cards[+i])};
function dueCards(){return Object.entries(S.cards).filter(([k,c])=>c.due<=today()&&cardExists(k))
 .sort((a,b)=>(a[1].seen||0)-(b[1].seen||0)).map(([k])=>k)}
function rate(k,r){const c=S.cards[k]; c.seen=Date.now();
 if(r===1){c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.due=today()}
 else{const base=c.ivl||0; let n= r===2?Math.max(1,Math.round(base*1.2)) : r===3?(base?Math.round(base*c.ease):1) : (base?Math.round(base*c.ease*1.3):3);
  if(r===2)c.ease=Math.max(1.3,c.ease-.15); if(r===4)c.ease+=.15; c.ivl=n; c.due=addDays(today(),n)}
 logToday(); save()}

/* ---------- nav ---------- */
const TABS=[["home","日","Hôm nay"],["lessons","課","Bài học"],["review","習","Ôn tập"],["mat","眼","Luyện mắt"],["lib","典","Tra cứu"]];
let tab="home";
function renderNav(){document.getElementById("nav").innerHTML=TABS.map(([id,ic,l])=>
 `<button type="button" data-tab="${id}" ${tab===id?'aria-current="page"':''}><span class="ic">${ic}</span>${l}</button>`).join("");
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab))}
function go(t,arg){tab=t;renderNav();window.scrollTo(0,0);({home,lessons,review,lib,lesson,mat,sotm:soThacMac})[t](arg)}
const $=s=>document.querySelector(s); const app=()=>document.getElementById("app");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- home ---------- */
const ORDER=()=>Object.keys(LESSONS).sort((a,b)=>parseFloat(a)-parseFloat(b));
function backupNag(){const n=Object.keys(S.done).length;if(n<3)return "";
 const last=S.lastBackup; const days=last?Math.round((new Date(today())-new Date(last))/864e5):null;
 if(days!==null&&days<14)return "";
 return `<p class="note" style="margin:0 0 14px;border-color:var(--gold)">${last?`Đã ${days} ngày chưa sao lưu tiến độ.`:"Chị chưa sao lưu tiến độ lần nào."} Kéo xuống cuối trang, bấm “Tải file sao lưu” và cất file vào Google Drive hoặc Zalo “Cloud của tôi”.</p>`}
function nextLesson(){return ORDER().find(id=>!S.done[id])}
function caseLesson(){const d=ORDER().filter(id=>S.done[id]);return d.length?d.sort((a,b)=>S.done[b].localeCompare(S.done[a]))[0]:nextLesson()}
function home(){
 const d=new Date(), due=dueCards().length, nl=nextLesson(), revDone=due===0&&Object.keys(S.cards).length>0;
 const ds=d.toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"numeric"});
 const nDone=Object.keys(S.done).length, nCards=Object.keys(S.cards).length;
 let streak=0;for(let i=S.log[today()]?0:1;i<1000&&S.log[addDays(today(),-i)];i++)streak++;
 app().innerHTML=`
 <section class="today"><div class="seal" aria-hidden="true"><span>日</span><span>課</span><span>醫</span><span>學</span></div>
 <div><div class="date">${ds}</div><h1>Buổi học hôm nay</h1><p class="muted" style="margin:4px 0 0">Khoảng 15–30 phút. Làm lần lượt từ trên xuống.</p></div></section>
 ${backupNag()}<ol class="steps">
  <li class="${revDone?'done':''}"><div><div class="t">Ôn thẻ đến hạn</div><div class="s">${due?due+" thẻ đang chờ":(nCards?"Đã ôn xong hôm nay":"Chưa có thẻ. Học bài đầu tiên để có thẻ ôn")}</div></div>
   <button type="button" class="btn ${due?'':'ghost'}" ${due?'':'disabled'} data-go="review">Ôn</button></li>
  <li class="${nl?'':'done'}"><div><div class="t">Bài mới</div><div class="s">${nl?esc(nl+" · "+LESSONS[nl].title):"Đã học hết các bài đã soạn"}</div></div>
   <button type="button" class="btn ${nl?'':'ghost'}" ${nl?'':'disabled'} data-l="${nl||''}">Học</button></li>
  <li><div><div class="t">Ca tình huống</div><div class="s">Nằm cuối mỗi bài học. Tự suy luận trước, rồi mới xem gợi ý.</div></div>
   <button type="button" class="btn ghost" data-l="${caseLesson()||''}" data-case="1">Mở</button></li>
 </ol>
 <div class="stats"><div><b>${nDone}</b><span>bài đã học</span></div><div><b>${nCards}</b><span>thẻ trong kho</span></div><div><b>${streak}</b><span>ngày liên tiếp</span></div></div>
 <p class="note">Bản demo: đã có ${ORDER().length} bài (${ORDER().join(", ")}) và 26 tượng lưỡi trong phần Tra cứu. Bài mới được xếp theo lộ trình, bắt đầu từ Tầng 1. Tiến độ lưu ngay trên thiết bị này.</p>`;
 {const n=(S.hoi||[]).filter(x=>!x.xong).length;app().insertAdjacentHTML("beforeend",`<button type="button" class="btn ghost" id="toSotm" style="margin-top:14px;width:100%">❓ Sổ thắc mắc${n?` · ${n} câu chưa hỏi`:""}</button>`);$("#toSotm").onclick=()=>go("sotm")}
 app().insertAdjacentHTML("beforeend",`<div class="bk"><h3>Sao lưu tiến độ</h3>
 <p class="muted" style="font-size:.88rem">Tiến độ chỉ lưu trên máy này. Thỉnh thoảng tải file sao lưu về để phòng khi đổi máy hoặc xóa dữ liệu trình duyệt.</p>
 <button type="button" class="btn ghost" id="exp">Tải file sao lưu</button> <label class="btn ghost" for="imp" style="display:inline-block">Khôi phục từ file</label>
 <input type="file" id="imp" accept="application/json,.json" hidden><p id="bkmsg" class="muted" style="font-size:.85rem;margin-top:8px"></p></div>`);
 $("#exp").onclick=()=>{const blob=new Blob([JSON.stringify({app:"yhct15",v:1,at:new Date().toISOString(),data:S})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`yhct15-saoluu-${today()}.json`;document.body.appendChild(a);a.click();a.remove();S.lastBackup=today();save();
  $("#bkmsg").textContent="Đã tạo file sao lưu. Kiểm tra thư mục Tải về."};
 $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const j=JSON.parse(t);if(j.app!=="yhct15"||!j.data)throw 0;
  if(!confirm("Thay tiến độ hiện tại bằng dữ liệu trong file sao lưu?"))return;S=Object.assign({done:{},cards:{},notes:{},quiz:{},log:{}},j.data);save();go("home")})
  .catch(()=>{$("#bkmsg").textContent="File không đúng định dạng sao lưu của app. Chọn file yhct15-saoluu-….json."})};
 app().querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 app().querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>b.dataset.l&&go("lesson",{id:b.dataset.l,toCase:!!b.dataset.case}));
}

/* ---------- lessons cabinet ---------- */
function lessons(){
 let h=`<h1>Bài học</h1><p class="muted" style="margin-top:6px">Mỗi ô tủ là một bài. Ô viền vàng là bài đã soạn, sẵn sàng học.</p>`;
 for(const t of [1,2,3,4]){const arr=LESSON_TITLES[t];
  const doneN=arr.filter((_,i)=>S.done[`${t}.${String(i+1).padStart(2,"0")}`]).length;
  h+=`<div class="tang"><h3>Tầng ${t} · ${TANG_NAMES[t]}</h3><span class="muted" style="font-size:.85rem">${doneN}/${arr.length}</span></div><div class="cab">`;
  arr.forEach((title,i)=>{const id=`${t}.${String(i+1).padStart(2,"0")}`, ready=!!LESSONS[id], done=!!S.done[id];
   h+=`<button type="button" class="dr ${done?'done':ready?'ready':''}" ${ready?'':'disabled'} data-l="${id}" title="${esc(id+' '+title)}" aria-label="${esc(id+' '+title+(ready?'':' (chưa soạn)'))}">${id}</button>`});
  h+=`</div>`}
 h+=`<div class="legend"><span><i style="background:#E2C79C;box-shadow:0 0 0 2px var(--gold)"></i>Sẵn sàng</span><span><i style="background:var(--jade-soft)"></i>Đã học</span><span><i style="background:#C9A57A;opacity:.55"></i>Chưa soạn</span></div>`;
 app().innerHTML=h;
 app().querySelectorAll(".dr:not(:disabled)").forEach(b=>b.onclick=()=>go("lesson",{id:b.dataset.l}));
}

 const baiDangHoc=tab==="lesson"?curLesson:null;
 goc.querySelectorAll("[data-atlas]").forEach(b=>b.onclick=()=>{go("mat");loadKho().then(()=>{TAP=null;VE_BAI=baiDangHoc;hocMot(b.dataset.atlas)}).catch(()=>{})});
 if(!o.length)return; loadKho().then(()=>o.forEach(el=>{const a=KHO.anh.find(x=>x.id===el.dataset.id);
   el.innerHTML=a?photo(a,el.dataset.khung==="1")+'<p class="src-note">Ảnh minh họa đặc điểm, không phải ảnh của người bệnh trong ca.</p>':'<p class="src-note">Không tìm thấy ảnh trong kho.</p>'}))

let _sel={t:"",at:0,muc:""};

 if(t.length<3)return;const n=sl.anchorNode&&(sl.anchorNode.nodeType===1?sl.anchorNode:sl.anchorNode.parentElement);
 if(!n||!n.closest||!n.closest("#app"))return;_sel={t:t.slice(0,1500),at:Date.now(),muc:mucCua(n)}});
function mucCua(el){// tên mục: tiêu đề .sec gần nhất phía trước
 let x=el.closest(".q")?null:el;const q=el.closest(".q");if(q)return "Trắc nghiệm";
 const secs=[...app().querySelectorAll(".sec")];let m="";for(const s of secs){if(s.compareDocumentPosition(el)&Node.DOCUMENT_POSITION_FOLLOWING)m=s.textContent.replace(/^\S\s*/,"").trim()}return m||"Bài học"}
let _hoi=null;
function moHoi(o){_hoi=o;const d=$("#hoiDlg");
 $("#hoiCtx").textContent=[o.bai?("Bài "+o.bai+(o.ten?" · "+o.ten:"")):"",o.muc||""].filter(Boolean).join(" · ");
 $("#hoiDoan").textContent=o.doan||"(Chưa chọn đoạn nào. Mẹo: bôi đen đoạn chưa hiểu rồi mới bấm ❓, hoặc gõ thẳng câu hỏi bên dưới.)";
 $("#hoiQ").value="";$("#hoiMsg").textContent="";d.showModal();setTimeout(()=>$("#hoiQ").focus(),50)}

async function chep(text){try{await navigator.clipboard.writeText(text);return true}catch(e){
 const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();

  <div><div class="nm">${esc(t.vi)}<span class="han">${t.han}</span></div><div class="ds">${esc(t.d)}</div><div class="mn"><b>Chủ:</b> ${esc(t.m)}</div>
  ${t.f?`<div class="fl">Đã hiệu đính: ${esc(t.f)}</div>`:""}<div class="src">Nguồn: ${esc(t.s)}</div>${soAnh(t.c)?`<button type="button" class="chip xem-that" data-k="${t.k}">Ảnh thật · ${soAnh(t.c).toLocaleString("vi")} trường hợp ›</button>`:""}</div></div>`).join(""):
  `<div class="empty">Không có tượng lưỡi nào khớp “${esc(libQ)}”. Thử từ khác, hoặc chọn “Tất cả”.</div>`);
  document.querySelectorAll(".tg img[data-p]").forEach(im=>im.onclick=()=>{const d=$("#zoom");d.querySelector("img").src=IMGS[im.dataset.p];d.showModal()});

 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{libG=b.dataset.g;lib()});

/* ---------- LUYỆN MẮT: kho ảnh TCM-Tongue (luong-y-pictures) ---------- */
// Nguồn kho ảnh: ưu tiên GitHub Pages; nếu Pages chưa bật hoặc lỗi thì lấy thẳng từ kho file của GitHub.
const KHO_NGUON=[new URL("../luong-y-pictures/",location.href).href,
 "https://raw.githubusercontent.com/linhmai101-dev/luong-y-pictures/main/"];
let KHO_URL=KHO_NGUON[0];
let KHO=null,_khoP=null;
function layDanhMuc(){const thuTu=[],nho=M().nguon;
 const ds=nho&&KHO_NGUON.includes(nho)?[nho,...KHO_NGUON.filter(n=>n!==nho)]:KHO_NGUON;
 ds.forEach(n=>["danh-muc-app.json","danh-muc.json"].forEach(f=>thuTu.push([n,f])));
 let i=0;const thu=()=>fetch(thuTu[i][0]+thuTu[i][1]).then(r=>{if(!r.ok)throw 0;KHO_URL=thuTu[i][0];if(M().nguon!==KHO_URL){M().nguon=KHO_URL;save()}return r.json()})
 .catch(e=>{if(++i<thuTu.length)return thu();throw e});return thu()}
function loadKho(){ if(KHO)return Promise.resolve(KHO); if(_khoP)return _khoP;
 _khoP=layDanhMuc().then(m=>{
   const ma=m.ma_so, ten=c=>m.nhan[c].ten;
   m.anh=m.anh.filter(a=>!a.xung_dot);   // ảnh trùng mà nhãn mâu thuẫn: không dùng để hỏi, chấm
   m.anh.forEach(a=>{a.nh=[...new Set(a.khung.map(b=>ma[b[0]]).filter(Boolean))]});
   KHO={meta:m,anh:m.anh,ma,ten,gt:c=>m.nhan[c].giao_trinh,nhom:c=>m.nhan[c].nhom,
     codes:Object.values(ma)}; return KHO}).catch(e=>{_khoP=null;throw e});
 return _khoP;}
const imgUrl=id=>KHO_URL+"anh/"+id.slice(0,2)+"/"+id+".webp";
const tamLuoi=a=>{const [x,y,w,h]=a.cat||vungCat(a);return `object-position:${Math.round((x+w/2)*100)}% ${Math.round((y+h/2)*100)}%`};
const luoiUrl=id=>KHO_URL+"luoi/"+id.slice(0,2)+"/"+id+"."+((KHO&&KHO.meta.luoi_duoi)||"webp");   // bản cắt sát lưỡi từ ảnh gốc (nét hơn)
const gocUrl=a=>KHO_URL+"goc/"+a.id.slice(0,2)+"/"+a.id+(a.gx||".jpg");
const cheDo=()=>(KHO&&KHO.meta.che_do)||"luoi";
// ảnh dùng để hiển thị: gốc nguyên bản (nếu kho có và không bật tiết kiệm) → bản cắt sát lưỡi → bản xem 560 px
function nguonAnh(a){if(a._loiLuoi||M().tiet)return {url:imgUrl(a.id),cat:null};
 if(cheDo()==="goc")return {url:gocUrl(a),cat:null};
 if(a.cat&&!M().full)return {url:luoiUrl(a.id),cat:a.cat};
 return {url:imgUrl(a.id),cat:null}}
const dungLuoi=a=>nguonAnh(a).cat!==null;
function M(){S.mat=S.mat||{seen:{},ok:{},wrong:[],conf:{},lv:"de",vung:false};return S.mat}
const inScope=c=>M().vung||KHO.gt(c);
const nhanCua=a=>a.nh.filter(inScope);
const NGUONG_NET={tat:0,nhe:20,vua:35,chat:50};
const mucLoc=()=>{const m=M();return m.loc||(m.anMo===false?"tat":"vua")};
function pool(){const m=M(),ng=NGUONG_NET[mucLoc()];return KHO.anh.filter(a=>{const n=nhanCua(a).length;
 if(ng&&a.q!==undefined&&a.q<ng)return false;   // bỏ phần ảnh kém nét nhất theo mức đã chọn
 return n>0&&(m.lv==="de"?n===1:m.lv==="vua"?n<=2:true)})}
const pick=a=>a[Math.floor(Math.random()*a.length)];
let _ke=null;   // ảnh kế tiếp đã tải sẵn
function layAnh(){const p=pool();let a=_ke&&p.includes(_ke)?_ke:pick(p);_ke=pick(p);
 if(_ke){const im=new Image();im.crossOrigin="anonymous";im.src=nguonAnh(_ke).url} return a}

/* Giải thích từng đặc điểm: nhìn vào đâu + ý nghĩa (theo 中医诊断学 十三五 = ZD và tài liệu thiệt chẩn Sline = TC) */
const GIAI={
"binh-thuong":{nhin:"Chất lưỡi đỏ nhạt, tươi nhuận; rêu trắng mỏng, đều, nhìn xuyên qua rêu vẫn thấy chất lưỡi; lưỡi mềm, cử động linh hoạt.",nghia:"Khí huyết điều hòa, vị khí còn. Gặp trong bệnh thì đa phần bệnh nhẹ, ở biểu.",nguon:"ZD 淡红舌; TC"},
"bac-thai":{nhin:"Tìm chỗ rêu MẤT, lộ chất lưỡi nhẵn, ranh giới rõ với vùng còn rêu. Ghi nhận vị trí bong: trước (đầu), giữa, cuống, hay nhiều chỗ loang lổ.",nghia:"Vị khí bất túc, vị âm tổn thương, hoặc khí huyết lưỡng hư. Lưỡi đỏ mà bong rêu: đa phần âm hư; lưỡi nhạt bong rêu: huyết hư, khí huyết hư. Vị trí bong thường tương ứng tạng phủ của vùng đó. Phần còn lại là rêu nhớt: chính khí hư mà đàm trọc chưa hóa, bệnh phức tạp.",nguon:"ZD 剥苔"},
"hong-thiet":{nhin:"Nhìn màu CHẤT lưỡi (chỗ không có rêu: đầu, rìa), không nhìn màu rêu. Đỏ hơn đỏ nhạt bình thường, có khi đỏ tươi; có thể chỉ đỏ ở đầu hoặc rìa.",nghia:"Chủ nhiệt. Đỏ kèm rêu vàng dày: thực nhiệt; đỏ mà ít rêu, bong rêu: âm hư (hư nhiệt).",nguon:"ZD 红舌; TC"},
"tu-thiet":{nhin:"Toàn lưỡi ánh tím, hoặc có chấm/mảng tím (ứ điểm, ứ ban). Xem thêm lạc mạch dưới lưỡi nếu có.",nghia:"Khí huyết ứ trệ. Tím nhạt mà ướt: hàn ngưng, dương hư. Tím đỏ khô: nhiệt độc vào dinh huyết. Có chấm tím: ứ huyết cục bộ.",nguon:"ZD 青紫舌; TC"},
"ban-dai":{nhin:"Lưỡi to dày hơn bình thường, gần như đầy miệng; thường kèm dấu răng ở rìa.",nghia:"Thủy thấp, đàm ẩm nội đình. Nhạt bệu: tỳ thận dương hư. Đỏ bệu: tỳ vị thấp nhiệt, đàm nhiệt.",nguon:"ZD 胖大舌"},
"sau-bac":{nhin:"Lưỡi nhỏ, mỏng hơn bình thường.",nghia:"Khí huyết lưỡng hư (nếu nhạt) hoặc âm hư hỏa vượng (nếu đỏ giáng, ít rêu).",nguon:"ZD 瘦薄舌"},
"diem-do":{nhin:"Chấm đỏ nhô lên trên mặt lưỡi, hay gặp ở đầu và rìa lưỡi. Ghi nhận vị trí và mật độ.",nghia:"Nhiệt cực ở tạng phủ hoặc huyết nhiệt; càng nhiều càng nhiệt. Đầu lưỡi: tâm hỏa; rìa lưỡi: can đởm hỏa; giữa lưỡi: vị trường nhiệt.",nguon:"ZD 点刺舌"},
"liet-van":{nhin:"Đường nứt, rãnh trên mặt lưỡi: nằm ở đâu (giữa, đầu, rìa), nông hay sâu, nhiều hay ít; xem kèm màu chất lưỡi để biết ý nghĩa.",nghia:"Âm huyết hư, tỳ hư thấp xâm. Đỏ giáng có nứt: nhiệt thịnh thương âm. Nhạt có nứt: huyết hư. Nhạt bệu dấu răng có nứt: tỳ hư thấp xâm.",nguon:"ZD 裂纹舌"},
"xi-ngan":{nhin:"Hai rìa lưỡi có vết lõm theo hình răng.",nghia:"Tỳ hư, thấp thịnh. Nhạt bệu ướt có dấu răng: hàn thấp hoặc dương hư thủy thấp. Đỏ nhạt có dấu răng: tỳ khí hư.",nguon:"ZD 齿痕舌"},
"bach-thai":{nhin:"Nhìn màu RÊU: trắng. Xem thêm dày hay mỏng (có thấy chất lưỡi qua rêu không), khô hay ướt.",nghia:"Có thể là rêu bình thường. Có bệnh thì chủ biểu chứng, hàn chứng, thấp; cũng gặp trong nhiệt chứng.",nguon:"TC; ZD 白苔"},
"hoang-thai":{nhin:"Rêu vàng; nhạt hay đậm, khô hay nhớt.",nghia:"Chủ nhiệt, lý chứng. Vàng nhớt: thấp nhiệt, đàm nhiệt, thực tích. Vàng ở đầu lưỡi: nhiệt thượng tiêu; giữa: vị trường; cuống: hạ tiêu.",nguon:"ZD 黄苔; TC"},
"hac-thai":{nhin:"Rêu tro đến đen, thường đậm ở cuống, nhạt dần ra đầu lưỡi. Quan trọng là khô hay ướt.",nghia:"Âm hàn nội thịnh (thường ướt trơn) hoặc lý nhiệt sí thịnh (thường khô). Thường xuất hiện khi bệnh đã kéo dài, nặng.",nguon:"ZD 灰黑苔; TC"},
"hoat-thai":{nhin:"Mặt lưỡi nhiều nước, bóng ướt, có khi như sắp nhỏ giọt.",nghia:"Thủy thấp, đàm ẩm: hàn thấp xâm nhập hoặc dương khí hư không vận hóa thủy dịch.",nguon:"ZD 滑苔"}
};
function goiYKH(ds){const co=c=>ds.includes(c),goi=[];
 if(co("bac-thai")&&co("hong-thiet"))goi.push("Lưỡi đỏ kèm bong rêu → hướng âm hư.");
 if(co("liet-van")&&co("hong-thiet"))goi.push("Lưỡi đỏ có vết nứt → nhiệt thịnh thương âm.");
 if(co("liet-van")&&(co("ban-dai")||co("xi-ngan")))goi.push("Nứt kèm bệu, dấu răng → tỳ hư thấp xâm.");
 if((co("ban-dai")||co("xi-ngan"))&&co("hoat-thai"))goi.push("Bệu, dấu răng, rêu trơn ướt → hàn thấp hoặc dương hư thủy thấp.");
 if(co("hong-thiet")&&co("hoang-thai"))goi.push("Lưỡi đỏ rêu vàng → thực nhiệt.");
 if(co("diem-do")&&co("hong-thiet"))goi.push("Lưỡi đỏ có điểm đỏ → nhiệt thịnh; xem điểm đỏ nằm ở đầu (tâm), rìa (can đởm) hay giữa (vị trường).");
 if(co("bach-thai")&&co("hoat-thai"))goi.push("Rêu trắng trơn ướt → hàn, thấp.");
 if(co("ban-dai")&&co("hoang-thai"))goi.push("Lưỡi bệu rêu vàng → thấp nhiệt, đàm nhiệt.");
 if(co("xi-ngan")&&co("bach-thai"))goi.push("Dấu răng rêu trắng → tỳ hư, hàn thấp.");
 if(co("sau-bac")&&co("hong-thiet"))goi.push("Lưỡi gầy mỏng mà đỏ → âm hư hỏa vượng.");
 if(co("sau-bac")&&co("bac-thai"))goi.push("Gầy mỏng, bong rêu → âm huyết hư, vị âm hư.");
 if(co("tu-thiet")&&co("hoang-thai"))goi.push("Lưỡi tím rêu vàng → nhiệt kèm ứ.");
 if(co("tu-thiet")&&co("bach-thai"))goi.push("Lưỡi tím rêu trắng → hàn ngưng huyết ứ.");
 if(co("hac-thai")&&co("hoat-thai"))goi.push("Rêu đen trơn ướt → hàn cực (dương hư).");
 if(co("hoang-thai")&&co("liet-van"))goi.push("Rêu vàng kèm lưỡi nứt → nhiệt làm tổn thương tân dịch; xem thêm màu chất lưỡi.");
 if(co("hoang-thai")&&co("diem-do"))goi.push("Rêu vàng kèm điểm đỏ → nhiệt thịnh.");
 if(co("hoang-thai")&&co("xi-ngan"))goi.push("Dấu răng rêu vàng → tỳ hư sinh thấp, thấp hóa nhiệt.");
 if(co("bach-thai")&&co("liet-van")&&!co("hong-thiet"))goi.push("Nứt mà rêu trắng, lưỡi không đỏ → thường do huyết hư hoặc tỳ hư; nứt bẩm sinh không có ý nghĩa bệnh.");
 return goi}
function giaiThich(a){const ds=a.nh;const dong=ds.map(c=>{const g=GIAI[c];
  if(!g)return `<li><b>${esc(KHO.ten(c))}</b> <span class="muted">(nhãn ngoài giáo trình – tham khảo; vị trí lõm/lồi theo phân vùng tạng phủ trên lưỡi)</span></li>`;
  return `<li><b>${esc(KHO.ten(c))}</b><br><span class="gt-k">Nhìn:</span> ${esc(g.nhin)}<br><span class="gt-k">Ý nghĩa:</span> ${esc(g.nghia)} <span class="pg">${esc(g.nguon)}</span></li>`}).join("");
 const goi=goiYKH(ds);
 return `<div class="giai"><h3>Đọc ảnh này</h3><ul>${dong}</ul>${goi.length?`<p><b>Gợi ý kết hợp:</b> ${goi.join(" ")}</p>`:""}
 <p class="src-note">Bộ dữ liệu chỉ gán những đặc điểm nổi bật; ảnh có thể còn đặc điểm khác chưa gán nhãn (ví dụ rêu trắng). Một tấm ảnh chưa đủ để kết luận: cần đối chiếu vấn chẩn và mạch.</p></div>`}
// Cặp đặc điểm loại trừ nhau: chỉ khi đó mới chắc chắn "sai"
const LOAI_TRU=[["ban-dai","sau-bac"]];
function chacKhongCo(a,c){if(c==="binh-thuong")return a.nh.some(x=>x!=="binh-thuong"&&KHO.gt(x));
 if(a.nh.includes("binh-thuong")&&KHO.gt(c))return true;
 return LOAI_TRU.some(([x,y])=>(c===x&&a.nh.includes(y))||(c===y&&a.nh.includes(x)))}
const TOAN_THE=new Set(["toan-the","mau-luoi","hinh","mau-reu"]);   // nhãn toàn lưỡi: ghi tên ở đáy khung, xếp chồng
function boxes(a,cat){let g=0;const [X,Y,Wc,Hc]=cat||[0,0,1,1];return a.khung.map(b=>{const c=KHO.ma[b[0]];if(!c)return"";
 const toan=TOAN_THE.has(KHO.nhom(c));let [cx,cy,w,h]=b.slice(1);cx=(cx-X)/Wc;cy=(cy-Y)/Hc;w=w/Wc;h=h/Hc;
 const phai=cx+w/2>.7;   // khung sát mép phải: neo chữ bên phải để không bị cắt
 const st=(toan?`bottom:calc(${g++} * 1.5em * var(--k,1));top:auto;`:"")+(phai?`left:auto;right:0;transform-origin:${toan?"100% 100%":"100% 0"}`:"");
 return `<div class="bx${toan?" bx-t":""}" style="left:${(cx-w/2)*100}%;top:${(cy-h/2)*100}%;width:${w*100}%;height:${h*100}%"><i style="${st}">${esc(KHO.ten(c))}</i></div>`}).join("")}
function vungCat(a){let x0=1,y0=1,x1=0,y1=0;a.khung.forEach(([c,cx,cy,w,h])=>{x0=Math.min(x0,cx-w/2);y0=Math.min(y0,cy-h/2);x1=Math.max(x1,cx+w/2);y1=Math.max(y1,cy+h/2)});
 const mx=(x1-x0)*.12,my=(y1-y0)*.12;x0=Math.max(0,x0-mx);y0=Math.max(0,y0-my);x1=Math.min(1,x1+mx);y1=Math.min(1,y1+my);return [x0,y0,x1-x0,y1-y0]}
function canAnh(img){const ph=img.closest(".ph");if(!ph||ph.dataset.toan==="1"){if(ph){ph.style.aspectRatio="";ph.firstElementChild.style.transform="";ph.style.setProperty("--k",1)}return}
 const [x,y,w,h]=JSON.parse(ph.dataset.cat),W=img.naturalWidth,H=img.naturalHeight;if(!W||w>=.98&&h>=.98)return;
 ph.style.aspectRatio=(w*W)/(h*H);ph.firstElementChild.style.transform=`scale(${1/w}) translate(${-x*100}%,${-y*100}%)`;ph.style.setProperty("--k",w)}
function loiLuoi(img){const ph=img.closest(".ph");if(!ph)return;const a=KHO.anh.find(x=>x.id===ph.dataset.id);if(!a)return;
 a._loiLuoi=true;ph.closest(".phw").outerHTML=photo(a,ph.dataset.show==="1")}
function photo(a,show){const n=nguonAnh(a),L=n.cat!==null,du=n.url!==imgUrl(a.id);

const LA={
"binh-thuong":["Lưỡi bình thường: “đạm hồng thiệt, bạc bạch thai”. Chất lưỡi đỏ nhạt, tươi nhuận, to nhỏ vừa phải, mềm, cử động linh hoạt; rêu trắng mỏng, đều, ẩm vừa, không nhớt dính, lau không đi, có gốc.","Biến đổi sinh lý: trẻ em lưỡi thường nhạt, non, rêu ít, dễ bong; người già lưỡi thường đỏ sẫm. Không vội cho là bệnh."],
"bac-thai":["Lưỡi vốn có rêu, trong quá trình bệnh rêu bong một phần hay toàn bộ, chỗ bong nhẵn không rêu. Theo vị trí: tiền bác (nửa trước), trung bác (giữa), căn bác (cuống); hoa bác (bong nhiều chỗ, loang lổ); kính diện (bong hết, bóng như gương).","Lưỡi bản đồ (địa đồ thiệt): bong không đều, viền gồ lên, ranh giới rõ, vị trí hay thay đổi, hay gặp ở trẻ em. Loại bác: chỗ bong không nhẵn, vẫn thấy hạt rêu mới mọc."],
"hong-thiet":["Chất lưỡi đỏ hơn bình thường, có khi đỏ tươi; có thể đỏ toàn lưỡi hoặc chỉ ở đầu, rìa lưỡi.","Giáng thiệt: đỏ thẫm hơn, hơi ám. Vừa ăn đồ cay nóng, lưỡi có thể đỏ lên tạm thời."],
"tu-thiet":["Toàn lưỡi ánh tím (đạm tử, tử hồng, giáng tử), hoặc từng chỗ có chấm, mảng tím (ứ điểm, ứ ban).","Điểm đỏ: chấm màu đỏ chủ nhiệt, khác với ứ điểm màu tím chủ huyết ứ."],
"ban-dai":["Lưỡi to và dày hơn bình thường, thè ra đầy miệng.","Thũng trướng thiệt: lưỡi sưng to đầy miệng, có khi không ngậm miệng được, thè ra khó thụt vào; chủ thấp nhiệt, nhiệt độc bốc lên."],
"sau-bac":["Lưỡi nhỏ và mỏng hơn bình thường.","Phải xem kèm màu: nhạt thì khí huyết hư; đỏ giáng, khô, ít rêu thì âm hư hỏa vượng."],
"diem-do":["Điểm: chấm đỏ (có khi trắng, đen) nhô lên mặt lưỡi, to gọi “tinh”, nhỏ gọi “điểm”. Thứ (gai): gai lưỡi nhô cao, nhọn, sờ vướng tay. Hay gặp ở đầu và rìa lưỡi.","Ứ điểm màu tím thuộc tử thiệt, chủ huyết ứ, không phải điểm đỏ."],
"liet-van":["Mặt lưỡi có vết nứt, rãnh, nông sâu và nhiều ít khác nhau, có thể khắp lưỡi hoặc ở đầu, rìa.","Nứt bẩm sinh: nông, trong rãnh có rêu phủ, không khó chịu; không phải dấu hiệu bệnh."],
"xi-ngan":["Rìa lưỡi có vết ấn của răng; thường đi cùng lưỡi bệu.","Dấu răng bẩm sinh: lưỡi đỏ nhạt, non, không to, dấu răng nhẹ; gặp ở trẻ em, người khí huyết bất túc, bệnh nhẹ."],
"bach-thai":["Rêu màu trắng. Mỏng: nhìn xuyên qua rêu thấy chất lưỡi. Dày: rêu che lấp chất lưỡi.","Rêu nhuộm: uống sữa, sữa đậu nành có thể làm rêu trắng dày tạm thời. Xem dưới đèn vàng, rêu vàng có thể trông như trắng."],
"hoang-thai":["Rêu màu vàng: vàng nhạt, vàng đậm, hoặc tiêu hoàng (vàng lẫn tro đen). Thường ở giữa lưỡi hoặc khắp lưỡi, hay đi cùng lưỡi đỏ giáng.","Rêu nhuộm: lòng đỏ trứng, quýt, hồng, vitamin B2 làm rêu vàng tạm thời. Hỏi ăn uống, thuốc trước khi kết luận."],
"hac-thai":["Rêu màu tro (hôi) đến đen (hắc), đậm ở vùng giữa – cuống, nhạt dần ra đầu lưỡi; thường xuất hiện khi bệnh đã kéo dài.","Rêu nhuộm do thuốc lá, ô mai, thức ăn hay thuốc màu sẫm; dùng kháng sinh lâu có thể gây rêu đen nhớt. Rêu nhuộm thường không đều, lau đi được, không khớp với bệnh tình."],

};

  ghiNhan(a,[dung],new Set(c===dung?[dung]:[]));
  $(".phw").outerHTML=photo(a,true);
  const tb=c===dung?"Đúng.":chac?"Chưa đúng: "+esc(KHO.ten(c))+" không thể cùng có với đặc điểm của ảnh.":"Bộ dữ liệu không gán “"+esc(KHO.ten(c))+"” cho ảnh này (có thể ảnh vẫn có, hãy tự đối chiếu), đặc điểm được gán là “"+esc(KHO.ten(dung))+"”.";
  $("#kq").innerHTML=`<p class="qscore">${tb}</p>`+giaiThich(a)+navMat();bindNav(()=>qMot())});}
function qTatCa(fixed,next){const m=M();const a=fixed||layAnh();const ds=KHO.codes.filter(inScope);const can=nhanCua(a);
 app().innerHTML=`<button type="button" class="back" data-back>‹ Luyện mắt</button><h1>Chọn tất cả</h1><p class="muted" style="margin:6px 0">Tích mọi đặc điểm chị thấy trong ảnh.</p>${photo(a,false)}
 <div class="ck">${ds.map(c=>`<label data-c="${c}"><input type="checkbox" value="${c}"> ${esc(KHO.ten(c))}</label>`).join("")}</div>
 <button type="button" class="btn finish" id="cham">Chấm điểm</button><div id="kq"></div>`;
 $("#cham").onclick=()=>{const chon=new Set([...app().querySelectorAll(".ck input:checked")].map(i=>i.value));
  let dung=0;app().querySelectorAll(".ck label").forEach(l=>{const c=l.dataset.c,co=can.includes(c),ch=chon.has(c);
   l.querySelector("input").disabled=true; if(co&&ch){l.classList.add("right");dung++} else if(co)l.classList.add("miss"); else if(ch)l.classList.add(chacKhongCo(a,c)?"wrong":"unsure")});
  const thuaDs=[...chon].filter(c=>!can.includes(c)&&chacKhongCo(a,c)),thua=thuaDs.length,ngoai=[...chon].filter(c=>!can.includes(c)&&!chacKhongCo(a,c)).length;
  thuaDs.forEach(c=>can.forEach(d=>{if(!chon.has(d))m.conf[d+"|"+c]=(m.conf[d+"|"+c]||0)+1}));
  ghiNhan(a,can,new Set(can.filter(c=>chon.has(c))));
  $(".phw").outerHTML=photo(a,true);$("#cham").remove();
  $("#kq").innerHTML=`<p class="qscore">Nhận ra ${dung}/${can.length} đặc điểm được gán${thua?`, chọn sai ${thua}`:""}${ngoai?`, ${ngoai} đặc điểm ngoài nhãn (tự đối chiếu)`:""}.</p><p class="src-note">Viền xanh: đúng · vàng nét đứt: bỏ sót · tím nét chấm: ngoài nhãn, chưa chắc sai · đỏ: chắc chắn sai.</p>`+giaiThich(a)+navMat();bindNav(next||(()=>qTatCa()))};}
function qSai(){const m=M();if(!m.wrong.length)return matHome();const id=m.wrong[0];const a=KHO.anh.find(x=>x.id===id);
 if(!a||!nhanCua(a).length){m.wrong.shift();save();return qSai()} qTatCa(a,qSai);}
function xemMau(code){const ds=KHO.codes.filter(inScope);code=code||ds[0];
 const list=shuffle(KHO.anh.filter(a=>a.nh.includes(code))).slice(0,24);
 app().innerHTML=`<button type="button" class="back" data-back>‹ Luyện mắt</button><h1>Xem mẫu</h1><div class="chips">${ds.map(c=>`<button type="button" class="chip" aria-pressed="${c===code}" data-c="${c}">${esc(KHO.ten(c))}</button>`).join("")}</div>
 <p class="muted" style="font-size:.85rem">${KHO.anh.filter(a=>a.nh.includes(code)).length.toLocaleString("vi")} ảnh có “${esc(KHO.ten(code))}”. Chạm ảnh để xem khung vị trí. ${KHO.gt(code)?"":"<b>Nhãn ngoài giáo trình – tham khảo.</b>"}</p>
 <div class="gal">${list.map(a=>`<img loading="lazy" crossorigin="anonymous" src="${imgUrl(a.id)}" style="${tamLuoi(a)}" alt="Ảnh lưỡi ${a.id}, chạm để phóng to" tabindex="0" role="button" data-id="${a.id}">`).join("")}</div>
 <button type="button" class="btn ghost finish" id="ve">Về Luyện mắt</button>`;
 app().querySelectorAll(".chip").forEach(b=>b.onclick=()=>xemMau(b.dataset.c));
 app().querySelectorAll(".gal img").forEach(im=>im.onclick=()=>{const a=KHO.anh.find(x=>x.id===im.dataset.id);
  const d=$("#zoom");d.innerHTML=photo(a,true);d.showModal()});
 $("#ve").onclick=matHome;}
function thongKe(){const m=M();const rows=KHO.codes.filter(c=>m.seen[c]).map(c=>[c,m.seen[c],m.ok[c]||0]).sort((x,y)=>(x[2]/x[1])-(y[2]/y[1]));
 const conf=Object.entries(m.conf).sort((a,b)=>b[1]-a[1]).slice(0,6);
 app().innerHTML=`<button type="button" class="back" data-back>‹ Luyện mắt</button><h1>Thống kê</h1>${rows.length?`<div class="tbl"><table class="stat"><tr><th>Đặc điểm</th><th>Gặp</th><th>Nhận ra</th><th>%</th></tr>
 ${rows.map(r=>`<tr><td>${esc(KHO.ten(r[0]))}</td><td>${r[1]}</td><td>${r[2]}</td><td>${Math.round(100*r[2]/r[1])}</td></tr>`).join("")}</table></div>`:`<div class="empty">Chưa có dữ liệu. Làm vài ảnh rồi quay lại.</div>`}
 ${conf.length?`<h2>Hay nhầm</h2><ul>${conf.map(([k,n])=>{const[a,b]=k.split("|");return `<li>${esc(KHO.ten(a))} → nhầm thành ${esc(KHO.ten(b))}: ${n} lần</li>`}).join("")}</ul>`:""}
 <button type="button" class="btn ghost finish" id="ve">Về Luyện mắt</button>`;$("#ve").onclick=matHome;}

Object.keys(S.done).forEach(id=>LESSONS[id]&&addCards(id));save();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
renderNav();home();
</script>
