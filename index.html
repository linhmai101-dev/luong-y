const SRC_CD="Chẩn đoán YHCT (ĐHYD TP.HCM 2021)";
Object.assign(LESSONS,{
"2.01":{id:"2.01",tang:2,title:"Đại cương chẩn đoán học",han:"中医诊断学概论",src:SRC_CD+", tr.3–16",
hook:"Một người đến khám vì đau lưng mạn tính. Chị có nên hỏi họ về đại tiện, tiểu tiện, cảm giác nóng lạnh không, dù những thứ đó chẳng liên quan gì đến lưng?",
reading:`
<p><b>Chẩn đoán YHCT</b> là quá trình thăm khám người bệnh để tìm ra bệnh lý dựa trên các học thuyết cơ bản; là <b>cầu nối từ lý luận cơ bản đến lâm sàng</b>. <span class="pg">tr.3</span></p>
<p><b>Quy trình gồm 2 giai đoạn</b> <span class="pg">tr.3–5</span></p>
<table><tr><th>Chẩn (thăm khám)</th><th>Đoán (phán đoán, quyết định)</th></tr>
<tr><td><b>Tứ chẩn</b>: <b>Vọng</b> (nhìn thần, sắc, lưỡi, chất tiết); <b>Văn</b> (nghe âm thanh, ngửi mùi); <b>Vấn</b> (hỏi người bệnh, người nhà: triệu chứng, nguyên nhân, tiền sử, môi trường, thói quen, thuốc đang dùng); <b>Thiết</b> (sờ, ấn, xem mạch)</td><td>1. Xác định triệu chứng có ý nghĩa: <b>cơ năng</b> (cảm giác chủ quan, chủ yếu qua vấn chẩn) và <b>thực thể</b> (dữ liệu khách quan như mặt nhợt, lưỡi đỏ, mạch hoạt, qua vọng, văn, thiết).<br>2. <b>Biện chứng</b>: xếp triệu chứng vào hội chứng (một “bức tranh” phản ánh rối loạn cụ thể). <b>Biện bệnh</b>: xác định bệnh danh</td></tr></table>
<p><b>Cơ sở lý luận (cách tư duy)</b> <span class="pg">tr.5–7</span></p>
<ul><li><b>So sánh</b> (“quy đạc kỳ hằng”: lấy cái bình thường đo cái biến hóa): một hơi thở (định tức) mạch đập 4 nhịp; nhanh hơn là sác, chậm hơn là trì.</li>
<li><b>Diễn dịch</b>: tức khắc (đặc điểm của nhiệt là sưng, nóng, đỏ, đau → chỗ nào sưng nóng đỏ đau là nhiệt); tam đoạn luận (âm hư sinh nội nhiệt; nhiệt nhiễu tâm thần dễ mất ngủ → người âm hư có thể mất ngủ).</li>
<li><b>Loại suy</b>: trời lạnh nước đóng băng → “huyết gặp hàn thì ngưng”; nước chảy chỗ trũng → thấp gây bệnh ở phía dưới; rút củi thì lửa hạ → “rút củi đáy nồi” (tả hạ trị nhiệt); nước đủ thuyền mới trôi → “tăng dịch thuyền trôi” chữa táo bón.</li>
<li><b>Xem ngoài biết trong</b>: “Hữu ư trung tất hình ư ngoại”; mỗi phần cơ thể phản ánh toàn thân, nên có thiệt chẩn.</li>
<li><b>Thăm dò, phản chứng</b>: đi từ kết quả về nguyên nhân: bổ can thấy sáng mắt → can liên quan mắt; bổ thận giảm ù tai → thận liên quan tai.</li>
<li>Và <b>quan sát vĩ mô</b>: kết hợp tự nhiên (thiên văn, khí tượng, địa lý, xã hội) với con người.</li></ul>
<p><b>Ba nguyên tắc chung</b> <span class="pg">tr.8–13</span></p>
<ol><li><b>Tiếp cận theo thiên nhân hợp nhất</b>: cơ thể là chỉnh thể (bệnh can hiện ra mắt, bệnh thận hiện ra tai); con người hợp nhất với môi trường tự nhiên, xã hội (khí hậu, địa lý, nghề nghiệp, áp lực sống).</li>
<li><b>Phối hợp tứ chẩn</b>: bốn phép bổ sung, kiểm tra lẫn nhau. Ví dụ đau gối: vấn (đau dữ dội, hạn chế vận động) + vọng (sưng đỏ) + thiết (nóng, cự án, mạch sác) → <b>nhiệt tý</b>.</li>
<li><b>Kết hợp biện chứng và biện bệnh</b>: <b>bệnh</b> là toàn bộ quá trình; <b>hội chứng</b> là một giai đoạn cụ thể. Một bệnh qua nhiều hội chứng, một hội chứng gặp ở nhiều bệnh. <b>Pháp trị dựa trên hội chứng.</b> Ví dụ tọa cốt phong: giai đoạn cấp là khí trệ huyết ứ (hành khí hoạt huyết); giai đoạn muộn là can thận âm hư (bổ can thận).</li></ol>
<p><b>Vấn chẩn của YHCT hỏi rộng</b> <span class="pg">tr.12</span>: người đau lưng mạn tính mà có lạnh hai chân, đại tiện lỏng, tiểu trong lượng nhiều thì những dấu hiệu “không liên quan” ấy lại giúp chẩn đoán <b>đau lưng thể thận dương hư</b>.</p>`,
checkTitle:"Trình tự một lần khám",
checklist:["Vọng: thần, sắc, hình thái, lưỡi, chất tiết","Văn: giọng nói, hơi thở, tiếng ho; mùi","Vấn: lý do đến khám, khởi phát, diễn tiến; rồi Thập vấn (kể cả những thứ “không liên quan”)","Thiết: mạch, sờ nắn vùng bệnh","Đoán: lọc triệu chứng có ý nghĩa → biện chứng (hội chứng) + biện bệnh (bệnh danh) → pháp trị theo hội chứng"],
quiz:[
{q:"Quy trình chẩn đoán YHCT gồm hai giai đoạn:",o:[["Vọng và Thiết","Sai: đó là hai trong tứ chẩn."],["Chẩn (thăm khám) và Đoán (phán đoán, quyết định)","Đúng."],["Biện bệnh và điều trị","Sai."],["Hỏi bệnh và xem mạch","Sai."]],a:1,p:"3"},
{q:"Triệu chứng cơ năng chủ yếu thu thập qua:",o:[["Vọng chẩn","Sai: vọng thu thập dấu hiệu thực thể."],["Vấn chẩn","Đúng: cơ năng là cảm giác chủ quan của người bệnh."],["Thiết chẩn","Sai."],["Văn chẩn","Sai."]],a:1,p:"4–5"},
{q:"“Đặc điểm của nhiệt là sưng, nóng, đỏ, đau → chỗ nào sưng nóng đỏ đau là nhiệt” là phương pháp:",o:[["Loại suy","Sai."],["So sánh","Sai."],["Diễn dịch","Đúng: diễn dịch tức khắc, từ tiền đề đến kết luận."],["Phản chứng","Sai."]],a:2,p:"6"},
{q:"Thấy nước chảy về chỗ trũng, suy ra thấp gây bệnh ở phía dưới. Đây là phương pháp:",o:[["Loại suy","Đúng."],["Diễn dịch","Sai."],["Phản chứng","Sai."],["Xem ngoài biết trong","Sai."]],a:0,p:"6"},
{q:"Bổ can thấy sáng mắt, suy ra can liên quan mắt. Đây là:",o:[["So sánh","Sai."],["Phản chứng","Đúng: đi từ kết quả về nguyên nhân."],["Loại suy","Sai."],["Diễn dịch","Sai."]],a:1,p:"7"},
{q:"Xem lưỡi mà phán đoán được bệnh toàn cơ thể dựa trên nguyên lý:",o:[["Xem ngoài biết trong","Đúng: “Hữu ư trung tất hình ư ngoại”."],["So sánh","Sai."],["Diễn dịch","Sai."],["Phản chứng","Sai."]],a:0,p:"7"},
{q:"Theo sách, pháp trị dựa chủ yếu vào:",o:[["Bệnh danh","Sai: nếu chỉ xác định bệnh thì rất khó chọn pháp trị."],["Hội chứng ở thời điểm thăm khám","Đúng."],["Tuổi người bệnh","Sai."],["Mạch đơn thuần","Sai."]],a:1,p:"13"},
{q:"Ví dụ tọa cốt phong của sách cho thấy điều gì?",o:[["Một bệnh chỉ có một hội chứng","Sai."],["Một bệnh qua nhiều giai đoạn có thể có các hội chứng khác nhau, nên pháp trị khác nhau","Đúng: cấp là khí trệ huyết ứ, muộn là can thận âm hư."],["Không cần biện bệnh","Sai."],["Tọa cốt phong luôn là can thận âm hư","Sai."]],a:1,p:"13"},
{q:"Theo Nội kinh (sách dẫn), một hơi thở mạch người bình thường đập:",o:[["2 nhịp","Sai."],["4 nhịp","Đúng: nhanh hơn là sác, chậm hơn là trì."],["6 nhịp","Sai."],["8 nhịp","Sai."]],a:1,p:"5–6"}
],
case:{v:"Nam, 55 tuổi, đến khám vì đau lưng âm ỉ nhiều năm. Hỏi thêm thì biết hai chân hay lạnh, đại tiện lỏng, tiểu trong và nhiều.",
qs:["Vì sao YHCT vẫn hỏi đại tiện, tiểu tiện, nóng lạnh ở người đau lưng?","Các dấu hiệu này gợi ý hội chứng gì theo sách?","Nếu sau 6 tháng điều trị, người này chuyển sang nóng trong, lòng bàn tay chân nóng, thì chẩn đoán và pháp trị có giữ nguyên không? Vì sao?"],
ans:`<p><b>1.</b> Vấn chẩn YHCT đánh giá rộng các chức năng cơ bản (nóng lạnh, đại tiểu tiện, mồ hôi, khát…); những triệu chứng “không liên quan” vẫn có giá trị biện chứng. <span class="pg">CĐ tr.12</span></p>
<p><b>2.</b> Đau lưng thể <b>thận dương hư</b>: lạnh hai chân, đại tiện lỏng, tiểu trong lượng nhiều. <span class="pg">CĐ tr.12</span> (Liên hệ bài 1.12: thận dương hư thì ngoại hàn.)</p>
<p><b>3.</b> <b>Không.</b> Bệnh (đau lưng) vẫn vậy nhưng <b>hội chứng</b> đã đổi (dấu hiệu âm hư sinh nội nhiệt); pháp trị dựa trên hội chứng nên phải đổi theo. <span class="pg">CĐ tr.13</span></p>`},
cards:[["Hai giai đoạn của chẩn đoán YHCT?","Chẩn (thăm khám bằng tứ chẩn) và Đoán (biện chứng, biện bệnh, quyết định)."],["Tứ chẩn?","Vọng (nhìn), Văn (nghe, ngửi), Vấn (hỏi), Thiết (sờ, xem mạch)."],["Triệu chứng cơ năng / thực thể?","Cơ năng: cảm giác chủ quan (qua vấn). Thực thể: dữ liệu khách quan (qua vọng, văn, thiết)."],["Biện chứng / biện bệnh?","Biện chứng: xếp triệu chứng vào hội chứng. Biện bệnh: xác định bệnh danh."],["“Quy đạc kỳ hằng” là phương pháp gì?","So sánh: lấy cái bình thường đo cái biến hóa."],["Ví dụ loại suy trong điều trị?","Rút củi đáy nồi (tả hạ trị nhiệt); tăng dịch thuyền trôi (chữa táo bón)."],["Phản chứng là gì? Ví dụ?","Đi từ kết quả về nguyên nhân: bổ can sáng mắt, bổ thận giảm ù tai."],["Ba nguyên tắc chung trong chẩn đoán?","Thiên nhân hợp nhất; phối hợp tứ chẩn; kết hợp biện chứng và biện bệnh."],["Bệnh và hội chứng khác nhau?","Bệnh: toàn bộ quá trình. Hội chứng: một giai đoạn. Pháp trị dựa trên hội chứng."]],
terms:[["Tứ chẩn","四诊","sì zhěn"],["Vọng, văn, vấn, thiết","望 闻 问 切","wàng, wén, wèn, qiè"],["Biện chứng","辨证","biàn zhèng"],["Biện bệnh","辨病","biàn bìng"],["Tứ chẩn hợp tham","四诊合参","sì zhěn hé cān"],["Hữu ư trung tất hình ư ngoại","有诸内必形诸外","yǒu zhū nèi bì xíng zhū wài"]],

"2.02":{id:"2.02",tang:2,title:"Vọng toàn thân: thần, hình thái, sắc",han:"望神 · 望形态 · 望色",src:SRC_CD+", tr.21–28",
hook:"Một cụ ông bệnh nặng nằm liệt nhiều ngày, sáng nay bỗng tỉnh táo, nói nhiều, đòi gặp con cháu, kêu đói, má hồng lên. Gia đình mừng vì nghĩ cụ đang khỏe lại. Chị nghĩ gì?",
reading:`
<p><b>Vọng thần</b> <span class="pg">tr.21–23</span>: thần là biểu hiện bên ngoài của tinh, khí, huyết, tân dịch; thần thịnh hay suy tiêu biểu cho sức sống mạnh hay yếu. Quan sát ba yếu tố: <b>biểu hiện của thần</b> (cơ thể tràn năng lượng, hoạt bát), <b>sức sống của thần</b> (sáng suốt, giọng to rõ, hơi thở điều hòa, phản xạ nhanh), <b>sự tươi nhuận</b> (da, lông, tóc, đôi mắt).</p>
<table><tr><th></th><th>Biểu hiện</th><th>Ý nghĩa</th></tr>
<tr><td><b>Còn thần</b></td><td>Mắt sáng, linh hoạt; da tươi nhuận; tinh thần sảng khoái, tập trung; hơi thở điều hòa; giọng to rõ; dáng nhanh nhẹn</td><td>Bình thường</td></tr>
<tr><td><b>Mất thần</b></td><td>Bơ phờ, mắt kém linh hoạt, da kém tươi, tiếng nói nhỏ, chậm chạp, thờ ơ, suy nghĩ chậm, mạch vô lực</td><td>Tạng phủ đều bị ảnh hưởng, tinh khí hao tổn, tiên lượng kém</td></tr>
<tr><td><b>Giả thần</b></td><td>Người bệnh nặng hoặc mạn tính <b>đột nhiên</b> mạnh lên, mắt sáng, nói liên tục, muốn gặp người nhà, thèm ăn, da đột nhiên hồng</td><td><b>Nguy kịch</b>: nguyên khí cạn kiệt, âm dương phân tán; tử vong sau thời gian ngắn</td></tr></table>
<p><b>Vọng hình thái</b> <span class="pg">tr.23–25</span>: xem dáng béo gầy, trạng thái hoạt động để biết cân bằng âm dương và xu hướng mắc bệnh.</p>
<table><tr><th>Thể</th><th>Hình thái</th><th>Xu hướng bệnh</th></tr>
<tr><td>Dương thịnh</td><td>Cường tráng, mặt đỏ, thích mát, nói nhiều, giọng to, hiếu động</td><td>Nhiệt, hỏa; điều trị chú trọng chế dương, tư âm</td></tr>
<tr><td>Âm thịnh</td><td>Béo, sắc mặt tối, cơ nhão, trầm tính, ít nói, thích ấm</td><td>Hàn, đàm, thấp, khí trệ, huyết ứ</td></tr>
<tr><td>Dương hư</td><td>Thừa cân, phù, mặt nhợt hoặc xanh xao, mệt, chậm, sợ lạnh, chân tay lạnh</td><td>Hàn, hàn thấp, đàm ẩm</td></tr>
<tr><td>Âm hư</td><td>Cao gầy, cổ cao, ngực hẹp; gò má đỏ, môi đỏ, bồn chồn, nóng trong, cử động nhanh</td><td>Hư nhiệt, táo</td></tr></table>
<p>Hình thái còn được chia theo ngũ hành: người Mộc, Hỏa thường bị bệnh vào thu đông; người Thổ, Kim, Thủy thường bị bệnh vào xuân hạ. <span class="pg">tr.25</span></p>
<p><b>Vọng sắc</b> <span class="pg">tr.26–28</span>: quan sát mặt <b>buổi sáng sau khi thức dậy</b>, ánh sáng tự nhiên, yên tĩnh. Bình thường hồng hào (tâm huyết tốt), nhuận (tân dịch tốt).</p>
<table><tr><th>Sắc</th><th>Chủ</th><th>Chi tiết</th></tr>
<tr><td>Trắng</td><td>Huyết hư, dương hư</td><td>Trắng sáng: dương hư. Trắng nhợt: khí hư. Trắng vàng xỉn: huyết hư. Trắng xanh: hàn do dương hư. Trắng bệch đột ngột ở bệnh cấp: dương khí thoát</td></tr>
<tr><td>Vàng</td><td>Tỳ hư thấp trệ</td><td>Ám vàng, không nhuận: tỳ khí hư. Hoàng đản vàng tươi như cam: thấp nhiệt; vàng ám như khói: hàn thấp</td></tr>
<tr><td>Đỏ</td><td>Nhiệt</td><td>Đỏ thẫm cả má: thực nhiệt. Đỏ nhạt thoáng qua, chiều tối, ở hai gò má: hư nhiệt</td></tr>
<tr><td>Xanh</td><td>Hàn, phong, đau do khí trệ huyết ứ</td><td>Xanh nhạt dưới mắt: can khí uất. Trẻ em xanh vùng giữa hai lông mày: can phong, co giật</td></tr>
<tr><td>Đen</td><td>Thận hư, hàn, đau</td><td>Đen khô: thận âm hư. Đen tối, hốc mắt tối: thận dương hư. Đen nhạt quanh mắt, phù mặt: hàn thấp, đàm ẩm. Đen sậm: huyết ứ</td></tr>

case:{v:"Ca A: cụ ông bệnh nặng nằm liệt nhiều ngày, bỗng tỉnh táo, nói luôn miệng, đòi gặp con cháu, kêu đói, má hồng lên. Ca B: nữ 40 tuổi, cao gầy, môi đỏ, hai gò má ửng đỏ vào chiều tối, hay bồn chồn, thấy nóng trong người. Ca C: nam 45 tuổi, mặt và mắt vàng tươi như màu cam.",
qs:["Ca A: nhận định thế nào? Chị dặn gia đình ra sao?","Ca B: thể hình thái và sắc mặt gợi ý gì? Xu hướng bệnh?","Ca C: sắc vàng này gợi ý gì? Nếu vàng ám tối như khói thì sao?"],
ans:`<p><b>A.</b> <b>Giả thần</b>: bệnh nguy kịch, nguyên khí cạn kiệt, âm dương phân tán. Cần nói rõ với gia đình đây không phải dấu hiệu khỏe lại. <span class="pg">CĐ tr.23</span></p>
<p><b>B.</b> Thể <b>âm hư</b> (cao gầy, môi đỏ, bồn chồn, nóng trong); sắc đỏ nhạt ở hai gò má chiều tối là <b>hư nhiệt</b>. Xu hướng mắc hư nhiệt, táo. <span class="pg">CĐ tr.24, 27</span></p>
<p><b>C.</b> Hoàng đản vàng tươi: <b>thấp nhiệt</b>. Vàng ám tối như khói thuốc: <b>hàn thấp</b>. <span class="pg">CĐ tr.27</span></p>`},
cards:[["Ba yếu tố của vọng thần?","Biểu hiện của thần, sức sống của thần, sự tươi nhuận."],["Còn thần / mất thần?","Còn: mắt sáng, tươi nhuận, giọng to rõ, nhanh nhẹn. Mất: bơ phờ, chậm, tiếng nhỏ, thờ ơ, tiên lượng kém."],["Giả thần?","Bệnh nặng đột nhiên tỉnh, nói nhiều, thèm ăn, má hồng: nguyên khí cạn kiệt, sắp tử vong."],["Bốn thể hình thái theo âm dương?","Dương thịnh (nhiệt, hỏa), âm thịnh (hàn, đàm, thấp), dương hư (hàn, đàm ẩm), âm hư (hư nhiệt, táo)."],["Vọng sắc lúc nào?","Buổi sáng sau thức dậy, ánh sáng tự nhiên, yên tĩnh."],["Sắc trắng: các kiểu?","Trắng sáng: dương hư. Trắng nhợt: khí hư. Trắng vàng: huyết hư. Trắng bệch đột ngột: dương thoát."],["Sắc đỏ: thực hay hư?","Đỏ thẫm cả má: thực nhiệt. Đỏ nhạt hai gò má chiều tối: hư nhiệt."],["Hoàng đản: tươi / ám?","Vàng tươi như cam: thấp nhiệt. Vàng ám như khói: hàn thấp."],["Sắc đen: khô / tối / nhạt / sậm?","Khô: thận âm hư. Tối: thận dương hư. Nhạt, phù: hàn thấp, đàm ẩm. Sậm: huyết ứ."]],

"2.03":{id:"2.03",tang:2,title:"Vọng từng bộ phận",han:"望局部",src:SRC_CD+", tr.31–48",
hook:"Một người mí mắt và mặt sưng nề. Chị ấn ngón tay vào: một người để lại vết lõm lâu, một người vết lõm đầy lại ngay. Hai kiểu sưng này khác nhau thế nào?",
reading:`
<p>Bài này gom các điểm <b>hay dùng nhất</b> của từng vùng. Phần lưỡi học riêng ở các bài thiệt chẩn.</p>
<p><b>Đầu mặt</b> <span class="pg">tr.31–33</span>: da đầu, mặt khô, nứt, bong vảy là <b>huyết táo</b>. Sưng nề, mí mắt xệ, <b>ấn lõm là thủy thấp; ấn vào vết lõm đầy nhanh là khí trệ</b>. Da vàng tươi kèm sốt là dương hoàng, vàng tối không sốt là âm hoàng. Ban chẩn tươi nhuận: chính khí chưa hư; tím: nhiệt thịnh; nhạt xám: chính khí đã hư. Trẻ thóp đóng trễ thường do thận tiên thiên khuyết tổn.</p>
<p><b>Mắt</b> <span class="pg">tr.33–37</span>: khiếu của can. Con ngươi – thận, mống mắt – can, củng mạc – phế, khóe mắt – tâm, mí mắt – tỳ.</p>
<ul><li>Mắt đỏ là nhiệt; sưng đau là can nhiệt. Mắt hay giật: kinh phong ở can. Khóe đuôi mắt đỏ: tâm có hỏa. Mí mắt đỏ: tỳ nhiệt.</li>
<li><b>Can hỏa</b>: mắt đỏ, nóng, đau, miệng đắng, lưỡi đỏ hai rìa đỏ sậm. <b>Tâm hỏa</b>: mắt đỏ đau, lo lắng, mất ngủ, đầu lưỡi đỏ.</li>
<li>Củng mạc vàng hoặc đỏ là nhiệt; xanh hoặc nhợt là hàn. Mí trên đỏ sưng: đàm nhiệt trở tỳ; mí dưới đỏ sưng: vị nhiệt. Bên trong mí nhợt: huyết hư hoặc dương hư.</li>
<li>Mắt trũng sâu luôn do hư; trũng cấp là âm hoặc dương suy kiệt. Quầng mắt thâm tím: huyết ứ; tối đen: đàm kết hoặc thận hư.</li></ul>
<p><b>Mũi</b> <span class="pg">tr.37–39</span>: đầu mũi trắng: khí hư hoặc mất máu; vàng: nhiều thấp; đỏ: tỳ nhiệt hoặc âm hư; phần trên mũi đỏ: phế nhiệt; đen khô: thận âm hư. <b>Cánh mũi phập phồng</b>: thiếu khí do ngạt, suyễn, khí hư không nạp khí. Nước mũi trong: phong hàn; đặc: phong nhiệt.</p>
<p><b>Tai</b> <span class="pg">tr.39–40</span>: khiếu của thận. Tai to: khí huyết dồi dào; tai nhỏ: khí huyết hư. Tai teo, nhăn: thiếu tân dịch (nhiệt hun đốt hoặc âm hư). Vành tai khô, ám đen: thận âm hư. Chảy mủ cấp: phong nhiệt kinh thiếu dương hoặc can đởm thấp nhiệt; mạn: can đởm thấp nhiệt.</p>
<p><b>Răng, nướu, họng</b> <span class="pg">tr.40–42</span>: nướu đỏ, sưng, đau là vị hỏa; nướu hơi đỏ, không sưng, răng lung lay, đau về chiều tối là thận âm hư sinh nhiệt; chảy máu nướu mạn là tỳ khí hư không thống huyết; nướu nhợt: tỳ khí hư, huyết hư. Họng đỏ sậm: thực nhiệt; đỏ nhạt: hư nhiệt; lở loét mạn tái phát: hư nhiệt.</p>
<p><b>Môi, miệng, cổ</b> <span class="pg">tr.42–44</span>: môi nhợt khô: can huyết hư; nhợt nhuận: dương hư; sưng đỏ: thực nhiệt; đỏ khô: hư nhiệt; xanh tím: huyết ứ; môi run: tỳ khí hư. Loét đầu lưỡi: tâm hỏa; loét viền đỏ trên nướu, trong má: vị nhiệt. Méo miệng: can phong hoặc ngoại phong phạm kinh lạc mặt. Chảy nước dãi: tỳ khí hư (hoặc phế khí hư, nội phong kèm đàm…). Cứng cổ: hàn tà phạm kinh lạc.</p>
<p><b>Ngực, bụng, lưng, tứ chi</b> <span class="pg">tr.44–48</span>: ngực lõm: phế khí hư, phế âm hư hoặc thận hư. Bụng to mập: tỳ hư sinh đàm. <b>Khối ở bụng cứng, cố định là huyết ứ; mềm, di chuyển là khí trệ</b>; khối vùng hạ sườn: can huyết ứ. Gù lưng: thận tinh bất túc. <b>Phù ở tay: phế dương hư; phù chân: thận dương hư; phù tứ chi: tỳ dương hư, thấp.</b></p>`,

],
case:{v:"Nam, 62 tuổi. Mặt và mí mắt sưng nề, ấn vào để lại vết lõm. Hai cẳng chân phù. Môi nhợt nhưng ướt, nướu nhợt. Sợ lạnh, chân tay lạnh. Khám bụng thấy một khối cứng, không di động vùng hạ sườn phải.",
qs:["Sưng nề mặt ấn lõm và phù chân gợi ý gì?","Môi nhợt nhuận, nướu nhợt, sợ lạnh nói thêm điều gì?","Khối cứng cố định vùng hạ sườn theo sách nghĩ đến gì? Nếu khối mềm, lúc có lúc không thì sao?"],
ans:`<p><b>1.</b> Sưng nề ấn lõm: <b>thủy thấp</b>. Phù chân: <b>thận dương hư</b>. <span class="pg">CĐ tr.33, 48</span></p>
<p><b>2.</b> Môi nhợt nhuận: <b>dương hư</b>; nướu nhợt: tỳ khí hư hoặc huyết hư, tỳ dương hư sinh hàn; cùng sợ lạnh, chân tay lạnh, củng cố hướng <b>dương hư</b>. <span class="pg">CĐ tr.41–42</span></p>
<p><b>3.</b> Khối cứng cố định là <b>huyết ứ</b>; ở vùng hạ sườn là <b>can huyết ứ</b>. Khối mềm, di chuyển là <b>khí trệ</b>. <span class="pg">CĐ tr.46</span> (Người có khối bụng cần phối hợp khám Tây y.)</p>`},
cards:[["Sưng nề: ấn lõm / lõm đầy nhanh?","Ấn lõm: thủy thấp. Lõm đầy nhanh: khí trệ."],["Năm phần của mắt ứng tạng nào?","Con ngươi – thận, mống mắt – can, củng mạc – phế, khóe mắt – tâm, mí mắt – tỳ."],["Can hỏa / tâm hỏa ở mắt?","Can hỏa: mắt đỏ nóng đau, miệng đắng, rìa lưỡi đỏ sậm. Tâm hỏa: mắt đỏ đau, lo lắng, mất ngủ, đầu lưỡi đỏ."],["Mí trên / mí dưới đỏ sưng?","Mí trên: đàm nhiệt trở tỳ. Mí dưới: vị nhiệt."],["Mũi: cánh mũi phập phồng? Nước mũi trong / đặc?","Thiếu khí (ngạt, suyễn, không nạp khí). Trong: phong hàn. Đặc: phong nhiệt."],["Nướu: vị hỏa / thận âm hư?","Vị hỏa: đỏ, sưng, đau. Thận âm hư: hơi đỏ, không sưng, răng lung lay, đau chiều tối."],["Môi nhợt khô / nhợt nhuận?","Nhợt khô: can huyết hư. Nhợt nhuận: dương hư."],["Khối ở bụng: cứng cố định / mềm di chuyển?","Cứng cố định: huyết ứ. Mềm di chuyển: khí trệ."],["Phù tay / chân / tứ chi?","Tay: phế dương hư. Chân: thận dương hư. Tứ chi: tỳ dương hư, thấp."]],
terms:[["Vọng cục bộ","望局部","wàng jú bù"],["Ngũ luân","五轮","wǔ lún"],["Tỵ dực phiến động (cánh mũi phập phồng)","鼻翼煽动","bí yì shān dòng"],["Hoàng đản","黄疸","huáng dǎn"],["Thủy thũng","水肿","shuǐ zhǒng"]],
flags:["🔍 Bài gốc rất dài (tr.31–53) và có nhiều chi tiết lấy từ tài liệu nước ngoài (Maciocia). Em chọn các dấu hiệu hay gặp và dễ dùng trên lâm sàng. Phần vọng da (tr.48–53) sẽ được bổ sung vào thư viện tra cứu."]},

"2.04":{id:"2.04",tang:2,title:"Vọng chỉ văn và vọng chất tiết",han:"望指纹 · 望排出物",src:SRC_CD+", tr.54–66",
hook:"Một bé 18 tháng sốt, quấy khóc, không tự kể được mình bị gì. Ngoài sờ trán, chị còn nhìn được gì trên chính bàn tay bé?",
reading:`
<p><b>Vọng chỉ văn</b> <span class="pg">tr.54–58</span>: quan sát mạch máu mặt lòng <b>ngón trỏ ở trẻ dưới 3 tuổi</b>. Cơ sở: một nhánh của kinh thủ thái âm phế tách ra ở gần huyệt liệt khuyết; da trẻ mỏng nên dễ thấy. Bé trai xem tay trái, bé gái xem tay phải. Người khám vuốt nhẹ từ Mệnh quan về Phong quan 2–3 lần.</p>
<p><b>Tam quan</b>: <b>Phong quan</b> (khớp bàn ngón → khớp liên đốt gần), <b>Khí quan</b> (→ khớp liên đốt xa), <b>Mệnh quan</b> (→ đầu ngón). Bình thường: mờ, nâu đỏ nhạt hoặc tím nhạt, chỉ thấy ở Phong quan.</p>
<table><tr><th>Yếu tố</th><th>Phản ánh</th><th>Đọc thế nào</th></tr>
<tr><td><b>Chiều dài</b></td><td>Mức độ nặng</td><td>Giữa Phong–Khí quan: nhẹ (mạch, lạc). Qua Khí quan: nặng hơn (kinh). Đến Mệnh quan: rất nặng (tạng phủ). Suốt tam quan: cực kỳ nặng</td></tr>
<tr><td><b>Độ sâu</b></td><td>Vị trí bệnh</td><td>Nông, rõ: biểu chứng. Sâu, mờ: lý chứng</td></tr>
<tr><td><b>Màu sắc</b></td><td>Hàn nhiệt</td><td>Đỏ tươi: biểu, phong hàn. Tím: lý nhiệt. Xanh (lục lam): can phong nội động, chứng đau. Đỏ nhạt: hư hàn. Vàng nhạt: tỳ hư. Tím đen: huyết ứ. Đen: nguy kịch</td></tr>
<tr><td><b>Tái tưới máu</b></td><td>Hư thực</td><td>Hồi phục nhanh: bình thường hoặc hư. Chậm, khó: thực (đàm thấp, thực tích, huyết ứ)</td></tr></table>
<p class="muted">Giáo trình 中医诊断学 tóm gọn thành 4 câu: 浮沉分表里，红紫辨寒热，淡滞定虚实，三关测轻重 (nổi chìm chia biểu lý, đỏ tím phân hàn nhiệt, nhạt trệ định hư thực, tam quan đo nặng nhẹ). Chỉ văn chạy thẳng đến đầu ngón gọi là “thấu quan xạ giáp”: rất nguy.</p>
<p><b>Vọng chất tiết</b> <span class="pg">tr.61–66</span></p>
<table><tr><th>Chất</th><th>Biểu hiện → nguyên nhân</th></tr>
<tr><td>Đàm</td><td>Trắng loãng: hàn đàm, tỳ hoặc thận dương hư. Trắng nhầy: thấp đàm ở phế. <b>Vàng nhầy: đàm nhiệt ở phế.</b> Lẫn máu: đàm nhiệt ở phế, phế âm hư kèm hư nhiệt</td></tr>
<tr><td>Nước mũi</td><td>Vàng nhầy: đàm, thấp nhiệt. Trắng, loãng, chảy nước: hàn đàm. Dính máu: đàm nhiệt ở phế</td></tr>
<tr><td>Mồ hôi</td><td>Trên trán: dương thoát. Màu vàng: thấp nhiệt tỳ vị. Trên đầu: nhiệt, thấp nhiệt ở vị, hoặc thận âm hư. Lòng bàn tay, bàn chân: thận âm hư</td></tr>
<tr><td>Phân</td><td>Vàng sậm: thực nhiệt đại trường. Trắng nhạt: hàn ở đại trường. Đen, tối: ứ huyết. Khô: nhiệt ở đại trường, can huyết hư, âm hư. Lỏng: tỳ khí hư, thận khí hư. Nhầy: thấp. Nhỏ thành viên: can khí trệ, nhiệt</td></tr>
<tr><td>Nước tiểu</td><td>Nhạt: hàn ở bàng quang, thận dương hư. Sẫm: nhiệt ở bàng quang, thận âm hư. Đục: thấp tại bàng quang</td></tr>
<tr><td>Kinh nguyệt</td><td>Bình thường 3–5 ngày, 50–100 ml, đỏ sẫm, không cục. Đỏ sậm hoặc đỏ chói: huyết nhiệt. Đen, rất tối: ứ huyết</td></tr>
<tr><td>Khí hư (huyết trắng)</td><td>Trắng: hàn thấp, tỳ hoặc thận dương hư. Vàng: thấp nhiệt. Xanh: thấp nhiệt kinh can. Đỏ trắng lẫn: thấp nhiệt</td></tr></table>`,

{q:"Chỉ văn kéo dài đến Mệnh quan nghĩa là:",o:[["Bệnh nhẹ, ở lạc","Sai."],["Bệnh rất nặng, ở tạng phủ","Đúng."],["Bình thường","Sai."],["Bệnh ở kinh, nặng vừa","Sai: đó là qua Khí quan."]],a:1,p:"56"},

{q:"Đổ mồ hôi lòng bàn tay và lòng bàn chân theo sách là:",o:[["Dương thoát","Sai: dương thoát ra mồ hôi trên trán."],["Thận âm hư","Đúng."],["Thấp nhiệt tỳ vị","Sai: mồ hôi vàng."],["Phế nhiệt","Sai."]],a:1,p:"63"},

case:{v:"Bé trai 18 tháng, sốt 2 ngày, quấy khóc. Chỉ văn ở ngón trỏ trái màu tím, nằm sâu, kéo dài qua Khí quan; vuốt xong mạch máu hồi lại chậm. Bé ho có đờm vàng nhầy.",

ans:`<p><b>1.</b> Màu tím: <b>lý nhiệt</b>. Sâu: bệnh ở <b>lý</b>. Qua Khí quan: <b>nặng hơn</b>, bệnh ở kinh. Hồi lại chậm: <b>thực chứng</b>. <span class="pg">CĐ tr.56–57</span></p>
<p><b>2.</b> <b>Đàm nhiệt ở phế.</b> <span class="pg">CĐ tr.61</span></p>
<p><b>3.</b> Đến Mệnh quan: <b>rất nặng</b>, bệnh vào tạng phủ; chạy thẳng đến đầu ngón (thấu quan xạ giáp): <b>nguy</b>, cần chuyển cấp cứu, phối hợp Tây y. <span class="pg">CĐ tr.56; ZD 望小儿食指络脉</span></p>`},

// Tầng 2 – Thiệt chẩn 2.05–2.10. Nguồn chính: Chẩn đoán YHCT (ĐHYD TP.HCM 2021) tr.69–83; đối chiếu 中医诊断学 (十三五) mục 望舌 (ghi "ZD").

"2.05":{id:"2.05",tang:2,title:"Thiệt chẩn (1): đại cương, phân vùng lưỡi, lưỡi bình thường",han:"舌诊概论",src:SRC_CD+", tr.69–71, 77; 中医诊断学 mục 望舌",
hook:"Buổi chiều, phòng khám bật đèn vàng, bệnh nhân vừa uống cà phê sữa. Chị nhìn thấy rêu lưỡi vàng nhạt, dày. Có nên ghi vào bệnh án là “rêu vàng dày” không?",
reading:`
<p><b>Vì sao thiệt chẩn quan trọng?</b> Lưỡi cho thấy dấu hiệu bất thường <b>ngay khi bên trong có tổn thương</b>, nên được xem là một phương pháp đáng tin cậy. <span class="pg">tr.69</span></p>
<p><b>Phân vùng lưỡi</b> <span class="pg">tr.69</span>: <b>đầu (chót) lưỡi – Tâm, Phế</b>; <b>giữa lưỡi – Tỳ, Vị</b>; <b>hai rìa – Can, Đởm</b>; <b>gốc lưỡi – Thận, Bàng quang</b>. Kết hợp vị trí với đặc điểm bất thường để định vị tạng phủ. (Khớp với Lý luận YHCT tr.42, bài 1.08.)</p>
<p><b>Quan sát những gì?</b> Giáo trình CĐ nêu 4 yếu tố: <b>màu chất lưỡi, hình thái lưỡi, rêu lưỡi, độ ẩm</b> <span class="pg">tr.70</span>. 中医诊断学 chia thành <b>chất lưỡi</b> (thần, sắc, hình, thái) và <b>rêu</b> (chất rêu, màu rêu), cộng <b>lạc mạch dưới lưỡi</b>. Hai cách chia cùng nội dung; các bài 2.06–2.09 đi theo cách chia của 中医诊断学.</p>
<p><b>Cách khám</b> <span class="pg">tr.70</span></p>
<ul><li>Người bệnh ngồi hoặc nằm ngửa, há miệng, <b>thè lưỡi tự nhiên, không gắng sức</b>.</li>
<li>Trình tự: <b>thân lưỡi</b> (màu, hình thái) → <b>rêu</b> → <b>độ ẩm</b>; nhìn <b>từ ngoài vào trong</b>: đầu → giữa → hai rìa → gốc.</li>
<li><b>Ánh sáng tự nhiên, vừa đủ</b>; tránh nguồn sáng có màu.</li></ul>
<p><b>Lưỡi bình thường</b> <span class="pg">tr.70–71</span>: chất lưỡi <b>hồng</b>; kích thước vừa, mềm, không to bè không gầy, cân đối, không lệch, cử động linh hoạt; <b>rêu trắng mỏng phủ đều, bám chặt như cỏ bám rễ</b> (phân biệt với “rêu giả”); <b>ẩm ướt nhẹ</b>. 中医诊断学 tóm gọn: <b>“đạm hồng thiệt, bạc bạch thai”</b>.</p>
${ANH("ccd855929f31",false)}${ATL("binh-thuong","Lưỡi bình thường")}
<p><b>Yếu tố làm thay đổi lưỡi bình thường</b> <span class="pg">tr.71, 77</span></p>
<table><tr><th>Yếu tố</th><th>Ảnh hưởng</th></tr>
<tr><td>Mùa</td><td>Hè: rêu hơi vàng, hơi dày. Thu: rêu mỏng, khô hơn. Đông: lưỡi ẩm hơn</td></tr>
<tr><td>Trong ngày</td><td>Sáng trước bữa ăn rêu dày hơn; vừa ngủ dậy chất lưỡi hơi nhạt</td></tr>
<tr><td>Ăn uống, thuốc</td><td>Trà, cà phê, bữa ăn gần đó làm rêu vàng; kẹo, phẩm màu đổi màu rêu; thuốc kháng acid chứa bismuth gây <b>rêu đen giả</b></td></tr>
<tr><td>Tuổi (ZD)</td><td>Trẻ em lưỡi nhạt, non, rêu ít, dễ bong; người già lưỡi thường đỏ sẫm</td></tr></table>
<p><b>Rêu nói lên điều gì?</b> <span class="pg">tr.77</span> Rêu do <b>Vị khí</b> sinh ra. <b>Rêu dày là có tà</b>, càng dày tà càng mạnh; rêu còn cho biết bệnh nông hay sâu, và tình trạng phủ Vị.</p>`,
checkTitle:"Trước khi xem lưỡi",

{q:"Bốn yếu tố chính khi quan sát lưỡi theo giáo trình CĐ:",o:[["Màu chất lưỡi, hình thái lưỡi, rêu lưỡi, độ ẩm","Đúng."],["Màu, mùi, vị, độ ẩm","Sai."],["Thần, sắc, hình, thái","Sai: đây là các mục của chất lưỡi theo 中医诊断学, chưa gồm rêu."],["Rêu, mạch, mồ hôi, đờm","Sai."]],a:0,p:"70"},
{q:"Trình tự quan sát từ ngoài vào trong là:",o:[["Gốc → giữa → rìa → đầu","Sai: ngược lại."],["Đầu → giữa → hai rìa → gốc","Đúng."],["Rìa → gốc → giữa → đầu","Sai."],["Không cần theo thứ tự","Sai."]],a:1,p:"70"},
{q:"Nguồn sáng tốt nhất để khám lưỡi:",o:[["Đèn vàng ấm","Sai: nguồn sáng có màu làm sai màu lưỡi, rêu."],["Ánh sáng tự nhiên, cường độ vừa đủ","Đúng."],["Đèn pin chiếu mạnh","Sai."],["Ánh sáng nào cũng được","Sai."]],a:1,p:"70"},

{q:"Theo giáo trình, mùa hè rêu lưỡi bình thường:",o:[["Mỏng và khô hơn","Sai: đó là mùa thu."],["Ẩm hơn","Sai: đó là mùa đông."],["Hơi vàng và hơi dày hơn","Đúng."],["Không thay đổi","Sai."]],a:2,p:"71"},
{q:"Rêu dày nói lên điều gì?",o:[["Có yếu tố gây bệnh; càng dày tà càng mạnh","Đúng."],["Chính khí mạnh","Sai."],["Luôn là bình thường","Sai."],["Huyết hư","Sai."]],a:0,p:"77"},

],
case:{v:`Buổi chiều, phòng khám bật đèn vàng. Bệnh nhân vừa uống một ly cà phê sữa trước khi vào. Chị thấy rêu lưỡi vàng nhạt, khá dày.`,
qs:["Có những yếu tố gây nhiễu nào?","Chị nên làm gì trước khi ghi nhận rêu lưỡi?","Ảnh mẫu trong phần đáp án là lưỡi bình thường: hãy mô tả theo 4 yếu tố của giáo trình."],
ans:`<p><b>1.</b> <b>Đèn vàng</b> (nguồn sáng có màu làm sai màu rêu); <b>cà phê</b> (làm rêu vàng); <b>sữa</b> (làm rêu trắng, dày); khám <b>buổi chiều</b> khác buổi sáng. <span class="pg">CĐ tr.70–71, 77; ZD 染苔</span></p>
<p><b>2.</b> Khám dưới ánh sáng tự nhiên; hỏi rõ ăn uống, thuốc; loại bỏ yếu tố gây nhiễu (súc miệng, chờ một lúc, hoặc hẹn xem lại). Chưa ghi “rêu vàng dày” khi chưa loại trừ rêu nhuộm. <span class="pg">CĐ tr.77</span></p>
<p><b>3.</b> Màu: chất lưỡi hồng nhạt, tươi. Hình thái: vừa phải, không bệu, không gầy, cân đối. Rêu: trắng mỏng, đều, nhìn thấy chất lưỡi qua rêu. Độ ẩm: ẩm nhẹ. <span class="pg">CĐ tr.70–71</span></p>${ANH("ccd855929f31",true)}`},
cards:[["Phân vùng lưỡi?","Đầu: Tâm, Phế. Giữa: Tỳ, Vị. Hai rìa: Can, Đởm. Gốc: Thận, Bàng quang."],["4 yếu tố quan sát (CĐ)?","Màu chất lưỡi, hình thái, rêu, độ ẩm."],["Cách chia của 中医诊断学?","Chất lưỡi (thần, sắc, hình, thái); rêu (chất, màu); lạc mạch dưới lưỡi."],["Trình tự xem lưỡi?","Thân lưỡi → rêu → độ ẩm; đầu → giữa → rìa → gốc."],["Lưỡi bình thường?","Đạm hồng thiệt, bạc bạch thai: hồng, mềm, vừa, linh hoạt; rêu trắng mỏng đều, có gốc; ẩm nhẹ."],["Mùa ảnh hưởng rêu thế nào?","Hè hơi vàng dày; thu mỏng khô; đông ẩm hơn."],["Rêu nhuộm thường gặp?","Trà, cà phê: vàng. Sữa: trắng dày. Bismuth, thuốc lá: đen."],["Rêu do đâu sinh ra? Rêu dày nghĩa là gì?","Vị khí. Rêu dày: có tà, càng dày tà càng mạnh."],["Biến đổi theo tuổi?","Trẻ em: nhạt, non, rêu ít dễ bong. Người già: đỏ sẫm."]],
terms:[["Thiệt chẩn","舌诊","shé zhěn"],["Chất lưỡi","舌质","shé zhì"],["Rêu lưỡi","舌苔","shé tāi"],["Đạm hồng thiệt, bạc bạch thai","淡红舌，薄白苔","dàn hóng shé, bó bái tāi"],["Đầu, giữa, rìa, gốc lưỡi","舌尖 舌中 舌边 舌根","shé jiān, shé zhōng, shé biān, shé gēn"],["Rêu nhuộm","染苔","rǎn tāi"]],

"2.06":{id:"2.06",tang:2,title:"Thiệt chẩn (2): thần lưỡi và màu chất lưỡi",han:"舌神 · 舌色",src:SRC_CD+", tr.71–74; 中医诊断学 mục 望舌",
hook:"Hai người cùng có lưỡi đỏ. Một người rêu vàng dày, một người gần như không có rêu. Cùng là “lưỡi đỏ”, hai người có cùng một chứng không?",
reading:`
<p><b>Thần lưỡi</b> (ZD 舌神): <b>vinh thiệt</b> (có thần): chất lưỡi tươi nhuận, hồng hoạt, có sinh khí, cử động linh hoạt; khí huyết đầy đủ, có bệnh cũng là dấu hiệu tốt. <b>Khô thiệt</b> (không thần): khô, cứng đờ, không sinh khí, mất bóng, cử động kém; khí huyết suy bại, bệnh nặng. Giáo trình CĐ không có mục này.</p>
${ATL("binh-thuong","Lưỡi bình thường")}
<p><b>Màu chất lưỡi</b> phản ánh khí huyết, ngũ tạng; cho biết <b>hàn hay nhiệt</b>, <b>âm hay dương</b> bị hư tổn. Màu bệnh lý có 5 loại <span class="pg">tr.71</span>:</p>
<table><tr><th>CĐ gọi</th><th>ZD gọi</th><th>Ý nghĩa</th></tr>
<tr><td><b>Hồng nhợt (nhạt)</b></td><td>淡白 đạm bạch</td><td><b>Dương hư</b> (lưỡi mềm, ẩm) hoặc <b>huyết hư</b> (hơi khô). Hai rìa đặc biệt nhợt, nặng thì màu cam nhạt: <b>Can huyết hư</b> <span class="pg">tr.72</span></td></tr>
<tr><td><b>Đỏ</b></td><td>红 hồng</td><td><b>Nhiệt</b>: có rêu là <b>thực nhiệt</b>, không rêu là <b>hư nhiệt</b> <span class="pg">tr.72</span></td></tr>
<tr><td><b>Đỏ thẫm</b></td><td>绛 giáng</td><td>Như lưỡi đỏ nhưng <b>nặng hơn</b> <span class="pg">tr.73</span></td></tr>
<tr><td><b>Tím</b></td><td>紫 tử</td><td><b>Huyết ứ</b>. Tím đỏ: nhiệt + ứ (tiến triển từ lưỡi đỏ). Tím xanh: hàn + ứ (tiến triển từ lưỡi nhợt) <span class="pg">tr.73</span></td></tr>
<tr><td><b>Xanh lam</b></td><td>青 thanh</td><td>Như tím xanh: <b>hàn ngưng</b> gây huyết ứ <span class="pg">tr.74</span></td></tr></table>
<p><b>Đọc màu theo vị trí</b> <span class="pg">tr.72–73</span></p>
<ul><li><b>Đầu lưỡi đỏ:</b> Tâm hỏa (có rêu) hoặc Tâm âm hư (không rêu).</li>
<li><b>Hai rìa đỏ:</b> có rêu là Can hỏa, Đởm nhiệt; không rêu là hư nhiệt ở Can.</li>
<li><b>Giữa lưỡi đỏ:</b> nhiệt ở Vị (thực hay hư tùy có rêu không).</li>
<li><b>Nốt đỏ</b> trên nền đỏ: luôn là nhiệt; dày thành đốm còn gợi ý huyết ứ. Ở đầu lưỡi: Tâm hỏa; rìa: Can hỏa; gốc: nhiệt hạ tiêu; quanh giữa lưỡi: Vị nhiệt.</li>
<li><b>Tím ở rìa:</b> Can huyết ứ; ở phụ nữ có thể là huyết ứ bào cung (thường tím xanh). <b>Tím ở giữa:</b> huyết ứ tại Vị.</li></ul>
${ATL("hong-thiet","Hồng thiệt")} ${ATL("tu-thiet","Tử thiệt")} ${ATL("diem-do","Điểm đỏ")}
<p class="muted">Mẹo nhớ: <b>màu lưỡi nói hàn nhiệt, có rêu hay không nói thực hay hư.</b></p>`,
checkTitle:"Khi xem màu chất lưỡi",
checklist:["Nhìn chỗ không có rêu (đầu, rìa) để đánh giá màu chất lưỡi","Nhạt hay đỏ? Đỏ tươi hay đỏ thẫm? Có ánh tím hay xanh?","Màu bất thường ở đâu: đầu, rìa, giữa, gốc?","Có rêu hay không (để phân thực, hư)?","Có nốt đỏ, đốm đỏ, chấm tím? Ở vùng nào?","Lưỡi tươi nhuận, linh hoạt (có thần) hay khô cứng (không thần)?"],
quiz:[
{q:"Lưỡi đỏ có rêu theo giáo trình là:",o:[["Hư nhiệt","Sai: lưỡi đỏ không rêu mới là hư nhiệt."],["Thực nhiệt","Đúng."],["Huyết hư","Sai."],["Dương hư","Sai."]],a:1,p:"72"},
{q:"Sắc lưỡi hồng nhợt, mềm và ẩm gợi ý:",o:[["Huyết hư","Sai: huyết hư thì lưỡi nhợt nhưng hơi khô."],["Dương hư","Đúng: dương khí suy không vận hóa được tân dịch."],["Thực nhiệt","Sai."],["Huyết ứ","Sai."]],a:1,p:"72"},
{q:"Hai rìa lưỡi đặc biệt nhợt, nặng thì màu cam nhạt là dấu hiệu của:",o:[["Can huyết hư","Đúng."],["Can hỏa","Sai: Can hỏa thì rìa đỏ, có rêu."],["Tỳ hư","Sai."],["Tâm âm hư","Sai."]],a:0,p:"72"},
{q:"Đầu lưỡi đỏ, không có rêu gợi ý:",o:[["Tâm hỏa","Sai: Tâm hỏa thì có rêu."],["Tâm âm hư","Đúng."],["Can hỏa","Sai."],["Vị nhiệt","Sai."]],a:1,p:"72"},
{q:"Hai rìa lưỡi đỏ, có rêu là chỉ điểm của:",o:[["Can hỏa hoặc Đởm nhiệt","Đúng."],["Hư nhiệt ở Can","Sai: đó là khi không có rêu."],["Vị nhiệt","Sai."],["Can huyết hư","Sai."]],a:0,p:"72"},
{q:"Lưỡi tím xanh theo giáo trình phản ánh:",o:[["Nhiệt và ứ huyết","Sai: đó là tím đỏ."],["Hàn và ứ huyết","Đúng: tiến triển từ lưỡi nhợt sang tím xanh."],["Âm hư","Sai."],["Thực nhiệt","Sai."]],a:1,p:"73"},
{q:"Ở phụ nữ, chất lưỡi tím ở rìa có thể là:",o:[["Huyết ứ tại bào cung","Đúng: thường có màu tím xanh."],["Can hỏa","Sai."],["Tỳ khí hư","Sai."],["Phế nhiệt","Sai."]],a:0,p:"73"},
{q:"Theo 中医诊断学, “khô thiệt” (lưỡi không thần) có ý nghĩa:",o:[["Bình thường","Sai: đó là vinh thiệt."],["Khí huyết suy bại, bệnh nặng","Đúng."],["Biểu chứng mới mắc","Sai."],["Đàm thấp","Sai."]],a:1,p:"ZD 舌神"},
{q:"Sắc lưỡi đỏ thẫm (giáng) so với lưỡi đỏ:",o:[["Bệnh nhẹ hơn","Sai."],["Cùng loại bệnh cảnh nhưng mức độ nặng hơn","Đúng."],["Chủ hàn","Sai."],["Chủ huyết hư","Sai."]],a:1,p:"73"}
],
case:{v:`Hai bệnh nhân cùng có lưỡi đỏ. A: rêu vàng phủ phần giữa và gốc lưỡi, sốt, khát, táo bón. B: lưỡi đỏ, gần như không có rêu, nóng trong về chiều, ra mồ hôi trộm. Đáp án có ảnh minh họa lưỡi của A.`,
qs:["A và B khác nhau ở điểm nào trên lưỡi? Mỗi người nghiêng về chứng gì?","Nếu A có thêm nhiều nốt đỏ ở hai rìa lưỡi thì sao?","Nếu B là nữ, kinh có cục, đau bụng kinh, và rìa lưỡi ánh tím xanh, chị nghĩ thêm gì?"],
ans:`${ANH("ec361198aa28",true)}<p><b>1.</b> Cùng lưỡi đỏ (nhiệt), khác nhau ở <b>rêu</b>: A có rêu là <b>thực nhiệt</b> (rêu vàng: nhiệt ở lý, xem bài 2.09); B không rêu là <b>hư nhiệt</b> (âm hư). <span class="pg">CĐ tr.72</span></p>
<p><b>2.</b> Nốt đỏ luôn là nhiệt; ở hai rìa là <b>Can hỏa</b>. <span class="pg">CĐ tr.73</span></p>
<p><b>3.</b> Rìa lưỡi tím ở phụ nữ: <b>huyết ứ tại bào cung</b>, thường tím xanh, tức hàn + ứ. <span class="pg">CĐ tr.73</span> Khi màu và các dấu hiệu khác chỉ về hai hướng (âm hư nhiệt với hàn ứ), cần tứ chẩn kỹ để phân chính phụ (bài 2.10).</p>`},
cards:[["5 màu lưỡi bệnh lý (CĐ)?","Hồng nhợt, đỏ, đỏ thẫm, tím, xanh lam."],["Hồng nhợt: ẩm / khô?","Mềm ẩm: dương hư. Hơi khô: huyết hư."],["Lưỡi đỏ: có rêu / không rêu?","Có rêu: thực nhiệt. Không rêu: hư nhiệt."],["Đầu lưỡi đỏ?","Có rêu: Tâm hỏa. Không rêu: Tâm âm hư."],["Rìa lưỡi đỏ / rìa nhợt cam?","Đỏ có rêu: Can hỏa, Đởm nhiệt; không rêu: Can hư nhiệt. Nhợt cam: Can huyết hư."],["Tím đỏ / tím xanh?","Tím đỏ: nhiệt + ứ. Tím xanh: hàn + ứ."],["Tím ở rìa / ở giữa?","Rìa: Can huyết ứ (nữ: bào cung). Giữa: huyết ứ tại Vị."],["Nốt đỏ theo vị trí?","Đầu: Tâm hỏa. Rìa: Can hỏa. Gốc: hạ tiêu. Quanh giữa: Vị nhiệt."],["Vinh thiệt / khô thiệt?","Vinh: tươi nhuận, linh hoạt, khí huyết đủ. Khô: khô cứng, không sinh khí, bệnh nặng."]],
terms:[["Vinh thiệt / Khô thiệt","荣舌 / 枯舌","róng shé / kū shé"],["Đạm bạch thiệt","淡白舌","dàn bái shé"],["Hồng thiệt","红舌","hóng shé"],["Giáng thiệt","绛舌","jiàng shé"],["Thanh tử thiệt","青紫舌","qīng zǐ shé"]],
flags:["🔍 Giáo trình CĐ dùng “hồng” cho lưỡi bình thường và “hồng nhợt” cho lưỡi nhạt bệnh lý; 中医诊断学 gọi là 淡红 (đạm hồng, bình thường) và 淡白 (đạm bạch). Khi đọc tài liệu khác, chị đối chiếu theo bảng trong bài.","🔍 Mục “thần lưỡi” lấy từ 中医诊断学; giáo trình CĐ không có mục này."]},

"2.07":{id:"2.07",tang:2,title:"Thiệt chẩn (3): hình thể, động thái, lạc mạch dưới lưỡi",han:"舌形 · 舌态 · 舌下络脉",src:SRC_CD+", tr.74–76; 中医诊断学 mục 望舌",
hook:"Một lưỡi to bè, nhợt, rìa có dấu răng; một lưỡi gầy, đỏ, có vết nứt sâu giữa lưỡi. Hình dáng lưỡi đang nói gì về hư hay thực?",
reading:`
<p><b>Hình thể lưỡi</b> cho biết tình trạng khí huyết, phản ánh <b>hư hay thực</b>. <span class="pg">tr.74</span></p>
<table><tr><th>Hình thể</th><th>Ý nghĩa (CĐ)</th><th>Đối chiếu ZD</th></tr>
<tr><td><b>Gầy, teo</b></td><td>Nhợt: huyết hư. Đỏ, không rêu: âm hư nội nhiệt. Đều là bệnh mạn tính <span class="pg">tr.74</span></td><td>Khớp</td></tr>
<tr><td><b>Trướng, bệu</b></td><td>Phần nhiều là <b>thấp, đàm</b>. Bệu, đỏ đầu lưỡi: Tâm hỏa; đỏ hai rìa: Can hỏa. Bệu bè, nhợt: Tỳ hư <span class="pg">tr.74</span></td><td>Nhạt bệu: tỳ thận dương hư; đỏ bệu: thấp nhiệt, đàm nhiệt</td></tr>
<tr><td><b>Có vết nứt</b></td><td>Thực nhiệt hoặc âm hư. Nứt ngắn ngang: Vị âm hư <span class="pg">tr.75</span></td><td>Đỏ có nứt: nhiệt thịnh thương âm; nhạt: huyết hư; nhạt bệu dấu răng: tỳ hư thấp xâm; có nứt bẩm sinh</td></tr>
<tr><td><b>Dấu ấn răng</b></td><td><b>Thấp</b> hoặc <b>Tỳ hư</b> <span class="pg">tr.76</span></td><td>Khớp</td></tr></table>
${ATL("sau-bac","Lưỡi gầy")} ${ATL("ban-dai","Lưỡi bệu")} ${ATL("liet-van","Lưỡi nứt")} ${ATL("xi-ngan","Dấu răng")}
<p><b>Động thái lưỡi</b>: bình thường cử động tự nhiên, linh hoạt. Đây là phần <b>hai giáo trình khác nhau nhiều</b>:</p>
<table><tr><th>Động thái</th><th>Giáo trình CĐ</th><th>中医诊断学</th></tr>
<tr><td><b>Mềm nhũn (nuy)</b></td><td>Tân dịch thiếu hụt <span class="pg">tr.75</span></td><td>Khí huyết đều hư, âm hao kiệt</td></tr>
<tr><td><b>Cứng chắc</b></td><td>Nội phong, huyết ứ <span class="pg">tr.75</span></td><td>Nhiệt vào tâm bào, nhiệt thịnh thương tân, phong đàm trở lạc; cứng kèm nói ngọng, tê chân tay là dấu hiệu báo trước trúng phong</td></tr>
<tr><td><b>Run</b></td><td>Tỳ khí hư <span class="pg">tr.76</span></td><td><b>Can phong nội động</b>: huyết hư sinh phong, nhiệt cực sinh phong, âm hư động phong</td></tr>
<tr><td><b>Lệch</b></td><td>Trúng phong <span class="pg">tr.76</span></td><td>Trúng phong hoặc dấu báo trước trúng phong</td></tr>
<tr><td><b>Rụt ngắn</b></td><td>Nhợt, ẩm: hàn. Đỏ: âm hư tổn <span class="pg">tr.75</span></td><td>Hàn ngưng, đàm trở, huyết hư, tân thương; gặp trong bệnh là nặng. Phân biệt với dây hãm lưỡi ngắn bẩm sinh</td></tr>
<tr><td><b>Dài, thè ra</b></td><td>Lưỡi dài: nhiệt, nhất là ở Tâm <span class="pg">tr.75</span></td><td>Thổ lộng thiệt (thè ra không thu về, liếm môi): Tâm Tỳ có nhiệt</td></tr></table>
<p><b>Lạc mạch dưới lưỡi</b> (ZD; giáo trình CĐ không có): bảo người bệnh cong lưỡi chạm nhẹ hàm trên. Bình thường hai tĩnh mạch hai bên dây hãm lưỡi màu đỏ sẫm, không phồng, không phân nhánh. <b>Ngắn, nhỏ, lưỡi nhạt:</b> khí huyết bất túc. <b>Phồng to, phân nhánh, màu tím đen, hoặc có nốt tím như hạt châu:</b> <b>huyết ứ</b>. Lạc mạch thay đổi có khi <b>sớm hơn</b> màu lưỡi.</p>`,
checkTitle:"Khi xem hình thể và động thái",
checklist:["To hay nhỏ, dày hay mỏng so với khoang miệng?","Rìa có dấu răng không?","Vết nứt: ở đâu, dài hay ngắn, sâu hay nông, ngang hay dọc? Có rêu phủ không (bẩm sinh)?","Thè ra có lệch, run, cứng, rụt không? Nói có ngọng không?","Nhìn mặt dưới lưỡi: lạc mạch có phồng, tím, phân nhánh không?","Luôn xem kèm màu chất lưỡi: cùng một hình thể, màu khác thì nghĩa khác"],
quiz:[
{q:"Lưỡi gầy, đỏ, không rêu theo giáo trình là:",o:[["Huyết hư","Sai: lưỡi gầy mà nhợt mới là huyết hư."],["Âm hư nội nhiệt","Đúng."],["Thực nhiệt","Sai."],["Đàm thấp","Sai."]],a:1,p:"74"},
{q:"Lưỡi trướng, bệu phần nhiều thuộc:",o:[["Thấp hoặc đàm","Đúng."],["Âm hư","Sai."],["Huyết ứ","Sai."],["Phong","Sai."]],a:0,p:"74"},
{q:"Lưỡi bệu, bè ra hai bên, sắc nhợt nhạt phản ánh:",o:[["Tâm hỏa","Sai."],["Tỳ suy yếu","Đúng."],["Can hỏa","Sai."],["Thực nhiệt","Sai."]],a:1,p:"74"},
{q:"Theo giáo trình CĐ, vết nứt ngắn theo đường ngang thường gặp trong:",o:[["Vị âm hư","Đúng."],["Tâm hỏa","Sai."],["Thận dương hư","Sai."],["Can khí uất","Sai."]],a:0,p:"75"},
{q:"Lưỡi có dấu ấn răng theo giáo trình là dấu chứng của:",o:[["Thấp hoặc Tỳ hư","Đúng."],["Nhiệt thịnh","Sai."],["Huyết ứ","Sai."],["Âm hư","Sai."]],a:0,p:"76"},
{q:"Lưỡi lệch sang một bên khi thè ra thường là biểu hiện của:",o:[["Tỳ khí hư","Sai."],["Trúng phong","Đúng: hai giáo trình đều thống nhất."],["Huyết hư","Sai."],["Thấp","Sai."]],a:1,p:"76"},
{q:"Theo 中医诊断学, lưỡi run (颤动舌) chủ yếu là:",o:[["Can phong nội động","Đúng: huyết hư, nhiệt cực hoặc âm hư sinh phong."],["Tỳ khí hư","Sai theo 中医诊断学; đây là cách giải thích của giáo trình CĐ."],["Đàm thấp","Sai."],["Thực tích","Sai."]],a:0,p:"ZD 颤动舌"},
{q:"Theo 中医诊断学, lạc mạch dưới lưỡi phồng to, phân nhánh, màu tím đen là dấu hiệu của:",o:[["Khí huyết bất túc","Sai: đó là lạc mạch ngắn nhỏ, lưỡi nhạt."],["Huyết ứ","Đúng."],["Âm hư","Sai."],["Biểu chứng","Sai."]],a:1,p:"ZD 舌下络脉"},
{q:"Lưỡi rụt ngắn, sắc nhợt, ẩm theo giáo trình gợi ý:",o:[["Hàn","Đúng."],["Âm hư","Sai: rụt ngắn kèm đỏ mới là âm hư."],["Thực nhiệt","Sai."],["Phong","Sai."]],a:0,p:"75"}
],
case:{v:`Ca A: nữ 45 tuổi, ăn kém, người nặng nề, phân lỏng. Lưỡi to bè, nhợt, rìa có dấu răng, rêu trắng. Ca B: nam 60 tuổi, nóng trong, khát, mất ngủ. Lưỡi đỏ thẫm, có vết nứt sâu chạy dọc giữa lưỡi. Đáp án có ảnh minh họa cho từng ca.`,
qs:["Ca A: phân tích hình thể lưỡi, kết luận hướng chứng.","Ca B: phân tích; vì sao phải xem màu lưỡi kèm vết nứt?","Ca B thêm: khi thè lưỡi thấy lưỡi run nhẹ, nói hơi ngọng, tê nửa người bên phải. Chị lo ngại điều gì?"],
ans:`${ANH("6aafb74e3d80",true)}<p><b>1. Ca A.</b> Bệu, bè, nhợt: <b>Tỳ suy yếu</b>; dấu răng: <b>thấp, Tỳ hư</b>; rêu trắng: hàn thấp (bài 2.09). Hướng: <b>tỳ hư thấp thịnh</b>, có thể kèm dương hư. <span class="pg">CĐ tr.74, 76; ZD 胖大舌, 齿痕舌</span></p>
${ANH("dc0be233b133",true)}<p><b>2. Ca B.</b> Lưỡi đỏ thẫm có vết nứt: <b>nhiệt thịnh thương âm</b> (ZD). Cùng là vết nứt, lưỡi nhạt thì là huyết hư, nhạt bệu dấu răng thì là tỳ hư thấp xâm, nên phải xem màu mới biết ý nghĩa. <span class="pg">CĐ tr.75; ZD 裂纹舌</span></p>
<p><b>3.</b> Lưỡi run (ZD: can phong nội động), lưỡi cứng, nói ngọng kèm tê chân tay là <b>dấu hiệu báo trước trúng phong</b>: cần khám cấp cứu, phối hợp Tây y ngay. <span class="pg">ZD 强硬舌, 颤动舌</span></p>`},
cards:[["Lưỡi gầy: nhợt / đỏ không rêu?","Nhợt: huyết hư. Đỏ không rêu: âm hư nội nhiệt. Đều mạn tính."],["Lưỡi bệu nói chung? Bệu bè nhợt?","Thấp, đàm. Bệu bè nhợt: Tỳ hư."],["Dấu răng?","Thấp hoặc Tỳ hư."],["Vết nứt theo màu (ZD)?","Đỏ: nhiệt thịnh thương âm. Nhạt: huyết hư. Nhạt bệu dấu răng: tỳ hư thấp xâm."],["Lưỡi lệch?","Trúng phong (hai giáo trình thống nhất)."],["Lưỡi run: CĐ / ZD?","CĐ: Tỳ khí hư. ZD: can phong nội động."],["Lưỡi cứng: CĐ / ZD?","CĐ: nội phong, huyết ứ. ZD: nhiệt vào tâm bào, nhiệt thương tân, phong đàm trở lạc."],["Lưỡi rụt ngắn?","Nhợt ẩm: hàn. Đỏ: âm hư. ZD: gặp trong bệnh là nặng."],["Lạc mạch dưới lưỡi bất thường?","Ngắn nhỏ, lưỡi nhạt: khí huyết hư. Phồng, phân nhánh, tím đen: huyết ứ."]],
terms:[["Bàn đại thiệt (lưỡi bệu)","胖大舌","pàng dà shé"],["Sấu bạc thiệt (lưỡi gầy)","瘦薄舌","shòu bó shé"],["Liệt văn thiệt (lưỡi nứt)","裂纹舌","liè wén shé"],["Xỉ ngân thiệt (dấu răng)","齿痕舌","chǐ hén shé"],["Nuy nhuyễn, cường ngạnh, oa tà, chiến động, đoản súc","痿软 强硬 歪斜 颤动 短缩","wěi ruǎn, qiáng yìng, wāi xié, chàn dòng, duǎn suō"],["Lạc mạch dưới lưỡi","舌下络脉","shé xià luò mài"]],
flags:["⚠️ Phần động thái lưỡi, giáo trình CĐ lấy theo sách phương Tây (Maciocia): “lưỡi run là Tỳ khí hư”, “lưỡi cứng là nội phong hoặc huyết ứ”, “lưỡi mềm nhũn là thiếu tân dịch”, “lưỡi dài là nhiệt ở Tâm”. 中医诊断学 giải thích khác (bảng trong bài). Khi thi K01, theo giáo trình được dùng; khi khám, nhớ cả hai, nhất là lưỡi run có thể là phong.","🔍 Giáo trình CĐ còn nêu “vết nứt của Tâm” (dài, sâu, dọc giữa tới đầu lưỡi) và “vết nứt của Vị” (nông, rộng, dọc giữa, không tới đầu lưỡi) theo Maciocia; 中医诊断学 không phân loại như vậy. Em chưa đưa vào câu hỏi."]},

"2.08":{id:"2.08",tang:2,title:"Thiệt chẩn (4): chất rêu",han:"苔质",src:SRC_CD+", tr.77, 80; 中医诊断学 mục 望舌",
hook:"Rêu lưỡi dày cả lớp, nhưng cạo nhẹ là sạch trơn, bên dưới nhẵn bóng. Đó là tà mạnh, hay là điều đáng lo hơn?",
reading:`
<p><b>Chất rêu</b> cho biết tính chất tà, tình trạng tân dịch và <b>vị khí</b>. Bài này đi theo 中医诊断学 (ZD), kèm các ý của giáo trình CĐ.</p>
<table><tr><th>Chất rêu</th><th>Nhận ra</th><th>Ý nghĩa</th></tr>
<tr><td><b>Mỏng / dày</b></td><td>Thấy / không thấy chất lưỡi qua rêu</td><td>Dày: có tà, càng dày tà càng mạnh <span class="pg">CĐ tr.77</span>. Mỏng thành dày: tà vào lý; dày thành mỏng: tà lui</td></tr>
<tr><td><b>Nhuận / hoạt / táo</b></td><td>Ẩm vừa / ướt trơn như muốn nhỏ giọt / khô</td><td>Độ ẩm phản ánh <b>tân dịch</b> <span class="pg">CĐ tr.80</span>. Quá ẩm: dương khí suy, thủy thấp. Khô: thực nhiệt hoặc hư nhiệt (âm hư). Lưỡi đỏ mà khô: nhiệt đã hao tân dịch</td></tr>
<tr><td><b>Nị (nhớt)</b></td><td>Hạt mịn, sít, liền mảng như phủ dầu, lau không sạch</td><td>Đàm trọc, thực tích, thấp. Dính nhớt hoặc trơn: thấp, đàm <span class="pg">CĐ tr.80</span></td></tr>
<tr><td><b>Hủ (bã đậu)</b></td><td>Hạt thô, xốp, dày như bã đậu, lau dễ sạch</td><td>Thực tích, đàm trọc (dương nhiệt hữu dư)</td></tr>
<tr><td><b>Bác (bong)</b></td><td>Rêu vốn có rồi bong, chỗ bong nhẵn</td><td>Vị khí bất túc, vị âm tổn thương, khí huyết lưỡng hư. Bong một phần: Vị âm hư; <b>không rêu toàn bộ: Thận âm hư hoặc Vị âm hư</b> <span class="pg">CĐ tr.77</span></td></tr>
<tr><td><b>Có gốc / không gốc</b></td><td>Bám chặt như mọc từ lưỡi / như trát lên, cạo là sạch, bên dưới nhẵn</td><td><b>Rêu giả</b> (không gốc): <b>Vị khí suy yếu</b>, không sinh được rêu mới <span class="pg">CĐ tr.77</span></td></tr></table>
${ATL("hoat-thai","Rêu trơn ướt")} ${ATL("bac-thai","Bác thai")}
<p><b>Vị khí trên lưỡi</b> (ZD): rêu mỏng đều có gốc, hoặc dày mà cạo vẫn còn dấu rêu, hoặc bong rồi mọc lại: <b>vị khí còn</b>. Rêu như có như không, nổi không gốc, cạo là sạch, nhẵn như gương: <b>vị khí suy bại</b>. Bệnh đang có rêu mục mà rêu tróc dần, mọc lớp rêu trắng mỏng mới: chính thắng tà, bệnh lui.</p>
<p class="muted">Rêu lệch (偏苔) khác rêu bong: rêu dày mỏng không đều theo phía, không phải bong ra; mất răng một bên cũng làm rêu bên đó dày hơn.</p>`,
checkTitle:"Khi xem chất rêu",
checklist:["Thấy được chất lưỡi qua rêu không (mỏng hay dày)?","Ướt hay khô? Có trơn ướt như sắp nhỏ giọt?","Hạt rêu mịn sít như phủ dầu (nị) hay thô xốp như bã đậu (hủ)?","Có chỗ bong không? Ở đâu? Nhẵn hay còn hạt rêu mới?","Cạo nhẹ: rêu có gốc hay sạch trơn bên dưới?","So với lần khám trước: rêu dày lên hay mỏng đi, có mọc lại không?"],
quiz:[
{q:"Độ ẩm của lưỡi phản ánh:",o:[["Tình trạng tân dịch","Đúng."],["Tình trạng huyết ứ","Sai."],["Can khí","Sai."],["Vị trí bệnh","Sai."]],a:0,p:"80"},
{q:"Lưỡi ẩm quá mức bình thường theo giáo trình là do:",o:[["Thực nhiệt","Sai."],["Dương khí suy, không chuyển hóa vận chuyển tân dịch, tích trệ thành thấp","Đúng."],["Âm hư","Sai."],["Huyết hư","Sai."]],a:1,p:"80"},
{q:"Lưỡi đỏ hoặc đỏ thẫm mà khô ráo chứng tỏ:",o:[["Nhiệt đã bắt đầu làm hao tân dịch","Đúng."],["Hàn thấp","Sai."],["Bình thường","Sai."],["Khí trệ","Sai."]],a:0,p:"80"},
{q:"Rêu dính nhớt hoặc trơn theo giáo trình là biểu hiện của:",o:[["Thấp hoặc đàm","Đúng."],["Âm hư","Sai."],["Huyết hư","Sai."],["Phong","Sai."]],a:0,p:"80"},
{q:"Rêu giả (không gốc) là biểu hiện của:",o:[["Tà khí rất mạnh","Sai: rêu dày có gốc mới là tà mạnh."],["Vị khí suy yếu, không sinh được rêu mới","Đúng."],["Bình thường","Sai."],["Biểu chứng","Sai."]],a:1,p:"77"},
{q:"Theo giáo trình, toàn bộ lưỡi không có rêu là dấu chứng của:",o:[["Thận âm hư hoặc Vị âm hư, hoặc cả hai","Đúng."],["Tỳ dương hư","Sai."],["Thực nhiệt","Sai."],["Biểu hàn","Sai."]],a:0,p:"77"},
{q:"Theo 中医诊断学, rêu hạt mịn, sít, liền mảng như phủ dầu, lau không sạch là:",o:[["Hủ thai","Sai: hủ thai thô xốp như bã đậu, lau dễ sạch."],["Nị thai","Đúng: chủ đàm trọc, thực tích."],["Bác thai","Sai."],["Hoạt thai","Sai."]],a:1,p:"ZD 腻腐苔"},
{q:"Theo 中医诊断学, lưỡi đỏ mà bong rêu đa phần là:",o:[["Âm hư","Đúng."],["Dương hư","Sai."],["Huyết ứ","Sai."],["Biểu chứng","Sai."]],a:0,p:"ZD 剥苔"},
{q:"Đang có rêu mục, rêu tróc dần và mọc lớp rêu trắng mỏng mới, theo 中医诊断学 nghĩa là:",o:[["Vị khí suy bại","Sai: đó là khi rêu tróc mà không mọc lại."],["Chính thắng tà, bệnh lui","Đúng."],["Tà vào sâu","Sai."],["Không có ý nghĩa","Sai."]],a:1,p:"ZD 腻腐苔"}
],
case:{v:`Nữ 50 tuổi, bệnh kéo dài, miệng khô, nóng về chiều, ăn kém. Lưỡi đỏ, rêu bong thành nhiều mảng loang lổ, chỗ bong nhẵn. Đáp án có ảnh minh họa.`,
qs:["Gọi tên đặc điểm rêu. Kết hợp với màu lưỡi, nghiêng về chứng gì?","Nếu sau vài tuần điều trị, chỗ bong bắt đầu có lớp rêu trắng mỏng mọc lại, chị đánh giá thế nào?","Nếu thay vào đó rêu bong hết, lưỡi đỏ nhẵn bóng như gương thì sao?"],
ans:`${ANH("1906170be3e6",true)}<p><b>1.</b> Rêu bong nhiều chỗ, loang lổ: <b>hoa bác</b>. Lưỡi đỏ mà bong rêu: <b>âm hư</b>, vị âm tổn thương (kèm miệng khô, nóng chiều, ăn kém). <span class="pg">CĐ tr.77; ZD 剥苔</span></p>
<p><b>2.</b> Rêu mọc lại: <b>vị khí đang hồi phục</b>, chính thắng tà, tiên lượng tốt. <span class="pg">ZD</span></p>
<p><b>3.</b> <b>Kính diện</b> (lưỡi gương), đỏ giáng: <b>vị âm khô kiệt</b>, âm hư nặng; không rêu toàn bộ còn có thể là Thận âm hư. Bệnh nặng, cần theo dõi sát. <span class="pg">CĐ tr.77; ZD 镜面舌</span></p>`},
cards:[["Rêu mỏng / dày?","Mỏng: thấy chất lưỡi. Dày: có tà, càng dày tà càng mạnh."],["Độ ẩm phản ánh gì?","Tân dịch. Quá ẩm: dương suy, thấp. Khô: thực hoặc hư nhiệt."],["Nị thai / hủ thai?","Nị: mịn sít như dầu, lau không sạch (đàm, thấp, tích). Hủ: thô xốp như bã đậu, lau dễ sạch (tích, đàm trọc)."],["Bong một phần / không rêu toàn bộ (CĐ)?","Một phần: Vị âm hư. Toàn bộ: Thận âm hư hoặc Vị âm hư."],["Lưỡi đỏ bong rêu / nhạt bong rêu (ZD)?","Đỏ: âm hư. Nhạt: huyết hư, khí huyết hư."],["Rêu giả?","Không gốc, cạo sạch, bên dưới nhẵn: Vị khí suy yếu."],["Dấu hiệu vị khí còn?","Rêu mỏng có gốc; dày mà cạo còn dấu; bong rồi mọc lại."],["Rêu lệch khác rêu bong?","Lệch: dày mỏng không đều theo phía (mất răng một bên cũng gây ra). Bong: rêu có rồi tróc."]],
terms:[["Bạc thai / Hậu thai","薄苔 / 厚苔","bó tāi / hòu tāi"],["Nhuận thai / Hoạt thai / Táo thai","润苔 / 滑苔 / 燥苔","rùn tāi / huá tāi / zào tāi"],["Nị thai / Hủ thai","腻苔 / 腐苔","nì tāi / fǔ tāi"],["Bác thai","剥苔","bō tāi"],["Kính diện thiệt","镜面舌","jìng miàn shé"],["Hữu căn / Vô căn","有根苔 / 无根苔","yǒu gēn tāi / wú gēn tāi"]],

"2.09":{id:"2.09",tang:2,title:"Thiệt chẩn (5): màu rêu",han:"苔色",src:SRC_CD+", tr.78–80; 中医诊断学 mục 望舌",
hook:"Rêu đen: có người bảo là nhiệt cực, có người bảo là hàn cực. Vậy dựa vào đâu để phân biệt?",
reading:`
<p>Màu rêu chủ bệnh có <b>trắng, vàng, xám, đen</b>. Phải xem kèm <b>khô hay ướt</b>, <b>màu chất lưỡi</b> và các chứng khác mới phân được hàn, nhiệt, hư, thực. <span class="pg">tr.78</span></p>
<table><tr><th>Màu rêu</th><th>Chủ</th><th>Các dạng thường gặp</th></tr>
<tr><td><b>Trắng</b></td><td>Phong hàn thấp (hàn là chính); biểu chứng</td><td>Trắng mỏng, lưỡi hồng nhuận: bình thường, bệnh nhẹ, giai đoạn sớm; ngoại tà phong hàn, phong thấp, hàn thấp. <b>Trắng dày nhờn</b>: Tỳ Vị dương hư, đàm thấp tích trệ. <b>Trắng mỏng khô</b>: tân dịch Phế đã hao. <b>Trắng dày khô</b>: giai đoạn sớm bệnh nhiệt <span class="pg">tr.78</span></td></tr>
<tr><td><b>Vàng</b></td><td>Bệnh ở <b>lý</b>, chủ <b>nhiệt</b></td><td><b>Vàng nhờn</b>: thấp nhiệt, đàm nhiệt, ăn uống tích trệ. <b>Mỏng hơi vàng</b>: phong hàn chuyển phong nhiệt, chưa hao tân dịch. <b>Vàng dày khô</b>: vị nhiệt thương tân; vàng khô nứt: nhiệt cực. <b>Vàng bóng, chất lưỡi nhợt</b>: dương hư, thủy dịch sinh đàm lâu ngày hóa nhiệt <span class="pg">tr.78</span></td></tr>
<tr><td><b>Xám</b></td><td>Bệnh ở lý; nhiệt hoặc hàn thấp</td><td>Xám bóng: hàn thấp. Xám khô: âm hư nội nhiệt. Hầu như không gặp ở biểu chứng hay hư hàn <span class="pg">tr.79</span></td></tr>
<tr><td><b>Đen</b></td><td>Bệnh nặng, kéo dài, đã vào lý</td><td><b>Đen trơn nhuận, lưỡi nhợt</b>: dương hư hàn. <b>Đen khô, nứt, lưỡi đỏ</b>: hỏa nhiệt làm âm dịch khô kiệt, rất nguy <span class="pg">tr.79</span></td></tr></table>
${ATL("bach-thai","Rêu trắng")} ${ATL("hoang-thai","Rêu vàng")} ${ATL("hac-thai","Rêu đen")}
<p><b>Chìa khóa phân hàn nhiệt của rêu xám đen: khô hay ướt.</b> 中医诊断学: trong bệnh hàn thấp, rêu xám đen chuyển từ rêu trắng và <b>ướt nhiều nước</b>; trong bệnh nhiệt, chuyển từ rêu vàng và <b>khô không có nước</b>. Dù hàn hay nhiệt đều là bệnh nặng; đen càng đậm bệnh càng nặng. Cũng có rêu đen do <b>hút thuốc nhiều (rêu nhuộm)</b>, không có triệu chứng tương ứng.</p>
<p><b>Rêu vàng theo vị trí</b> (ZD): đầu lưỡi vàng: nhiệt thượng tiêu; giữa: nhiệt ở vị trường; gốc: nhiệt hạ tiêu. Rêu chuyển từ trắng sang vàng, hoặc vàng trắng lẫn nhau: tà đang hóa nhiệt vào lý.</p>`,
checkTitle:"Khi xem màu rêu",
checklist:["Đã loại trừ rêu nhuộm chưa (cà phê, trà, thuốc, thuốc lá)?","Màu gì, ở vùng nào (đầu, giữa, gốc)?","Khô hay ướt? Mỏng hay dày? Có nhờn không?","Màu chất lưỡi bên dưới: nhợt hay đỏ?","Diễn biến: rêu chuyển từ trắng sang vàng, hay từ vàng sang đen?"],
quiz:[
{q:"Rêu trắng theo giáo trình chủ yếu chủ về:",o:[["Phong hàn thấp, trong đó hàn là chính; và biểu chứng","Đúng."],["Thực nhiệt","Sai."],["Âm hư","Sai."],["Huyết ứ","Sai."]],a:0,p:"78"},
{q:"Rêu trắng dày, nhờn là biểu hiện của:",o:[["Tỳ hoặc Vị dương hư, đàm thấp tích trệ","Đúng."],["Phế nhiệt","Sai."],["Âm hư","Sai."],["Bình thường","Sai."]],a:0,p:"78"},
{q:"Rêu vàng nhờn theo giáo trình là:",o:[["Thấp nhiệt, đàm nhiệt hoặc ăn uống tích trệ","Đúng."],["Biểu hàn","Sai."],["Dương hư","Sai."],["Huyết hư","Sai."]],a:0,p:"78"},
{q:"Rêu mỏng hơi vàng gợi ý:",o:[["Nhiệt cực","Sai."],["Phong hàn chuyển thành phong nhiệt, chưa hao tân dịch","Đúng."],["Hàn thấp","Sai."],["Vị khí suy","Sai."]],a:1,p:"78"},
{q:"Rêu vàng bóng kèm chất lưỡi nhợt nhạt là:",o:[["Thực nhiệt đơn thuần","Sai."],["Dương suy, thủy dịch ứ đọng sinh đàm, đàm lâu ngày hóa nhiệt","Đúng."],["Âm hư","Sai."],["Biểu nhiệt","Sai."]],a:1,p:"78"},
{q:"Rêu xám khô ráo theo giáo trình là biểu hiện của:",o:[["Hàn thấp","Sai: xám bóng mới là hàn thấp."],["Âm hư nội nhiệt","Đúng."],["Biểu chứng","Sai."],["Hư hàn","Sai."]],a:1,p:"79"},
{q:"Rêu đen trơn nhuận, chất lưỡi hồng nhợt là:",o:[["Hỏa nhiệt cực","Sai: đó là đen khô, nứt, lưỡi đỏ."],["Dương hư (hàn)","Đúng."],["Bình thường","Sai."],["Biểu chứng","Sai."]],a:1,p:"79"},
{q:"Theo 中医诊断学, dấu hiệu quan trọng nhất để phân rêu xám đen thuộc hàn hay nhiệt:",o:[["Độ dày","Sai."],["Khô hay ướt","Đúng: hàn thấp thì ướt nhiều nước, nhiệt thì khô."],["Vị trí","Sai."],["Kích thước lưỡi","Sai."]],a:1,p:"ZD 灰黑苔"},
{q:"Theo 中医诊断学, rêu vàng ở gốc lưỡi gợi ý:",o:[["Nhiệt thượng tiêu","Sai: đó là đầu lưỡi."],["Nhiệt ở vị trường","Sai: đó là giữa lưỡi."],["Nhiệt hạ tiêu","Đúng."],["Biểu nhiệt","Sai."]],a:2,p:"ZD 黄苔"}
],
case:{v:`Nam 70 tuổi, bệnh nhiều tháng, mệt lả, sợ lạnh, chân tay lạnh, ăn kém. Rêu lưỡi xám đen. Người nhà kể ông không hút thuốc, không dùng thuốc gì đặc biệt. Đáp án có ảnh minh họa rêu xám đen.`,
qs:["Trước khi kết luận, chị cần kiểm tra thêm điều gì trên lưỡi?","Nếu rêu ướt, chất lưỡi nhợt: kết luận gì?","Nếu rêu khô, nứt, chất lưỡi đỏ, người nóng, khát: kết luận gì? Tiên lượng?"],
ans:`${ANH("e55df7462393",true)}<p><b>1.</b> Rêu <b>khô hay ướt</b>, và <b>màu chất lưỡi</b> bên dưới; đã loại trừ rêu nhuộm (không hút thuốc, không dùng thuốc). <span class="pg">CĐ tr.79; ZD 灰黑苔</span></p>
<p><b>2.</b> Rêu đen trơn nhuận, lưỡi nhợt: <b>dương hư hàn</b>, phù hợp với sợ lạnh, chân tay lạnh. <span class="pg">CĐ tr.79</span></p>
<p><b>3.</b> Rêu đen khô nứt, lưỡi đỏ: <b>hỏa nhiệt làm âm dịch khô kiệt</b>, chân thủy sắp kiệt, <b>rất nguy</b>. Dù hàn hay nhiệt, rêu đen đều là bệnh nặng; cần phối hợp Tây y. <span class="pg">CĐ tr.79</span></p>`},
cards:[["4 màu rêu bệnh lý?","Trắng, vàng, xám, đen."],["Rêu trắng chủ?","Phong hàn thấp (hàn là chính), biểu chứng; trắng mỏng hồng nhuận là bình thường."],["Trắng dày nhờn / trắng mỏng khô / trắng dày khô?","Tỳ Vị dương hư, đàm thấp / tân dịch Phế hao / sớm của bệnh nhiệt."],["Rêu vàng chủ?","Lý, nhiệt."],["Vàng nhờn / mỏng hơi vàng / vàng dày khô?","Thấp nhiệt, đàm nhiệt, tích / phong hàn hóa nhiệt / vị nhiệt thương tân."],["Vàng bóng + lưỡi nhợt?","Dương hư, đàm lâu ngày hóa nhiệt."],["Xám bóng / xám khô?","Hàn thấp / âm hư nội nhiệt."],["Đen nhuận lưỡi nhợt / đen khô nứt lưỡi đỏ?","Dương hư hàn / hỏa nhiệt làm âm dịch khô kiệt, rất nguy."],["Phân hàn nhiệt rêu xám đen?","Khô hay ướt: ướt là hàn thấp, khô là nhiệt."]],

"2.10":{id:"2.10",tang:2,title:"Thiệt chẩn (6): kết hợp chất lưỡi và rêu",han:"舌质舌苔合参",src:SRC_CD+", tr.71–80; 中医诊断学 mục 舌象分析要点",
hook:"Lưỡi nhạt nhưng rêu vàng nhớt. Màu lưỡi nói hàn, màu rêu nói nhiệt. Tin bên nào?",
reading:`
<p><b>Nguyên tắc</b> (ZD): <b>chất lưỡi</b> chủ yếu phản ánh <b>tạng phủ, khí huyết, tân dịch</b> (chính khí, hư thực); <b>rêu</b> chủ yếu phản ánh <b>tà khí</b> (tính chất, nông sâu, tiến thoái) và <b>vị khí</b>. “Xem chất lưỡi biết âm dương hư thực; xem rêu biết hàn nhiệt nông sâu của tà.”</p>
<p><b>Ba tình huống</b></p>
<table><tr><th>Tình huống</th><th>Ý nghĩa</th><th>Ví dụ</th></tr>
<tr><td><b>Chỉ một bên bất thường</b></td><td>Bệnh còn đơn giản. Chỉ rêu đổi: tà là chính, chính khí chưa tổn, chữa thiên về <b>khu tà</b>. Chỉ chất lưỡi đổi: thiên về <b>điều hòa khí huyết, phù chính</b></td><td>Lưỡi hồng, rêu vàng dày</td></tr>
<tr><td><b>Hai bên cùng hướng</b></td><td>Bệnh cơ thống nhất, đơn giản</td><td>Đỏ + vàng khô: thực nhiệt. Đỏ giáng có nứt + vàng cháy khô: nhiệt cực tân thương. Đỏ gầy, ít hoặc không rêu: âm hư nội nhiệt. Nhạt non + trắng nhuận: hư hàn. Tím + trắng nhớt: khí huyết ứ trở, đàm thấp nội đình</td></tr>
<tr><td><b>Hai bên ngược hướng</b></td><td>Bệnh phức tạp, thường có <b>hai bệnh cơ cùng lúc</b>: phân tiêu bản, hoãn cấp</td><td><b>Nhạt + vàng nhớt</b>: vốn tỳ vị hư hàn, nay cảm thấp nhiệt (hàn nhiệt lẫn lộn, bản hư tiêu thực). <b>Đỏ giáng + trắng trơn nhớt</b>: dinh phận có nhiệt mà khí phận có thấp; hoặc người âm hư hỏa vượng cảm thêm hàn thấp</td></tr></table>
<p><b>Xem lưỡi theo diễn biến</b> (ZD): rêu mỏng thành dày: tà từ biểu vào lý; trắng thành vàng: tà hóa nhiệt; lưỡi từ hồng thành đỏ giáng, rêu khô: nhiệt tràn khí doanh; rêu bong, lưỡi đỏ giáng: nhiệt vào doanh huyết, khí âm đều tổn. Ngược lại, lưỡi từ tím, đỏ sẫm trở về hồng nhạt, rêu dần mỏng: bệnh đang ổn định.</p>
<p><b>Thần và vị khí trên lưỡi</b> (ZD): lưỡi có thần, rêu có gốc: chính khí còn, tiên lượng tốt dù bệnh nặng. Lưỡi khô, không thần; rêu nổi không gốc, nhẵn như gương: tiên lượng xấu.</p>
<p class="muted">Áp dụng: dùng phần “Đọc ảnh này” trong tab Luyện mắt (chế độ Chọn tất cả, mức Khó) để luyện kết hợp trên ảnh thật nhiều đặc điểm.</p>`,

qs:["Phân tích chất lưỡi và rêu riêng từng bên.","Hai bên cùng hướng hay ngược hướng? Kết luận bệnh cơ.","Chị cần hỏi, khám thêm gì để xác định bệnh cơ nào là chính?"],
ans:`${ANH("a25a607196b3",true)}<p><b>1.</b> <b>Chất lưỡi</b>: chỗ bong lộ đỏ sẫm, nhiều chấm đỏ ở nửa trước và hai rìa: <b>nhiệt</b> (chấm đỏ: đầu lưỡi Tâm hỏa, rìa Can hỏa), có dấu hiệu âm hư. <b>Rêu</b>: bong vùng giữa – cuống (vị âm tổn thương, có thể cả thận âm), phần còn lại trắng dày: <b>thấp, đàm trọc chưa hóa</b>. <span class="pg">CĐ tr.72–73, 77; ZD 剥苔, 点刺舌</span></p>
<p><b>2.</b> <b>Ngược hướng</b>: âm hư có nhiệt (chất lưỡi, chỗ bong) cùng thấp trọc (rêu dày còn lại). 中医诊断学 viết đúng kiểu này: rêu bong một phần mà chỗ còn lại là rêu nhớt là <b>chính khí hư mà đàm trọc chưa hóa, bệnh phức tạp</b>. Miệng khô mà không muốn uống, bụng đầy cũng gợi ý có thấp. <span class="pg">ZD 剥苔</span></p>
<p class="src-note">Bộ dữ liệu chỉ gán nhãn “bác thai” cho ảnh này; rêu trắng dày và chấm đỏ được mô tả từ quan sát trực tiếp trên ảnh.</p><p><b>3.</b> Hỏi thêm nóng chiều, mồ hôi trộm, ăn uống, đại tiện; xem mạch (tế sác nghiêng âm hư nhiệt, hoạt nghiêng đàm thấp); theo dõi lưỡi theo thời gian (rêu có mọc lại không). Khi lập pháp phải tính cả hai: thanh nhiệt dưỡng âm mà không làm thấp nặng thêm, hóa thấp mà không làm hao âm.</p>`},
cards:[["Chất lưỡi / rêu phản ánh gì?","Chất lưỡi: tạng phủ, khí huyết, tân dịch (chính khí). Rêu: tà khí (tính chất, nông sâu, tiến thoái) và vị khí."],["Chỉ rêu đổi / chỉ chất lưỡi đổi?","Rêu đổi: khu tà là chính. Chất lưỡi đổi: điều hòa khí huyết, phù chính."],["Đỏ + vàng khô?","Thực nhiệt."],["Đỏ gầy, ít rêu?","Âm hư nội nhiệt."],["Nhạt non + trắng nhuận?","Hư hàn."],["Tím + trắng nhớt?","Khí huyết ứ trở, đàm thấp nội đình."],["Nhạt + vàng nhớt?","Tỳ vị hư hàn cảm thấp nhiệt: hàn nhiệt lẫn lộn, bản hư tiêu thực."],["Đỏ giáng + trắng trơn nhớt?","Dinh có nhiệt, khí có thấp; hoặc âm hư hỏa vượng cảm hàn thấp."],["Diễn biến xấu / tốt của lưỡi?","Xấu: rêu mỏng thành dày, trắng thành vàng, lưỡi thành giáng, rêu bong. Tốt: lưỡi về hồng nhạt, rêu mỏng dần, rêu mọc lại."]],

// Tầng 2 – Văn chẩn (2.11), Vấn hãn (2.13), Vấn đau (2.14). Nguồn: CĐ tr.87–104, 119–124, 127–136; đối chiếu 中医诊断学 (ZD).
Object.assign(LESSONS,{
"2.11":{id:"2.11",tang:2,title:"Văn chẩn: nghe tiếng, ngửi mùi",han:"闻诊",src:SRC_CD+", tr.87–104; 中医诊断学 mục 闻诊",
hook:"Hai người cùng ho. Một người ho to, tiếng thô, mới mắc hôm qua. Một người ho nhỏ, yếu, kéo dài mấy tháng, nặng về chiều tối. Chưa cần hỏi gì thêm, chị đã nghiêng về hư hay thực cho mỗi người?",
reading:`
<p><b>Văn chẩn</b> gồm <b>nghe</b> (giọng nói, lời nói, hơi thở, ho, nôn, nấc, ợ, trung tiện, thở dài) và <b>ngửi</b> (mùi cơ thể, chất tiết, phòng bệnh). Mục đích chung: phân <b>hàn nhiệt</b> và <b>hư thực</b>. <span class="pg">tr.87, 99–100</span></p>
<table><tr><th>Quy tắc chung</th><th>Thực, nhiệt</th><th>Hư, hàn</th></tr>
<tr><td>Âm thanh <span class="pg">tr.88</span></td><td>To, mạnh</td><td>Nhỏ, yếu</td></tr>
<tr><td>Lời nói <span class="pg">tr.91</span></td><td>Nói nhiều, dai dẳng</td><td>Im lặng, ngại nói</td></tr>
<tr><td>Mùi <span class="pg">tr.100</span></td><td>Hôi, thối</td><td>Tanh hoặc không mùi</td></tr></table>
<p><b>Giọng nói</b> <span class="pg">tr.88–89</span>: giọng to là nhiệt, thực; nhỏ là hàn, hư. <b>Khàn tiếng</b>: khởi phát đột ngột kèm sốt, ớn lạnh, đau họng là ngoại cảm; khàn từ từ, nặng về tối, khô họng, mồ hôi trộm là <b>Phế Thận âm hư</b>; khàn kèm đờm vàng đặc là đàm nhiệt; khàn mạn, họng có khối, lưỡi tím là ứ huyết. Mất tiếng cấp thường do ngoại tà, dễ chữa; mất tiếng mạn thường do hư, khó chữa.</p>
<p><b>Lời nói bất thường</b> (dùng tên theo 中医诊断学):</p>
<table><tr><th>Tên</th><th>Biểu hiện</th><th>Ý nghĩa</th></tr>
<tr><td><b>Thiềm ngữ</b> 谵语</td><td>Thần chí không rõ, nói lung tung, <b>tiếng to có lực</b></td><td><b>Thực</b>: nhiệt nhiễu tâm thần (“thực tắc thiềm ngữ”). CĐ gọi là “mê sảng”</td></tr>
<tr><td><b>Trịnh thanh</b> 郑声</td><td>Thần chí không rõ, nói lặp đi lặp lại, ngắt quãng, <b>tiếng nhỏ yếu</b></td><td><b>Hư</b>: tạng khí suy kiệt, giai đoạn nặng, cuối bệnh (“hư tắc trịnh thanh”). CĐ gọi là “lẩm bẩm”</td></tr>
<tr><td><b>Độc ngữ</b> 独语</td><td>Nói một mình, lẩm nhẩm, thấy người thì thôi</td><td>Tâm khí bất túc hoặc khí uất đàm trở; hay gặp trong điên, uất</td></tr>
<tr><td><b>Thác ngữ</b> 错语</td><td>Tỉnh táo nhưng nói nhầm, nói xong tự biết sai</td><td>Hư: tâm khí bất túc (người già, bệnh lâu). Thực: đàm, ứ huyết, khí uất</td></tr>
<tr><td><b>Cuồng ngôn</b> 狂言</td><td>Tinh thần rối loạn, la hét, nói bậy, không kiêng nể</td><td>Dương chứng, thực chứng: khí uất hóa hỏa, đàm hỏa nhiễu tâm</td></tr></table>
<p><b>Hơi thở</b> (ZD, rõ hơn CĐ): <b>suyễn</b> thở khó, gấp; <b>thực suyễn</b> phát nhanh, tiếng to, thở ra mới dễ chịu; <b>hư suyễn</b> phát từ từ, tiếng nhỏ, hít sâu mới dễ chịu, gắng sức thì nặng (phế thận hư, không nạp khí; liên hệ bài 1.12). <b>Háo</b>: thở gấp kèm tiếng rít trong họng; có háo thì có suyễn, có suyễn chưa chắc có háo. <b>Đoản khí</b>: thở ngắn không nối hơi. <b>Thiểu khí</b>: thở yếu, tiếng nhỏ, nói không ra hơi; chủ hư tổn. CĐ: thở to, nhanh là thực nhiệt; yếu, chậm là hư hàn. <span class="pg">tr.93</span></p>
<p><b>Ho</b> <span class="pg">tr.94</span>: cấp, tiếng to thô là ngoại tà (phong hàn, phong nhiệt; ho khan tiếng rõ sắc là táo thương Phế). Mạn, tiếng to, nhiều đờm, nặng buổi sáng và sau ăn là đàm thấp ở Phế. Mạn, tiếng yếu, nặng về chiều tối là Phế khí hư; ho khan yếu, khàn, nặng về tối là <b>Phế âm hư</b>.</p>
<p><b>Nôn, nấc, ợ</b> <span class="pg">tr.95–97</span>: âm thanh to, mạnh, cấp là <b>thực</b>; nhỏ, yếu, ngắt quãng, mạn tính, hay tái phát là <b>hư</b>. Nôn ra chua, hôi sau ăn quá nhiều: thức ăn đình trệ. Nấc, ợ, nôn nặng lên khi căng thẳng: Can Vị bất hòa. Nấc to rõ có mùi hôi: Vị nhiệt. Ợ hôi kèm đau bụng cự án là thực; ợ yếu không mùi, chán ăn là Vị hư.</p>
<p><b>Thở dài</b> <span class="pg">tr.99</span>: kèm đau ngực nặng lên khi căng thẳng, cáu gắt, miệng đắng, mạch huyền: <b>Can khí uất</b> (liên hệ bài 1.19); thở dài tiếng yếu, khó thở khi gắng sức: khí hư, dương hư.</p>
<p><b>Ngửi mùi</b> <span class="pg">tr.100–103</span>: <b>hôi thối là nhiệt, thực; tanh hoặc không mùi là hàn, hư.</b> Hơi thở hôi, nướu sưng nóng, khát nước lạnh: Vị nhiệt; chua, hôi như trứng thối, ợ hôi: thức ăn tích ở Vị; tanh hôi kèm ho đờm mủ máu: đàm nhiệt ở Phế (Phế ung). Nước tiểu đục, hôi, tiểu buốt rát: thấp nhiệt Bàng quang; tiểu không mùi: Thận dương hư. Phân hôi thối có mủ máu: thấp nhiệt Đại trường; phân lỏng mùi tanh: hàn. Khí hư vàng dính, tanh hôi: thấp nhiệt kinh Can. Phòng bệnh có mùi táo thối: tiêu khát giai đoạn muộn; mùi nước tiểu: urê máu cao. Trước khi kết luận về mùi miệng, loại trừ nguyên nhân tại chỗ (viêm nướu, sâu răng, vệ sinh kém).</p>`,

{q:"Ho mạn tính, tiếng to, nhiều đờm, nặng buổi sáng và sau bữa ăn:",o:[["Phế âm hư","Sai."],["Đàm thấp tích trở ở Phế","Đúng."],["Phong nhiệt phạm Phế","Sai: đó là ho cấp."],["Phế khí hư","Sai: Phế khí hư thì tiếng ho yếu."]],a:1,p:"94"},
{q:"Nấc mạn tính, hay tái phát, tiếng thấp, yếu, không liên tục là:",o:[["Thực chứng","Sai."],["Hư chứng","Đúng: tiếng nấc yếu, ngắt quãng, mạn tính là hư."],["Vị nhiệt","Sai: Vị nhiệt nấc to rõ, có mùi hôi."],["Can Vị bất hòa","Sai."]],a:1,p:"96"},
{q:"Thở dài, đau ngực nặng lên khi căng thẳng, cáu gắt, miệng đắng, mạch huyền:",o:[["Khí hư","Sai: khí hư thì thở dài tiếng yếu, nặng khi gắng sức."],["Can khí uất","Đúng."],["Phế âm hư","Sai."],["Thận dương hư","Sai."]],a:1,p:"99"}
],
case:{v:`A: nam 30 tuổi, ho từ hôm qua, tiếng ho to thô, sợ lạnh, nghẹt mũi. B: nữ 60 tuổi, ho khan đã 3 tháng, tiếng ho yếu, giọng khàn dần, nặng về chiều tối, họng khô, ra mồ hôi trộm.`,
qs:["Chỉ dựa vào âm thanh, mỗi người nghiêng về hư hay thực?","Kết hợp các dấu hiệu khác, nghĩ đến hội chứng gì cho từng người?","B còn kể hơi thở có mùi hôi, nướu sưng nóng, thích uống nước lạnh. Chị có kết luận ngay là Vị nhiệt không?"],
ans:`<p><b>1.</b> A: tiếng to, thô, cấp tính → <b>thực</b>. B: tiếng yếu, mạn tính → <b>hư</b>. <span class="pg">CĐ tr.88, 94</span></p>
<p><b>2.</b> A: ho cấp tiếng thô, sợ lạnh, nghẹt mũi → <b>phong hàn phạm Phế</b>. B: ho khan yếu, khàn, nặng về tối, khô họng, mồ hôi trộm → <b>Phế (Thận) âm hư</b>. <span class="pg">CĐ tr.89, 94</span></p>
<p><b>3.</b> Chưa. Phải loại trừ nguyên nhân tại chỗ (viêm nướu, sâu răng, vệ sinh miệng). Nếu đúng là do nội tạng thì hôi miệng, nướu sưng nóng, khát nước lạnh hợp với <b>Vị nhiệt</b>; còn hôi miệng kèm loét nướu mạn, bốc hỏa, mồ hôi trộm thì nghĩ <b>Thận âm hư</b>, gần hơn với bệnh cảnh hiện có của B. <span class="pg">CĐ tr.100–101</span></p>`},
cards:[["Quy tắc chung văn chẩn?","To, mạnh, nói nhiều, hôi thối: thực nhiệt. Nhỏ, yếu, ngại nói, tanh hoặc không mùi: hư hàn."],["Khàn tiếng: cấp / mạn nặng về tối?","Cấp kèm sốt, đau họng: ngoại cảm. Mạn, nặng về tối, mồ hôi trộm: Phế Thận âm hư."],["Thiềm ngữ / trịnh thanh?","Thiềm ngữ: mê, nói lung tung, tiếng to có lực (thực). Trịnh thanh: mê, lặp lại, tiếng nhỏ yếu (hư, cuối bệnh)."],["Độc ngữ / thác ngữ / cuồng ngôn?","Độc ngữ: nói một mình, thấy người thì thôi. Thác ngữ: tỉnh mà nói nhầm, tự biết sai. Cuồng ngôn: la hét nói bậy (dương, thực)."],["Thực suyễn / hư suyễn?","Thực: phát nhanh, tiếng to, thở ra dễ chịu. Hư: từ từ, tiếng nhỏ, hít sâu dễ chịu, gắng sức nặng."],["Háo / suyễn / đoản khí / thiểu khí?","Háo: có tiếng rít. Suyễn: thở khó gấp. Đoản khí: thở ngắn không nối. Thiểu khí: thở yếu, nói không ra hơi."],["Ho mạn nhiều đờm, nặng sáng và sau ăn? Ho khan yếu, nặng về tối?","Đàm thấp ở Phế. Phế âm hư."],["Nôn, nấc, ợ: thực / hư?","Thực: to, mạnh, cấp. Hư: nhỏ, yếu, ngắt quãng, mạn, hay tái phát."],["Mùi nước tiểu, phân?","Nước tiểu đục hôi: thấp nhiệt Bàng quang; không mùi: Thận dương hư. Phân hôi thối mủ máu: thấp nhiệt Đại trường; lỏng tanh: hàn."]],
terms:[["Văn chẩn","闻诊","wén zhěn"],["Thiềm ngữ","谵语","zhān yǔ"],["Trịnh thanh","郑声","zhèng shēng"],["Độc ngữ / Thác ngữ","独语 / 错语","dú yǔ / cuò yǔ"],["Cuồng ngôn","狂言","kuáng yán"],["Suyễn / Háo","喘 / 哮","chuǎn / xiào"],["Đoản khí / Thiểu khí","短气 / 少气","duǎn qì / shǎo qì"],["Ách nghịch (nấc) / Ái khí (ợ)","呃逆 / 嗳气","è nì / ài qì"]],
flags:["🔍 Giáo trình CĐ gọi “mê sảng” và “lẩm bẩm”, còn dùng chữ “thác ngôn” cho kiểu nói một mình âm thầm (đối lập với cuồng ngôn). 中医诊断学 dùng thiềm ngữ, trịnh thanh, độc ngữ, thác ngữ (nói nhầm rồi tự biết sai), cuồng ngôn. Bài dùng tên theo 中医诊断学 và ghi tên CĐ bên cạnh.","⚠️ Tr.93, bảng âm thanh hơi thở có dòng “thở sâu: Tâm Phế khí thịnh; thở yếu: Can Thận hư”; tr.95, bảng tiếng nôn ghi “Vị âm hư” cho kiểu nôn dữ dội, tiếng to. Hai ý này khó đối chiếu được với 中医诊断学, em không đưa vào câu hỏi."]},

"2.13":{id:"2.13",tang:2,title:"Vấn hãn: hỏi mồ hôi",han:"问汗",src:SRC_CD+", tr.119–124; 中医诊断学 mục 问汗",
hook:"Một người tỉnh dậy giữa đêm, áo ướt đẫm mồ hôi, thức dậy thì hết. Một người ngồi yên ban ngày cũng rịn mồ hôi, đi vài bước là đẫm. Cùng là “ra nhiều mồ hôi”, hai người có cùng một gốc không?",
reading:`
<p>Mồ hôi do <b>tân dịch</b> mà ra (trong là tân dịch, ra ngoài là mồ hôi); Tâm, Phế, Tỳ, Thận đều tham gia. Hỏi mồ hôi giúp biết <b>tính chất tà</b> và <b>thịnh suy âm dương</b>. <span class="pg">tr.119</span> Liên hệ bài 1.06: vệ khí điều lý đóng mở lỗ chân lông.</p>
<p><b>Hỏi những gì</b> <span class="pg">tr.119–120</span>: có hay không; <b>lúc nào</b> (ngày, đêm, nghỉ, gắng sức, sau ăn, sau tắm); <b>ở đâu</b>; <b>nhiều hay ít</b>; <b>tính chất</b> (trong loãng, dính, như dầu; nóng hay lạnh); triệu chứng kèm; và <b>sau khi ra mồ hôi thì sao</b> (bớt sốt, đỡ đau, hay chóng mặt, lạnh tay chân).</p>
<p><b>Ba điều kiện để ra mồ hôi</b> <span class="pg">tr.120</span>: tân dịch đủ, dương khí đủ, lỗ chân lông mở. Thiếu một trong ba là không ra mồ hôi.</p>
<table><tr><th>Loại</th><th>Biểu hiện</th><th>Gợi ý</th></tr>
<tr><td><b>Vô hãn</b> (không ra)</td><td>Cấp, sợ lạnh, sốt nhẹ, đau đầu, nghẹt mũi</td><td><b>Hàn tà phạm biểu</b>: hàn co rút đóng lỗ chân lông <span class="pg">tr.122</span></td></tr>
<tr><td></td><td>Bệnh lâu, da tóc khô, ngũ tâm phiền nhiệt / sợ lạnh thích ấm</td><td>Âm hư (thiếu tân dịch) / Dương hư (không khí hóa được)</td></tr>
<tr><td><b>Đa hãn</b> (quá nhiều)</td><td>Mồ hôi nóng, mặt đỏ, sốt cao, khát nhiều</td><td><b>Thực nhiệt</b>: nhiệt bức mồ hôi ra <span class="pg">tr.122</span></td></tr>
<tr><td></td><td>Mồ hôi loãng lạnh, hoặc như dầu</td><td>Dương hư, dương thoát</td></tr>
<tr><td><b>Tự hãn</b> (ban ngày, không làm gì cũng ra, gắng sức thì nặng)</td><td>Hay cảm, sợ lạnh, hụt hơi</td><td><b>Khí hư</b> (Phế khí không đủ tạo vệ khí) <span class="pg">tr.123</span></td></tr>
<tr><td></td><td>Tay chân mát, kém ăn</td><td>Dương hư</td></tr>
<tr><td></td><td>Sợ gió, đau mình, sốt nhẹ, lúc đầu không ra sau tự ra</td><td>Dinh vệ bất hòa</td></tr>
<tr><td><b>Đạo hãn</b> (ra khi ngủ, tỉnh thì hết)</td><td>Bốc hỏa, ngũ tâm phiền nhiệt, khát, gầy, đau lưng mỏi gối</td><td><b>Âm hư</b> (Thận âm hư): ngủ thì vệ khí vào trong, gặp hư nhiệt đẩy mồ hôi ra <span class="pg">tr.121, 123</span></td></tr>
<tr><td></td><td>Đầu nặng, kém ăn / hay quên, chóng mặt, đoản hơi</td><td>Đàm thấp / huyết hư (CĐ)</td></tr></table>
<p><b>Mồ hôi đặc biệt</b> (ZD, bổ sung cho CĐ)</p>
<ul><li><b>Tuyệt hãn (thoát hãn)</b>: bệnh nặng ra mồ hôi không ngừng. <b>Lạnh, nhiều như nước</b>, mặt trắng, chân tay lạnh, mạch vi: <b>vong dương</b>. <b>Nóng, dính như dầu</b>, bứt rứt, khát, mạch tế sác: <b>vong âm</b>. Cả hai đều nguy cấp.</li>
<li><b>Chiến hãn</b>: run lạnh rồi ra mồ hôi; chính khí hồi phục, chính tà giao tranh, là <b>bước ngoặt</b>. Ra mồ hôi mà hết sốt, mạch êm: bệnh lui; ra mồ hôi mà vẫn sốt, vật vã, mạch gấp: bệnh nặng thêm.</li>
<li><b>Chỉ ra ở đầu</b>: kèm phiền, khát, mặt đỏ là nhiệt thượng tiêu; kèm nặng mình, đầy bụng là thấp nhiệt trung tiêu; kèm chân tay lạnh, thở gấp, mạch vi là nguy (dương thoát). Trẻ nhỏ ngủ ra mồ hôi đầu mà không có gì khác là bình thường.</li>
<li><b>Lòng bàn tay chân</b> ra nhiều: âm hư nội nhiệt; dương minh táo nhiệt; tỳ vị thấp nhiệt.</li>
<li><b>Nửa người</b>: thường bên lành ra mồ hôi, <b>bên không ra là bên bệnh</b>; gặp trong trúng phong, nuy, liệt.</li></ul>`,
checkTitle:"Câu hỏi về mồ hôi",

{q:"Tự hãn, nặng sau gắng sức, hay bị cảm, sợ lạnh, hụt hơi gợi ý:",o:[["Âm hư","Sai."],["Khí hư (Phế khí không đủ tạo vệ khí)","Đúng."],["Thực nhiệt","Sai."],["Đàm thấp","Sai."]],a:1,p:"123"},
{q:"Đạo hãn kèm bốc hỏa, ngũ tâm phiền nhiệt, khát, gầy, đau lưng mỏi gối:",o:[["Thận âm hư","Đúng."],["Khí hư","Sai."],["Hàn tà phạm biểu","Sai."],["Dinh vệ bất hòa","Sai."]],a:0,p:"123"},
{q:"Mồ hôi nóng nhiều, mặt đỏ, sốt cao, khát nhiều:",o:[["Dương hư","Sai: dương hư thì mồ hôi loãng lạnh."],["Thực nhiệt","Đúng: nhiệt bức mồ hôi ra."],["Âm hư","Sai."],["Khí hư","Sai."]],a:1,p:"122"},
{q:"Theo 中医诊断学, bệnh nặng ra mồ hôi nóng, dính như dầu, bứt rứt, khát, mạch tế sác là:",o:[["Vong dương","Sai: vong dương thì mồ hôi lạnh nhiều như nước, chân tay lạnh, mạch vi."],["Vong âm","Đúng: nguy cấp."],["Chiến hãn","Sai."],["Tự hãn","Sai."]],a:1,p:"ZD 绝汗"},
{q:"Theo 中医诊断学, chiến hãn có ý nghĩa:",o:[["Luôn là dấu hiệu tử vong","Sai."],["Bước ngoặt của bệnh: ra mồ hôi hết sốt, mạch êm là bệnh lui; vẫn sốt, vật vã là nặng thêm","Đúng."],["Bình thường","Sai."],["Khí hư","Sai."]],a:1,p:"ZD 战汗"},
{q:"Theo 中医诊断学, người chỉ ra mồ hôi một bên người: bên bệnh thường là:",o:[["Bên ra mồ hôi","Sai."],["Bên không ra mồ hôi","Đúng: gặp trong trúng phong, nuy, liệt."],["Không xác định được","Sai."],["Luôn là bên trái","Sai."]],a:1,p:"ZD 半身汗"}
],
case:{v:`A: nữ 52 tuổi, mấy tháng nay đêm ngủ ra mồ hôi ướt áo, tỉnh dậy thì hết; hay bốc hỏa, lòng bàn tay chân nóng, miệng khô, đau lưng mỏi gối. B: nam 45 tuổi, ban ngày ngồi yên cũng rịn mồ hôi, đi vài bước là đẫm; hay cảm vặt, sợ gió, nói hụt hơi.`,
qs:["Gọi tên kiểu ra mồ hôi của mỗi người và hội chứng gợi ý.","Giải thích vì sao A ra mồ hôi khi ngủ mà tỉnh thì hết.","Một bệnh nhân khác đang sốt cao nhiều ngày, bỗng run lạnh rồi ra nhiều mồ hôi. Chị theo dõi gì để biết bệnh tốt lên hay xấu đi?"],
ans:`<p><b>1.</b> A: <b>đạo hãn</b>, kèm bốc hỏa, ngũ tâm phiền nhiệt, đau lưng mỏi gối → <b>Thận âm hư</b>. B: <b>tự hãn</b>, nặng khi gắng sức, hay cảm, sợ gió, hụt hơi → <b>khí hư</b> (vệ khí không đủ). <span class="pg">CĐ tr.123</span></p>
<p><b>2.</b> Khi ngủ, vệ khí đi vào trong, lỗ chân lông dễ mở; âm hư sinh nội nhiệt, gặp vệ khí (thuộc dương) vào trong thì đẩy mồ hôi ra. Thức dậy vệ khí ra ngoài, lỗ chân lông đóng lại nên hết. <span class="pg">CĐ tr.121</span></p>
<p><b>3.</b> Đó là <b>chiến hãn</b>, bước ngoặt. Ra mồ hôi rồi <b>hết sốt, người mát, mạch êm</b>: tà lui, bệnh khỏi dần. Ra mồ hôi mà <b>vẫn sốt, vật vã, mạch gấp</b>: tà thịnh chính suy, nặng thêm. Nếu mồ hôi ra không ngừng, lạnh như nước hoặc dính như dầu là tuyệt hãn, phải cấp cứu. <span class="pg">ZD 战汗, 绝汗</span></p>`},
cards:[["Ba điều kiện để ra mồ hôi?","Tân dịch đủ, dương khí đủ, lỗ chân lông mở."],["Vô hãn cấp kèm sợ lạnh, sốt nhẹ?","Hàn tà phạm biểu."],["Đa hãn nóng, mặt đỏ, sốt cao, khát?","Thực nhiệt."],["Tự hãn là gì? Gợi ý?","Thức, không làm gì cũng ra, gắng sức nặng thêm. Khí hư (hay cảm, sợ lạnh, hụt hơi); dương hư."],["Đạo hãn là gì? Gợi ý?","Ra khi ngủ, tỉnh thì hết. Âm hư (Thận âm hư)."],["Vì sao âm hư thì ra mồ hôi khi ngủ?","Ngủ thì vệ khí vào trong, gặp hư nhiệt do âm hư đẩy mồ hôi ra."],["Tuyệt hãn: vong dương / vong âm?","Vong dương: lạnh nhiều như nước, chi lạnh, mạch vi. Vong âm: nóng dính như dầu, phiền khát, mạch tế sác."],["Chiến hãn?","Run lạnh rồi ra mồ hôi: bước ngoặt. Hết sốt, mạch êm là lui; vẫn sốt, vật vã là nặng."],["Mồ hôi nửa người?","Bên không ra mồ hôi là bên bệnh (trúng phong, nuy, liệt)."]],
