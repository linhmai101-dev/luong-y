"2.14":{id:"2.14",tang:2,title:"Vấn đau: hỏi về đau",han:"问疼痛",src:SRC_CD+", tr.127–136; 中医诊断学 mục 问疼痛",
hook:"Một người đau bụng, ấn vào thì đỡ, chườm ấm thì dễ chịu. Một người đau bụng, chạm vào là kêu, đau căng tức. Chỉ một động tác ấn tay đã nói được gì?",
reading:`
<p><b>Hai cơ chế gây đau</b> <span class="pg">tr.128–129</span>; 中医诊断学 tóm lại là “<b>bất thông tắc thống</b>” và “<b>bất vinh tắc thống</b>”:</p>
<ul><li><b>Ứ trệ (thực)</b>: khí, huyết, tân dịch bị cản trở (do tạng phủ rối loạn, chấn thương, hàn tà…). Thường <b>đau dữ dội</b>.</li>
<li><b>Thiếu hụt (hư)</b>: khí, huyết, tân dịch, tinh không đủ nuôi dưỡng. Thường <b>âm ỉ, dai dẳng, nhẹ</b>.</li></ul>
<p><b>Hỏi những gì</b> <span class="pg">tr.127–128</span>: tính chất cơn đau; mức độ; yếu tố làm tăng, giảm (nóng, lạnh, nghỉ, vận động, thời tiết, <b>xoa ấn</b>); thời điểm, liên tục hay từng cơn, cấp hay mạn; vị trí; khởi phát (chấn thương, đột ngột, từ từ); triệu chứng kèm.</p>
<table><tr><th>Tính chất đau</th><th>Đặc điểm</th><th>Gợi ý</th></tr>
<tr><td><b>Căng tức (trướng thống)</b></td><td>Căng tức, giảm khi khí thông (ợ, trung tiện)</td><td><b>Khí trệ</b></td></tr>
<tr><td><b>Như dao đâm, kim châm (thích thống)</b></td><td>Cố định, dữ dội, diện nhỏ; thường nặng về đêm</td><td><b>Huyết ứ</b></td></tr>
<tr><td><b>Quặn, xoắn (giảo thống)</b></td><td>Dữ dội, như vặn xoắn</td><td>Tắc nghẽn ở phủ (thực tà hữu hình)</td></tr>
<tr><td><b>Chạy chỗ (thoán thống)</b></td><td>Không cố định</td><td><b>Phong</b> (đau khớp chi); khí trệ (ngực bụng)</td></tr>
<tr><td><b>Nóng rát (chước thống)</b></td><td>Cảm giác nóng, thích mát</td><td><b>Nhiệt</b></td></tr>
<tr><td><b>Lạnh (lãnh thống)</b></td><td>Cảm giác lạnh, giảm khi ấm</td><td><b>Hàn</b></td></tr>
<tr><td><b>Nặng mỏi (trọng thống)</b></td><td>Nặng nề</td><td><b>Thấp</b></td></tr>
<tr><td><b>Trống rỗng (không thống)</b></td><td>Trống, thích đè ấn, thích ấm</td><td><b>Hư</b> (âm dương khí huyết hư)</td></tr>
<tr><td><b>Âm ỉ (ẩn thống)</b></td><td>Nhẹ, chịu được, kéo dài</td><td><b>Hư</b></td></tr></table>
<p class="muted"><span class="pg">tr.129</span> Quy tắc nhanh (ZD): <b>thích xoa ấn (hỷ án) là hư, không cho ấn (cự án) là thực</b>; thích ấm là hàn, thích mát là nhiệt.</p>
<p><b>Theo vị trí</b></p>
<ul><li><b>Đầu</b> <span class="pg">tr.130</span>: sau gáy, chẩm: <b>Thái dương</b>; trán, quanh mắt: <b>Dương minh</b>; hai bên: <b>Thiếu dương</b>; đỉnh: <b>Quyết âm</b> (khớp bài 1.16). Đau dữ dội dai dẳng, cấp: thực, biểu; đau mạn, từng lúc, nhẹ: hư, lý.</li>
<li><b>Ngực</b> (Tâm, Phế) <span class="pg">tr.130–131</span>: như dao đâm, cố định, tăng về đêm: huyết ứ; căng tức kèm thở dài, cáu: khí trệ; đè nặng, ho nhiều đờm: đàm trệ; đờm vàng có mủ máu, hôi: Phế ung; đau tăng khi gắng sức, hồi hộp, thở ngắn: khí hư. <b>Đau ngực dữ dội, đột ngột lan cánh tay trái, vai: cần loại trừ cấp cứu tim mạch.</b></li>
<li><b>Hạ sườn</b> (Can, Đởm) <span class="pg">tr.131</span>: đau căng không cố định, tăng khi căng thẳng: Can khí uất; như dao đâm, cố định, cự án: huyết ứ; kèm sốt rét xen kẽ: kinh Thiếu dương; âm ỉ mạn: Can âm hư.</li>
<li><b>Thượng vị</b> (Vị) <span class="pg">tr.132</span>: thực: cấp, dữ dội, căng tức, đau tăng sau ăn, cự án (hàn: gặp lạnh nặng, chườm ấm đỡ; nhiệt: nóng rát; thực tích: đỡ sau đại tiện; khí trệ: lan sườn, liên quan căng thẳng; huyết ứ: dao đâm, có thể nôn, đi ngoài ra máu). Hư: mạn, âm ỉ, tăng khi đói, xoa ấn đỡ (Vị âm hư: nóng rát, đói mà không muốn ăn; Tỳ Vị khí hư: trống rỗng, thích ấm).</li>
<li><b>Thắt lưng</b> (phủ của Thận) <span class="pg">tr.133–134</span>: cấp, co rút, tăng khi lạnh: phong hàn kinh Thái dương; mạn, tăng khi lạnh ẩm: phong hàn thấp; chấn thương, đau dữ dội cố định, cự án: huyết ứ; mạn, âm ỉ, nghỉ thì đỡ, gắng sức, gặp lạnh thì nặng: <b>Thận khí hư</b>; kèm lòng bàn tay chân nóng: <b>Thận âm hư</b>.</li>
<li><b>Chi</b> <span class="pg">tr.135</span>: đau chạy chỗ: phong; dữ dội, lạnh thì nặng, ấm thì đỡ, không sưng đỏ: hàn; nặng mỏi, tê, biến dạng: đàm thấp; nóng rát, sưng đỏ: nhiệt; dữ dội cố định, nặng về đêm: huyết ứ; mạn, gắng sức thì nặng, yếu teo cơ: khí huyết hư.</li></ul>`,
checkTitle:"Hỏi về đau (dùng được cho mọi vị trí)",
checklist:["Đau ở đâu? Có lan không? Cố định hay chạy chỗ?","Đau kiểu gì: căng tức, đâm chích, quặn, nóng rát, lạnh, nặng mỏi, trống rỗng, âm ỉ?","Ấn vào: dễ chịu hơn (hỷ án) hay đau hơn (cự án)?","Chườm ấm hay chườm mát thì đỡ? Nặng lên khi trời lạnh, ẩm?","Nặng lúc nào: ban đêm, khi đói, sau ăn, khi gắng sức, khi căng thẳng?","Cấp hay mạn? Bắt đầu thế nào (chấn thương, đột ngột, từ từ)? Kèm triệu chứng gì?","Có dấu hiệu cần chuyển cấp cứu không (đau ngực lan tay trái, đau bụng dữ dội, sốt cao)?"],

<p><b>2.</b> A: <b>Tỳ Vị khí hư</b> (thiên hư hàn). B: <b>thực tích</b> (thức ăn tích trệ: ợ hôi chua, đỡ sau đại tiện). <span class="pg">CĐ tr.132</span></p>

// Tầng 2 – Vấn chẩn 2.15–2.18. Nguồn: CĐ tr.138–187; đối chiếu 中医诊断学 (ZD) mục 问头身胸腹不适, 问耳目, 问饮食口味, 问二便.
Object.assign(LESSONS,{
"2.15":{id:"2.15",tang:2,title:"Vấn đầu thân, hung phúc: những khó chịu ngoài đau",han:"问头身胸腹不适",src:SRC_CD+", tr.138–148; 中医诊断学 mục 问头身胸腹不适",
hook:"Người bệnh không kêu đau, chỉ nói “người cứ khó chịu”: lúc chóng mặt, lúc tức ngực, lúc tim đập thình thịch. Hỏi thế nào để biến câu than chung chung ấy thành dữ kiện biện chứng?",
reading:`
<p>Phần này hỏi các <b>khó chịu ngoài cảm giác đau</b> ở đầu, thân, ngực bụng (đau đã có bài 2.14). Với mỗi triệu chứng cần hỏi: hoàn cảnh khởi phát, mức độ, thời điểm (liên tục hay từng cơn, giờ nào), yếu tố làm tăng giảm (vận động, nghỉ, suy nghĩ…), tần suất, triệu chứng kèm. <span class="pg">tr.138</span></p>
<table><tr><th>Triệu chứng</th><th>Là gì</th><th>Gợi ý thường gặp (ZD, đối chiếu CĐ)</th></tr>
<tr><td><b>Đầu vựng</b> (choáng, xoay)</td><td>Thấy mình hoặc cảnh vật xoay, đứng không vững <span class="pg">tr.139</span></td><td>Choáng kèm căng đầu, miệng đắng, dễ cáu, mạch huyền sác: <b>can hỏa, can dương thượng cang</b>. Mặt trắng, mệt, lưỡi nhạt: <b>khí huyết hư</b>. Đầu nặng như bó, đờm nhiều, rêu nhớt: <b>đàm thấp</b>. Kèm ù tai, hay quên, lưng gối mỏi: <b>thận tinh hư</b>. Sau chấn thương, đau như châm: <b>huyết ứ</b></td></tr>
<tr><td><b>Hung muộn</b> (tức ngực)</td><td>Ngực đầy tức, bí bách <span class="pg">tr.139</span></td><td>Kèm hồi hộp, hụt hơi: tâm khí, tâm dương hư. Kèm ho suyễn nhiều đờm: đàm ẩm ở phế. Kèm sốt cao, cánh mũi phập phồng: nhiệt, đàm nhiệt ủng phế. Kèm thở yếu không ra hơi: phế (thận) khí hư. Can khí uất cũng gây tức ngực</td></tr>
<tr><td><b>Tâm quý</b> (hồi hộp)</td><td>Tim đập rõ, hồi hộp, bồn chồn <span class="pg">tr.139</span></td><td><b>Kinh quý</b>: do sợ hãi, lao lực, lúc có lúc không, nhẹ. <b>Chinh xung</b>: không do kinh sợ mà tim đập mạnh lan khắp ngực xuống tận rốn, nhẹ nhàng cũng phát, nặng hơn. Kinh quý lâu ngày có thể thành chinh xung</td></tr>
<tr><td><b>Hiếp trướng</b> (đầy tức sườn)</td><td>Một hoặc hai bên sườn đầy trướng <span class="pg">tr.140</span></td><td>Bệnh Can Đởm. Kèm thở dài, dễ cáu, mạch huyền: can khí uất kết. Kèm vàng da mắt, miệng đắng, rêu vàng nhớt: can đởm thấp nhiệt</td></tr>
<tr><td><b>Quản bĩ</b> (đầy tức thượng vị)</td><td>Vùng thượng vị đầy tức, không đau, sờ mềm, không có khối <span class="pg">tr.140</span></td><td>Đói mà không muốn ăn, nôn khan, lưỡi đỏ ít rêu: vị âm hư. Ăn ít, phân lỏng: tỳ vị khí hư. Ợ hôi chua: thực tích. Chán ăn, buồn nôn, rêu nhớt: thấp khốn tỳ</td></tr>
<tr><td><b>Phúc trướng</b> (đầy bụng)</td><td>Bụng đầy trướng như có vật chặn ngang <span class="pg">tr.140</span></td><td><b>Thích đè ấn là hư</b> (tỳ vị hư nhược); <b>ấn vào khó chịu là thực</b> (thực tích, thực nhiệt, đàm thấp, huyết ứ). Bụng căng như trống, da vàng, nổi tĩnh mạch trên bụng: <b>cổ trướng</b>. Ăn xong mới đầy: tỳ hư không vận</td></tr>
<tr><td><b>Thân trọng</b> (nặng mình)</td><td>Người nặng nề, ê ẩm, cử động kém linh hoạt <span class="pg">tr.140</span></td><td>Liên quan Phế (chủ khí), Tỳ (chủ cơ nhục). Kèm đầy bụng, rêu nhớt: thấp khốn tỳ dương. Kèm phù: thủy thấp tràn ra cơ phu. Kèm thích nằm, mệt: tỳ khí hư</td></tr>
<tr><td><b>Ma mộc</b> (tê bì)</td><td>Da thịt giảm hoặc mất cảm giác, còn gọi “bất nhân”; có khi như kiến bò <span class="pg">tr.140</span></td><td>Cơ chế chung: cơ phu, cân mạch không được nuôi dưỡng. Tê mặt kèm méo miệng: phong trúng lạc. Tê chân tay kèm đau khớp: hàn thấp (tý). <b>Tê nửa người mà vẫn cử động được: dấu báo trước trúng phong</b> (ZD)</td></tr></table>
<p><b>Các thể tâm quý theo giáo trình</b> <span class="pg">tr.144–147</span></p>
<ul><li><b>Tâm hư đởm khiếp</b>: dễ sợ hãi, đứng ngồi không yên, ngủ ít mơ nhiều, dễ tỉnh.</li>
<li><b>Tâm khí bất túc</b>: hụt hơi, tức ngực, mệt; hễ hoạt động là hồi hộp, nghỉ thì hết; tự hãn; lưỡi nhạt, mạch tế nhược.</li>
<li><b>Tâm tỳ lưỡng hư</b>: kèm xây xẩm, sắc mặt kém tươi, ăn chậm tiêu, phân lỏng; lưỡi nhạt, mạch tế nhược (liên hệ bài 1.14).</li>
<li><b>Tâm thận âm hư</b>: dễ sợ, phiền, mất ngủ, ngũ tâm phiền nhiệt, đạo hãn, ù tai, đau lưng; lưỡi đỏ ít rêu, mạch tế sác.</li>
<li><b>Tâm dương hư</b>: tức ngực, hụt hơi, mặt trắng xanh, người lạnh, chân tay lạnh; mạch hư nhược hoặc trầm tế.</li>
<li><b>Thủy ẩm lăng tâm</b> (ZD: dương hư thủy tràn): kèm phù chân hoặc mặt, thở gấp.</li>
<li><b>Tâm mạch ứ trở</b>: tức ngực, đau ngực hay tái phát, lưỡi tím.</li></ul>`,

case:{v:`Nữ 50 tuổi, thường hồi hộp, hễ đi nhanh hay làm việc nhà một lúc là tim đập mạnh, hụt hơi, ra mồ hôi, ngồi nghỉ thì đỡ. Kèm hay choáng, sắc mặt kém tươi, ăn chậm tiêu, đi ngoài phân lỏng. Lưỡi nhạt, mạch tế nhược.`,
qs:["Gọi tên các triệu chứng theo thuật ngữ của bài.","Thể tâm quý nào phù hợp? Vì sao không phải tâm thận âm hư?","Người này kể thêm: mấy hôm nay tê nửa người bên trái, nói hơi ngọng, dù vẫn đi lại được. Chị làm gì?"],
ans:`<p><b>1.</b> Tâm quý (hồi hộp), khí đoản (hụt hơi), tự hãn, đầu vựng (choáng), cùng triệu chứng tỳ hư (ăn chậm tiêu, phân lỏng). <span class="pg">CĐ tr.139</span></p>
<p><b>2.</b> <b>Tâm tỳ lưỡng hư</b> (có nền tâm khí bất túc): hồi hộp khi gắng sức, hụt hơi, tự hãn, kèm tỳ hư và khí huyết hư (choáng, mặt kém tươi, lưỡi nhạt, mạch tế nhược). Không phải tâm thận âm hư vì không có ngũ tâm phiền nhiệt, đạo hãn, lưỡi đỏ ít rêu, mạch tế sác. <span class="pg">CĐ tr.144–146</span></p>
<p><b>3.</b> Tê nửa người, nói ngọng là <b>dấu báo trước trúng phong</b>: chuyển khám cấp cứu ngay, không tự điều trị tại phòng khám. <span class="pg">ZD 麻木, 强硬舌</span></p>`},
cards:[["Đầu vựng: 5 thể thường gặp (ZD)?","Can hỏa, can dương; khí huyết hư; đàm thấp; thận tinh hư; huyết ứ (sau chấn thương)."],["Hung muộn thường do đâu?","Tâm, phế khí cơ không thông: tâm khí, tâm dương hư; đàm ẩm, đàm nhiệt ở phế; phế khí hư; can khí uất."],["Kinh quý / chinh xung?","Kinh quý: do sợ, lao lực, lúc có lúc không, nhẹ. Chinh xung: không do sợ, đập mạnh lan khắp ngực xuống rốn, nặng."],["Hiếp trướng thuộc bệnh gì?","Can Đởm: can khí uất kết; can đởm thấp nhiệt."],["Quản bĩ là gì?","Đầy tức thượng vị, không đau, sờ mềm, không có khối."],["Phúc trướng hư / thực?","Thích đè ấn: hư (tỳ vị hư). Ấn vào khó chịu: thực (tích, nhiệt, đàm thấp, huyết ứ)."],["Cổ trướng?","Bụng căng như trống, da vàng, nổi tĩnh mạch trên bụng."],["Tâm quý các thể chính?","Tâm hư đởm khiếp, tâm khí bất túc, tâm tỳ lưỡng hư, tâm thận âm hư, tâm dương hư, thủy ẩm lăng tâm, tâm mạch ứ trở."],["Tê nửa người vẫn cử động được?","Dấu báo trước trúng phong: chuyển cấp cứu."]],

"2.16":{id:"2.16",tang:2,title:"Vấn tai, mắt",han:"问耳目",src:SRC_CD+", tr.163–171; 中医诊断学 mục 问耳目",
hook:"Hai người cùng ù tai. Một người ù đột ngột, tiếng to như sóng, đang giận thì nặng thêm; một người ù từ từ, tiếng nhỏ như ve, lấy tay ấn vào tai thì bớt. Chỉ với hai chi tiết đó, ai hư ai thực?",
reading:`
<p><b>Ba cơ chế chung</b> gây bệnh tai, mắt <span class="pg">tr.166</span>: <b>tắc nghẽn</b> (ngoại tà, đàm thấp, khí trệ, huyết ứ, hỏa uất); <b>không được nuôi dưỡng</b> (khí, huyết, tinh của tạng phủ hư, nhất là thận tinh với tai, can huyết với mắt); <b>tổn thương trực tiếp</b>.</p>
<p><b>Ù tai: phân hư thực</b> <span class="pg">tr.167</span></p>
<table><tr><th></th><th>Thực</th><th>Hư</th></tr>
<tr><td>Khởi phát</td><td>Đột ngột</td><td>Từ từ, bệnh kéo dài</td></tr>
<tr><td>Tiếng ù</td><td>To (như sóng, như gió), liên tục</td><td>Nhỏ (như ve), ngắt quãng, nặng về đêm</td></tr>
<tr><td>Ấn chặt vào tai</td><td><b>Không giảm</b></td><td><b>Giảm</b></td></tr>
<tr><td>Thể thường gặp</td><td>Phong tà phạm kinh lạc; <b>can hỏa uất, can dương vượng</b> (nặng khi căng thẳng); đàm nhiệt; huyết ứ sau chấn thương</td><td><b>Thận âm hư, thận khí hư</b>; tâm thận bất giao; can huyết hư; khí huyết hư (nặng khi gắng sức)</td></tr></table>
<p><b>Điếc, nghe kém</b> <span class="pg">tr.168</span>: sau cảm, kèm nghẹt mũi, sợ lạnh: phong tà bế nhĩ khiếu. Đột ngột sau cơn giận, kèm mặt mắt đỏ, miệng đắng, dễ cáu: <b>can đởm hỏa thịnh</b>. Người già gầy, lưng gối mỏi, hay quên: <b>thận tinh bất túc</b>. Nặng khi suy nghĩ, lao lực, kèm mệt, ăn ít: khí huyết hư. (Liên hệ bài 1.12: thận khai khiếu ra tai.)</p>
<p><b>Đau, ngứa tai</b> <span class="pg">tr.167–168</span>: đột ngột ngứa sâu trong tai, kèm đau, ù: phong thấp nhiệt; ngứa kéo dài kèm ù, lưng gối mỏi: can thận âm hư. Đau tai sau cảm, sốt, đau họng: phong nhiệt.</p>
<p><b>Mắt</b> <span class="pg">tr.169</span> (mắt là khiếu của can; bài 1.09, 2.03)</p>
<table><tr><th>Triệu chứng</th><th>Gợi ý</th></tr>
<tr><td>Đau, sưng, đỏ mắt</td><td>Can hỏa vượng, thấp nhiệt. Đỏ nhiều ở khóe mắt, như có dị vật: hỏa độc kinh Tâm</td></tr>
<tr><td>Ngứa mắt</td><td>Ngứa nhiều mí mắt, mẩn đỏ, ghèn vàng: phong nhiệt. Ngứa nhẹ từng cơn, khô mắt: huyết hư sinh phong</td></tr>
<tr><td>Khô mắt</td><td>Can âm hư, thận âm hư</td></tr>
<tr><td>Chảy nước mắt</td><td>Không đỏ, gặp gió thì nặng: can huyết hư, phong tà. Nước mắt nóng, ngày nhiều đêm khô: âm hư hỏa vượng. Kèm đỏ sưng: can hỏa</td></tr>
<tr><td>Mờ mắt</td><td>Khô mắt, nhìn lâu thì nặng, mờ về đêm: <b>can huyết hư</b>. Người già: can thận âm hư</td></tr>
<tr><td>Hoa mắt (đốm, sợi lơ lửng)</td><td>Thận tinh bất túc, can huyết hư</td></tr>
<tr><td>Sợ ánh sáng</td><td>Can huyết hư, can âm hư sinh nội nhiệt</td></tr></table>`,

case:{v:`A: nam 45 tuổi, sau một trận cãi nhau tai trái ù đột ngột, tiếng ầm như sóng, nghe kém, đau đầu, mặt đỏ, miệng đắng, rất dễ cáu. B: nữ 68 tuổi, ù tai hai bên đã vài năm, tiếng rè rè như ve kêu, về đêm nghe rõ hơn, ấn tay vào tai thì bớt; hay quên, lưng gối mỏi, đêm ra mồ hôi.`,
qs:["Mỗi người hư hay thực? Dựa vào những chi tiết nào?","Hội chứng gợi ý cho từng người.","Vì sao ù tai lại liên quan đến thận và can?"],
ans:`<p><b>1.</b> A <b>thực</b>: đột ngột, tiếng to, liên quan cơn giận. B <b>hư</b>: từ từ, kéo dài, tiếng nhỏ, nặng về đêm, ấn vào thì bớt. <span class="pg">CĐ tr.167</span></p>
<p><b>2.</b> A: <b>can đởm hỏa thịnh</b> (can hỏa uất) bốc lên. B: <b>thận âm hư</b> (thận tinh hư; hay quên, lưng gối mỏi, đạo hãn). <span class="pg">CĐ tr.167–168</span></p>
<p><b>3.</b> Thận khai khiếu ra tai, thận tinh nuôi tai (bài 1.12); kinh can đởm đi quanh tai, can hỏa bốc lên làm tắc nghẽn khiếu (bài 1.15: can khí thịnh, can hỏa vượng cũng gây ù tai). <span class="pg">LL tr.49, 59</span></p>`},
cards:[["Ba cơ chế bệnh tai, mắt?","Tắc nghẽn; không được nuôi dưỡng; tổn thương trực tiếp."],["Ù tai thực / hư?","Thực: đột ngột, tiếng to, liên tục, ấn không giảm. Hư: từ từ, tiếng nhỏ như ve, ngắt quãng, ấn thì giảm."],["Ù tai nặng khi căng thẳng, tiếng to?","Can hỏa uất, can dương vượng."],["Nghe kém sau cơn giận?","Can đởm hỏa thịnh."],["Điếc ở người già, lưng gối mỏi?","Thận tinh bất túc, thận âm hư."],["Mờ mắt, khô, nhìn lâu nặng, mờ về đêm?","Can huyết hư."],["Ngứa mí mắt có ghèn vàng / ngứa nhẹ khô mắt?","Phong nhiệt / huyết hư sinh phong."],["Nước mắt nóng, ngày nhiều đêm khô?","Âm hư hỏa vượng."],["Khô mắt?","Can âm hư, thận âm hư."]],

"2.17":{id:"2.17",tang:2,title:"Vấn ẩm thực: ăn, uống, vị giác",han:"问饮食口味",src:SRC_CD+", tr.172–178; 中医诊断学 mục 问饮食口味",
hook:"Một người lúc nào cũng thấy đói nhưng ăn chẳng được bao nhiêu. Một người ăn rất nhiều mà vẫn gầy. Một người khát mà nuốt nước vào lại nôn ra. Mỗi kiểu đang kể về Tỳ Vị điều gì?",
reading:`
<p>Hỏi ăn nhiều hay ít biết <b>thịnh suy của Tỳ Vị</b>; hỏi khẩu vị biết <b>hư thực của tạng phủ</b>. <span class="pg">tr.177</span></p>
<p><b>Ăn</b> <span class="pg">tr.174–175</span>: tiêu hóa <b>quá nhanh</b> (do nhiệt: thực nhiệt hoặc hư nhiệt ở Trường Vị) gây hay đói; tiêu hóa <b>chậm</b> (Vị khí hư, ăn quá nhiều, thiếu tân dịch) gây chán ăn. Can khí uất làm Tỳ không thăng, Vị không giáng cũng gây chán ăn.</p>
<table><tr><th>Biểu hiện</th><th>Gợi ý</th></tr>
<tr><td>Chán ăn, không đói, liên quan cảm xúc</td><td>Can khí uất</td></tr>
<tr><td>Ăn ít, gầy, mặt vàng nhợt, đầy bụng, phân lỏng, mệt</td><td>Tỳ Vị khí hư</td></tr>
<tr><td>Chán ăn, đầy, buồn nôn, nặng mình, rêu nhớt</td><td>Thấp khốn tỳ</td></tr>
<tr><td><b>Ghét ăn (yếm thực)</b>, ợ hôi chua, rêu dày nhớt</td><td><b>Thực tích</b> (ăn uống quá độ)</td></tr>
<tr><td>Sợ đồ dầu mỡ, đầy, buồn nôn; kèm vàng da mắt, đau sườn, miệng đắng</td><td>Tỳ vị thấp nhiệt; can đởm thấp nhiệt</td></tr>
<tr><td><b>Tiêu cốc thiện cơ</b> (ăn nhiều mau đói)</td><td><b>Vị nhiệt</b>. Kèm uống nhiều, tiểu nhiều, gầy: tiêu khát. Ăn nhiều mau đói mà phân lỏng: <b>vị cường tỳ nhược</b> (ZD)</td></tr>
<tr><td><b>Cơ bất dục thực</b> (đói mà không muốn ăn)</td><td><b>Vị âm hư</b>: hư hỏa làm thấy đói, vị hư nên ăn không vào; kèm cồn cào, nôn khan</td></tr>
<tr><td>Phụ nữ mới có thai chán ăn, buồn nôn</td><td>Phản ứng thai nghén; nặng thì là “nhâm thần ác trở” (ZD)</td></tr></table>
<p><b>Khát và uống</b> <span class="pg">tr.174, 176</span>: khát là dấu hiệu tân dịch thiếu, hoặc tân dịch không được đưa lên.</p>
<table><tr><th>Biểu hiện</th><th>Gợi ý</th></tr>
<tr><td>Không khát</td><td>Hàn, hoặc bình thường (tân dịch không thiếu)</td></tr>
<tr><td>Khát nhiều, uống nhiều</td><td><b>Nhiệt</b>, hoặc mất dịch (ra mồ hôi nhiều, nôn, tiêu chảy, mất máu)</td></tr>
<tr><td>Khát muốn uống, <b>uống vào lại nôn</b></td><td>Thấp trệ (hoặc thấp nhiệt) Tỳ Vị: thấp làm tân dịch không lên, Vị khí nghịch</td></tr>
<tr><td><b>Khát không muốn uống</b> (chỉ súc miệng)</td><td><b>Huyết ứ</b>: ứ làm tân dịch không vận hành, dịch không thật sự thiếu</td></tr>
<tr><td>Khát, uống vào bàng quang căng trướng, không muốn uống thêm</td><td>Hạ tiêu hư hàn (thận dương hư không khí hóa)</td></tr></table>
<p><b>Vị trong miệng</b> <span class="pg">tr.175, 177</span> (đối chiếu ZD)</p>
<ul><li><b>Nhạt</b>: tỳ vị hư nhược, hàn thấp; mất vị giác: tỳ vị khí hư.</li>
<li><b>Đắng</b>: thực nhiệt, nhất là <b>can đởm hỏa</b> (mật vị đắng trào lên), tâm hỏa (kèm phiền, mất ngủ).</li>
<li><b>Ngọt</b>: tỳ vị thấp nhiệt (ngọt dính, rêu vàng nhớt); hoặc tỳ hư (ngọt kèm ăn ít, mệt).</li>
<li><b>Chua</b>: can vị uất nhiệt (ợ chua, đau thượng vị); thực tích (chua thiu, hơi thở hôi).</li>
<li><b>Dính nhớt</b>: thấp trệ Tỳ Vị.</li></ul>`,
checkTitle:"Hỏi ăn uống",
checklist:["Thèm ăn hay chán ăn? Có đói không? Đói mà ăn được không?","Ăn bao nhiêu so với trước? Ăn xong có đầy, ợ hôi, buồn nôn?","Có sợ đồ dầu mỡ, đồ lạnh? Thích nóng hay thích mát?","Khát không? Uống nhiều hay ít? Thích uống nóng hay lạnh? Uống vào có nôn?","Khát mà chỉ muốn súc miệng, không muốn nuốt?","Miệng nhạt, đắng, ngọt, chua, hay dính nhớt?"],
quiz:[
{q:"Theo giáo trình, hỏi ăn nhiều hay ít giúp biết:",o:[["Thịnh suy của Tỳ Vị","Đúng."],["Thịnh suy của Tâm","Sai."],["Biểu hay lý","Sai."],["Tình trạng huyết ứ","Sai."]],a:0,p:"177"},
{q:"Ăn nhiều mà vẫn mau đói (tiêu cốc thiện cơ) chủ yếu do:",o:[["Tỳ Vị khí hư","Sai."],["Vị nhiệt","Đúng: nhiệt làm tiêu hóa quá nhanh."],["Can khí uất","Sai."],["Thấp trở","Sai."]],a:1,p:"175"},
{q:"Đói mà không muốn ăn, ăn ít, kèm cồn cào, nôn khan:",o:[["Vị âm hư","Đúng: hư nhiệt làm thấy đói, vị hư nên ăn không vào."],["Thực tích","Sai."],["Tỳ dương hư","Sai."],["Vị nhiệt thực","Sai."]],a:0,p:"175"},
{q:"Chán ăn, không thấy đói, liên quan đến tình chí:",o:[["Can khí uất","Đúng."],["Vị nhiệt","Sai."],["Thận dương hư","Sai."],["Huyết ứ","Sai."]],a:0,p:"175"},
{q:"Khát muốn uống, nhưng uống xong lại nôn ra:",o:[["Nhiệt thịnh","Sai."],["Thấp trệ Tỳ Vị","Đúng: thấp làm tân dịch không lên được, Vị khí nghịch."],["Âm hư","Sai."],["Huyết ứ","Sai."]],a:1,p:"176"},
{q:"Khát nhưng không muốn uống, dịch trong cơ thể không thiếu, gợi ý:",o:[["Huyết ứ","Đúng."],["Nhiệt chứng","Sai: nhiệt thì khát và uống nhiều."],["Hàn","Sai: hàn thì không khát."],["Tỳ khí hư","Sai."]],a:0,p:"176"},
{q:"Miệng chua, ợ chua, đầy bụng, hôi miệng:",o:[["Thực tích Vị quản","Đúng."],["Tỳ Vị khí hư","Sai."],["Can Đởm nhiệt","Sai: can đởm nhiệt thì miệng đắng."],["Thấp trệ Tỳ Vị","Sai."]],a:0,p:"177"},
{q:"Cảm giác ngọt, dính trong miệng, nặng đầu, nặng mình:",o:[["Thấp nhiệt Tỳ Vị","Đúng."],["Can khí hóa nhiệt","Sai."],["Thận âm hư","Sai."],["Phong hàn","Sai."]],a:0,p:"177"},
{q:"Theo 中医诊断学, ăn nhiều mau đói mà đại tiện lỏng là:",o:[["Vị cường tỳ nhược","Đúng: vị làm chín nhừ quá mạnh, tỳ vận hóa lại yếu."],["Tỳ vị đều hư","Sai."],["Thực tích","Sai."],["Can khí uất","Sai."]],a:0,p:"ZD 消谷善饥"}
],
case:{v:`A: nữ 55 tuổi, bệnh dạ dày lâu năm. Hay cồn cào như đói nhưng ăn được rất ít, nôn khan, miệng họng khô, lưỡi đỏ ít rêu. B: nam 50 tuổi, ăn rất nhiều mà người gầy đi, uống nhiều, đi tiểu nhiều. C: nam 60 tuổi, đau tức sườn có khối cố định, môi tím, hay khát nhưng chỉ ngậm nước súc miệng chứ không muốn nuốt.`,
qs:["A: kiểu rối loạn ăn uống gì, gợi ý hội chứng gì?","B: nghĩ đến gì? Cần làm gì thêm?","C: kiểu khát này gợi ý gì? Có khớp với các dấu hiệu khác không?"],
ans:`<p><b>1.</b> A: <b>đói mà không muốn ăn</b> (cơ bất dục thực), nôn khan, khô họng, lưỡi đỏ ít rêu → <b>Vị âm hư</b>. <span class="pg">CĐ tr.175; ZD 饥不欲食</span></p>
<p><b>2.</b> B: <b>tiêu cốc thiện cơ</b> kèm uống nhiều, tiểu nhiều, gầy → hướng <b>tiêu khát</b> (vị nhiệt). Cần xét nghiệm đường huyết, phối hợp Tây y. <span class="pg">CĐ tr.175; ZD 消谷善饥</span></p>
<p><b>3.</b> C: <b>khát không muốn uống</b> → <b>huyết ứ</b>; khớp với khối cố định ở sườn, môi tím (bài 1.20, 2.14). <span class="pg">CĐ tr.176</span></p>`},
cards:[["Hỏi ăn uống biết gì?","Ăn nhiều ít: thịnh suy Tỳ Vị. Khẩu vị: hư thực tạng phủ."],["Tiêu cốc thiện cơ?","Ăn nhiều mau đói: Vị nhiệt. Kèm uống nhiều tiểu nhiều gầy: tiêu khát."],["Cơ bất dục thực?","Đói mà không muốn ăn: Vị âm hư."],["Vị cường tỳ nhược?","Ăn nhiều mau đói mà phân lỏng."],["Chán ăn do cảm xúc / kèm rêu nhớt / ghét ăn ợ hôi?","Can khí uất / thấp khốn tỳ / thực tích."],["Khát mà uống vào nôn?","Thấp trệ (thấp nhiệt) Tỳ Vị."],["Khát không muốn uống?","Huyết ứ."],["Khát, uống vào bàng quang căng trướng?","Hạ tiêu hư hàn (thận dương hư)."],["Miệng đắng / ngọt dính / chua / nhạt?","Can đởm hỏa / tỳ vị thấp nhiệt / can vị uất nhiệt, thực tích / tỳ vị hư, hàn thấp."]],

"2.18":{id:"2.18",tang:2,title:"Vấn đại tiện, tiểu tiện",han:"问二便",src:SRC_CD+", tr.179–187; 中医诊断学 mục 问二便",
hook:"Một người đi ngoài lỏng mỗi sáng sớm, cứ sôi bụng là phải chạy vào nhà vệ sinh, đi xong thì đỡ đau. Một người táo bón, phân nhỏ như phân dê, nặng hơn khi căng thẳng. Hai kiểu này chỉ về hai tạng khác nhau thế nào?",
reading:`
<p><b>Bình thường</b> <span class="pg">tr.181</span>: đại tiện mỗi ngày khoảng 1 lần, dễ đi, phân vàng, mềm, thành khuôn, không có mủ, máu, nhầy, thức ăn sống. Tiểu 4–6 lần ngày, đêm không đi hoặc chỉ 1 lần, khoảng 1.500–2.000 ml, trong, vàng nhạt; thay đổi theo lượng nước uống, nhiệt độ, mồ hôi, tuổi.</p>
<p><b>Cơ chế</b> <span class="pg">tr.182</span>: đại tiện bất thường liên quan chức năng truyền tống của Đại trường (đàm ẩm tích tụ, hoặc tân dịch bị thiêu đốt). Tiểu tiện bất thường liên quan khí hóa của Tỳ, Thận, Bàng quang, Phế, Can.</p>
<table><tr><th>Táo bón</th><th>Biểu hiện</th><th>Gợi ý</th></tr>
<tr><td rowspan="2">Thực</td><td>Táo nặng, phân khô, đau bụng cự án, miệng khô, lưỡi đỏ</td><td>Vị trường thực nhiệt <span class="pg">tr.183</span></td></tr>

<p><b>Đặc điểm phân khác</b> (ZD): <b>hoàn cốc bất hóa</b> (phân còn nhiều thức ăn chưa tiêu): tỳ thận dương hư, hoặc thực tích. <b>Lúc táo lúc lỏng</b>: can uất tỳ hư; trước khô sau lỏng: tỳ hư. <b>Lý cấp hậu trọng</b> (đau quặn mót rặn, hậu môn nặng trĩu, đi không hết): thấp nhiệt (lỵ). Đại tiện không tự chủ: tỳ thận hư, nặng. Hậu môn sa nặng: tỳ hư khí hãm. Phân bạc màu như đất sét: hoàng đản. Đi ngoài ra máu: tổn thương lạc mạch trường vị.</p>

// Tầng 2 – Vấn chẩn 2.19–2.21. Nguồn: CĐ tr.188–211; đối chiếu 中医诊断学 (ZD) mục 问睡眠, 问经带, 痛经.

"2.19":{id:"2.19",tang:2,title:"Vấn giấc ngủ",han:"问睡眠",src:SRC_CD+", tr.188–193; 中医诊断学 mục 问睡眠",
hook:"“Tôi mất ngủ.” Câu này có thể là khó vào giấc, dễ thức giấc, dậy quá sớm, hay ngủ mà mơ liên miên. Mỗi kiểu chỉ về một hướng khác nhau. Chị sẽ hỏi tiếp những gì?",
reading:`
<p><b>Cơ sở</b> <span class="pg">tr.188–189</span>: ngày là dương, động; đêm là âm, tĩnh. Ngủ được khi <b>dương vào âm</b>, thần được yên. <b>Tâm</b> tàng thần; <b>Can</b> tàng huyết, huyết là nơi trú của hồn: can huyết đủ thì neo được can dương, ngủ yên; can huyết hư thì dương khí không có nơi về, khó ngủ, dễ thức, mơ nhiều. <b>Thận</b> tinh sinh tủy nuôi não. 中医诊断学 tóm lại: mất ngủ do <b>âm hư dương thịnh, dương không vào âm, thần không giữ được chỗ</b>; ngủ nhiều do <b>dương hư âm thịnh</b>.</p>
<p><b>Hỏi gì</b> <span class="pg">tr.189</span>: giờ đi ngủ, giờ thức, tổng số giờ; dễ hay khó vào giấc, ngủ sâu hay dễ thức, có mơ, nói mớ; dậy thấy khỏe hay mệt; triệu chứng kèm (bứt rứt, hồi hộp, khát…); khởi phát khi nào, yếu tố ảnh hưởng. Bình thường: 7–9 giờ, vào giấc dưới 30 phút, ngủ sâu, dậy thấy sảng khoái.</p>
<p><b>Ba cơ chế mất ngủ</b> <span class="pg">tr.190</span>: (1) <b>nhiệt</b> làm thần không yên (ngoại nhiệt; nội nhiệt thực như khí uất, đàm, huyết ứ, thực tích hóa nhiệt; hoặc hư nhiệt do âm hư); (2) âm huyết của Tâm, Can không đủ nuôi thần; (3) vật chiếm chỗ (đàm thấp, huyết ứ) cản trở.</p>
<table><tr><th></th><th>Thể</th><th>Đặc điểm</th></tr>
<tr><td rowspan="4"><b>Thực</b><br><span class="muted">khởi phát cấp, thời gian ngắn, khó vào giấc, ác mộng</span></td><td>Can khí uất</td><td>Mơ nhiều, ngủ không yên, nặng khi stress; tức sườn, mạch huyền</td></tr>
<tr><td>Đàm nhiệt nhiễu Tâm</td><td>Trằn trọc, mơ nhiều, dễ thức; ngực đầy, nhiều đờm, buồn nôn, mạch hoạt sác</td></tr>
<tr><td>Thực tích</td><td>Khó ngủ, khó chịu vùng bụng, nặng khi ăn nhiều, ăn muộn; ợ chua, rêu nhớt (“vị bất hòa tắc ngọa bất an”)</td></tr>
<tr><td>Huyết ứ hóa nhiệt</td><td>Không ngủ được, kích động, lo lắng; nóng về đêm, lưỡi tím sẫm</td></tr>
<tr><td rowspan="4"><b>Hư</b><br><span class="muted">khởi phát từ từ, kéo dài, dễ thức, dậy sớm</span></td><td><b>Tâm thận âm hư</b></td><td>Khó vào giấc hoặc khó duy trì, thức nhiều lần; hay quên, ù tai, mỏi lưng, <b>đạo hãn, ngũ tâm phiền nhiệt</b></td></tr>
<tr><td><b>Tâm tỳ hư</b></td><td><b>Dễ ngủ nhưng không sâu, dễ thức</b>; hay quên, hồi hộp, ăn kém, mệt; lưỡi nhợt bệu, mạch vô lực</td></tr>
<tr><td>Tâm can huyết hư</td><td>Khó ngủ, mơ nhiều, trằn trọc; lo âu, hồi hộp, hoa mắt, khô họng</td></tr>
<tr><td><b>Tâm đởm khí hư</b></td><td>Sợ ngủ một mình, <b>dễ giật mình thức giấc</b>, hoảng hốt; lưỡi nhợt, mạch vô lực</td></tr></table>
<p><b>Ngủ nhiều (hay buồn ngủ)</b> <span class="pg">tr.192</span>: đối lập với mất ngủ, do dương khí của Tâm, Não hư.</p>
<ul><li><b>Tâm tỳ dương hư</b>: thích nằm, phân nhão, người lạnh. ZD: buồn ngủ sau ăn, mệt, ít nói: tỳ khí hư, thanh dương không lên.</li>
<li><b>Tâm thận dương hư</b>: lừ đừ, đau lưng, ù tai, mạch trầm nhược.</li>
<li><b>Đàm thấp</b>: buồn ngủ sau ăn và buổi sáng, nặng nề, choáng, rêu nhầy, mạch hoạt.</li>
<li>ZD lưu ý: buồn ngủ kèm <b>lơ mơ, gọi dậy trả lời không đúng</b> là tà bế tâm thần (nhiệt, đàm nhiệt, thấp trọc), thường là giai đoạn trước hôn mê: <b>nguy hiểm, cần cấp cứu</b>. Sau bệnh nặng mệt hay ngủ là chính khí chưa hồi.</li></ul>`,

case:{v:`A: nữ 48 tuổi, mất ngủ 2 năm; đi ngủ thì nằm mãi không ngủ được, ngủ rồi hay thức giấc, đêm ra mồ hôi, lòng bàn tay chân nóng, ù tai, mỏi lưng. B: nam 30 tuổi, mất ngủ 1 tuần kể từ khi công việc căng thẳng; mơ nhiều, ngủ không yên, tức sườn, hay thở dài. C: nữ 35 tuổi, nằm xuống là ngủ ngay nhưng ngủ chập chờn, 3 giờ sáng đã thức, ban ngày hay quên, hồi hộp, ăn kém.`,
qs:["Phân hư thực cho từng người; dấu hiệu then chốt.","Gọi tên hội chứng gợi ý.","Bố của A, 75 tuổi, mấy hôm nay sốt, ngủ li bì, gọi dậy thì lơ mơ, trả lời không đúng. Chị làm gì?"],
ans:`<p><b>1.</b> A <b>hư</b> (kéo dài, mồ hôi trộm, ngũ tâm phiền nhiệt). B <b>thực</b> (cấp, sau stress, mơ nhiều). C <b>hư</b> (dễ vào giấc nhưng không sâu, dậy sớm, kéo dài). <span class="pg">CĐ tr.191</span></p>
<p><b>2.</b> A: <b>Tâm thận âm hư</b>. B: <b>Can khí uất</b>. C: <b>Tâm tỳ hư</b>. <span class="pg">CĐ tr.191</span></p>
<p><b>3.</b> Ngủ li bì kèm lơ mơ, trả lời không đúng khi gọi dậy là <b>tà bế tâm thần</b>, giai đoạn trước hôn mê: <b>chuyển cấp cứu ngay</b>. <span class="pg">ZD 嗜睡</span></p>`},
cards:[["Cơ chế mất ngủ / ngủ nhiều (ZD)?","Mất ngủ: âm hư dương thịnh, dương không vào âm. Ngủ nhiều: dương hư âm thịnh."],["Vai trò của Can trong giấc ngủ?","Can tàng huyết, huyết là nơi trú của hồn; can huyết đủ thì neo được dương, ngủ yên."],["Mất ngủ thực / hư: đặc điểm chung?","Thực: cấp, ngắn, khó vào giấc, ác mộng. Hư: từ từ, kéo dài, dễ thức, dậy sớm."],["4 thể thực?","Can khí uất; đàm nhiệt nhiễu tâm; thực tích; huyết ứ hóa nhiệt."],["Tâm thận âm hư?","Khó ngủ, thức nhiều; hay quên, ù tai, mỏi lưng, đạo hãn, ngũ tâm phiền nhiệt."],["Tâm tỳ hư?","Dễ ngủ nhưng không sâu, dễ thức; hay quên, hồi hộp, ăn kém."],["Tâm đởm khí hư?","Sợ ngủ một mình, dễ giật mình, hoảng hốt."],["Ngủ nhiều: 3 thể?","Tâm tỳ dương hư; tâm thận dương hư; đàm thấp (buồn ngủ sau ăn, buổi sáng)."],["Buồn ngủ + lơ mơ, trả lời sai?","Tà bế tâm thần, trước hôn mê: cấp cứu."]],

"2.20":{id:"2.20",tang:2,title:"Vấn kinh nguyệt, đới hạ",han:"问经带",src:SRC_CD+", tr.194–205; 中医诊断学 mục 问经带",
hook:"Hai phụ nữ cùng thấy kinh sớm hơn mỗi tháng gần một tuần. Một người kinh nhiều, đỏ tía có cục, mặt đỏ, dễ cáu; một người kinh ít, đỏ, gò má đỏ, nóng trong. Cùng “kinh trước kỳ”, gốc bệnh có giống nhau?",
reading:`
<p><b>Cơ sở</b> <span class="pg">tr.194</span>: Tố Vấn: “14 tuổi có thiên quý, mạch nhâm thông, mạch xung thịnh, kinh nguyệt đến đúng kỳ, có thể sinh con” (bài 1.12). Kinh nguyệt chủ yếu do <b>mạch Xung, Nhâm</b>, liên quan mạch Đốc, Đới và ngũ tạng: Tâm chủ huyết, Can tàng huyết, Tỳ thống huyết, Thận tàng tinh.</p>
<p><b>Hỏi gì</b> <span class="pg">tr.195</span>: tuổi thấy kinh; chu kỳ; số ngày; <b>lượng, màu, chất</b> (loãng, đặc, cục), mùi; kèm đau bụng, đau lưng. Đới hạ: màu, lượng, chất, mùi, liên tục hay từng lúc, kèm ngứa, rát.</p>
<p><b>Bình thường</b> <span class="pg">tr.195</span>: chu kỳ 25–32 ngày (trung bình 28); hành kinh 3–5 ngày, khoảng 50 ml; máu <b>đỏ sẫm, không loãng không đặc, không cục</b>. Một số trường hợp đặc biệt vẫn có thai được: tịnh nguyệt (2 tháng 1 lần), cự kinh (3 tháng 1 lần), tỵ niên (1 năm 1 lần), ám kinh (không có kinh). Đới hạ sinh lý: ít, trắng, không mùi.</p>
<p><b>Quy tắc đọc kinh nguyệt</b> (khớp CĐ và 中医诊断学): <b>kinh sớm phần nhiều do nhiệt</b> (hoặc khí hư không nhiếp); <b>kinh muộn phần nhiều do hư hàn</b> (hoặc huyết hư, huyết ứ, đàm trệ); <b>không định kỳ do can uất, tỳ hư, can thận hư</b>. Màu đỏ tươi, đỏ tía, nhiều: nhiệt. Nhạt, loãng: hư (huyết hư, khí hư, hư hàn). Tím đen có cục: ứ (hàn ngưng hoặc huyết ứ).</p>
<table><tr><th>Rối loạn</th><th>Thể chính</th><th>Dấu hiệu phân biệt</th></tr>
<tr><td><b>Kinh trước kỳ</b> <span class="pg">tr.197</span></td><td>Huyết nhiệt</td><td>Nhiều, đỏ tía, có cục, mặt đỏ, dễ cáu, rêu vàng, mạch hồng hoạt sác</td></tr>
<tr><td></td><td>Hư nhiệt</td><td>Ít, đỏ, không cục, gò má đỏ, phiền nhiệt, lưỡi đỏ, mạch tế sác</td></tr>
<tr><td></td><td>Khí hư</td><td>Nhiều, mặt trắng nhợt, mệt, thở ngắn, lưỡi nhạt, mạch hư nhược</td></tr>
<tr><td><b>Kinh sau kỳ</b> <span class="pg">tr.197–198</span></td><td>Hư hàn</td><td>Ít, nhạt hoặc xám loãng, sợ lạnh, bụng đau âm ỉ, chườm nóng dễ chịu, mạch trầm trì</td></tr>
<tr><td></td><td>Huyết ứ</td><td>Ít, tím đen, có cục, bụng dưới trướng cự án</td></tr>
<tr><td></td><td>Huyết hư</td><td>Loãng, mặt trắng, hồi hộp, móng nhạt, choáng, lưỡi nhợt</td></tr>
<tr><td></td><td>Đàm thấp / khí uất</td><td>Nhợt dính, ngực bụng trướng, buồn nôn, rêu nhớt / bụng dưới trướng, tức ngực sườn</td></tr>
<tr><td><b>Không định kỳ</b> <span class="pg">tr.198</span></td><td>Can khí uất kết</td><td>Ít, căng vú, đau trước kỳ lan sườn, uất ức, mạch huyền</td></tr>
<tr><td></td><td>Tỳ hư / Can thận hư</td><td>Nhạt, mệt, phù, tiêu lỏng / loãng, ù tai, mỏi lưng, tiểu nhiều</td></tr></table>
<p><b>Rong kinh, rong huyết, kinh nhiều, kinh ít, bế kinh</b> <span class="pg">tr.198–202</span>: nhóm nguyên nhân lặp lại theo cùng logic: <b>nhiệt</b> (huyết đi sai đường, đỏ tươi nhiều), <b>khí hư, tỳ hư</b> (không nhiếp huyết, nhạt, mệt), <b>huyết ứ</b> (tím đen có cục, đau cự án, hay gặp sau nạo hút, đặt vòng), <b>huyết hư</b> (ít, nhạt), <b>can thận âm hư</b>, <b>đàm trở</b> (người béo, ít kinh, bạch đới), <b>can khí uất</b>, <b>hàn</b>.</p>
<p><b>Thống kinh</b> (ZD dẫn Cảnh Nhạc toàn thư): <b>đau trước hoặc đang hành kinh, cự án là thực</b> (khí trệ huyết ứ: trướng hoặc đau như châm; thấp nhiệt: nóng rát, khí hư vàng hôi; hàn: lạnh đau, chườm ấm đỡ, có cục). <b>Đau sau kỳ, âm ỉ, trống, xoa ấn đỡ là hư</b> (khí huyết hư, thận tinh bất túc, hư hàn). CĐ: huyết hư, khí trệ huyết ứ, thực hàn, hư hàn, huyết nhiệt. <span class="pg">tr.201</span></p>
<p><b>Đới hạ</b> <span class="pg">tr.196, 203</span>: trắng loãng như nước, không hôi: <b>tỳ dương hư</b>. Nhiều, kèm lạnh bụng dưới, đau lưng, tiểu nhiều: thận dương hư. Vàng như mủ, hôi, ngứa: <b>thấp nhiệt bào cung</b> (hạ tiêu). Ít, âm đạo khô, rát, đạo hãn: can thận âm hư. Nhầy dính, kinh không đều, uất ức: can khí uất.</p>`,
checkTitle:"Hỏi kinh nguyệt, đới hạ",
checklist:["Tuổi thấy kinh? Còn kinh hay đã mãn kinh, từ khi nào?","Chu kỳ bao nhiêu ngày, đều không? Sớm hay muộn so với thường?","Hành kinh mấy ngày? Lượng nhiều hay ít? Màu, chất (loãng, đặc, cục)?","Đau bụng: trước, trong hay sau kỳ? Ấn vào dễ chịu hay đau hơn? Chườm ấm có đỡ?","Kèm: căng vú, cáu gắt, đau lưng, mệt, sợ lạnh, nóng trong?","Đới hạ: màu, lượng, chất, mùi; ngứa, rát? Có thai, nạo hút, đặt vòng không?"],

{q:"Kinh nguyệt chủ yếu do hai mạch nào?",o:[["Đốc, Đới","Sai: hai mạch này có liên quan nhưng không phải chủ yếu."],["Xung, Nhâm","Đúng."],["Âm duy, Dương duy","Sai."],["Âm kiểu, Dương kiểu","Sai."]],a:1,p:"194"},
{q:"Máu kinh bình thường theo giáo trình:",o:[["Đỏ tươi, loãng, có cục nhỏ","Sai."],["Đỏ sẫm, không loãng không đặc, không cục","Đúng."],["Tím đen","Sai."],["Nhạt như nước","Sai."]],a:1,p:"195"},

{q:"Kinh sau kỳ, ít, nhạt, sợ lạnh, bụng đau âm ỉ, chườm nóng dễ chịu, mạch trầm trì:",o:[["Hư hàn","Đúng."],["Huyết nhiệt","Sai."],["Can khí uất","Sai."],["Thấp nhiệt","Sai."]],a:0,p:"197"},
{q:"Kinh không định kỳ, ít, căng vú, đau trước kỳ lan mạn sườn, uất ức, mạch huyền:",o:[["Can khí uất kết","Đúng."],["Tỳ hư","Sai."],["Can thận hư","Sai."],["Huyết hư","Sai."]],a:0,p:"198"},
{q:"Rong huyết đột ngột hoặc dầm dề, tím đen có cục, bụng dưới đau cự án, ra cục thì bớt đau, hay gặp sau nạo thai, đặt vòng:",o:[["Khí hư","Sai."],["Huyết ứ","Đúng."],["Thấp nhiệt","Sai."],["Âm hư","Sai."]],a:1,p:"199"},
{q:"Đới hạ nhiều, trắng loãng như nước, không hôi, mệt, chân tay lạnh:",o:[["Thấp nhiệt bào cung","Sai: thấp nhiệt thì vàng như mủ, hôi."],["Tỳ dương hư","Đúng."],["Can thận âm hư","Sai."],["Can khí uất","Sai."]],a:1,p:"203"},
{q:"Theo 中医诊断学, đau bụng kinh xuất hiện sau kỳ, âm ỉ, xoa ấn dễ chịu thuộc:",o:[["Thực: khí trệ huyết ứ","Sai: thực thì đau trước hoặc trong kỳ, cự án."],["Hư: khí huyết hư hoặc thận tinh bất túc","Đúng."],["Thấp nhiệt","Sai."],["Huyết nhiệt","Sai."]],a:1,p:"ZD 痛经"}
],
case:{v:`A: nữ 28 tuổi, kinh đến sớm 5–7 ngày, lượng nhiều, đỏ tía, có cục, mặt đỏ, dễ cáu, thích mát, rêu vàng, mạch hoạt sác. B: nữ 32 tuổi, kinh đến sớm, lượng ít, đỏ, không cục, hai gò má đỏ, nóng trong, ngủ không yên, lưỡi đỏ, mạch tế sác. C: nữ 25 tuổi, mỗi kỳ đau bụng dưới dữ dội ngày đầu, ấn vào đau hơn, kinh tím có cục, ra cục thì đỡ.`,
qs:["A và B cùng kinh trước kỳ: thể nào cho mỗi người? Phân biệt bằng gì?","C: thống kinh hư hay thực? Thể gì?","Nếu C kể thêm khí hư vàng, hôi, ngứa, đau bụng dưới nóng rát, chị nghĩ thêm gì?"],
ans:`<p><b>1.</b> A: <b>huyết nhiệt</b> (thực nhiệt): lượng nhiều, đỏ tía có cục, mặt đỏ, rêu vàng, mạch hoạt sác. B: <b>hư nhiệt</b> (âm huyết kém): lượng ít, gò má đỏ, lưỡi đỏ, mạch tế sác. Phân biệt chủ yếu bằng <b>lượng kinh</b> và dấu hiệu thực hay hư. <span class="pg">CĐ tr.197</span></p>
<p><b>2.</b> C: <b>thực</b>: đau ngày đầu, cự án, kinh tím có cục, ra cục thì đỡ → <b>khí trệ huyết ứ</b>. <span class="pg">CĐ tr.201; ZD 痛经</span></p>
<p><b>3.</b> Đau nóng rát kèm khí hư vàng hôi, ngứa: <b>thấp nhiệt</b> (bào cung, hạ tiêu), có thể cùng huyết ứ. Cần khám phụ khoa Tây y để loại trừ viêm nhiễm. <span class="pg">CĐ tr.203; ZD 痛经</span></p>`},
cards:[["Kinh nguyệt chủ yếu do mạch nào? Liên quan tạng nào?","Xung, Nhâm (cùng Đốc, Đới). Tâm, Can, Tỳ, Thận."],["Kinh bình thường?","Chu kỳ 25–32 ngày, 3–5 ngày, khoảng 50 ml, đỏ sẫm, không loãng đặc, không cục."],["Kinh sớm / muộn / không định kỳ: xu hướng?","Sớm: nhiệt (khí hư). Muộn: hư hàn (huyết hư, huyết ứ, đàm, khí uất). Không định kỳ: can uất, tỳ hư, can thận hư."],["Kinh trước kỳ: 3 thể?","Huyết nhiệt (nhiều, đỏ tía, cục). Hư nhiệt (ít, đỏ, gò má đỏ). Khí hư (nhiều, mặt trắng, mệt)."],["Màu kinh nói gì?","Đỏ tươi, đỏ tía, nhiều: nhiệt. Nhạt, loãng: hư. Tím đen có cục: ứ."],["Thống kinh thực / hư (ZD)?","Thực: đau trước, trong kỳ, cự án. Hư: đau sau kỳ, âm ỉ, xoa ấn đỡ."],["Rong huyết sau nạo thai, đặt vòng, tím đen có cục, cự án?","Huyết ứ."],["Đới hạ trắng loãng như nước / vàng như mủ hôi ngứa?","Tỳ dương hư / thấp nhiệt bào cung."],["Đới hạ ít, âm đạo khô rát, đạo hãn?","Can thận âm hư."]],
terms:[["Nguyệt kinh tiên kỳ / hậu kỳ","月经先期 / 后期","yuè jīng xiān qī / hòu qī"],["Kinh hành tiên hậu vô định kỳ","经行先后无定期","jīng xíng xiān hòu wú dìng qī"],["Băng lậu (rong kinh, rong huyết)","崩漏","bēng lòu"],["Thống kinh","痛经","tòng jīng"],["Bế kinh","闭经","bì jīng"],["Đới hạ","带下","dài xià"],["Xung Nhâm","冲任","chōng rèn"]],
flags:["⚠️ Tr.201, thể thống kinh “khí trệ huyết ứ” giáo trình ghi “thích xoa bụng”. 中医诊断学 và nguyên tắc chung đều nói khí trệ huyết ứ thì cự án (không cho ấn); “thích xoa ấn” là dấu hiệu hư. Có thể là lỗi in; em không đưa chi tiết này vào câu hỏi.","🔍 Bài này làm rõ ghi chú ở bài 2.04: bảng kinh nguyệt ở chương Vọng chất tiết ghi “kinh nhạt là hư nhiệt”, còn chương Vấn kinh nguyệt (bài này) thống nhất với 中医诊断学: kinh nhạt, loãng là hư (huyết hư, khí hư, hư hàn). Khi học, theo chương này."]},

"2.21":{id:"2.21",tang:2,title:"Vấn trẻ em",han:"问小儿",src:SRC_CD+", tr.206–211",
hook:"Một bé 2 tuổi ho khò khè tái đi tái lại, cứ hết đợt này lại sang đợt khác. Bé không tự kể được. Chị hỏi bố mẹ những gì mà người lớn thì không cần hỏi?",
reading:`
<p>Vấn chẩn ở trẻ về cơ bản như người lớn nhưng <b>thường hỏi qua cha mẹ</b>, và cần hỏi thêm 6 nhóm: <b>trước và sau sinh, tiêu hóa, hô hấp, giấc ngủ, chủng ngừa, tâm lý</b>. <span class="pg">tr.206</span></p>
<table><tr><th>Nhóm</th><th>Hỏi gì</th><th>Ý nghĩa</th></tr>
<tr><td><b>Trước, sau sinh</b> <span class="pg">tr.206, 209</span></td><td>Sức khỏe cha mẹ lúc thụ thai; thai đủ tháng hay non; mẹ bệnh, dùng thuốc, rượu, thuốc lá khi mang thai; sinh khó, sinh mổ, sinh non</td><td>Cha mẹ khỏe, khí huyết đủ thì <b>khí tiên thiên</b> của con đủ; ngược lại con dễ mắc bệnh bẩm sinh. Sinh đủ tháng thì khí huyết đầy đủ</td></tr>
<tr><td><b>Tiêu hóa</b> <span class="pg">tr.206, 209</span></td><td>Bú mẹ hay sữa công thức; cai sữa, ăn dặm lúc nào; nôn sữa, đau bụng (ôm bụng, khóc, lăn lộn)</td><td>Trẻ lớn nhanh, cần nhiều dinh dưỡng nhưng <b>Tỳ Vị chưa hoàn chỉnh</b>: càng nhỏ càng hay rối loạn tiêu hóa. Đau bụng hay gặp nhất do <b>nhiễm hàn</b> ở Vị, Trường và <b>khí trệ</b> ở Trường. Sơ sinh hay <b>ứ đọng thức ăn</b> (nôn sữa, đau bụng)</td></tr>
<tr><td><b>Hô hấp</b> <span class="pg">tr.207, 209–210</span></td><td>Chảy mũi, nghẹt mũi, ho, khò khè, khó thở, đau tai; kéo dài bao lâu</td><td>Trẻ dễ bị <b>phong tà</b>. Ho, khò khè tái phát là <b>phục tà</b> (thường phế đàm nhiệt) do tà chưa trừ sạch, dùng kháng sinh nhiều, hoặc tiên thiên bất túc. Chảy mũi mạn: phục tà kèm tỳ hư sinh đàm</td></tr>
<tr><td><b>Giấc ngủ</b> <span class="pg">tr.207, 210</span></td><td>Khóc khi ngủ (to hay nhỏ), thức giữa chừng, mơ</td><td>Trẻ nhỏ thường do <b>thức ăn đình trệ</b> hoặc <b>vị nhiệt</b> (khóc rất to). Trẻ lớn: can hỏa, vị nhiệt, thực tích</td></tr>
<tr><td><b>Chủng ngừa</b> <span class="pg">tr.207, 210</span></td><td>Tiêm đủ lịch chưa; phản ứng sau tiêm; tiền sử bệnh truyền nhiễm (sởi, thủy đậu)</td><td>Trẻ 6 tháng đến 5 tuổi miễn dịch bẩm sinh giảm mà miễn dịch mắc phải chưa đủ: dễ mắc bệnh truyền nhiễm. Hỏi để chẩn đoán nhanh, kiểm soát dịch</td></tr>
<tr><td><b>Tâm lý</b> <span class="pg">tr.207, 210</span></td><td>Từng hoảng sợ, sang chấn? Giật mình, khóc, sốt cao, co giật? Tự kỷ, tăng động?</td><td>Trẻ <b>rất dễ hoảng sợ</b> (tâm trí chưa vững); sợ quá có thể sốt, co giật; ảnh hưởng lâu dài đến tính cách</td></tr></table>
<p class="muted">Liên hệ: vọng chỉ văn ở trẻ dưới 3 tuổi (bài 2.04); lưỡi trẻ em thường nhạt, non, rêu ít, dễ bong (bài 2.05); trẻ ngủ ra mồ hôi đầu mà không có gì khác là bình thường (bài 2.13).</p>`,
checkTitle:"Hỏi cha mẹ khi khám trẻ",
checklist:["Thai kỳ, sinh đủ tháng hay non, sinh thường hay mổ, cân nặng lúc sinh","Bú mẹ hay sữa công thức; ăn dặm, cai sữa lúc nào; ăn uống hiện nay","Nôn, đau bụng (ôm bụng, khóc, lăn lộn), đại tiện","Ho, khò khè, chảy mũi: bao lâu, tái phát mấy lần, đã dùng kháng sinh bao nhiêu đợt","Giấc ngủ: khóc đêm (to hay nhỏ), giật mình, thức giấc","Tiêm chủng đủ chưa; từng mắc sởi, thủy đậu; từng sốt cao co giật, hoảng sợ"],
quiz:[
{q:"Ngoài các câu hỏi thông thường, vấn chẩn trẻ em cần hỏi thêm mấy nhóm vấn đề theo giáo trình?",o:[["3","Sai."],["6: trước sau sinh, tiêu hóa, hô hấp, giấc ngủ, chủng ngừa, tâm lý","Đúng."],["10 theo thập vấn","Sai."],["Không cần hỏi thêm","Sai."]],a:1,p:"206"},
{q:"Vì sao hỏi tình trạng cha mẹ lúc thụ thai và quá trình mang thai?",o:[["Để biết khí tiên thiên của trẻ đủ hay thiếu","Đúng: liên quan bệnh bẩm sinh."],["Để biết trẻ ăn gì","Sai."],["Để biết tâm lý của trẻ","Sai."],["Không có ý nghĩa","Sai."]],a:0,p:"209"},
{q:"Theo giáo trình, vì sao trẻ càng nhỏ càng hay rối loạn tiêu hóa?",o:[["Vì thận chưa đủ","Sai."],["Vì trẻ cần nhiều dinh dưỡng nhưng Tỳ Vị chưa phát triển đầy đủ","Đúng."],["Vì can khí thịnh","Sai."],["Vì phế yếu","Sai."]],a:1,p:"209"},
{q:"Hai nguyên nhân thường gặp nhất gây đau bụng ở trẻ:",o:[["Nhiễm hàn ở Vị, Trường và khí trệ ở Trường","Đúng."],["Huyết ứ và đàm thấp","Sai."],["Âm hư và hư nhiệt","Sai."],["Can hỏa và tâm hỏa","Sai."]],a:0,p:"209"},
{q:"Trẻ sơ sinh nôn sữa và đau bụng thường do:",o:[["Ứ đọng thức ăn","Đúng."],["Thận dương hư","Sai."],["Huyết hư","Sai."],["Can khí uất","Sai."]],a:0,p:"209"},
{q:"Ho, khò khè tái đi tái lại ở trẻ theo giáo trình thường là biểu hiện của:",o:[["Phục tà (thường phế đàm nhiệt) sau các đợt nhiễm phong tà","Đúng."],["Thận dương hư","Sai."],["Can hỏa","Sai."],["Huyết ứ","Sai."]],a:0,p:"209"},
{q:"Theo giáo trình, ho, khò khè tái phát ở trẻ có thể do:",o:[["Phong tà chưa được trừ sạch, dùng kháng sinh quá thường xuyên, hoặc tiên thiên bất túc","Đúng."],["Ăn quá nhiều rau","Sai."],["Ngủ nhiều","Sai."],["Không rõ nguyên nhân","Sai."]],a:0,p:"209–210"},
{q:"Trẻ nhỏ khóc rất to khi ngủ thường do:",o:[["Thức ăn đình trệ hoặc vị nhiệt","Đúng."],["Huyết hư","Sai."],["Thận âm hư","Sai."],["Phế khí hư","Sai."]],a:0,p:"210"},
{q:"Theo giáo trình, đặc điểm tâm lý của trẻ:",o:[["Rất khó bị hoảng sợ","Sai."],["Rất dễ hoảng sợ; sợ quá có thể sốt cao, co giật","Đúng."],["Không ảnh hưởng thể chất","Sai."],["Chỉ ảnh hưởng ở tuổi dậy thì","Sai."]],a:1,p:"210"}
],
case:{v:`Bé trai 2 tuổi, sinh non 34 tuần. Một năm nay ho, khò khè tái đi tái lại 6–7 đợt, mỗi đợt đều dùng kháng sinh; chảy mũi gần như quanh năm, đờm vàng. Ăn kém, phân lúc lỏng. Đêm hay khóc to, trằn trọc, nhất là hôm ăn tối muộn.`,
qs:["Những chi tiết nào trong tiền sử gợi ý nền tảng yếu?","Ho, khò khè tái phát và chảy mũi quanh năm giải thích thế nào theo giáo trình?","Khóc đêm to sau bữa tối muộn gợi ý gì?"],
ans:`<p><b>1.</b> <b>Sinh non</b>: khí huyết, khí tiên thiên chưa đủ (tiên thiên bất túc); ăn kém, phân lỏng: <b>tỳ hư</b>. <span class="pg">CĐ tr.209</span></p>
<p><b>2.</b> <b>Phục tà</b> (thường phế đàm nhiệt, đờm vàng) sau nhiều đợt nhiễm phong tà chưa trừ sạch, dùng kháng sinh nhiều, trên nền tiên thiên bất túc; chảy mũi mạn do phục tà kèm <b>tỳ hư sinh đàm</b>. <span class="pg">CĐ tr.209–210</span></p>
<p><b>3.</b> <b>Thức ăn đình trệ</b> hoặc <b>vị nhiệt</b> (khóc to). <span class="pg">CĐ tr.210</span> Ở trẻ khò khè tái phát nhiều lần, cần phối hợp khám nhi khoa Tây y.</p>`},

// Tầng 2 – Mạch chẩn 2.22–2.26. Nguồn: CĐ tr.215–229; Tần Hồ mạch học, phần Tứ ngôn quyết (ghi "TH"); đối chiếu 中医诊断学 (ZD) mục 脉诊.
const SRC_TH="Tần Hồ mạch học (Lý Thời Trân), phần Tứ ngôn quyết";
Object.assign(LESSONS,{
"2.22":{id:"2.22",tang:2,title:"Mạch chẩn (1): bộ vị, cách bắt, mạch bình thường",han:"脉诊 · 平脉",src:SRC_CD+", tr.215–222; "+SRC_TH+"; 中医诊断学 mục 正常脉象",
hook:"Một người vừa leo bốn tầng cầu thang vào phòng khám, mạch nhanh và mạnh. Ghi “mạch sác hữu lực, nhiệt chứng” được không?",
reading:`
<p><b>Giá trị và giới hạn</b> <span class="pg">tr.215</span>: mạch cho thông tin chi tiết về tạng phủ và khí huyết toàn thân, nhưng <b>phụ thuộc cảm giác chủ quan</b> và dễ bị nhiễu bởi yếu tố ngắn hạn (vừa leo cầu thang mạch nhanh; mất ngủ một tuần mạch yếu, trầm).</p>
<p><b>Bộ vị: Thốn khẩu</b> (động mạch quay ở cổ tay). Định bộ: <b>đặt ngón giữa vào chỗ mỏm xương quay nhô lên (cao cốt) là bộ Quan</b>; trước Quan là <b>Thốn</b> (dương), sau Quan là <b>Xích</b> (âm) (TH). Thốn ứng thượng tiêu, Quan ứng trung tiêu, Xích ứng hạ tiêu. <span class="pg">tr.217</span></p>
<table><tr><th></th><th>Tay trái</th><th>Tay phải</th></tr>
<tr><td>Thốn</td><td>Tâm (Tiểu trường)</td><td>Phế (Đại trường)</td></tr>
<tr><td>Quan</td><td>Can (Đởm)</td><td>Tỳ (Vị)</td></tr>
<tr><td>Xích</td><td>Thận (Bàng quang) – Thận âm</td><td>Thận (Tâm bào, Tam tiêu) – Thận dương, Mệnh môn</td></tr></table>
<p class="muted">Nạn kinh ghi cả phủ (trong ngoặc); Tần Hồ chỉ ghi tạng, xích trái là thận âm, xích phải là thận dương. <span class="pg">tr.217</span> Nội kinh còn có cách “tam bộ cửu hậu”: 9 điểm ở đầu, tay, chân. <span class="pg">tr.216</span></p>
<p><b>Ba tầng ấn</b> <span class="pg">tr.219–220</span>: <b>khinh án</b> (đặt nhẹ), <b>trung án</b>, <b>trọng án</b> (ấn gần mất mạch rồi nhấc nhẹ lên).</p>
<table><tr><th>Tầng</th><th>Năng lượng</th><th>Loại bệnh</th><th>Tạng phủ (Lý Thời Trân)</th></tr>
<tr><td>Khinh</td><td>Khí (phủ)</td><td>Ngoại cảm</td><td>Tâm, Phế</td></tr>
<tr><td>Trung</td><td>Huyết</td><td>Tỳ Vị</td><td>Tỳ, Vị</td></tr>
<tr><td>Trọng</td><td>Âm (tạng)</td><td>Nội thương</td><td>Can, Thận</td></tr></table>
<p><b>Cách bắt</b> <span class="pg">tr.220–222</span></p>
<ul><li><b>Thời gian</b>: tốt nhất sáng sớm, khi âm khí chưa động, dương khí chưa tán, chưa ăn uống (Tố vấn). Thực tế không phải lúc nào cũng được, nên cho người bệnh <b>nghỉ ngơi vài phút</b> trước khi bắt.</li>
<li><b>Tư thế</b>: người bệnh ngồi thẳng hoặc nằm ngửa, tay duỗi, bàn tay ngửa; không nằm nghiêng đè tay, không co hay giơ tay cao.</li>
<li>Thầy thuốc dùng <b>tay trái bắt tay phải</b> người bệnh và ngược lại; ngón trỏ, giữa, áp út lần lượt ở Thốn, Quan, Xích; xòe hay khép ngón theo khổ người. Bắt cả ba bộ cùng lúc (<b>tổng khán</b>) hoặc từng bộ (<b>đơn khán</b>).</li>
<li><b>5 thao tác</b>: nâng (xem tầng nông), nhấn (tầng trung, sâu), tìm (giữ yên để đếm nhịp), đẩy (sang hai bên, xem hình dạng), lăn (dọc theo mạch, xem dài ngắn, động).</li>
<li><b>Điều hòa hơi thở</b> của thầy thuốc: đếm nhịp mạch theo một lần thở của mình.</li></ul>
<p><b>Mạch bình thường</b> (ZD): ba bộ đều có mạch, <b>không phù không trầm, không nhanh không chậm (4–5 nhịp/một hơi thở)</b>, không to không nhỏ, <b>thong thả hòa hoãn, nhịp đều</b>, bộ Xích ấn sâu vẫn có lực. Tóm thành ba chữ:</p>
<ul><li><b>Hữu vị</b> (có vị khí): thong thả, hòa hoãn, mềm trơn. Dù là mạch bệnh, còn vẻ hòa hoãn là còn vị khí. “Có vị khí thì sống, ít vị khí thì bệnh, không vị khí thì chết.”</li>
<li><b>Hữu thần</b>: mềm mại mà có lực, nhịp đều.</li>
<li><b>Hữu căn</b> (có gốc): bộ Xích có lực, ấn sâu không mất; phản ánh <b>thận khí</b>. Bệnh nặng mà xích ấn sâu còn mạch là còn hy vọng.</li></ul>
<p><b>Mạch bình thường theo mùa và theo tạng</b> (TH): <b>xuân huyền, hạ hồng, thu mao (phù nhẹ), đông thạch (trầm)</b>, mùa nào cũng phải có vẻ <b>hòa hoãn</b>. Thái quá (thực, cường) là bệnh từ ngoài; bất cập (hư, vi) là bệnh từ trong. Ngũ tạng: Tâm phù đại mà tán; Phế phù sáp mà đoản; Can trầm trường mà huyền; Thận trầm thực mà nhuyễn; Tỳ Vị hòa hoãn. CĐ thêm: mùa đông mạch trầm hơn, mùa hè phù hơn; nam mạnh hơn nữ; lao động nặng mạch mạnh hơn. <span class="pg">tr.222</span></p>`,

"2.23":{id:"2.23",tang:2,title:"Mạch chẩn (2): nhóm phù, nhóm trầm",han:"浮脉类 · 沉脉类",src:SRC_CD+", tr.223–226; "+SRC_TH,
hook:"Tần Hồ mạch học viết: “Mạch lý bao la, quy về bốn mạch. Đề cương đã vạch, từ đó suy ra.” Bốn mạch ấy là gì, và vì sao nắm được chúng là nắm được cả hai mươi tám mạch?",
reading:`
<p><b>Bốn đề cương: phù, trầm, trì, sác</b> (TH, Biện mạch đề cương). <b>Phù trầm phân biểu lý</b>; <b>trì sác phân hàn nhiệt</b>. Phù sác là biểu nhiệt, trầm sác là lý nhiệt; phù trì là biểu hư, trầm trì là lãnh kết (hàn kết ở lý). Các mạch khác đều được phân tích từ bốn mạch này. 中医诊断学 nói theo cách khác: mọi mạch đều là sự thay đổi của <b>8 yếu tố</b>: vị trí (nông sâu), tần số, độ dài, lực, độ rộng, nhịp, độ trơn, độ căng.</p>
<p><b>Nhóm PHÙ</b>: mạch nằm nông, đặt nhẹ tay đã thấy.</p>
<table><tr><th>Mạch</th><th>Hình thái</th><th>Chủ bệnh</th></tr>
<tr><td><b>Phù</b></td><td>Đặt nhẹ là thấy, “như gỗ nổi trên mặt nước” (TH) <span class="pg">tr.223</span></td><td><b>Biểu chứng</b>, có ngoại tà. Phù có lực: biểu thực; phù vô lực: lý hư, huyết nhược (TH)</td></tr>
<tr><td><b>Hồng</b></td><td>To, tràn như sông dâng; <b>đến mạnh đi yếu</b> <span class="pg">tr.226</span></td><td><b>Nhiệt thịnh</b>, hay gặp khi sốt; cũng gặp ở bệnh mạn có nội nhiệt</td></tr>
<tr><td><b>Khâu</b></td><td>Nông thấy, trung án mất, trọng án lại thấy: <b>rỗng giữa</b> như cọng hành <span class="pg">tr.224</span></td><td><b>Mất máu</b> (sau xuất huyết)</td></tr>
<tr><td><b>Cách</b></td><td>Cứng, căng ở khinh án như <b>mặt trống</b>, rỗng ở trọng án; TH: “khâu mà huyền cấp” <span class="pg">tr.224</span></td><td>Thận âm, thận tinh hư kiệt; ZD: vong huyết, thất tinh, sảy thai, rong huyết</td></tr>
<tr><td><b>Nhu</b> (nhuyễn)</td><td>Chỉ thấy ở khinh án, <b>rất mềm</b>, nổi nhẹ; ấn mạnh thì mất; TH: “như bông trên mặt nước” <span class="pg">tr.224</span></td><td><b>Thấp</b> trên nền khí hư; tinh hoặc âm hư</td></tr>
<tr><td><b>Tán</b></td><td>Phù mà tản mạn, ấn nặng thì không thấy, như vỡ thành nhiều mảnh, <b>không có gốc</b> <span class="pg">tr.226</span></td><td>Khí huyết hư kiệt, nhất là thận khí: nặng</td></tr></table>
<p><b>Nhóm TRẦM</b>: phải ấn mạnh, sát gân xương mới thấy (TH: “như âm khí dưới đất, nặng đục, chìm xuống”).</p>
<table><tr><th>Mạch</th><th>Hình thái</th><th>Chủ bệnh</th></tr>
<tr><td><b>Trầm</b></td><td>Chỉ thấy khi ấn sâu, gần xương <span class="pg">tr.224</span></td><td><b>Bệnh ở lý</b>, ở tạng phủ. TH: lý nội thương, âm hàn, tích tụ. <b>Trầm có lực</b>: lý thực (đàm ẩm, thương thực); <b>trầm vô lực</b>: lý hư, khí uất</td></tr>
<tr><td><b>Phục</b></td><td>Còn sâu hơn trầm, <b>ẩn dưới xương</b>, phải ấn đến xương, đẩy gân mới thấy <span class="pg">tr.224</span></td><td>Nặng hơn trầm. ZD: tà bế, quyết chứng, <b>đau dữ dội</b>; CĐ: dương hư kiệt</td></tr>
<tr><td><b>Lao</b></td><td>Chỉ thấy ở trọng án, <b>cứng và căng</b>; ZD: trầm, thực, đại, huyền, trường, “vững không dời” <span class="pg">tr.224</span></td><td>Huyết ứ, nội hàn (kèm trì); ZD: âm hàn nội thịnh, sán khí, trưng tích</td></tr></table>
<p><b>Mạch kết hợp thường gặp</b> (TH, Chư mạch chủ bệnh): <b>phù khẩn</b>: phong hàn ở biểu; <b>phù sác</b>: phong nhiệt; <b>phù hoãn</b>: phong thấp ở cơ nhục; <b>phù hoạt</b>: đàm nhiệt; phù khâu: sau mất máu; phù hồng: âm hư hỏa vượng. <b>Trầm trì</b>: hư hàn; <b>trầm sác</b>: nhiệt uẩn ở lý; <b>trầm khẩn</b>: hàn ngưng gây đau; <b>trầm hoạt</b>: thực tích; <b>trầm huyền</b>: đàm ẩm gây đau ngực sườn; trầm tế: thấp tý.</p>
<p class="muted">Phân biệt nhanh: <b>khâu</b> rỗng giữa, mềm (mất máu); <b>cách</b> rỗng giữa nhưng ngoài căng cứng như mặt trống (tinh huyết hao kiệt). <b>Nhu</b> mềm ở nông (thấp, hư); <b>nhược</b> mềm ở sâu (bài 2.25). <b>Lao</b> sâu mà cứng có lực; <b>phục</b> sâu đến tận xương.</p>`,
checkTitle:"Khi thấy mạch nông hoặc sâu",
checklist:["Nông: có lực hay vô lực? Kèm sác, khẩn, hoãn, hoạt?","Nông mà rỗng giữa: mềm (khâu) hay căng cứng ngoài (cách)?","Nông mà rất mềm, ấn là mất (nhu)? Tản mạn không gốc (tán)?","Sâu: có lực hay vô lực? Kèm trì, sác, khẩn, hoạt, huyền?","Sâu đến tận xương mới thấy (phục)? Sâu mà cứng căng (lao)?","Đối chiếu với chứng: có biểu chứng không? Có mất máu, đau dữ dội không?"],

{q:"Mạch phù theo giáo trình cho thấy:",o:[["Bệnh ở lý","Sai."],["Bệnh ở biểu, có cảm nhiễm yếu tố gây bệnh bên ngoài","Đúng."],["Mất máu","Sai."],["Thận tinh hư kiệt","Sai."]],a:1,p:"223"},

{q:"Mạch cứng, chặt ở khinh án, căng như mặt trống nhưng rỗng ở trọng án:",o:[["Mạch cách: thận âm, thận tinh hư kiệt","Đúng."],["Mạch lao","Sai: lao chỉ thấy ở trọng án."],["Mạch hồng","Sai."],["Mạch thực","Sai."]],a:0,p:"224"},
{q:"Mạch chỉ thấy ở khinh án, rất mềm, ấn mạnh thì mất, gợi ý:",o:[["Thấp trên nền khí hư","Đúng: mạch nhu."],["Nhiệt thịnh","Sai."],["Huyết ứ","Sai."],["Thực tích","Sai."]],a:0,p:"224"},
{q:"Mạch chỉ thấy ở trọng án, cứng và căng:",o:[["Mạch phục","Sai: phục là ẩn dưới xương, khó bắt."],["Mạch lao: huyết ứ hoặc nội hàn","Đúng."],["Mạch nhược","Sai."],["Mạch trầm thường","Sai."]],a:1,p:"224"},
{q:"Theo Tần Hồ mạch học, trầm mà khẩn chủ:",o:[["Phong nhiệt","Sai."],["Hàn ngưng gây đau","Đúng."],["Âm hư","Sai."],["Mất máu","Sai."]],a:1,p:"TH Chư mạch chủ bệnh"},
{q:"Mạch hồng có đặc điểm và chủ bệnh:",o:[["Nhỏ, yếu; huyết hư","Sai: đó là tế."],["To, tràn như sông, đến mạnh đi yếu; nhiệt thịnh","Đúng."],["Rỗng giữa; mất máu","Sai."],["Rất sâu; tà bế","Sai."]],a:1,p:"226"}
],
case:{v:`A: nam 30 tuổi, sợ lạnh, sốt nhẹ, không ra mồ hôi, đau mình; mạch nông, căng như dây thừng xoắn. B: nữ 45 tuổi vừa băng huyết nhiều; mạch nông, ấn vừa thì mất, ấn sâu lại thấy, giữa như rỗng. C: nam 60 tuổi đau bụng dữ dội, chân tay lạnh; mạch ấn đến tận xương mới thấy.`,
qs:["Gọi tên mạch của từng người.","Mạch của A nói gì? Có khớp với chứng không?","Mạch của B và C cho biết gì? Cần làm gì?"],
ans:`<p><b>1.</b> A: <b>phù khẩn</b>. B: <b>khâu</b>. C: <b>phục</b>. <span class="pg">CĐ tr.223–224</span></p>
<p><b>2.</b> Phù khẩn: <b>phong hàn ở biểu</b>; khớp với sợ lạnh, sốt nhẹ, không mồ hôi, đau mình (bài 2.12, 2.13). <span class="pg">TH Chư mạch chủ bệnh</span></p>
<p><b>3.</b> B: khâu gặp <b>sau mất máu</b>, phải theo dõi sát, phối hợp Tây y. C: phục gặp khi tà bế, quyết chứng, <b>đau dữ dội</b> (ZD); kèm chân tay lạnh là nặng, cần cấp cứu. <span class="pg">CĐ tr.224; ZD 伏脉</span></p>`},
cards:[["4 đề cương mạch (TH)?","Phù, trầm (biểu lý); trì, sác (hàn nhiệt)."],["Phù sác / trầm sác / phù trì / trầm trì (TH)?","Biểu nhiệt / lý nhiệt / biểu hư / lãnh kết."],["Phù: hình thái, chủ?","Đặt nhẹ đã thấy, như gỗ nổi. Biểu chứng."],["Hồng?","To, tràn, đến mạnh đi yếu. Nhiệt thịnh."],["Khâu / cách?","Khâu: rỗng giữa, mềm; mất máu. Cách: ngoài căng như mặt trống, trong rỗng; thận tinh, âm hư kiệt."],["Nhu / tán?","Nhu: nông, rất mềm, ấn mất; thấp, khí hư. Tán: tản mạn không gốc; khí huyết, thận khí hư kiệt."],["Trầm có lực / vô lực?","Có lực: lý thực (đàm, thương thực). Vô lực: lý hư, khí uất."],["Phục / lao?","Phục: sâu đến xương; tà bế, quyết, đau dữ dội. Lao: sâu, cứng căng có lực; huyết ứ, nội hàn, trưng tích."],["Phù khẩn / phù hoãn / phù hoạt (TH)?","Phong hàn biểu / phong thấp ở cơ nhục / đàm nhiệt."]],
terms:[["Phù mạch / Trầm mạch","浮脉 / 沉脉","fú mài / chén mài"],["Hồng mạch","洪脉","hóng mài"],["Khâu mạch / Cách mạch","芤脉 / 革脉","kōu mài / gé mài"],["Nhu mạch / Tán mạch","濡脉 / 散脉","rú mài / sàn mài"],["Phục mạch / Lao mạch","伏脉 / 牢脉","fú mài / láo mài"]],
flags:["🔍 Tần Hồ mạch học xếp các mạch theo bốn đề cương: dưới phù có hồng, hư, tán, khâu, cách, nhu, vi; dưới trầm có phục, lao, thực, nhược, tế. Giáo trình CĐ xếp theo đặc điểm (độ sâu, tốc độ, cường độ, kích thước, độ dài, hình dạng, nhịp). Bài này theo cách xếp của CĐ, kèm khung đề cương của Tần Hồ."]},

"2.24":{id:"2.24",tang:2,title:"Mạch chẩn (3): nhóm trì, sác và mạch theo nhịp",han:"迟数 · 结促代",src:SRC_CD+", tr.225, 228; "+SRC_TH+"; 中医诊断学 mục 脉诊",
hook:"Một vận động viên nghỉ ngơi có mạch 52 lần/phút. Một bệnh nhân táo bón, sốt cao, bụng cứng đau cũng có mạch chậm mà có lực. Mạch trì có phải lúc nào cũng là hàn?",
reading:`
<p><b>Đếm theo hơi thở</b> của thầy thuốc (một lần thở ra hít vào) <span class="pg">tr.225</span>; TH: “Bốn năm nhịp đập là mạch hòa bình.”</p>
<table><tr><th>Mạch</th><th>Nhịp/hơi thở</th><th>Chủ bệnh</th></tr>
<tr><td><b>Trì</b></td><td>3 (ZD: dưới 60 lần/phút)</td><td><b>Hàn</b>. TH: trì có lực là hàn tà ngưng tụ gây đau (thực hàn); trì vô lực là dương khí bất túc (hư hàn). ZD: <b>cũng gặp ở tà nhiệt kết tụ</b> (lý thực nhiệt, như dương minh phủ thực): trì mà có lực. Người tập luyện thể lực mạch trì có lực khi nghỉ là bình thường</td></tr>
<tr><td><b>Hoãn</b></td><td>4</td><td>Hòa hoãn đều đặn: <b>mạch bình thường</b> (có vị khí). ZD: hoãn mà lười, vô lực là mạch bệnh: <b>thấp</b>, tỳ vị hư nhược. TH: hoãn đại là phong, hoãn tế là thấp, hoãn sáp là huyết thiếu, hoãn hoạt là nóng trong</td></tr>
<tr><td><b>Sác</b></td><td>5–6 trở lên</td><td><b>Nhiệt</b>. TH: sác có lực là thực nhiệt; sác vô lực là hư nhiệt (như sau khi nhọt vỡ, dinh huyết tổn thương, còn dư nhiệt)</td></tr>
<tr><td><b>Tật</b></td><td>7</td><td>Rất nhanh, gấp: dương cực thịnh, hỏa thiêu cạn âm</td></tr></table>
<p class="muted">TH còn phân: chậm hơn trì có tổn (2), bại (1), đoạt tinh (2 hơi thở 1 nhịp); nhanh hơn tật có cực (8), thoát (9): đều là tinh khí hoặc dương khí sắp tuyệt (bài 2.26).</p>
<p><b>Mạch theo nhịp</b>: có lúc ngừng. <span class="pg">tr.228</span></p>
<table><tr><th>Mạch</th><th>Nhận ra</th><th>Chủ bệnh</th></tr>
<tr><td><b>Xúc</b></td><td><b>Nhanh</b>, ngừng <b>không đều</b>; TH: hay thấy ở bộ thốn</td><td>CĐ: nhiệt thịnh, tâm khí hư, tâm hỏa. ZD: dương thịnh thực nhiệt; khí, huyết, đàm, thực tích đình trệ; cũng gặp khi tạng khí suy bại</td></tr>
<tr><td><b>Kết</b></td><td><b>Chậm</b>, ngừng <b>không đều</b>, ngừng xong đập lại ngay</td><td>CĐ: hàn, tâm dương hư. ZD: âm thịnh khí kết, hàn đàm, huyết ứ; khí huyết hư. TH: sán, hà, tích tụ, uất, tâm quý</td></tr>
<tr><td><b>Đại</b></td><td>Ngừng <b>đều đặn</b> theo quy luật, ngừng lâu mới đập lại</td><td>CĐ: vấn đề nghiêm trọng ở một hay nhiều tạng. ZD: tạng khí suy vi; cũng gặp khi đau, kinh sợ, chấn thương. TH: tiêu chảy lâu ra máu mủ, thương hàn lâu ngày tâm hồi hộp; <b>phụ nữ có thai 3 tháng nôn nhiều cũng có thể thấy</b></td></tr></table>
<p class="muted">Mẹo nhớ: <b>xúc nhanh, kết chậm, cả hai ngừng không đều; đại ngừng đều</b>. Mạch ngừng nhịp cần nghĩ đến bệnh tim: nên làm điện tim, khám tim mạch.</p>`,
checkTitle:"Khi đếm nhịp và thấy mạch ngừng",
checklist:["Người bệnh đã nghỉ chưa? Có tập luyện thể lực thường xuyên không?","Đếm theo hơi thở mình: 3 (trì), 4 (hoãn), 5–6 (sác), 7 (tật)?","Trì: có lực hay vô lực? Có sốt, táo bón, bụng cứng đau không (nhiệt kết)?","Sác: có lực hay vô lực? Có âm hư, dư nhiệt?","Có lúc ngừng không? Ngừng đều hay không đều? Nền nhanh hay chậm?","Mạch ngừng nhịp: hỏi tiền sử tim, chuyển làm điện tim"],
quiz:[
{q:"Mạch trì có bao nhiêu nhịp trong một hơi thở của người khám?",o:[["3","Đúng."],["4","Sai: 4 là hoãn."],["6","Sai: đó là sác."],["7","Sai: đó là tật."]],a:0,p:"225"},
{q:"Theo giáo trình, mạch hoãn (4 nhịp/hơi thở) là:",o:[["Mạch bình thường","Đúng."],["Mạch hàn","Sai."],["Mạch nhiệt","Sai."],["Mạch nguy","Sai."]],a:0,p:"225"},
{q:"Mạch tật có ý nghĩa:",o:[["Hàn cực","Sai."],["Dương thịnh, hỏa trong cơ thể làm cạn kiệt âm","Đúng."],["Bình thường","Sai."],["Thấp","Sai."]],a:1,p:"225"},
{q:"Theo Tần Hồ mạch học, mạch trì vô lực chủ:",o:[["Hàn tà ngưng tụ gây đau","Sai: đó là trì có lực."],["Hư hàn do dương khí bất túc","Đúng."],["Thực nhiệt","Sai."],["Âm hư","Sai."]],a:1,p:"TH Chư mạch chủ bệnh"},
{q:"Theo 中医诊断学, mạch trì ngoài hàn chứng còn có thể gặp ở:",o:[["Tà nhiệt kết tụ, lý thực nhiệt (như dương minh phủ thực)","Đúng: khi đó mạch trì mà có lực."],["Biểu nhiệt","Sai."],["Âm hư","Sai."],["Không gặp ở đâu khác","Sai."]],a:0,p:"ZD 迟脉"},
{q:"Mạch nhanh, có lúc ngừng không đều là:",o:[["Kết","Sai: kết là chậm."],["Xúc","Đúng."],["Đại","Sai: đại ngừng đều."],["Tật","Sai."]],a:1,p:"228"},
{q:"Mạch chậm, có lúc ngừng không đều, theo giáo trình biểu thị:",o:[["Nhiệt thịnh","Sai."],["Hàn hoặc tâm dương hư","Đúng: mạch kết."],["Âm hư","Sai."],["Bình thường","Sai."]],a:1,p:"228"},
{q:"Mạch có các khoảng nghỉ đều nhau là:",o:[["Kết","Sai."],["Xúc","Sai."],["Đại","Đúng: chỉ ra vấn đề nghiêm trọng ở một hay nhiều tạng."],["Động","Sai."]],a:2,p:"228"},
{q:"Theo Tần Hồ mạch học, mạch đại có thể gặp ở trường hợp nào sau đây mà không phải bệnh nặng?",o:[["Phụ nữ có thai 3 tháng nôn ọe nhiều","Đúng."],["Mất máu","Sai."],["Thương hàn lâu ngày","Sai: đó là bệnh."],["Tiêu chảy lâu ra máu mủ","Sai: đó là bệnh."]],a:0,p:"TH Chư mạch chủ bệnh"}
],
case:{v:`A: nam 55 tuổi, sợ lạnh, chân tay lạnh, mệt; mạch 3 nhịp mỗi hơi thở, ấn vô lực. B: nam 35 tuổi, sốt cao nhiều ngày, táo bón, bụng cứng đau cự án, nói sảng; mạch trầm, chậm mà rất có lực. C: nữ 60 tuổi, hồi hộp, tức ngực; mạch chậm, có lúc ngừng không đều rồi đập lại ngay.`,
qs:["A: mạch gì, nói lên gì?","B cũng có mạch chậm: có phải hàn không? Vì sao?","C: mạch gì? Chị cần làm gì thêm?"],
ans:`<p><b>1.</b> A: <b>trì vô lực</b> → <b>hư hàn</b>, dương khí bất túc. <span class="pg">CĐ tr.225; TH</span></p>
<p><b>2.</b> Không. Sốt cao, táo bón, bụng cứng đau cự án, nói sảng là <b>lý thực nhiệt</b> (dương minh phủ thực). 中医诊断学 nêu mạch trì cũng gặp ở tà nhiệt kết tụ, khi đó <b>trì mà có lực</b>. Phải xét mạch cùng chứng. <span class="pg">ZD 迟脉</span></p>
<p><b>3.</b> C: <b>kết</b> (chậm, ngừng không đều): hàn, tâm dương hư; hoặc hàn đàm, huyết ứ trở trệ. Cần khám tim mạch, làm điện tim. <span class="pg">CĐ tr.228; ZD 结脉</span></p>`},
cards:[["Trì / hoãn / sác / tật: số nhịp mỗi hơi thở?","3 / 4 / 5–6 / 7."],["Trì có lực / vô lực (TH)?","Có lực: hàn ngưng gây đau (thực hàn). Vô lực: hư hàn."],["Mạch trì không do hàn (ZD)?","Tà nhiệt kết tụ (dương minh phủ thực): trì mà có lực; người tập luyện: trì có lực, bình thường."],["Hoãn: bình thường / bệnh?","Hòa hoãn đều: có vị khí, bình thường. Hoãn lười vô lực: thấp, tỳ vị hư."],["Sác có lực / vô lực?","Thực nhiệt / hư nhiệt."],["Xúc / kết / đại?","Xúc: nhanh, ngừng không đều. Kết: chậm, ngừng không đều. Đại: ngừng đều, lâu mới đập lại."],["Xúc chủ?","Dương thịnh thực nhiệt; khí huyết đàm thực đình trệ; tâm khí hư."],["Kết chủ?","Hàn, tâm dương hư; âm thịnh khí kết, hàn đàm, huyết ứ."],["Đại chủ?","Tạng khí suy vi; cũng gặp khi đau, kinh sợ, chấn thương, có thai 3 tháng nôn nhiều."]],
terms:[["Trì / Hoãn","迟 / 缓","chí / huǎn"],["Sác / Tật","数 / 疾","shuò / jí"],["Xúc / Kết / Đại","促 / 结 / 代","cù / jié / dài"],["Nhất tức (một hơi thở)","一息","yī xī"]],
flags:["🔍 Giáo trình CĐ chỉ ghi “mạch trì chủ hàn”; 中医诊断学 bổ sung mạch trì có lực cũng gặp ở lý thực nhiệt kết tụ, và ở người tập luyện thể lực. Phải đối chiếu mạch với chứng."]},

"2.25":{id:"2.25",tang:2,title:"Mạch chẩn (4): nhóm hư thực, kích thước, độ dài, hình dạng",han:"虚实 · 滑涩弦紧",src:SRC_CD+", tr.225–228; "+SRC_TH+"; 中医诊断学 mục 脉诊",
hook:"Mạch tế và mạch vi đều nhỏ. Mạch nhu và mạch nhược đều mềm. Mạch huyền và mạch khẩn đều căng. Phân biệt thế nào dưới ngón tay?",
reading:`
<p><b>Theo lực</b> <span class="pg">tr.225–226</span></p>
<table><tr><th>Mạch</th><th>Hình thái</th><th>Chủ bệnh</th></tr>
<tr><td><b>Hư</b></td><td>Khá to nhưng mềm, ấn mạnh hơn một chút thấy trống rỗng; TH: phù mà vô lực, to mà nhu nhuyễn</td><td><b>Khí hư</b>; TH: khí huyết hư thì mạch hư</td></tr>
<tr><td><b>Thực</b></td><td>Đầy, khá cứng, khá dài, có lực ở cả ba tầng</td><td><b>Bệnh thực</b>. Thực sác: thực nhiệt; thực trì: thực hàn</td></tr>
<tr><td><b>Nhược</b></td><td>Khinh án không thấy, chỉ thấy ở trọng án, <b>mềm</b>; TH: trầm mà vô lực, mềm như bông, nhỏ</td><td><b>Dương hư</b>, có khi huyết hư. TH: nhược mà nhỏ là dương kiệt (sợ lạnh)</td></tr></table>
<p><b>Theo kích thước</b> <span class="pg">tr.226</span></p>
<table><tr><th>Mạch</th><th>Hình thái</th><th>Chủ bệnh</th></tr>
<tr><td><b>Hồng</b></td><td>To, tràn (xem bài 2.23)</td><td>Nhiệt thịnh</td></tr>
<tr><td><b>Tế</b></td><td>Nhỏ hơn bình thường; ZD: <b>nhỏ như sợi chỉ nhưng rõ dưới tay</b>, ấn không mất</td><td><b>Huyết hư</b>; thấp; ZD: các chứng hư hoặc thấp</td></tr>
<tr><td><b>Vi</b></td><td>Cực nhỏ, cực mềm, khó cảm nhận, <b>như có như không</b></td><td><b>Khí huyết kiệt</b>; ZD: bệnh lâu mà vi là chính khí sắp tuyệt; mới bệnh mà vi là dương khí bạo thoát</td></tr></table>
<p><b>Theo độ dài</b> <span class="pg">tr.227</span>: <b>trường</b>: vượt quá bản vị; CĐ: nhiệt. TH: trường mà nhu hòa là chính khí đầy đủ (bình thường); ZD: dương, nhiệt, thực, cũng gặp ở người khỏe. <b>Đoản</b>: không đủ bản vị, thường thấy ở bộ thốn; khí kiệt; ZD: đoản vô lực là khí hư, đoản có lực là khí uất. <b>Động</b>: tròn như hạt đậu, ngắn, run run, chỉ nổi ở giữa (TH: sác mà thấy ở bộ quan); chủ <b>sốc, sợ hãi, đau dữ dội</b>.</p>
<p><b>Theo hình dạng</b> <span class="pg">tr.227–228</span></p>
<table><tr><th>Mạch</th><th>Cảm giác dưới tay</th><th>Chủ bệnh</th></tr>
<tr><td><b>Hoạt</b></td><td>Trơn, tròn, lướt dưới ngón như hạt châu lăn</td><td><b>Đàm, thấp, thực tích</b>; hoặc <b>có thai</b>. TH: đàm ẩm thường phù hoạt; thương thực thường trầm hoạt</td></tr>
<tr><td><b>Sáp</b></td><td>Rít, không trơn, như cạnh răng cưa; TH: đi lại khó khăn</td><td><b>Huyết hư</b>, cạn tân dịch (sau mồ hôi nhiều, nôn nhiều kéo dài); TH: tinh huyết đều thiếu</td></tr>
<tr><td><b>Khẩn</b></td><td>Như sợi dây thừng đang xoắn lại</td><td><b>Hàn</b> (nội hay ngoại hàn); <b>đau</b>. Phù khẩn: hàn ở biểu; trầm khẩn: hàn ở lý gây đau</td></tr>
<tr><td><b>Huyền</b></td><td>Căng như <b>dây đàn</b>, mỏng, căng và cứng hơn khẩn</td><td><b>Bệnh Can (Đởm)</b>, <b>đau</b>, <b>đàm ẩm</b>. TH: huyền sác nhiều nhiệt, huyền trì nhiều hàn; huyền ở thốn: đau đầu; ở xích: đau bụng</td></tr></table>
<p class="muted">Phân biệt cặp dễ nhầm: <b>tế</b> nhỏ mà rõ, <b>vi</b> nhỏ đến như có như không. <b>Nhu</b> mềm ở nông, <b>nhược</b> mềm ở sâu. <b>Huyền</b> thẳng căng như dây đàn; <b>khẩn</b> căng mà xoắn, rung hai bên như dây thừng. <b>Hoạt</b> trơn tru; <b>sáp</b> rít như cạnh răng cưa.</p>`,

case:{v:`A: nữ 26 tuổi, chậm kinh 6 tuần, buồn nôn buổi sáng; mạch trơn, tròn, lướt dưới tay. B: nam 50 tuổi, hay cáu, đau đầu hai bên, miệng đắng; mạch căng thẳng như dây đàn, rõ nhất ở bộ quan trái. C: nữ 40 tuổi, hoa mắt, da khô, móng nhợt, kinh ít; mạch nhỏ như sợi chỉ nhưng rõ, đi hơi rít.`,
qs:["A: mạch gì? Nghĩ đến gì trước tiên?","B: mạch gì, ở bộ nào? Khớp với chứng gì?","C: mạch gì? Kết luận hướng chứng."],
ans:`<p><b>1.</b> A: <b>hoạt</b>; kèm chậm kinh, buồn nôn sáng: nghĩ đến <b>có thai</b> trước, cần thử thai, khám sản; không dùng thuốc trước khi loại trừ. <span class="pg">CĐ tr.227</span></p>
<p><b>2.</b> B: <b>huyền</b>, rõ ở <b>quan trái (Can)</b>: bệnh Can, khớp can hỏa, can dương (đau hai bên đầu là kinh Thiếu dương, miệng đắng, dễ cáu; bài 2.14, 2.17). <span class="pg">CĐ tr.217, 228</span></p>
<p><b>3.</b> C: <b>tế sáp</b>: tế là huyết hư, sáp là huyết hư, tân dịch thiếu → <b>huyết hư</b> (hoa mắt, da khô, móng nhợt, kinh ít). <span class="pg">CĐ tr.226, 228</span></p>`},
cards:[["Hư / thực?","Hư: to mềm, ấn mạnh thấy rỗng; khí hư. Thực: đầy, cứng, dài, có lực; bệnh thực (sác: thực nhiệt, trì: thực hàn)."],["Nhu / nhược?","Nhu: mềm ở nông, ấn mất (thấp, khí hư). Nhược: mềm ở sâu, nhẹ tay không thấy (dương hư, huyết hư)."],["Tế / vi?","Tế: nhỏ như chỉ, rõ dưới tay (huyết hư, thấp). Vi: như có như không (khí huyết kiệt)."],["Trường / đoản?","Trường: vượt bản vị (nhiệt; nhu hòa thì bình thường). Đoản: không đủ bộ (khí kiệt; có lực là khí uất)."],["Động?","Tròn như hạt đậu, ngắn, run ở giữa: sốc, sợ, đau dữ dội."],["Hoạt?","Trơn như hạt châu lăn: đàm, thấp, thực tích, có thai."],["Sáp?","Rít như răng cưa: huyết hư, tân dịch thiếu."],["Khẩn?","Xoắn như dây thừng: hàn, đau."],["Huyền?","Căng thẳng như dây đàn: bệnh Can, đau, đàm ẩm. Thốn huyền: đau đầu; xích huyền: đau bụng."]],

"2.26":{id:"2.26",tang:2,title:"Mạch chẩn (5): mạch kiêm và mạch nguy",han:"相兼脉 · 真脏脉",src:SRC_CD+", tr.229; "+SRC_TH+"; 中医诊断学 mục 相兼脉, 真脏脉",
hook:"Trên lâm sàng hiếm khi gặp một mạch đơn thuần: thường là phù khẩn, trầm tế sác, huyền hoạt… Đọc một mạch kiêm thế nào? Và những mạch nào báo hiệu nguy hiểm?",
reading:`
<p><b>Mạch kiêm (tương kiêm mạch)</b>: TH: “Trên lâm sàng ít khi thấy chỉ có một loại mạch, mà thường thấy kèm theo mấy loại.” 中医诊断学: trừ những mạch có tính chất hoàn toàn trái ngược, các mạch đều có thể đi kèm nhau; <b>chủ bệnh của mạch kiêm thường là tổng hợp chủ bệnh của từng mạch thành phần</b>: mỗi thành phần nói một mặt (vị trí bệnh, hàn nhiệt, hư thực, loại tà).</p>
<table><tr><th>Mạch kiêm</th><th>Đọc ra</th><th>Gợi ý</th></tr>
<tr><td>Phù khẩn</td><td>biểu + hàn</td><td>Biểu hàn; phong hàn tý gây đau (ZD); phong hàn biểu (TH)</td></tr>
<tr><td>Phù hoãn</td><td>biểu + hoãn</td><td>Phong tà thương vệ, dinh vệ bất hòa: Thái dương trúng phong (ZD); TH: phong thấp ở cơ nhục</td></tr>
<tr><td>Phù sác</td><td>biểu + nhiệt</td><td>Phong nhiệt phạm biểu (ZD, TH)</td></tr>
<tr><td>Phù hoạt</td><td>biểu + đàm</td><td>Biểu chứng kèm đàm: người vốn nhiều đàm thấp lại cảm ngoại tà (ZD); TH: đàm nhiệt</td></tr>
<tr><td>Trầm trì</td><td>lý + hàn</td><td>Lý hàn (ZD); hư hàn (TH)</td></tr>
<tr><td>Trầm huyền</td><td>lý + can/ẩm</td><td>Can uất khí trệ, hoặc thủy ẩm nội đình (ZD)</td></tr>
<tr><td>Trầm sáp</td><td>lý + ứ</td><td><b>Huyết ứ</b>, nhất là dương hư hàn ngưng huyết ứ (ZD)</td></tr>
<tr><td>Trầm hoãn</td><td>lý + thấp</td><td>Tỳ hư, thủy thấp đình lưu (ZD)</td></tr>
<tr><td>Trầm tế sác</td><td>lý + hư + nhiệt</td><td><b>Âm hư nội nhiệt</b> hoặc huyết hư (ZD)</td></tr>
<tr><td>Huyền sác</td><td>can + nhiệt</td><td>Can uất hóa hỏa, can đởm thấp nhiệt, can dương thượng cang (ZD)</td></tr>
<tr><td>Huyền khẩn</td><td>can + hàn, đau</td><td>Hàn chứng, thống chứng: hàn trệ can mạch, can uất khí trệ gây đau (ZD)</td></tr>
<tr><td>Huyền tế</td><td>can + hư</td><td>Can thận âm hư, huyết hư can uất, can uất tỳ hư (ZD)</td></tr>
<tr><td>Hoạt sác</td><td>đàm/thực + nhiệt</td><td>Đàm nhiệt, thấp nhiệt, thực tích nội nhiệt (ZD)</td></tr>
<tr><td>Hồng sác</td><td>nhiệt thịnh</td><td>Dương minh kinh chứng, khí phận nhiệt thịnh (ZD)</td></tr></table>
<p><b>Mạch nguy</b></p>
<ul><li><b>Theo nhịp quá chậm, quá nhanh</b> (TH): một hơi thở 2 nhịp là <b>tổn</b>, 1 nhịp là <b>bại</b>, hai hơi thở 1 nhịp là <b>đoạt tinh</b>: tinh khí suy kiệt. 7 nhịp là <b>tật</b>, 8 là <b>cực</b>, 9 là <b>thoát</b>: âm tinh hư tổn, dương nhiệt cực thịnh, 9 nhịp trở lên là dương khí đã tuyệt.</li>
<li><b>Âm dương ly quyết</b> (TH, Chân tạng tuyệt mạch): <b>chỉ có mạch xích, không lên tới quan</b>: âm tinh suy tuyệt ở dưới; <b>chỉ có mạch thốn, không xuống tới quan</b>: dương khí suy kiệt ở trên. Mạch <b>trầm phục lúc đập lúc ngừng</b>: chân khí tạng phủ suy tuyệt. Mạch <b>phù tán, ấn nặng không còn</b> (vô căn): dương khí sắp tuyệt. TH cũng nói: bệnh âm hàn mà xuất hiện mạch dương là chuyển biến tốt; bệnh dương nhiệt mà thấy mạch âm hư là nguy.</li>
<li><b>Chân tạng mạch</b> (ZD; còn gọi bại mạch, tuyệt mạch, quái mạch): mạch <b>không vị, không thần, không căn</b>. Không vị: cứng, đập vào tay, mất vẻ hòa hoãn. Không thần: tán loạn, nhịp lộn xộn, lúc có lúc không. Không căn: phù đại tán loạn, hoặc vi nhược không còn dưới tay. Bảy quái mạch: <b>phủ phí</b> (như nước sôi, nhanh không đếm được, nổi không gốc: tam dương nhiệt cực, âm dịch khô kiệt), <b>ngư tường</b> (đầu đứng đuôi vẫy như cá bơi: tam âm hàn cực, vong dương), <b>hà du</b> (như tôm bơi, chợt nhảy rồi lặn), <b>ốc lậu</b> (như giọt nước dột lâu mới nhỏ một giọt), <b>tước trác</b> (như chim mổ thóc), <b>giải sách</b> (như sợi dây tở ra, tán loạn), <b>đàn thạch</b> (cứng như búng vào đá).</li></ul>
<p class="muted">中医诊断学 lưu ý: một phần chân tạng mạch do bệnh tim thực thể, không hẳn là “chết không chữa”: phải quan sát kỹ và cứu chữa tích cực. Ở phòng khám YHCT, mọi mạch nguy đều là <b>chỉ định chuyển cấp cứu</b>.</p>`,
checkTitle:"Đọc một mạch kiêm, nhận ra mạch nguy",
checklist:["Tách từng thành phần: vị trí (phù/trầm), tần số (trì/sác), lực (hư/thực), hình (hoạt/sáp/huyền/khẩn), kích thước (hồng/tế)","Ghép ý nghĩa từng thành phần thành một nhận định","Đối chiếu với vọng, văn, vấn: mạch và chứng có thống nhất không?","Có vị, thần, căn không? Xích ấn sâu còn mạch không?","Nhịp quá chậm (≤2/hơi thở) hay quá nhanh (≥7)? Lúc có lúc không, tán loạn?","Thấy dấu hiệu mạch nguy: chuyển cấp cứu, không tự điều trị"],
quiz:[

{q:"Theo 中医诊断学, mạch trầm tế sác thường gợi ý:",o:[["Âm hư nội nhiệt hoặc huyết hư","Đúng: trầm là lý, tế là âm huyết hư, sác là nhiệt."],["Phong hàn biểu","Sai."],["Thực nhiệt dương minh","Sai."],["Hư hàn","Sai."]],a:0,p:"ZD 相兼脉"},

{q:"Theo Tần Hồ mạch học, một hơi thở mạch đập 9 lần trở lên:",o:[["Tật","Sai: tật là 7."],["Cực","Sai: cực là 8."],["Thoát: dương khí đã tuyệt","Đúng."],["Bình thường khi sốt","Sai."]],a:2,p:"TH Hình thái các mạch"},

<p><b>2.</b> Thống nhất: A có nóng chiều, đạo hãn, ngũ tâm phiền nhiệt (âm hư); B có ho đờm vàng đặc, sốt (đàm nhiệt ở phế). <span class="pg">bài 2.11, 2.13</span></p>

// Tầng 2 – Xúc chẩn 2.27. Nguồn: CĐ tr.233–244; đối chiếu 中医诊断学 (ZD) mục 按诊.
Object.assign(LESSONS,{
"2.27":{id:"2.27",tang:2,title:"Xúc chẩn: sờ da, chi, ngực, bụng, kinh lạc",han:"按诊",src:SRC_CD+", tr.233–242; 中医诊断学 mục 按诊",
hook:"Một bệnh nhân sốt cao, bụng nóng hầm hập, nhưng tay chân lại lạnh ngắt. Chỉ bằng bàn tay sờ, chị đọc ra được điều gì, và vì sao đây là dấu hiệu dễ nhầm nhất của xúc chẩn?",
reading:`
<p><b>Xúc chẩn</b> là một phần của thiết chẩn: sờ để xét <b>nhiệt độ, độ ẩm, cấu trúc da, độ chắc của mô, khối u</b>, từ đó biết vị trí, tính chất, mức độ bệnh. Luôn <b>so sánh với bên đối xứng</b> và toàn thân. Gồm: sờ da, sờ chi, sờ ngực, sờ bụng, kinh lạc chẩn. <span class="pg">tr.233</span></p>
<table><tr><th>Kỹ thuật</th><th>Lực</th><th>Độ sâu</th><th>Đánh giá</th></tr>
<tr><td><b>Sờ</b></td><td>Nhẹ</td><td>Da</td><td>Nhiệt độ, độ ẩm, mồ hôi → biểu lý, dương khí, tân dịch</td></tr>
<tr><td><b>Vuốt</b></td><td>Vừa</td><td>Cơ nhục</td><td>Căng đau, sưng, hình dạng, kích thước → vị trí bệnh, hư thực</td></tr>
<tr><td><b>Ấn</b></td><td>Mạnh</td><td>Xương, tạng phủ</td><td>Điểm đau, khối u (hình dạng, kích thước, bề mặt, di động) → tạng phủ, nguyên nhân</td></tr></table>
<p class="muted"><span class="pg">tr.234</span> Lưu ý: tăng lực dần, làm ấm tay trước, quan sát nét mặt, khuyến khích người bệnh nói ra cảm giác.</p>
<p><b>Sờ da: nhiệt độ</b> <span class="pg">tr.235</span></p>
<table><tr><th>Đặc điểm</th><th>Ý nghĩa</th></tr>
<tr><td>Sờ lúc đầu nóng, sờ lâu bớt nóng</td><td><b>Ngoại nhiệt</b></td></tr>
<tr><td>Lúc đầu nóng ít, sờ càng lâu càng nóng, lan tỏa</td><td><b>Nội nhiệt</b></td></tr>
<tr><td>Da không nóng mà người bệnh thấy nóng; hoặc ấn sâu đến xương mới thấy nóng</td><td><b>Hư nhiệt</b></td></tr>
<tr><td>Da không nóng nhưng dính, ẩm khi ấn lâu</td><td>Đàm nhiệt</td></tr>
<tr><td>Lạnh tay chân lên quá gối, khuỷu</td><td><b>Dương hư</b></td></tr>
<tr><td>Tay chân lạnh, mồ hôi dầu, mặt tái, mạch nhược</td><td><b>Thoát dương</b></td></tr>
<tr><td>Đầu ngón lạnh nhưng dễ làm ấm lên</td><td>Dương khí trở trệ</td></tr>
<tr><td>Lạnh vùng hông, bụng dưới, thắt lưng</td><td>Thận dương hư</td></tr></table>
<p><b>Độ ẩm, bề mặt da</b> <span class="pg">tr.235–236</span>: da ẩm mà ấm: ngoại cảm phong nhiệt; ẩm mà nóng: nội nhiệt thịnh; ẩm mà lạnh: dương hư, thoát dương. Da khô: Phế âm hư; thô, khô, tróc vảy: phong, tân dịch khô kiệt, huyết ứ. Da nhuận: khí huyết đủ. <b>Phù</b>: ấn để lại vết lõm là <b>thủy thũng</b>; ấn xong đầy lên ngay là <b>khí thũng</b>. <b>Nhọt</b>: sưng đau không nóng đỏ là âm thư (hàn); sưng nóng đỏ đau là dương thư (nhiệt); cứng xung quanh, mềm ở giữa là <b>đã thành mủ</b>.</p>
<p><b>Sờ chi</b> <span class="pg">tr.237</span>: bình thường tay chân ấm. Lạnh tay hay gặp ở tâm, phế dương hư; lạnh chân ở tỳ thận dương hư; phụ nữ lạnh chi có thể do huyết hư; khí trệ, đàm thấp cũng gây lạnh chi.</p>
<table><tr><th>So sánh</th><th>Ý nghĩa</th></tr>
<tr><td>Lạnh lên quá khuỷu, gối / chỉ lạnh dưới khuỷu, gối</td><td>Hư hàn / thực hàn hoặc khí trệ</td></tr>
<tr><td>Nóng mu bàn tay, chân / nóng lòng bàn tay, chân</td><td>Thực nhiệt, ngoại nhiệt / hư nhiệt, nội nhiệt</td></tr>
<tr><td>Trán nóng hơn lòng bàn tay / lòng bàn tay nóng hơn trán</td><td>Ngoại nhiệt / nội nhiệt</td></tr></table>
<p><b>Tiên lượng qua tay chân</b> (ZD): dương hư mà tay chân còn ấm là dương khí còn; tay chân lạnh giá là bệnh sâu nặng. <b>Nhiệt chứng mà tay chân lại lạnh</b> là <b>nhiệt quá nặng, dương khí bị bế ở trong không đạt ra ngoài</b> (“nhiệt càng sâu, quyết càng sâu”): đây là <b>chân nhiệt giả hàn</b>, cần phân biệt kỹ (bài 2.29).</p>
<p><b>Sờ ngực</b> <span class="pg">tr.238–239</span>: mỏm tim (liên sườn 5, đường trung đòn trái) phản ánh <b>tông khí</b>. Khối u ở vú: mềm, bờ rõ, di động: <b>đàm thấp</b>; cứng: huyết ứ; bờ không rõ: nhiệt độc; không di động: huyết ứ, nhiệt độc. Khối nhỏ, di động, thay đổi theo chu kỳ kinh: đàm thấp kèm khí trệ. <b>Khối đơn độc, rất cứng, không di động, bờ không rõ cần khám chuyên khoa ngay.</b></p>
<p><b>Sờ bụng</b> <span class="pg">tr.239–241</span>: bình thường chắc, đàn hồi (khí đủ); mềm nhão: khí bất túc. <b>Cứng, ấn đau, cự án: thực; mềm, xoa ấn dễ chịu: hư.</b> Khối cứng, đau, <b>cố định: huyết ứ</b>; khối lúc có lúc không, không cố định: <b>khí trệ</b>.</p>
<ul><li><b>Hạ sườn</b>: Can Đởm; căng tức: can khí uất kết, can đởm thấp nhiệt.</li>
<li><b>Thượng vị</b>: Tỳ Vị. Căng trướng: thực (khí trệ, huyết ứ, đàm thấp, thực tích). Người bệnh thấy đầy mà sờ mềm: vừa hư vừa thực (vị hỏa uất kèm tỳ khí hư).</li>
<li><b>Quanh rốn</b>: Thận, mạch Xung Nhâm; cứng đầy: khí trệ, huyết ứ; mềm: thận hư.</li>
<li><b>Hố chậu</b>: Tiểu trường, mạch Xung; <b>hạ vị</b>: Tiểu trường, Thận, Bàng quang, Can, Tử cung; cứng: thấp; ấn đau: khí trệ huyết ứ.</li></ul>
<p><b>Kinh lạc chẩn</b> <span class="pg">tr.241–242</span>: dùng ngón cái ấn dọc đường kinh tìm điểm phản ứng (đau); xác định <b>thiện án</b> (day ấn dễ chịu) hay <b>cự án</b>. Chú ý các nguyên huyệt, khích huyệt, ngũ du huyệt ở đoạn khuỷu đến bàn tay, gối đến bàn chân, và các du, mộ huyệt ở lưng, ngực bụng.</p>`,
checkTitle:"Khi xúc chẩn",
checklist:["Làm ấm tay; tăng lực dần; quan sát nét mặt người bệnh","So sánh trán với lòng bàn tay; lòng với mu bàn tay; bên bệnh với bên lành","Sờ lâu: nóng tăng (nội nhiệt) hay giảm (ngoại nhiệt)? Ấn sâu mới nóng (hư nhiệt)?","Tay chân lạnh đến đâu? Nếu đang sốt cao mà tay chân lạnh: nghĩ chân nhiệt giả hàn","Phù: ấn có để lại vết lõm không?","Bụng: cứng hay mềm, cự án hay thiện án; khối cố định hay không; vị trí theo phân khu"],

{q:"Ấn vào chỗ phù để lại vết lõm là:",o:[["Khí thũng","Sai: khí thũng ấn xong đầy lên ngay."],["Thủy thũng","Đúng."],["Âm thư","Sai."],["Dương thư","Sai."]],a:1,p:"236"},
{q:"Nhọt cứng ở xung quanh, mềm ở giữa cho biết:",o:[["Hàn chứng","Sai."],["Đã thành mủ","Đúng."],["Hư chứng","Sai."],["Mới khởi phát","Sai."]],a:1,p:"236"},
