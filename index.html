"2.02":{id:"2.02",tang:2,title:"Vọng toàn thân: thần, hình thái, sắc",han:"望神 · 望形态 · 望色",src:SRC_CD+", tr.21–28",
hook:"Một cụ ông bệnh nặng nằm liệt nhiều ngày, sáng nay bỗng tỉnh táo, nói nhiều, đòi gặp con cháu, kêu đói, má hồng lên. Gia đình mừng vì nghĩ cụ đang khỏe lại. Chị nghĩ gì?",
reading:`
<p><b>Vọng thần</b> <span class="pg">tr.21–23</span>: thần là biểu hiện bên ngoài của tinh, khí, huyết, tân dịch; thần thịnh hay suy tiêu biểu cho sức sống mạnh hay yếu. Quan sát ba yếu tố: <b>biểu hiện của thần</b> (cơ thể tràn năng lượng, hoạt bát), <b>sức sống của thần</b> (sáng suốt, giọng to rõ, hơi thở điều hòa, phản xạ nhanh), <b>sự tươi nhuận</b> (da, lông, tóc, đôi mắt).</p>
<table><tr><th></th><th>Biểu hiện</th><th>Ý nghĩa</th></tr>
<tr><td><b>Còn thần</b></td><td>Mắt sáng, linh hoạt; da tươi nhuận; tinh thần sảng khoái, tập trung; hơi thở điều hòa; giọng to rõ; dáng nhanh nhẹn</td><td>Bình thường</td></tr>
<tr><td><b>Mất thần</b></td><td>Bơ phờ, mắt kém linh hoạt, da kém tươi, tiếng nói nhỏ, chậm chạp, thờ ơ, suy nghĩ chậm, mạch vô lực</td><td>Tạng phủ đều bị ảnh hưởng, tinh khí hao tổn, tiên lượng kém</td></tr>
<tr><td><b>Giả thần</b></td><td>Người bệnh nặng hoặc mạn tính <b>đột nhiên</b> mạnh lên, mắt sáng, nói liên tục, muốn gặp người nhà, thèm ăn, da đột nhiên hồng</td><td><b>Nguy kịch</b>: nguyên khí cạn kiệt, âm dương phân tán; tử vong sau thời gian ngắn</td></tr></table>
<p><b>Vọng hình thái</b> <span class="pg">tr.23–25</span>: xem dáng béo gầy, trạng thái hoạt động để biết cân bằng âm dương và xu hướng mắc bệnh.</p>
<table><tr><th>Thể</th><th>Hình thái</th><th>Xu hướng bệnh</th></tr>
<tr><td>Dương thịnh</td><td>Cường tráng, mặt đỏ, thích mát, nói nhiều, giọng to, hiếu động</td><td>Nhiệt, hỏa; điều trị chú trọng chế dương, tư âm</td></tr>
<tr><td>Âm thịnh</td><td>Béo, sắc mặt tối, cơ nhão, trầm tính, ít nói, thích ấm</td><td>Hàn, đàm, thấp, khí trệ, huyết ứ</td></tr>
<tr><td>Dương hư</td><td>Thừa cân, phù, mặt nhợt hoặc xanh xao, mệt, chậm, sợ lạnh, chân tay lạnh</td><td>Hàn, hàn thấp, đàm ẩm</td></tr>
<tr><td>Âm hư</td><td>Cao gầy, cổ cao, ngực hẹp; gò má đỏ, môi đỏ, bồn chồn, nóng trong, cử động nhanh</td><td>Hư nhiệt, táo</td></tr></table>
<p>Hình thái còn được chia theo ngũ hành: người Mộc, Hỏa thường bị bệnh vào thu đông; người Thổ, Kim, Thủy thường bị bệnh vào xuân hạ. <span class="pg">tr.25</span></p>
<p><b>Vọng sắc</b> <span class="pg">tr.26–28</span>: quan sát mặt <b>buổi sáng sau khi thức dậy</b>, ánh sáng tự nhiên, yên tĩnh. Bình thường hồng hào (tâm huyết tốt), nhuận (tân dịch tốt).</p>
<table><tr><th>Sắc</th><th>Chủ</th><th>Chi tiết</th></tr>
<tr><td>Trắng</td><td>Huyết hư, dương hư</td><td>Trắng sáng: dương hư. Trắng nhợt: khí hư. Trắng vàng xỉn: huyết hư. Trắng xanh: hàn do dương hư. Trắng bệch đột ngột ở bệnh cấp: dương khí thoát</td></tr>
<tr><td>Vàng</td><td>Tỳ hư thấp trệ</td><td>Ám vàng, không nhuận: tỳ khí hư. Hoàng đản vàng tươi như cam: thấp nhiệt; vàng ám như khói: hàn thấp</td></tr>
<tr><td>Đỏ</td><td>Nhiệt</td><td>Đỏ thẫm cả má: thực nhiệt. Đỏ nhạt thoáng qua, chiều tối, ở hai gò má: hư nhiệt</td></tr>
<tr><td>Xanh</td><td>Hàn, phong, đau do khí trệ huyết ứ</td><td>Xanh nhạt dưới mắt: can khí uất. Trẻ em xanh vùng giữa hai lông mày: can phong, co giật</td></tr>
<tr><td>Đen</td><td>Thận hư, hàn, đau</td><td>Đen khô: thận âm hư. Đen tối, hốc mắt tối: thận dương hư. Đen nhạt quanh mắt, phù mặt: hàn thấp, đàm ẩm. Đen sậm: huyết ứ</td></tr>
<tr><td>Tía</td><td></td><td>Đỏ tía: huyết ứ. Xanh tía: nội hàn gây huyết ứ hoặc nhiễm độc</td></tr></table>`,

case:{v:"Ca A: cụ ông bệnh nặng nằm liệt nhiều ngày, bỗng tỉnh táo, nói luôn miệng, đòi gặp con cháu, kêu đói, má hồng lên. Ca B: nữ 40 tuổi, cao gầy, môi đỏ, hai gò má ửng đỏ vào chiều tối, hay bồn chồn, thấy nóng trong người. Ca C: nam 45 tuổi, mặt và mắt vàng tươi như màu cam.",
qs:["Ca A: nhận định thế nào? Chị dặn gia đình ra sao?","Ca B: thể hình thái và sắc mặt gợi ý gì? Xu hướng bệnh?","Ca C: sắc vàng này gợi ý gì? Nếu vàng ám tối như khói thì sao?"],
ans:`<p><b>A.</b> <b>Giả thần</b>: bệnh nguy kịch, nguyên khí cạn kiệt, âm dương phân tán. Cần nói rõ với gia đình đây không phải dấu hiệu khỏe lại. <span class="pg">CĐ tr.23</span></p>
<p><b>B.</b> Thể <b>âm hư</b> (cao gầy, môi đỏ, bồn chồn, nóng trong); sắc đỏ nhạt ở hai gò má chiều tối là <b>hư nhiệt</b>. Xu hướng mắc hư nhiệt, táo. <span class="pg">CĐ tr.24, 27</span></p>
<p><b>C.</b> Hoàng đản vàng tươi: <b>thấp nhiệt</b>. Vàng ám tối như khói thuốc: <b>hàn thấp</b>. <span class="pg">CĐ tr.27</span></p>`},
cards:[["Ba yếu tố của vọng thần?","Biểu hiện của thần, sức sống của thần, sự tươi nhuận."],["Còn thần / mất thần?","Còn: mắt sáng, tươi nhuận, giọng to rõ, nhanh nhẹn. Mất: bơ phờ, chậm, tiếng nhỏ, thờ ơ, tiên lượng kém."],["Giả thần?","Bệnh nặng đột nhiên tỉnh, nói nhiều, thèm ăn, má hồng: nguyên khí cạn kiệt, sắp tử vong."],["Bốn thể hình thái theo âm dương?","Dương thịnh (nhiệt, hỏa), âm thịnh (hàn, đàm, thấp), dương hư (hàn, đàm ẩm), âm hư (hư nhiệt, táo)."],["Vọng sắc lúc nào?","Buổi sáng sau thức dậy, ánh sáng tự nhiên, yên tĩnh."],["Sắc trắng: các kiểu?","Trắng sáng: dương hư. Trắng nhợt: khí hư. Trắng vàng: huyết hư. Trắng bệch đột ngột: dương thoát."],["Sắc đỏ: thực hay hư?","Đỏ thẫm cả má: thực nhiệt. Đỏ nhạt hai gò má chiều tối: hư nhiệt."],["Hoàng đản: tươi / ám?","Vàng tươi như cam: thấp nhiệt. Vàng ám như khói: hàn thấp."],["Sắc đen: khô / tối / nhạt / sậm?","Khô: thận âm hư. Tối: thận dương hư. Nhạt, phù: hàn thấp, đàm ẩm. Sậm: huyết ứ."]],

"2.03":{id:"2.03",tang:2,title:"Vọng từng bộ phận",han:"望局部",src:SRC_CD+", tr.31–48",
hook:"Một người mí mắt và mặt sưng nề. Chị ấn ngón tay vào: một người để lại vết lõm lâu, một người vết lõm đầy lại ngay. Hai kiểu sưng này khác nhau thế nào?",
reading:`
<p>Bài này gom các điểm <b>hay dùng nhất</b> của từng vùng. Phần lưỡi học riêng ở các bài thiệt chẩn.</p>
<p><b>Đầu mặt</b> <span class="pg">tr.31–33</span>: da đầu, mặt khô, nứt, bong vảy là <b>huyết táo</b>. Sưng nề, mí mắt xệ, <b>ấn lõm là thủy thấp; ấn vào vết lõm đầy nhanh là khí trệ</b>. Da vàng tươi kèm sốt là dương hoàng, vàng tối không sốt là âm hoàng. Ban chẩn tươi nhuận: chính khí chưa hư; tím: nhiệt thịnh; nhạt xám: chính khí đã hư. Trẻ thóp đóng trễ thường do thận tiên thiên khuyết tổn.</p>
<p><b>Mắt</b> <span class="pg">tr.33–37</span>: khiếu của can. Con ngươi – thận, mống mắt – can, củng mạc – phế, khóe mắt – tâm, mí mắt – tỳ.</p>
<ul><li>Mắt đỏ là nhiệt; sưng đau là can nhiệt. Mắt hay giật: kinh phong ở can. Khóe đuôi mắt đỏ: tâm có hỏa. Mí mắt đỏ: tỳ nhiệt.</li>
<li><b>Can hỏa</b>: mắt đỏ, nóng, đau, miệng đắng, lưỡi đỏ hai rìa đỏ sậm. <b>Tâm hỏa</b>: mắt đỏ đau, lo lắng, mất ngủ, đầu lưỡi đỏ.</li>
<li>Củng mạc vàng hoặc đỏ là nhiệt; xanh hoặc nhợt là hàn. Mí trên đỏ sưng: đàm nhiệt trở tỳ; mí dưới đỏ sưng: vị nhiệt. Bên trong mí nhợt: huyết hư hoặc dương hư.</li>
<li>Mắt trũng sâu luôn do hư; trũng cấp là âm hoặc dương suy kiệt. Quầng mắt thâm tím: huyết ứ; tối đen: đàm kết hoặc thận hư.</li></ul>
<p><b>Mũi</b> <span class="pg">tr.37–39</span>: đầu mũi trắng: khí hư hoặc mất máu; vàng: nhiều thấp; đỏ: tỳ nhiệt hoặc âm hư; phần trên mũi đỏ: phế nhiệt; đen khô: thận âm hư. <b>Cánh mũi phập phồng</b>: thiếu khí do ngạt, suyễn, khí hư không nạp khí. Nước mũi trong: phong hàn; đặc: phong nhiệt.</p>
<p><b>Tai</b> <span class="pg">tr.39–40</span>: khiếu của thận. Tai to: khí huyết dồi dào; tai nhỏ: khí huyết hư. Tai teo, nhăn: thiếu tân dịch (nhiệt hun đốt hoặc âm hư). Vành tai khô, ám đen: thận âm hư. Chảy mủ cấp: phong nhiệt kinh thiếu dương hoặc can đởm thấp nhiệt; mạn: can đởm thấp nhiệt.</p>
<p><b>Răng, nướu, họng</b> <span class="pg">tr.40–42</span>: nướu đỏ, sưng, đau là vị hỏa; nướu hơi đỏ, không sưng, răng lung lay, đau về chiều tối là thận âm hư sinh nhiệt; chảy máu nướu mạn là tỳ khí hư không thống huyết; nướu nhợt: tỳ khí hư, huyết hư. Họng đỏ sậm: thực nhiệt; đỏ nhạt: hư nhiệt; lở loét mạn tái phát: hư nhiệt.</p>
<p><b>Môi, miệng, cổ</b> <span class="pg">tr.42–44</span>: môi nhợt khô: can huyết hư; nhợt nhuận: dương hư; sưng đỏ: thực nhiệt; đỏ khô: hư nhiệt; xanh tím: huyết ứ; môi run: tỳ khí hư. Loét đầu lưỡi: tâm hỏa; loét viền đỏ trên nướu, trong má: vị nhiệt. Méo miệng: can phong hoặc ngoại phong phạm kinh lạc mặt. Chảy nước dãi: tỳ khí hư (hoặc phế khí hư, nội phong kèm đàm…). Cứng cổ: hàn tà phạm kinh lạc.</p>
<p><b>Ngực, bụng, lưng, tứ chi</b> <span class="pg">tr.44–48</span>: ngực lõm: phế khí hư, phế âm hư hoặc thận hư. Bụng to mập: tỳ hư sinh đàm. <b>Khối ở bụng cứng, cố định là huyết ứ; mềm, di chuyển là khí trệ</b>; khối vùng hạ sườn: can huyết ứ. Gù lưng: thận tinh bất túc. <b>Phù ở tay: phế dương hư; phù chân: thận dương hư; phù tứ chi: tỳ dương hư, thấp.</b></p>`,

case:{v:"Nam, 62 tuổi. Mặt và mí mắt sưng nề, ấn vào để lại vết lõm. Hai cẳng chân phù. Môi nhợt nhưng ướt, nướu nhợt. Sợ lạnh, chân tay lạnh. Khám bụng thấy một khối cứng, không di động vùng hạ sườn phải.",
qs:["Sưng nề mặt ấn lõm và phù chân gợi ý gì?","Môi nhợt nhuận, nướu nhợt, sợ lạnh nói thêm điều gì?","Khối cứng cố định vùng hạ sườn theo sách nghĩ đến gì? Nếu khối mềm, lúc có lúc không thì sao?"],
ans:`<p><b>1.</b> Sưng nề ấn lõm: <b>thủy thấp</b>. Phù chân: <b>thận dương hư</b>. <span class="pg">CĐ tr.33, 48</span></p>
<p><b>2.</b> Môi nhợt nhuận: <b>dương hư</b>; nướu nhợt: tỳ khí hư hoặc huyết hư, tỳ dương hư sinh hàn; cùng sợ lạnh, chân tay lạnh, củng cố hướng <b>dương hư</b>. <span class="pg">CĐ tr.41–42</span></p>
<p><b>3.</b> Khối cứng cố định là <b>huyết ứ</b>; ở vùng hạ sườn là <b>can huyết ứ</b>. Khối mềm, di chuyển là <b>khí trệ</b>. <span class="pg">CĐ tr.46</span> (Người có khối bụng cần phối hợp khám Tây y.)</p>`},
cards:[["Sưng nề: ấn lõm / lõm đầy nhanh?","Ấn lõm: thủy thấp. Lõm đầy nhanh: khí trệ."],["Năm phần của mắt ứng tạng nào?","Con ngươi – thận, mống mắt – can, củng mạc – phế, khóe mắt – tâm, mí mắt – tỳ."],["Can hỏa / tâm hỏa ở mắt?","Can hỏa: mắt đỏ nóng đau, miệng đắng, rìa lưỡi đỏ sậm. Tâm hỏa: mắt đỏ đau, lo lắng, mất ngủ, đầu lưỡi đỏ."],["Mí trên / mí dưới đỏ sưng?","Mí trên: đàm nhiệt trở tỳ. Mí dưới: vị nhiệt."],["Mũi: cánh mũi phập phồng? Nước mũi trong / đặc?","Thiếu khí (ngạt, suyễn, không nạp khí). Trong: phong hàn. Đặc: phong nhiệt."],["Nướu: vị hỏa / thận âm hư?","Vị hỏa: đỏ, sưng, đau. Thận âm hư: hơi đỏ, không sưng, răng lung lay, đau chiều tối."],["Môi nhợt khô / nhợt nhuận?","Nhợt khô: can huyết hư. Nhợt nhuận: dương hư."],["Khối ở bụng: cứng cố định / mềm di chuyển?","Cứng cố định: huyết ứ. Mềm di chuyển: khí trệ."],["Phù tay / chân / tứ chi?","Tay: phế dương hư. Chân: thận dương hư. Tứ chi: tỳ dương hư, thấp."]],
terms:[["Vọng cục bộ","望局部","wàng jú bù"],["Ngũ luân","五轮","wǔ lún"],["Tỵ dực phiến động (cánh mũi phập phồng)","鼻翼煽动","bí yì shān dòng"],["Hoàng đản","黄疸","huáng dǎn"],["Thủy thũng","水肿","shuǐ zhǒng"]],
flags:["🔍 Bài gốc rất dài (tr.31–53) và có nhiều chi tiết lấy từ tài liệu nước ngoài (Maciocia). Em chọn các dấu hiệu hay gặp và dễ dùng trên lâm sàng. Phần vọng da (tr.48–53) sẽ được bổ sung vào thư viện tra cứu."]},

"2.04":{id:"2.04",tang:2,title:"Vọng chỉ văn và vọng chất tiết",han:"望指纹 · 望排出物",src:SRC_CD+", tr.54–66",
hook:"Một bé 18 tháng sốt, quấy khóc, không tự kể được mình bị gì. Ngoài sờ trán, chị còn nhìn được gì trên chính bàn tay bé?",
reading:`
<p><b>Vọng chỉ văn</b> <span class="pg">tr.54–58</span>: quan sát mạch máu mặt lòng <b>ngón trỏ ở trẻ dưới 3 tuổi</b>. Cơ sở: một nhánh của kinh thủ thái âm phế tách ra ở gần huyệt liệt khuyết; da trẻ mỏng nên dễ thấy. Bé trai xem tay trái, bé gái xem tay phải. Người khám vuốt nhẹ từ Mệnh quan về Phong quan 2–3 lần.</p>
<p><b>Tam quan</b>: <b>Phong quan</b> (khớp bàn ngón → khớp liên đốt gần), <b>Khí quan</b> (→ khớp liên đốt xa), <b>Mệnh quan</b> (→ đầu ngón). Bình thường: mờ, nâu đỏ nhạt hoặc tím nhạt, chỉ thấy ở Phong quan.</p>
<table><tr><th>Yếu tố</th><th>Phản ánh</th><th>Đọc thế nào</th></tr>
<tr><td><b>Chiều dài</b></td><td>Mức độ nặng</td><td>Giữa Phong–Khí quan: nhẹ (mạch, lạc). Qua Khí quan: nặng hơn (kinh). Đến Mệnh quan: rất nặng (tạng phủ). Suốt tam quan: cực kỳ nặng</td></tr>
<tr><td><b>Độ sâu</b></td><td>Vị trí bệnh</td><td>Nông, rõ: biểu chứng. Sâu, mờ: lý chứng</td></tr>
<tr><td><b>Màu sắc</b></td><td>Hàn nhiệt</td><td>Đỏ tươi: biểu, phong hàn. Tím: lý nhiệt. Xanh (lục lam): can phong nội động, chứng đau. Đỏ nhạt: hư hàn. Vàng nhạt: tỳ hư. Tím đen: huyết ứ. Đen: nguy kịch</td></tr>
<tr><td><b>Tái tưới máu</b></td><td>Hư thực</td><td>Hồi phục nhanh: bình thường hoặc hư. Chậm, khó: thực (đàm thấp, thực tích, huyết ứ)</td></tr></table>
<p class="muted">Giáo trình 中医诊断学 tóm gọn thành 4 câu: 浮沉分表里，红紫辨寒热，淡滞定虚实，三关测轻重 (nổi chìm chia biểu lý, đỏ tím phân hàn nhiệt, nhạt trệ định hư thực, tam quan đo nặng nhẹ). Chỉ văn chạy thẳng đến đầu ngón gọi là “thấu quan xạ giáp”: rất nguy.</p>
<p><b>Vọng chất tiết</b> <span class="pg">tr.61–66</span></p>
<table><tr><th>Chất</th><th>Biểu hiện → nguyên nhân</th></tr>
<tr><td>Đàm</td><td>Trắng loãng: hàn đàm, tỳ hoặc thận dương hư. Trắng nhầy: thấp đàm ở phế. <b>Vàng nhầy: đàm nhiệt ở phế.</b> Lẫn máu: đàm nhiệt ở phế, phế âm hư kèm hư nhiệt</td></tr>
<tr><td>Nước mũi</td><td>Vàng nhầy: đàm, thấp nhiệt. Trắng, loãng, chảy nước: hàn đàm. Dính máu: đàm nhiệt ở phế</td></tr>
<tr><td>Mồ hôi</td><td>Trên trán: dương thoát. Màu vàng: thấp nhiệt tỳ vị. Trên đầu: nhiệt, thấp nhiệt ở vị, hoặc thận âm hư. Lòng bàn tay, bàn chân: thận âm hư</td></tr>
<tr><td>Phân</td><td>Vàng sậm: thực nhiệt đại trường. Trắng nhạt: hàn ở đại trường. Đen, tối: ứ huyết. Khô: nhiệt ở đại trường, can huyết hư, âm hư. Lỏng: tỳ khí hư, thận khí hư. Nhầy: thấp. Nhỏ thành viên: can khí trệ, nhiệt</td></tr>
<tr><td>Nước tiểu</td><td>Nhạt: hàn ở bàng quang, thận dương hư. Sẫm: nhiệt ở bàng quang, thận âm hư. Đục: thấp tại bàng quang</td></tr>
<tr><td>Kinh nguyệt</td><td>Bình thường 3–5 ngày, 50–100 ml, đỏ sẫm, không cục. Đỏ sậm hoặc đỏ chói: huyết nhiệt. Đen, rất tối: ứ huyết</td></tr>
<tr><td>Khí hư (huyết trắng)</td><td>Trắng: hàn thấp, tỳ hoặc thận dương hư. Vàng: thấp nhiệt. Xanh: thấp nhiệt kinh can. Đỏ trắng lẫn: thấp nhiệt</td></tr></table>`,

{q:"Đổ mồ hôi lòng bàn tay và lòng bàn chân theo sách là:",o:[["Dương thoát","Sai: dương thoát ra mồ hôi trên trán."],["Thận âm hư","Đúng."],["Thấp nhiệt tỳ vị","Sai: mồ hôi vàng."],["Phế nhiệt","Sai."]],a:1,p:"63"},
{q:"Phân đen hoặc tối theo sách gợi ý:",o:[["Hàn ở đại trường","Sai: phân trắng nhạt."],["Ứ huyết","Đúng."],["Tỳ khí hư","Sai."],["Can khí trệ","Sai: phân nhỏ thành viên."]],a:1,p:"64"},

case:{v:"Bé trai 18 tháng, sốt 2 ngày, quấy khóc. Chỉ văn ở ngón trỏ trái màu tím, nằm sâu, kéo dài qua Khí quan; vuốt xong mạch máu hồi lại chậm. Bé ho có đờm vàng nhầy.",

ans:`<p><b>1.</b> Màu tím: <b>lý nhiệt</b>. Sâu: bệnh ở <b>lý</b>. Qua Khí quan: <b>nặng hơn</b>, bệnh ở kinh. Hồi lại chậm: <b>thực chứng</b>. <span class="pg">CĐ tr.56–57</span></p>
<p><b>2.</b> <b>Đàm nhiệt ở phế.</b> <span class="pg">CĐ tr.61</span></p>
<p><b>3.</b> Đến Mệnh quan: <b>rất nặng</b>, bệnh vào tạng phủ; chạy thẳng đến đầu ngón (thấu quan xạ giáp): <b>nguy</b>, cần chuyển cấp cứu, phối hợp Tây y. <span class="pg">CĐ tr.56; ZD 望小儿食指络脉</span></p>`},

let IMGS={}, IMGS_FAIL=false, _imgP=null;
const imgsReady=()=>Object.keys(IMGS).length>0;
function loadImgs(){ if(imgsReady())return Promise.resolve(); if(_imgP)return _imgP;
 _imgP=new Promise((ok,no)=>{const s=document.createElement("script");s.src="anh-luoi.js";
  s.onload=()=>{if(window.ANH_LUOI){IMGS=window.ANH_LUOI;ok()}else{_imgP=null;no()}};s.onerror=()=>{_imgP=null;no()};document.head.appendChild(s)});
 return _imgP;}
setTimeout(()=>{loadImgs().catch(()=>{})},3000);
</script>
<script>
/* ---------- storage ---------- */
const KEY="yhct15:v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
let S=Object.assign({done:{},cards:{},notes:{},quiz:{},log:{}},load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const ymd=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
const today=()=>ymd(new Date());
const addDays=(d,n)=>{const [y,m,dd]=d.split("-").map(Number);return ymd(new Date(y,m-1,dd+n))};
const logToday=()=>{S.log[today()]=(S.log[today()]||0)+1};

/* ---------- simple spaced repetition (demo; app thật dùng FSRS) ---------- */
function addCards(lid){LESSONS[lid].cards.forEach((c,i)=>{const k=lid+"#"+i;if(!S.cards[k])S.cards[k]={due:today(),ivl:0,ease:2.5}})}
const cardExists=k=>{const [lid,i]=k.split("#");return !!(LESSONS[lid]&&LESSONS[lid].cards[+i])};
function dueCards(){return Object.entries(S.cards).filter(([k,c])=>c.due<=today()&&cardExists(k))
 .sort((a,b)=>(a[1].seen||0)-(b[1].seen||0)).map(([k])=>k)}
function rate(k,r){const c=S.cards[k]; c.seen=Date.now();
 if(r===1){c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.due=today()}
 else{const base=c.ivl||0; let n= r===2?Math.max(1,Math.round(base*1.2)) : r===3?(base?Math.round(base*c.ease):1) : (base?Math.round(base*c.ease*1.3):3);
  if(r===2)c.ease=Math.max(1.3,c.ease-.15); if(r===4)c.ease+=.15; c.ivl=n; c.due=addDays(today(),n)}
 logToday(); save()}

/* ---------- nav ---------- */
const TABS=[["home","日","Hôm nay"],["lessons","課","Bài học"],["review","習","Ôn tập"],["mat","眼","Luyện mắt"],["lib","典","Tra cứu"]];
let tab="home";
function renderNav(){document.getElementById("nav").innerHTML=TABS.map(([id,ic,l])=>
 `<button type="button" data-tab="${id}" ${tab===id?'aria-current="page"':''}><span class="ic">${ic}</span>${l}</button>`).join("");
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab))}
function go(t,arg){tab=t;renderNav();window.scrollTo(0,0);({home,lessons,review,lib,lesson,mat})[t](arg)}
const $=s=>document.querySelector(s); const app=()=>document.getElementById("app");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- home ---------- */
const ORDER=()=>Object.keys(LESSONS).sort((a,b)=>parseFloat(a)-parseFloat(b));
function backupNag(){const n=Object.keys(S.done).length;if(n<3)return "";
 const last=S.lastBackup; const days=last?Math.round((new Date(today())-new Date(last))/864e5):null;
 if(days!==null&&days<14)return "";

function nextLesson(){return ORDER().find(id=>!S.done[id])}
function caseLesson(){const d=ORDER().filter(id=>S.done[id]);return d.length?d.sort((a,b)=>S.done[b].localeCompare(S.done[a]))[0]:nextLesson()}

 ${backupNag()}<ol class="steps">
  <li class="${revDone?'done':''}"><div><div class="t">Ôn thẻ đến hạn</div><div class="s">${due?due+" thẻ đang chờ":(nCards?"Đã ôn xong hôm nay":"Chưa có thẻ. Học bài đầu tiên để có thẻ ôn")}</div></div>
   <button type="button" class="btn ${due?'':'ghost'}" ${due?'':'disabled'} data-go="review">Ôn</button></li>
  <li class="${nl?'':'done'}"><div><div class="t">Bài mới</div><div class="s">${nl?esc(nl+" · "+LESSONS[nl].title):"Đã học hết các bài đã soạn"}</div></div>
   <button type="button" class="btn ${nl?'':'ghost'}" ${nl?'':'disabled'} data-l="${nl||''}">Học</button></li>
  <li><div><div class="t">Ca tình huống</div><div class="s">Nằm cuối mỗi bài học. Tự suy luận trước, rồi mới xem gợi ý.</div></div>
   <button type="button" class="btn ghost" data-l="${caseLesson()||''}" data-case="1">Mở</button></li>
 </ol>
 <div class="stats"><div><b>${nDone}</b><span>bài đã học</span></div><div><b>${nCards}</b><span>thẻ trong kho</span></div><div><b>${streak}</b><span>ngày liên tiếp</span></div></div>
 <p class="note">Bản demo: đã có ${ORDER().length} bài (${ORDER().join(", ")}) và 26 tượng lưỡi trong phần Tra cứu. Bài mới được xếp theo lộ trình, bắt đầu từ Tầng 1. Tiến độ lưu ngay trên thiết bị này.</p>`;
 app().insertAdjacentHTML("beforeend",`<div class="bk"><h3>Sao lưu tiến độ</h3>
 <p class="muted" style="font-size:.88rem">Tiến độ chỉ lưu trên máy này. Thỉnh thoảng tải file sao lưu về để phòng khi đổi máy hoặc xóa dữ liệu trình duyệt.</p>
 <button type="button" class="btn ghost" id="exp">Tải file sao lưu</button> <label class="btn ghost" for="imp" style="display:inline-block">Khôi phục từ file</label>
 <input type="file" id="imp" accept="application/json,.json" hidden><p id="bkmsg" class="muted" style="font-size:.85rem;margin-top:8px"></p></div>`);
 $("#exp").onclick=()=>{const blob=new Blob([JSON.stringify({app:"yhct15",v:1,at:new Date().toISOString(),data:S})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`yhct15-saoluu-${today()}.json`;document.body.appendChild(a);a.click();a.remove();S.lastBackup=today();save();
  $("#bkmsg").textContent="Đã tạo file sao lưu. Kiểm tra thư mục Tải về."};
 $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const j=JSON.parse(t);if(j.app!=="yhct15"||!j.data)throw 0;
  if(!confirm("Thay tiến độ hiện tại bằng dữ liệu trong file sao lưu?"))return;S=Object.assign({done:{},cards:{},notes:{},quiz:{},log:{}},j.data);save();go("home")})
  .catch(()=>{$("#bkmsg").textContent="File không đúng định dạng sao lưu của app. Chọn file yhct15-saoluu-….json."})};

 app().innerHTML=h;

  if(qa[qi]!==undefined)mark(qa[qi]); qz.appendChild(box)});
 function score(){const n=Object.keys(qa).length,r=Object.entries(qa).filter(([i,p])=>L.quiz[i].a===p).length;

 score();

/* ---------- LUYỆN MẮT: kho ảnh TCM-Tongue (luong-y-pictures) ---------- */
// Nguồn kho ảnh: ưu tiên GitHub Pages; nếu Pages chưa bật hoặc lỗi thì lấy thẳng từ kho file của GitHub.
const KHO_NGUON=[new URL("../luong-y-pictures/",location.href).href,
 "https://raw.githubusercontent.com/linhmai101-dev/luong-y-pictures/main/"];
let KHO_URL=KHO_NGUON[0];
let KHO=null,_khoP=null;
function layDanhMuc(){const thuTu=[];KHO_NGUON.forEach(n=>["danh-muc-app.json","danh-muc.json"].forEach(f=>thuTu.push([n,f])));
 let i=0;const thu=()=>fetch(thuTu[i][0]+thuTu[i][1]).then(r=>{if(!r.ok)throw 0;KHO_URL=thuTu[i][0];return r.json()})
 .catch(e=>{if(++i<thuTu.length)return thu();throw e});return thu()}
function loadKho(){ if(KHO)return Promise.resolve(KHO); if(_khoP)return _khoP;
 _khoP=layDanhMuc().then(m=>{
   const ma=m.ma_so, ten=c=>m.nhan[c].ten;
   m.anh=m.anh.filter(a=>!a.xung_dot);   // ảnh trùng mà nhãn mâu thuẫn: không dùng để hỏi, chấm
   m.anh.forEach(a=>{a.nh=[...new Set(a.khung.map(b=>ma[b[0]]).filter(Boolean))]});
   KHO={meta:m,anh:m.anh,ma,ten,gt:c=>m.nhan[c].giao_trinh,nhom:c=>m.nhan[c].nhom,
     codes:Object.values(ma)}; return KHO}).catch(e=>{_khoP=null;throw e});
 return _khoP;}
const imgUrl=id=>KHO_URL+"anh/"+id.slice(0,2)+"/"+id+".webp";
const luoiUrl=id=>KHO_URL+"luoi/"+id.slice(0,2)+"/"+id+".webp";   // bản cắt sát lưỡi từ ảnh gốc (nét hơn)
const dungLuoi=a=>!!a.cat&&!M().full&&!a._loiLuoi;
function M(){S.mat=S.mat||{seen:{},ok:{},wrong:[],conf:{},lv:"de",vung:false};return S.mat}
const inScope=c=>M().vung||KHO.gt(c);
const nhanCua=a=>a.nh.filter(inScope);
function pool(){const m=M(),anMo=m.anMo!==false;return KHO.anh.filter(a=>{const n=nhanCua(a).length;
 if(anMo&&a.q!==undefined&&a.q<20)return false;   // bỏ 20% ảnh kém nét nhất
 return n>0&&(m.lv==="de"?n===1:m.lv==="vua"?n<=2:true)})}
const pick=a=>a[Math.floor(Math.random()*a.length)];
let _ke=null;   // ảnh kế tiếp đã tải sẵn
function layAnh(){const p=pool();let a=_ke&&p.includes(_ke)?_ke:pick(p);_ke=pick(p);
 if(_ke){const im=new Image();im.crossOrigin="anonymous";im.src=dungLuoi(_ke)?luoiUrl(_ke.id):imgUrl(_ke.id)} return a}

"ban-dai":{nhin:"Lưỡi to dày hơn bình thường, gần như đầy miệng; thường kèm dấu răng ở rìa.",nghia:"Thủy thấp, đàm ẩm nội đình. Nhạt bệu: tỳ thận dương hư. Đỏ bệu: tỳ vị thấp nhiệt, đàm nhiệt.",nguon:"ZD 胖大舌"},
"sau-bac":{nhin:"Lưỡi nhỏ, mỏng hơn bình thường.",nghia:"Khí huyết lưỡng hư (nếu nhạt) hoặc âm hư hỏa vượng (nếu đỏ giáng, ít rêu).",nguon:"ZD 瘦薄舌"},
"diem-do":{nhin:"Chấm đỏ nhô lên trên mặt lưỡi, hay gặp ở đầu và rìa lưỡi. Ghi nhận vị trí và mật độ.",nghia:"Nhiệt cực ở tạng phủ hoặc huyết nhiệt; càng nhiều càng nhiệt. Đầu lưỡi: tâm hỏa; rìa lưỡi: can đởm hỏa; giữa lưỡi: vị trường nhiệt.",nguon:"ZD 点刺舌"},
"liet-van":{nhin:"Đường nứt, rãnh trên mặt lưỡi, nông sâu nhiều ít khác nhau. Phân biệt với nứt bẩm sinh: nông, có rêu phủ, không khó chịu.",nghia:"Âm huyết hư, tỳ hư thấp xâm. Đỏ giáng có nứt: nhiệt thịnh thương âm. Nhạt có nứt: huyết hư. Nhạt bệu dấu răng có nứt: tỳ hư thấp xâm.",nguon:"ZD 裂纹舌"},
"xi-ngan":{nhin:"Hai rìa lưỡi có vết lõm theo hình răng.",nghia:"Tỳ hư, thấp thịnh. Nhạt bệu ướt có dấu răng: hàn thấp hoặc dương hư thủy thấp. Đỏ nhạt có dấu răng: tỳ khí hư.",nguon:"ZD 齿痕舌"},
"bach-thai":{nhin:"Nhìn màu RÊU: trắng. Xem thêm dày hay mỏng (có thấy chất lưỡi qua rêu không), khô hay ướt.",nghia:"Có thể là rêu bình thường. Có bệnh thì chủ biểu chứng, hàn chứng, thấp; cũng gặp trong nhiệt chứng.",nguon:"TC; ZD 白苔"},
"hoang-thai":{nhin:"Rêu vàng; nhạt hay đậm, khô hay nhớt.",nghia:"Chủ nhiệt, lý chứng. Vàng nhớt: thấp nhiệt, đàm nhiệt, thực tích. Vàng ở đầu lưỡi: nhiệt thượng tiêu; giữa: vị trường; cuống: hạ tiêu.",nguon:"ZD 黄苔; TC"},
"hac-thai":{nhin:"Rêu tro đến đen, thường đậm ở cuống, nhạt dần ra đầu lưỡi. Quan trọng là khô hay ướt.",nghia:"Âm hàn nội thịnh (thường ướt trơn) hoặc lý nhiệt sí thịnh (thường khô). Thường xuất hiện khi bệnh đã kéo dài, nặng.",nguon:"ZD 灰黑苔; TC"},
"hoat-thai":{nhin:"Mặt lưỡi nhiều nước, bóng ướt, có khi như sắp nhỏ giọt.",nghia:"Thủy thấp, đàm ẩm: hàn thấp xâm nhập hoặc dương khí hư không vận hóa thủy dịch.",nguon:"ZD 滑苔"}
};
function giaiThich(a){const ds=a.nh;const dong=ds.map(c=>{const g=GIAI[c];
  if(!g)return `<li><b>${esc(KHO.ten(c))}</b> <span class="muted">(nhãn ngoài giáo trình – tham khảo; vị trí lõm/lồi theo phân vùng tạng phủ trên lưỡi)</span></li>`;
  return `<li><b>${esc(KHO.ten(c))}</b><br><span class="gt-k">Nhìn:</span> ${esc(g.nhin)}<br><span class="gt-k">Ý nghĩa:</span> ${esc(g.nghia)} <span class="pg">${esc(g.nguon)}</span></li>`}).join("");
 const co=c=>ds.includes(c),goi=[];
 if(co("bac-thai")&&co("hong-thiet"))goi.push("Lưỡi đỏ kèm bong rêu → hướng âm hư.");
 if(co("liet-van")&&co("hong-thiet"))goi.push("Lưỡi đỏ có vết nứt → nhiệt thịnh thương âm.");
 if(co("liet-van")&&(co("ban-dai")||co("xi-ngan")))goi.push("Nứt kèm bệu, dấu răng → tỳ hư thấp xâm.");
 if((co("ban-dai")||co("xi-ngan"))&&co("hoat-thai"))goi.push("Bệu, dấu răng, rêu trơn ướt → hàn thấp hoặc dương hư thủy thấp.");
 if(co("hong-thiet")&&co("hoang-thai"))goi.push("Lưỡi đỏ rêu vàng → thực nhiệt.");
 if(co("diem-do")&&co("hong-thiet"))goi.push("Lưỡi đỏ có điểm đỏ → nhiệt thịnh; xem điểm đỏ nằm ở đầu (tâm), rìa (can đởm) hay giữa (vị trường).");
 return `<div class="giai"><h3>Đọc ảnh này</h3><ul>${dong}</ul>${goi.length?`<p><b>Gợi ý kết hợp:</b> ${goi.join(" ")}</p>`:""}
 <p class="src-note">Bộ dữ liệu chỉ gán những đặc điểm nổi bật; ảnh có thể còn đặc điểm khác chưa gán nhãn (ví dụ rêu trắng). Một tấm ảnh chưa đủ để kết luận: cần đối chiếu vấn chẩn và mạch.</p></div>`}
// Cặp đặc điểm loại trừ nhau: chỉ khi đó mới chắc chắn "sai"
const LOAI_TRU=[["ban-dai","sau-bac"]];
function chacKhongCo(a,c){if(c==="binh-thuong")return a.nh.some(x=>x!=="binh-thuong"&&KHO.gt(x));
 if(a.nh.includes("binh-thuong")&&KHO.gt(c))return true;
 return LOAI_TRU.some(([x,y])=>(c===x&&a.nh.includes(y))||(c===y&&a.nh.includes(x)))}
const TOAN_THE=new Set(["toan-the","mau-luoi","hinh","mau-reu"]);   // nhãn toàn lưỡi: ghi tên ở đáy khung, xếp chồng
function boxes(a,cat){let g=0;const [X,Y,Wc,Hc]=cat||[0,0,1,1];return a.khung.map(b=>{const c=KHO.ma[b[0]];if(!c)return"";
 const toan=TOAN_THE.has(KHO.nhom(c));let [cx,cy,w,h]=b.slice(1);cx=(cx-X)/Wc;cy=(cy-Y)/Hc;w=w/Wc;h=h/Hc;
 const phai=cx+w/2>.7;   // khung sát mép phải: neo chữ bên phải để không bị cắt
 const st=(toan?`bottom:calc(${g++} * 1.5em * var(--k,1));top:auto;`:"")+(phai?`left:auto;right:0;transform-origin:${toan?"100% 100%":"100% 0"}`:"");
 return `<div class="bx${toan?" bx-t":""}" style="left:${(cx-w/2)*100}%;top:${(cy-h/2)*100}%;width:${w*100}%;height:${h*100}%"><i style="${st}">${esc(KHO.ten(c))}</i></div>`}).join("")}
function vungCat(a){let x0=1,y0=1,x1=0,y1=0;a.khung.forEach(([c,cx,cy,w,h])=>{x0=Math.min(x0,cx-w/2);y0=Math.min(y0,cy-h/2);x1=Math.max(x1,cx+w/2);y1=Math.max(y1,cy+h/2)});
 const mx=(x1-x0)*.12,my=(y1-y0)*.12;x0=Math.max(0,x0-mx);y0=Math.max(0,y0-my);x1=Math.min(1,x1+mx);y1=Math.min(1,y1+my);return [x0,y0,x1-x0,y1-y0]}
function canAnh(img){const ph=img.closest(".ph");if(!ph||ph.dataset.toan==="1"){if(ph){ph.style.aspectRatio="";ph.firstElementChild.style.transform="";ph.style.setProperty("--k",1)}return}
 const [x,y,w,h]=JSON.parse(ph.dataset.cat),W=img.naturalWidth,H=img.naturalHeight;if(!W||w>=.98&&h>=.98)return;
 ph.style.aspectRatio=(w*W)/(h*H);ph.firstElementChild.style.transform=`scale(${1/w}) translate(${-x*100}%,${-y*100}%)`;ph.style.setProperty("--k",w)}
function loiLuoi(img){const ph=img.closest(".ph");if(!ph)return;const a=KHO.anh.find(x=>x.id===ph.dataset.id);if(!a)return;
 a._loiLuoi=true;ph.closest(".phw").outerHTML=photo(a,ph.dataset.show==="1")}
function photo(a,show){const L=dungLuoi(a);
 return `<div class="phw"><div class="ph" data-id="${a.id}" data-show="${show?1:0}" data-cat='${JSON.stringify(L?[0,0,1,1]:vungCat(a))}' data-toan="${M().full?1:0}"><div class="phz"><img src="${L?luoiUrl(a.id):imgUrl(a.id)}" crossorigin="anonymous" alt="Ảnh lưỡi ${a.id}" onload="canAnh(this)" ${L?'onerror="loiLuoi(this)"':""}>${show?boxes(a,L?a.cat:null):""}</div></div><div class="src-note">Mã ảnh ${a.id} · TCM-Tongue (Dryad). Đáp án theo nhãn của bộ dữ liệu. <button type="button" class="linkbtn" data-nut-toan>${M().full?"Phóng vào lưỡi":"Xem toàn ảnh"}</button></div></div>`}
function mat(){
 app().innerHTML=`<h1>Luyện mắt</h1><p class="muted" style="margin:6px 0 4px">Luyện nhìn lưỡi trên ảnh thật. Đang tải kho ảnh…</p>`;
 loadKho().then(()=>matHome()).catch(()=>{app().innerHTML=`<h1>Luyện mắt</h1><div class="empty"><p>Chưa kết nối được kho ảnh lưỡi.</p><p style="font-size:.88rem">Kiểm tra kết nối mạng rồi mở lại tab này. Lần đầu cần có mạng để tải danh mục ảnh; sau đó ảnh đã xem dùng được cả khi offline.</p></div>`});}
function matHome(){const m=M(),p=pool(),nw=m.wrong.length;
 app().innerHTML=`<h1>Luyện mắt</h1><p class="muted" style="margin:6px 0 10px">${KHO.anh.length.toLocaleString("vi")} ảnh lưỡi thật, có nhãn do bác sĩ YHCT xác nhận.</p>
 <div class="seg" role="group" aria-label="Độ khó">${[["de","Dễ: 1 đặc điểm"],["vua","Vừa: ≤ 2"],["kho","Khó: tất cả"]].map(([k,t])=>`<button type="button" class="chip" aria-pressed="${m.lv===k}" data-lv="${k}">${t}</button>`).join("")}</div>
 <label style="font-size:.85rem;display:flex;gap:8px;align-items:center"><input type="checkbox" id="vung" ${m.vung?"checked":""}> Gồm nhãn vùng lõm/lồi (tham khảo, ngoài giáo trình)</label>
 <label style="font-size:.85rem;display:flex;gap:8px;align-items:center;margin-top:4px"><input type="checkbox" id="anmo" ${m.anMo!==false?"checked":""}> Ẩn ảnh kém nét (20% ảnh mờ nhất)</label>
 <p class="muted" style="font-size:.82rem">Số ảnh phù hợp: ${p.length.toLocaleString("vi")}</p>
 <div class="mode">
  <button type="button" data-m="mot"><b>Nhận diện</b><span>Chọn 1 đặc điểm có trong ảnh</span></button>
  <button type="button" data-m="tatca"><b>Chọn tất cả</b><span>Tích mọi đặc điểm thấy được</span></button>
  <button type="button" data-m="sai" ${nw?"":"disabled"}><b>Ôn ảnh làm sai</b><span>${nw} ảnh đang chờ</span></button>
  <button type="button" data-m="mau"><b>Xem mẫu</b><span>Ảnh theo từng đặc điểm</span></button>
 </div>
 <button type="button" class="btn ghost" id="tk">Thống kê điểm yếu</button>`;
 app().querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{m.lv=b.dataset.lv;save();matHome()});
 $("#vung").onchange=e=>{m.vung=e.target.checked;save();matHome()};
 $("#anmo").onchange=e=>{m.anMo=e.target.checked;save();matHome()};
 app().querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>({mot:qMot,tatca:qTatCa,sai:qSai,mau:xemMau})[b.dataset.m]());
 $("#tk").onclick=thongKe;}
function ghiNhan(a,tested,okSet){const m=M();tested.forEach(c=>{m.seen[c]=(m.seen[c]||0)+1;if(okSet.has(c))m.ok[c]=(m.ok[c]||0)+1});
 const sai=tested.some(c=>!okSet.has(c)); m.wrong=m.wrong.filter(x=>x!==a.id); if(sai){m.wrong.push(a.id);if(m.wrong.length>200)m.wrong.shift()}
 logToday();save()}
function navMat(again){return `<div style="display:flex;gap:8px;margin-top:12px"><button type="button" class="btn" id="tiep">Ảnh tiếp</button><button type="button" class="btn ghost" id="ve">Về Luyện mắt</button></div>`}
function bindNav(fn){$("#tiep").onclick=fn;$("#ve").onclick=matHome}
document.addEventListener("click",e=>{if(e.target.closest("[data-back]"))matHome();
 const f=e.target.closest("[data-nut-toan]");if(f){const m=M();m.full=!m.full;save();document.querySelectorAll(".ph").forEach(ph=>{const a=KHO.anh.find(x=>x.id===ph.dataset.id);if(a)ph.closest(".phw").outerHTML=photo(a,ph.dataset.show==="1")})}});
function qMot(){const m=M();const a=layAnh();const dung=pick(nhanCua(a));
 const ngoai=KHO.codes.filter(c=>!a.nh.includes(c)&&inScope(c));
 const cung=ngoai.filter(c=>KHO.nhom(c)===KHO.nhom(dung)), khac=ngoai.filter(c=>KHO.nhom(c)!==KHO.nhom(dung));
 const nhieu=shuffle([...shuffle(cung).slice(0,2),...shuffle(khac)]).slice(0,3);
 const opts=shuffle([dung,...nhieu]);
 app().innerHTML=`<button type="button" class="back" data-back>‹ Luyện mắt</button><h1>Nhận diện</h1><p class="muted" style="margin:6px 0">Bộ dữ liệu gán cho ảnh này đặc điểm nào?</p>${photo(a,false)}
 <div id="op">${opts.map(c=>`<button type="button" class="opt" data-c="${c}">${esc(KHO.ten(c))}</button>`).join("")}</div><div id="kq"></div>`;
 app().querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const c=b.dataset.c;
  const chac=c!==dung&&chacKhongCo(a,c);
  app().querySelectorAll(".opt").forEach(x=>{x.setAttribute("aria-disabled","true");x.style.pointerEvents="none";if(x.dataset.c===dung)x.classList.add("right");else if(x===b)x.classList.add(chac?"wrong":"unsure")});
  if(chac){m.conf[dung+"|"+c]=(m.conf[dung+"|"+c]||0)+1}
  ghiNhan(a,[dung],new Set(c===dung?[dung]:[]));
  $(".phw").outerHTML=photo(a,true);
  const tb=c===dung?"Đúng.":chac?"Chưa đúng: "+esc(KHO.ten(c))+" không thể cùng có với đặc điểm của ảnh.":"Bộ dữ liệu không gán “"+esc(KHO.ten(c))+"” cho ảnh này (có thể ảnh vẫn có, hãy tự đối chiếu), đặc điểm được gán là “"+esc(KHO.ten(dung))+"”.";
  $("#kq").innerHTML=`<p class="qscore">${tb}</p>`+giaiThich(a)+navMat();bindNav(()=>qMot())});}
function qTatCa(fixed,next){const m=M();const a=fixed||layAnh();const ds=KHO.codes.filter(inScope);const can=nhanCua(a);
 app().innerHTML=`<button type="button" class="back" data-back>‹ Luyện mắt</button><h1>Chọn tất cả</h1><p class="muted" style="margin:6px 0">Tích mọi đặc điểm chị thấy trong ảnh.</p>${photo(a,false)}
 <div class="ck">${ds.map(c=>`<label data-c="${c}"><input type="checkbox" value="${c}"> ${esc(KHO.ten(c))}</label>`).join("")}</div>
 <button type="button" class="btn finish" id="cham">Chấm điểm</button><div id="kq"></div>`;
 $("#cham").onclick=()=>{const chon=new Set([...app().querySelectorAll(".ck input:checked")].map(i=>i.value));
  let dung=0;app().querySelectorAll(".ck label").forEach(l=>{const c=l.dataset.c,co=can.includes(c),ch=chon.has(c);
   l.querySelector("input").disabled=true; if(co&&ch){l.classList.add("right");dung++} else if(co)l.classList.add("miss"); else if(ch)l.classList.add(chacKhongCo(a,c)?"wrong":"unsure")});
  const thuaDs=[...chon].filter(c=>!can.includes(c)&&chacKhongCo(a,c)),thua=thuaDs.length,ngoai=[...chon].filter(c=>!can.includes(c)&&!chacKhongCo(a,c)).length;
  thuaDs.forEach(c=>can.forEach(d=>{if(!chon.has(d))m.conf[d+"|"+c]=(m.conf[d+"|"+c]||0)+1}));
  ghiNhan(a,can,new Set(can.filter(c=>chon.has(c))));
  $(".phw").outerHTML=photo(a,true);$("#cham").remove();
  $("#kq").innerHTML=`<p class="qscore">Nhận ra ${dung}/${can.length} đặc điểm được gán${thua?`, chọn sai ${thua}`:""}${ngoai?`, ${ngoai} đặc điểm ngoài nhãn (tự đối chiếu)`:""}.</p><p class="src-note">Viền xanh: đúng · vàng nét đứt: bỏ sót · tím nét chấm: ngoài nhãn, chưa chắc sai · đỏ: chắc chắn sai.</p>`+giaiThich(a)+navMat();bindNav(next||(()=>qTatCa()))};}
function qSai(){const m=M();if(!m.wrong.length)return matHome();const id=m.wrong[0];const a=KHO.anh.find(x=>x.id===id);
 if(!a||!nhanCua(a).length){m.wrong.shift();save();return qSai()} qTatCa(a,qSai);}
function xemMau(code){const ds=KHO.codes.filter(inScope);code=code||ds[0];
 const list=shuffle(KHO.anh.filter(a=>a.nh.includes(code))).slice(0,24);
 app().innerHTML=`<button type="button" class="back" data-back>‹ Luyện mắt</button><h1>Xem mẫu</h1><div class="chips">${ds.map(c=>`<button type="button" class="chip" aria-pressed="${c===code}" data-c="${c}">${esc(KHO.ten(c))}</button>`).join("")}</div>
 <p class="muted" style="font-size:.85rem">${KHO.anh.filter(a=>a.nh.includes(code)).length.toLocaleString("vi")} ảnh có “${esc(KHO.ten(code))}”. Chạm ảnh để xem khung vị trí. ${KHO.gt(code)?"":"<b>Nhãn ngoài giáo trình – tham khảo.</b>"}</p>
 <div class="gal">${list.map(a=>`<img loading="lazy" crossorigin="anonymous" src="${imgUrl(a.id)}" alt="" data-id="${a.id}">`).join("")}</div>
 <button type="button" class="btn ghost finish" id="ve">Về Luyện mắt</button>`;
 app().querySelectorAll(".chip").forEach(b=>b.onclick=()=>xemMau(b.dataset.c));
 app().querySelectorAll(".gal img").forEach(im=>im.onclick=()=>{const a=KHO.anh.find(x=>x.id===im.dataset.id);
  const d=$("#zoom");d.innerHTML=photo(a,true);d.showModal()});
 $("#ve").onclick=matHome;}
function thongKe(){const m=M();const rows=KHO.codes.filter(c=>m.seen[c]).map(c=>[c,m.seen[c],m.ok[c]||0]).sort((x,y)=>(x[2]/x[1])-(y[2]/y[1]));
 const conf=Object.entries(m.conf).sort((a,b)=>b[1]-a[1]).slice(0,6);
 app().innerHTML=`<button type="button" class="back" data-back>‹ Luyện mắt</button><h1>Thống kê</h1>${rows.length?`<div class="tbl"><table class="stat"><tr><th>Đặc điểm</th><th>Gặp</th><th>Nhận ra</th><th>%</th></tr>
 ${rows.map(r=>`<tr><td>${esc(KHO.ten(r[0]))}</td><td>${r[1]}</td><td>${r[2]}</td><td>${Math.round(100*r[2]/r[1])}</td></tr>`).join("")}</table></div>`:`<div class="empty">Chưa có dữ liệu. Làm vài ảnh rồi quay lại.</div>`}
 ${conf.length?`<h2>Hay nhầm</h2><ul>${conf.map(([k,n])=>{const[a,b]=k.split("|");return `<li>${esc(KHO.ten(a))} → nhầm thành ${esc(KHO.ten(b))}: ${n} lần</li>`}).join("")}</ul>`:""}
 <button type="button" class="btn ghost finish" id="ve">Về Luyện mắt</button>`;$("#ve").onclick=matHome;}

Object.keys(S.done).forEach(id=>LESSONS[id]&&addCards(id));save();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
renderNav();home();
</script>
</body>
