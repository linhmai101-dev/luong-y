"1.10":{id:"1.10",tang:1,title:"Tạng Tỳ",han:"脾",src:SRC_LL+", tr.44–46",
hook:"Một người ăn kém, gầy sút, chân tay mỏi, môi nhợt, lại hay bầm tím dưới da. Năm dấu hiệu ở năm chỗ khác nhau. Có thể cùng một gốc không?",
reading:`
<p>Tỳ chủ vận hóa chất tinh vi trong đồ ăn để nuôi dưỡng cơ thể nên gọi là <b>“gốc của hậu thiên”</b>. <span class="pg">tr.44</span></p>
<p><b>Tỳ và vị phối hợp</b> <span class="pg">tr.44</span>: vị tiếp nhận, tiêu hóa thức ăn; tỳ hấp thu, vận chuyển chất dinh dưỡng. <b>Tỳ chủ thăng</b> (đưa tinh chất lên trên), <b>vị chủ giáng</b> (đưa cặn bã xuống dưới).</p>
<table><tr><th>Chức năng</th><th>Bình thường</th><th>Khi bệnh</th></tr>
<tr><td><b>Chủ vận hóa</b> (thức ăn và <b>thủy thấp</b>)</td><td>Vận hóa tốt gọi là <b>kiện vận</b>; thủy thấp được chuyển hóa liên tục, không ứ</td><td>Rối loạn tiêu hóa: ỉa chảy, ăn kém, mệt mỏi, gầy sút. Tỳ hư, thủy thấp ứ: <b>đàm ẩm, phù thũng</b>, xuống đại trường gây ỉa chảy, ứ ở bụng thành <b>cổ trướng</b>. Thấp ngược lại làm trở ngại tỳ: <b>thấp khốn tỳ</b>. Vì vậy “tỳ chủ thấp mà lại ghét thấp”</td></tr>
<tr><td><b>Chủ tứ chi</b></td><td>Dương khí từ tinh vi thủy cốc giúp tay chân hoạt động</td><td>Vận hóa rối loạn: tay chân hoạt động yếu kém</td></tr>
<tr><td><b>Chủ cơ nhục</b>, vinh nhuận ra <b>môi</b></td><td>Bắp thịt đầy đặn; môi đầy đặn, sắc tươi nhuận</td><td>Gầy yếu, cơ nhục teo nhẽo. Tỳ hư: môi khô, không tươi. Tỳ kiệt: môi teo, mỏng, vêu lên, khô héo</td></tr>
<tr><td><b>Thống nhiếp huyết</b></td><td>Tỳ khí kiện vận giữ huyết đi trong mạch. “Tỳ là nguồn sinh huyết, tâm là tạng chủ về huyết”</td><td>Tỳ khí hư mất thống nhiếp: huyết thấm ra ngoài mạch, <b>xuất huyết dưới da, xuất huyết nội tạng</b></td></tr>
<tr><td><b>Khai khiếu ra miệng</b></td><td>Muốn ăn, ăn ngon miệng</td><td>Tỳ hư: chán ăn, miệng nhạt</td></tr></table>
<p><b>Quan hệ:</b> tỳ biểu lý với <b>vị</b>. Tâm hỏa sinh tỳ thổ, tỳ thổ sinh phế kim; can mộc khắc tỳ thổ, tỳ thổ khắc thận thủy. <span class="pg">tr.46</span></p>`,
checkTitle:"Khi khám, nghĩ đến tỳ khi thấy",
checklist:["Ăn uống: thèm ăn hay chán ăn, miệng nhạt? Đầy bụng sau ăn?","Đại tiện: phân lỏng, ỉa chảy?","Thể trạng: gầy sút, cơ nhẽo, mệt, tay chân mỏi yếu?","Môi: đầy đặn tươi hay khô, nhợt, mỏng?","Có phù, đàm nhiều, bụng to (cổ trướng) không?","Có dễ bầm tím, chảy máu, rong kinh không?"],
quiz:[
{q:"Vì sao tỳ được gọi là “gốc của hậu thiên”?",o:[["Vì tỳ chứa tinh tiên thiên","Sai: tinh tiên thiên tàng ở thận."],["Vì tỳ vận hóa chất tinh vi trong đồ ăn để nuôi dưỡng cơ thể","Đúng."],["Vì tỳ thuộc thổ ở trung ương","Sai: không phải lý do sách nêu."],["Vì tỳ thống huyết","Sai."]],a:1,p:"44"},
{q:"Theo sách, tỳ chủ … và vị chủ …:",o:[["Tỳ giáng, vị thăng","Sai: ngược lại."],["Tỳ thăng, vị giáng","Đúng: tỳ đưa tinh chất lên, vị đưa cặn bã xuống."],["Cả hai đều thăng","Sai."],["Cả hai đều giáng","Sai."]],a:1,p:"44"},
{q:"“Thấp khốn tỳ” nghĩa là:",o:[["Tỳ hư sinh thấp","Sai: đó là chiều tỳ hư làm thấp ứ."],["Thủy thấp ngưng đọng làm trở ngại hoạt động của tỳ","Đúng."],["Tỳ khô táo","Sai."],["Thấp ở da","Sai."]],a:1,p:"45"},
{q:"Tỳ hư, thủy thấp không được chuyển hóa có thể gây:",o:[["Đàm ẩm, phù thũng, ỉa chảy, cổ trướng","Đúng."],["Mắt đỏ","Sai."],["Ù tai","Sai."],["Mất ngủ","Sai."]],a:0,p:"45"},
{q:"Tỳ kiệt thì môi:",o:[["Đỏ tươi","Sai."],["Teo, mỏng, vêu lên, khô héo","Đúng."],["Tím","Sai."],["Đầy đặn","Sai: đó là tỳ kiện vận."]],a:1,p:"45"},
{q:"Xuất huyết dưới da do tỳ khí hư là vì tỳ mất chức năng:",o:[["Vận hóa","Sai."],["Thống nhiếp huyết","Đúng."],["Chủ tứ chi","Sai."],["Khai khiếu ra miệng","Sai."]],a:1,p:"45"},
{q:"Câu nói nào sách dẫn về quan hệ tỳ và huyết?",o:[["“Tỳ tàng huyết”","Sai: can tàng huyết."],["“Tỳ là nguồn sinh ra huyết, tâm là tạng chủ về huyết”","Đúng."],["“Tỳ chủ huyết mạch”","Sai: tâm chủ huyết mạch."],["“Huyết về tỳ khi ngủ”","Sai: huyết về can."]],a:1,p:"45"},
{q:"Tỳ hư biểu hiện ở miệng là:",o:[["Miệng đắng","Sai: miệng đắng liên quan đởm khí nghịch (sẽ học ở lục phủ)."],["Chán ăn, miệng nhạt","Đúng."],["Lở miệng","Sai."],["Khô miệng","Sai."]],a:1,p:"45"},
{q:"Tỳ khắc tạng nào theo ngũ hành?",o:[["Thận","Đúng: tỳ thổ khắc thận thủy."],["Can","Sai: can khắc tỳ."],["Phế","Sai: tỳ sinh phế."],["Tâm","Sai: tâm sinh tỳ."]],a:0,p:"46"}
],
case:{v:"Nam, 50 tuổi. Ăn kém, miệng nhạt, ăn xong đầy bụng, phân lỏng. Người gầy dần, chân tay mỏi yếu, môi khô nhợt. Gần đây hay thấy vết bầm tím dưới da dù không va chạm.",
qs:["Ghép mỗi dấu hiệu với một chức năng của tỳ.","Vết bầm tím dưới da giải thích thế nào?","Nếu người này thêm phù nhẹ và người nặng nề, chị nghĩ đến cơ chế gì?"],
ans:`<p><b>1.</b> Ăn kém, đầy bụng, phân lỏng, gầy dần: <b>vận hóa</b>. Chân tay mỏi yếu: <b>chủ tứ chi</b>. Gầy, môi khô nhợt: <b>chủ cơ nhục, vinh ra môi</b>. Miệng nhạt, chán ăn: <b>khai khiếu ra miệng</b>. <span class="pg">LL tr.44–45</span></p>
<p><b>2.</b> Tỳ khí hư mất chức năng <b>thống nhiếp huyết</b>, huyết thấm ra ngoài mạch gây xuất huyết dưới da. <span class="pg">LL tr.45</span></p>
<p><b>3.</b> Tỳ hư không vận hóa được <b>thủy thấp</b>, thấp ứ thành phù; thấp lại làm trở ngại tỳ (<b>thấp khốn tỳ</b>), thành vòng luẩn quẩn. <span class="pg">LL tr.45</span></p>`},
cards:[["Tỳ là “gốc của …”?","Gốc của hậu thiên: vận hóa tinh vi thủy cốc nuôi cơ thể."],["Tỳ và vị: ai thăng, ai giáng?","Tỳ thăng (tinh chất lên), vị giáng (cặn bã xuống)."],["Tỳ vận hóa những gì?","Đồ ăn (tinh vi) và thủy thấp."],["Tỳ hư, thủy thấp ứ gây gì?","Đàm ẩm, phù thũng, ỉa chảy, cổ trướng."],["Thấp khốn tỳ là gì?","Thủy thấp ngưng đọng làm trở ngại hoạt động của tỳ."],["Tỳ chủ … và vinh nhuận ra …?","Chủ tứ chi, chủ cơ nhục; vinh nhuận ra môi."],["Tỳ thống nhiếp huyết: khi hư?","Huyết thấm ra ngoài mạch: xuất huyết dưới da, nội tạng."],["Tỳ khai khiếu ra miệng: khi hư?","Chán ăn, miệng nhạt."],["Tỳ biểu lý với?","Vị."]],
terms:[["Tỳ chủ vận hóa","脾主运化","pí zhǔ yùn huà"],["Tỳ thống huyết","脾统血","pí tǒng xuè"],["Tỳ chủ cơ nhục, tứ chi","脾主肌肉、四肢","pí zhǔ jī ròu, sì zhī"],["Tỳ khai khiếu ra miệng","脾开窍于口","pí kāi qiào yú kǒu"],["Gốc của hậu thiên","后天之本","hòu tiān zhī běn"],["Thấp khốn tỳ","湿困脾","shī kùn pí"]],
flags:["⚠️ Tr.44: sách viết “tỳ có tính thấp (ướt)… vị có tính táo (khô)”. Nhưng chính sách này ở tr.58 lại viết “tỳ ưa táo ghét thấp, vị ưa thấp ghét táo”, trùng với cách nói của giáo trình Trung Quốc (tỳ hỉ táo ố thấp). Khi học và thi, chị dùng câu ở tr.58: tỳ ưa táo, ghét thấp."]},

"1.11":{id:"1.11",tang:1,title:"Tạng Phế",han:"肺",src:SRC_LL+", tr.46–47",
hook:"Sau một đợt cảm, người bệnh không chỉ ho, ngạt mũi mà còn phù mặt, tiểu ít. Phổi thì liên quan gì đến nước tiểu?",
reading:`
<table><tr><th>Chức năng</th><th>Nội dung</th><th>Khi bệnh</th></tr>
<tr><td><b>Chủ khí, chủ hô hấp</b></td><td>Quản lý khí toàn thân; khí thủy cốc + thanh khí trời hợp thành <b>tông khí</b>; hít thanh khí, thải trọc khí</td><td></td></tr>
<tr><td><b>Trợ tâm, chủ trị tiết</b></td><td>Phế giữ chức <b>tướng phó</b>. Tâm chủ huyết, phế chủ khí, phối hợp cho khí huyết vận hành nhịp nhàng. “Khí là soái của huyết, huyết là mẹ của khí; khí hành thì huyết hành”</td><td></td></tr>
<tr><td><b>Chủ túc giáng, thông điều thủy đạo</b></td><td>Tinh khí của nước qua tỳ lên phế; phế khí túc giáng đưa thủy dịch theo thủy đạo tam tiêu xuống bàng quang. <b>“Phế là thượng nguồn của thủy”</b></td><td>Mất túc giáng: thủy dịch đọng ở thượng tiêu, <b>tiểu tiện không thông</b>, thậm chí <b>thủy thũng</b></td></tr>
<tr><td><b>Tuyên phát, chủ bì mao</b></td><td>Phân bố khí huyết, tân dịch ra toàn thân; đưa dinh dưỡng và <b>vệ khí</b> ra bì mao (da, lông, tóc, tuyến mồ hôi) để nuôi dưỡng, chống ngoại tà</td><td>Không tuyên phát: khí ủng trệ gây tức ngực, ngạt mũi, khó thở; tân dịch ủng trệ thành <b>đờm trọc</b>. Bệnh ở biểu: sợ lạnh, sợ gió, ngạt mũi, ho. Phế khí hư: da lông khô, <b>dễ cảm mạo</b></td></tr>
<tr><td><b>Khai khiếu ra mũi</b>, thông với họng, chủ tiếng nói</td><td>Mũi ngửi, thở nhờ phế khí</td><td>Ngoại tà xâm nhập: ngạt mũi, chảy nước mũi, không ngửi thấy mùi. Bệnh ở họng, tiếng nói: đau họng, mất tiếng</td></tr></table>
<p><b>Quan hệ:</b> phế biểu lý với <b>đại trường</b>. Tỳ thổ sinh phế kim, phế kim sinh thận thủy; tâm hỏa khắc phế kim, phế kim khắc can mộc. <span class="pg">tr.47</span></p>
<p class="muted">Liên hệ bài 1.06: vệ khí do thượng tiêu phân bố đi ngoài mạch, điều lý đóng mở lỗ chân lông. Ở đây sách giải thích “ai” đưa vệ khí ra bì mao: chính là chức năng tuyên phát của phế.</p>`,
checkTitle:"Khi khám, nghĩ đến phế khi thấy",
checklist:["Ho, khó thở, tức ngực? Đờm nhiều hay ít?","Ngạt mũi, chảy nước mũi, mất ngửi?","Đau họng, khàn hoặc mất tiếng?","Sợ lạnh, sợ gió, dễ cảm? Da lông khô?","Phù vùng mặt, tiểu ít (thủy đạo)?","Hơi thở ngắn, nói không đủ hơi (tông khí)?"],
quiz:[
{q:"Phế giữ chức gì theo Tố Vấn (Linh lan bí điển luận)?",o:[["Quân chủ","Sai: đó là tâm."],["Tướng quân","Sai: đó là can."],["Tướng phó, việc trị tiết từ đó mà ra","Đúng."],["Thương lẫm","Sai: không phải nội dung sách nêu ở đây."]],a:2,p:"46"},
{q:"“Khí là soái của huyết, huyết là mẹ của khí” nằm trong phần chức năng nào?",o:[["Phế chủ bì mao","Sai."],["Phế trợ tâm, chủ trị tiết","Đúng: tâm chủ huyết, phế chủ khí phối hợp."],["Phế khai khiếu ra mũi","Sai."],["Phế túc giáng","Sai."]],a:1,p:"46"},
{q:"Vì sao nói “phế là thượng nguồn của thủy”?",o:[["Vì phế chứa nước","Sai."],["Vì phế khí túc giáng đưa thủy dịch theo thủy đạo tam tiêu xuống bàng quang","Đúng."],["Vì phế sinh thận","Sai: đó là ngũ hành, không phải lý do sách nêu."],["Vì phế làm ra mồ hôi","Sai."]],a:1,p:"47"},
{q:"Phế mất chức năng túc giáng có thể gây:",o:[["Tiểu tiện không thông, thủy thũng","Đúng."],["Chảy máu cam","Sai."],["Quáng gà","Sai."],["Móng giòn","Sai."]],a:0,p:"46–47"},
{q:"Theo sách, “tuyên phát” là:",o:[["Đưa xuống dưới","Sai: đó là túc giáng."],["Phân bố, tán phát khí huyết, tân dịch ra mọi nơi","Đúng."],["Giữ huyết trong mạch","Sai."],["Hít vào","Sai."]],a:1,p:"47"},
{q:"Phế khí hư không tuyên phát ra bì mao dẫn tới:",o:[["Da lông khô, dễ bị cảm mạo","Đúng."],["Phù thũng","Sai: liên quan túc giáng."],["Mất ngủ","Sai."],["Ăn kém","Sai."]],a:0,p:"47"},
{q:"Tân dịch ủng trệ ở phế (không tuyên phát) thành:",o:[["Đờm trọc","Đúng."],["Mồ hôi","Sai."],["Huyết ứ","Sai."],["Nước tiểu","Sai."]],a:0,p:"47"},
{q:"Phế biểu lý với:",o:[["Vị","Sai."],["Tiểu trường","Sai."],["Đại trường","Đúng."],["Bàng quang","Sai."]],a:2,p:"47"},
{q:"Phế khắc tạng nào?",o:[["Can","Đúng: phế kim khắc can mộc."],["Tâm","Sai: tâm khắc phế."],["Thận","Sai: phế sinh thận."],["Tỳ","Sai: tỳ sinh phế."]],a:0,p:"47"}
],
case:{v:"Sau đợt gió lạnh, bệnh nhân sợ gió, ngạt mũi, chảy nước mũi, ho, tức ngực, khàn tiếng. Một tuần sau mặt và mi mắt hơi phù, tiểu ít.",
qs:["Giai đoạn đầu: các dấu hiệu liên quan chức năng nào của phế?","Giai đoạn sau: phù mặt, tiểu ít giải thích thế nào?","Một bệnh nhân khác hay cảm vặt quanh năm, da khô. Theo sách, nghĩ đến gì?"],
ans:`<p><b>1.</b> Ngoại tà vào bì mao, phế không tuyên phát: sợ gió, ho, tức ngực (khí ủng trệ). Ngạt mũi, chảy nước mũi: <b>khai khiếu ra mũi</b>. Khàn tiếng: phế <b>chủ tiếng nói, thông với họng</b>. <span class="pg">LL tr.47</span></p>
<p><b>2.</b> Phế mất <b>túc giáng, không thông điều thủy đạo</b>: thủy dịch đọng ở thượng tiêu, tiểu tiện không thông, thành thủy thũng; vì phế là thượng nguồn của thủy nên phù bắt đầu ở mặt. <span class="pg">LL tr.46–47</span></p>
<p><b>3.</b> <b>Phế khí hư</b>, không tuyên phát ra bì mao: da lông khô, chức năng bảo vệ giảm, dễ cảm mạo (liên hệ vệ khí, bài 1.06). <span class="pg">LL tr.47</span></p>`},
cards:[["Phế giữ chức gì?","Tướng phó; việc trị tiết từ đó mà ra."],["Phế chủ khí: tông khí từ đâu?","Khí thủy cốc + thanh khí trời."],["Khí và huyết quan hệ thế nào (theo phần phế)?","Khí là soái của huyết, huyết là mẹ của khí; khí hành thì huyết hành."],["Túc giáng, thông điều thủy đạo là gì?","Phế khí đưa thủy dịch theo tam tiêu xuống bàng quang; phế là thượng nguồn của thủy."],["Mất túc giáng gây gì?","Thủy đọng thượng tiêu, tiểu không thông, thủy thũng."],["Tuyên phát là gì?","Phân bố khí huyết, tân dịch, vệ khí ra toàn thân và bì mao."],["Phế không tuyên phát gây gì?","Tức ngực, ngạt mũi, khó thở; tân dịch ủng trệ thành đờm trọc."],["Phế khí hư ở bì mao?","Da lông khô, dễ cảm mạo."],["Phế khai khiếu, thông, chủ?","Khai khiếu ra mũi, thông với họng, chủ tiếng nói."],["Phế biểu lý với?","Đại trường."]],
terms:[["Phế chủ khí","肺主气","fèi zhǔ qì"],["Phế chủ tuyên phát","肺主宣发","fèi zhǔ xuān fā"],["Phế chủ túc giáng","肺主肃降","fèi zhǔ sù jiàng"],["Thông điều thủy đạo","通调水道","tōng tiáo shuǐ dào"],["Phế chủ bì mao","肺主皮毛","fèi zhǔ pí máo"],["Tướng phó chi quan","相傅之官","xiàng fù zhī guān"],["Khí vi huyết soái, huyết vi khí mẫu","气为血帅，血为气母","qì wéi xuè shuài, xuè wéi qì mǔ"]],
flags:[]},

"1.12":{id:"1.12",tang:1,title:"Tạng Thận (và Mệnh môn)",han:"肾 · 命门",src:SRC_LL+", tr.47–50",
hook:"Ông cụ 72 tuổi vừa ho hen hít vào khó, vừa ù tai, tiểu đêm, tóc bạc rụng. Ho hen là bệnh phổi, sao sách lại bảo chữa bằng bổ thận?",
reading:`
<table><tr><th>Chức năng</th><th>Nội dung</th><th>Khi bệnh</th></tr>
<tr><td><b>Tàng tinh</b></td><td>Tàng cả tinh tiên thiên và hậu thiên; hậu thiên luôn bổ sung cho tiên thiên. Tác dụng của thận tinh gọi là <b>thận khí</b>, quyết định sinh trưởng, phát dục, sinh sản (thiên quý)</td><td>Thận <b>âm</b> hư: hư nhiệt (nội nhiệt). Thận <b>dương</b> hư: ngoại hàn (sợ lạnh, chân tay lạnh)</td></tr>
<tr><td><b>Chủ cốt, sinh tủy</b>, thông với <b>não</b>, vinh ra <b>tóc</b></td><td>Tinh sinh tủy nuôi xương; não là bể chứa tủy; tóc là phần tươi tốt phô ra ngoài của thận</td><td>Thận tinh hư: chậm mọc răng, chậm biết đi, xương mềm. Cốt tý: người lạnh, sưởi không ấm, khớp co cứng. Tinh hư tủy ít: mệt, mất ngủ, hay quên. Thận khí suy: tóc bạc, dễ rụng</td></tr>
<tr><td><b>Chủ thủy</b></td><td>Phần trọc của tân dịch về thận; nhờ khí hóa, phần thanh hóa khí lên phế, phần trọc thành nước tiểu</td><td>Thận khí không đủ: <b>thủy thũng</b></td></tr>
<tr><td><b>Chủ nạp khí</b></td><td>Đại khí do phế hít vào được thận tiếp nạp</td><td>Thận hư không nạp khí: khí nghịch lên gây <b>ho hen, khó thở</b>. Hen suyễn, ho ở người cao tuổi chữa bằng <b>bổ thận (nạp khí) lẫn bổ phế</b></td></tr>
<tr><td><b>Khai khiếu ra tai</b> và <b>nhị âm</b></td><td>Tai do thận tinh nuôi dưỡng. Tiền âm (tiểu tiện, sinh dục), hậu âm (đại tiện, nhờ thận khí hóa cho tỳ dương): <b>“thận chủ nhị tiện”</b></td><td>Ù tai, điếc. Tiểu luôn ở người già, đái dầm ở trẻ em, di tinh, khí hư ở phụ nữ. Người già: đại tiện lỏng hoặc táo</td></tr></table>
<p><b>Thiên quý theo Nội kinh</b> <span class="pg">tr.48</span>: nữ 7 tuổi thận khí thịnh; 14 thiên quý đến, mạch nhâm thông, mạch xung thịnh, có kinh; 35 mạch dương minh bắt đầu suy; 49 thiên quý cạn, hết kinh. Nam 8 tuổi thận khí thực; 16 thiên quý đến; 24 thận khí quân bình; 40 suy dần; 56 thiên quý kiệt; 64 râu tóc bạc, mệt mỏi.</p>
<p><b>Mệnh môn</b> <span class="pg">tr.50</span>: thận tàng tinh là <b>nguyên âm (chân thủy)</b>; mệnh môn liên quan nguyên khí, là <b>nguyên dương (chân hỏa)</b>. Quan hệ thận và mệnh môn hỏa: “âm dương hỗ căn, thủy hỏa tương tế”. Mệnh môn suy bại, nguyên khí khô kiệt, âm dương ly quyết thì sinh mệnh kết thúc.</p>
<p><b>Quan hệ:</b> thận biểu lý với <b>bàng quang</b>. Phế kim sinh thận thủy, thận thủy sinh can mộc; tỳ thổ khắc thận thủy, thận thủy khắc tâm hỏa. <span class="pg">tr.49</span></p>`,
checkTitle:"Khi khám, nghĩ đến thận khi thấy",
checklist:["Tuổi tác và sự suy yếu theo tuổi; trẻ em chậm mọc răng, chậm đi?","Sợ lạnh, chân tay lạnh (dương hư) hay nóng trong (âm hư)?","Ù tai, nghe kém? Tóc bạc sớm, rụng?","Tiểu nhiều, tiểu đêm, đái dầm, di tinh, khí hư?","Hen, khó thở kiểu hít vào khó, nặng dần theo tuổi?","Mệt mỏi, hay quên, mất ngủ kéo dài; phù?"],
quiz:[
{q:"Tác dụng của thận tinh được gọi là:",o:[["Thận âm","Sai."],["Thận khí","Đúng."],["Thiên quý","Sai: thiên quý là thứ đến khi thận khí thịnh."],["Mệnh môn","Sai."]],a:1,p:"48"},
{q:"Theo sách, thận dương hư biểu hiện:",o:[["Hư nhiệt, nội nhiệt","Sai: đó là thận âm hư."],["Ngoại hàn: sợ lạnh, chân tay lạnh","Đúng."],["Mắt đỏ","Sai."],["Ăn kém","Sai."]],a:1,p:"48"},
{q:"Theo Nội kinh (sách dẫn), nữ bao nhiêu tuổi thì thiên quý đến?",o:[["7","Sai: 7 tuổi thận khí thịnh, thay răng."],["14","Đúng."],["16","Sai: 16 là của nam."],["21","Sai."]],a:1,p:"48"},
{q:"“Não là bể chứa tủy” nên thận thông với não. Tinh hư tủy ít biểu hiện:",o:[["Mệt mỏi, mất ngủ, hay quên","Đúng."],["Mắt đỏ","Sai."],["Phù thũng","Sai."],["Chảy máu cam","Sai."]],a:0,p:"48"},
{q:"Thận hư không nạp khí gây:",o:[["Ho hen, khó thở do khí nghịch lên","Đúng."],["Ỉa chảy","Sai."],["Mất tiếng","Sai."],["Mắt lác","Sai."]],a:0,p:"49"},
{q:"Theo sách, hen suyễn, ho ở người cao tuổi chữa bằng:",o:[["Chỉ bổ phế","Sai: sách nói bổ thận lẫn bổ phế."],["Bổ thận (nạp khí) lẫn bổ phế","Đúng."],["Tả phế","Sai."],["Bổ tỳ","Sai."]],a:1,p:"49"},
{q:"“Thận chủ nhị tiện” vì:",o:[["Thận chứa phân và nước tiểu","Sai."],["Thận quản lý tiền âm và hậu âm","Đúng: tiền âm bài tiết nước tiểu, hậu âm đại tiện nhờ thận khí hóa cho tỳ dương."],["Thận sinh can","Sai."],["Thận chủ cốt","Sai."]],a:1,p:"49"},
{q:"Mệnh môn theo sách là:",o:[["Nguyên âm, chân thủy","Sai: đó là thận tàng tinh."],["Nguyên dương, chân hỏa tiên thiên","Đúng."],["Tông khí","Sai."],["Một tên khác của tâm bào","Sai."]],a:1,p:"50"},
{q:"Thận biểu lý với:",o:[["Đởm","Sai."],["Bàng quang","Đúng."],["Tiểu trường","Sai."],["Đại trường","Sai."]],a:1,p:"49"}
],
case:{v:"Ông 72 tuổi. Ho hen, hít vào khó, gắng sức thì nặng hơn. Ù tai, nghe kém. Tiểu đêm 3–4 lần. Tóc bạc nhiều, rụng. Hay sợ lạnh, chân tay lạnh.",
qs:["Mỗi dấu hiệu ứng với chức năng nào của thận?","Thiên về thận âm hư hay thận dương hư? Căn cứ?","Theo sách, hướng chữa phần ho hen của ông thế nào? Vì sao không chỉ chữa phế?"],
ans:`<p><b>1.</b> Ho hen, hít vào khó: thận <b>không nạp khí</b>. Ù tai, nghe kém: thận <b>khai khiếu ra tai</b>. Tiểu đêm: thận chủ <b>tiền âm</b> (tiểu luôn ở người cao tuổi). Tóc bạc rụng: thận <b>vinh ra tóc</b>, thận khí suy theo tuổi. <span class="pg">LL tr.48–49</span></p>
<p><b>2.</b> Sợ lạnh, chân tay lạnh là <b>ngoại hàn</b> → thiên về <b>thận dương hư</b>. <span class="pg">LL tr.48</span> (Liên hệ bài 1.02: dương hư tất ngoại hàn.)</p>
<p><b>3.</b> <b>Bổ thận (nạp khí) lẫn bổ phế.</b> Phế hít khí vào nhưng phải được thận tiếp nạp; thận hư thì khí nghịch lên gây hen, nên chỉ chữa phế là chưa đủ gốc. <span class="pg">LL tr.49</span> Bài thuốc cụ thể sẽ học ở Tầng 3 và bài 4.03 (Hen suyễn).</p>`},
cards:[["Thận tàng những tinh nào?","Tinh tiên thiên và tinh hậu thiên; hậu thiên bổ sung cho tiên thiên."],["Thận khí là gì?","Tác dụng của thận tinh; quyết định sinh trưởng, phát dục, sinh sản."],["Thận âm hư / thận dương hư?","Âm hư: hư nhiệt, nội nhiệt. Dương hư: ngoại hàn (sợ lạnh, chân tay lạnh)."],["Thiên quý: nữ / nam?","Nữ 14 tuổi đến, 49 cạn. Nam 16 tuổi đến, 56 kiệt."],["Thận chủ cốt sinh tủy, thông não: khi tinh hư?","Trẻ chậm mọc răng, chậm đi, xương mềm; người lớn mệt, mất ngủ, hay quên."],["Thận vinh ra đâu?","Tóc."],["Thận chủ thủy: khí hóa thế nào?","Phần thanh hóa khí lên phế, phần trọc thành nước tiểu; thận khí không đủ thì thủy thũng."],["Thận chủ nạp khí: khi hư? Chữa?","Khí nghịch gây ho hen, khó thở; bổ thận (nạp khí) lẫn bổ phế."],["Thận khai khiếu ra? Chủ gì?","Tai; chủ nhị âm (nhị tiện)."],["Mệnh môn là gì?","Nguyên dương, chân hỏa tiên thiên; với thận: âm dương hỗ căn, thủy hỏa tương tế."]],
terms:[["Thận tàng tinh","肾藏精","shèn cáng jīng"],["Thận chủ thủy","肾主水","shèn zhǔ shuǐ"],["Thận chủ nạp khí","肾主纳气","shèn zhǔ nà qì"],["Thận chủ cốt sinh tủy","肾主骨生髓","shèn zhǔ gǔ shēng suǐ"],["Thận khai khiếu ra tai","肾开窍于耳","shèn kāi qiào yú ěr"],["Thiên quý","天癸","tiān guǐ"],["Mệnh môn","命门","mìng mén"],["Thủy hỏa tương tế","水火相济","shuǐ huǒ xiāng jì"]],
flags:[]}

"1.13":{id:"1.13",tang:1,title:"Lục phủ và phủ kỳ hằng",han:"六腑 · 奇恒之腑",src:SRC_LL+", tr.50–54",
hook:"Một người vừa đi ngoài phân lỏng nhiều lần, lại vừa tiểu ít hẳn. Hai việc trái chiều này có thể do cùng một phủ không?",
reading:`
<p><b>Lục phủ</b>: đởm, vị, đại trường, tiểu trường, bàng quang, tam tiêu. Công năng chung: tiêu hóa đồ ăn thức uống, hấp thu và phân bố tân dịch, bài tiết cặn bã. <b>Chỉ chuyển tiếp mà không tàng chứa</b> nên gọi là <b>“phủ truyền hóa”</b>. <span class="pg">tr.50</span></p>
<table><tr><th>Phủ</th><th>Chức năng</th><th>Khi bệnh</th></tr>
<tr><td><b>Đởm</b></td><td>Vừa là túi rỗng vừa chứa mật nên vừa thuộc lục phủ vừa thuộc phủ kỳ hằng; gọi là “phủ trung tinh”. Chủ <b>quyết đoán</b> (chức trung chính). “Khí nhờ đởm mà mạnh, tà không can phạm được”</td><td>Đởm khí nghịch: <b>miệng đắng</b>; mật vào vị, vị khí nghịch: nôn ra nước đắng. Đởm khí hư nhược: tinh thần thất thường, mất ngủ, hay sợ sệt, nơm nớp không yên</td></tr>
<tr><td><b>Vị</b></td><td>“Bể của thủy cốc”, thu nhận và tiêu hóa thủy cốc; vừa là bể thủy cốc vừa là <b>gốc của khí huyết</b>. “Còn vị khí thì sống, mất vị khí thì chết”</td><td>Bụng chướng đầy, tiêu hóa kém, đói không muốn ăn, nôn, nuốt chua, hoặc nhanh tiêu chóng đói. Vị khí hư không thu nhận được cơm nước: tiên lượng phần nhiều không tốt</td></tr>
<tr><td><b>Tiểu trường</b></td><td><b>Phân biệt thanh trọc</b>: thanh được hấp thu; trọc lỏng thấm vào bàng quang, trọc đặc xuống đại trường. Chức “thu thịnh”</td><td>Không tách được thanh trọc: <b>tiểu ngắn, ít, thậm chí bí đái</b>, đồng thời <b>đại tiện lỏng</b></td></tr>
<tr><td><b>Đại trường</b></td><td>Hấp thu phần nước (“tế bí biệt trấp”), truyền tống cặn bã thành phân. Chức “truyền tống”</td><td>Hư hàn: sôi bụng, đau bụng, tiêu chảy. Thực nhiệt, dịch ruột khô: táo bón</td></tr>
<tr><td><b>Bàng quang</b></td><td>Thu chứa tân dịch, bài tiết nước tiểu nhờ khí hóa. Chức “châu đô”</td><td>Tân dịch thiếu: đái không thông. Đái quá nhiều: hao tân dịch</td></tr>
<tr><td><b>Tam tiêu</b></td><td>Đường đi của <b>nguyên khí</b> và của <b>nước</b>: chủ trì các khí, thông điều đường nước. Thượng tiêu: khí hóa của tâm phế; trung tiêu: tỳ vị; hạ tiêu: can thận</td><td></td></tr></table>
<p><b>Ba tiêu theo Linh khu</b> (Dinh vệ sinh hội) <span class="pg">tr.52–53</span>: <b>thượng tiêu như sương mù</b> (khí trời và khí thủy cốc phân bố ra cơ biểu); <b>trung tiêu như bọt nước sủi</b> (làm chín nhừ thủy cốc, hóa thành khí huyết tân dịch); <b>hạ tiêu như nước chảy</b> (gạn lọc thanh trọc, bài tiết cặn bã; chủ đưa ra mà không nhận vào).</p>
<p><b>Phủ kỳ hằng</b> <span class="pg">tr.53–54</span>: “kỳ” là khác, “hằng” là thường. <b>Hình thể giống phủ, tác dụng giống tạng.</b> Gồm sáu: <b>não, tủy, cốt, mạch, đởm, tử cung</b>.</p>
<ul><li><b>Não, tủy, xương:</b> đều do thận sinh. “Não là bể của tủy”. Não tủy đầy đủ: tai thính, mắt sáng, vận động nhanh nhẹn. Hao kém: váng đầu, ù tai, hoa mắt, tinh thần uể oải, nặng thì xây xẩm, ngã, hôn mê. “Tủy là chất làm đầy xương”.</li>
<li><b>Mạch:</b> liên quan chặt với tâm; nơi khí huyết vận hành theo hướng, quỹ đạo nhất định. “Mạch là chỗ ở của huyết, lấy khí làm gốc”, nên xem mạch biết được lượng huyết, tốc độ vận hành và quan hệ khí huyết.</li>
<li><b>Tử cung (bào cung):</b> chủ kinh nguyệt, chứa nuôi thai; liên quan mạch xung, nhâm (“<b>xung là bể huyết, nhâm chủ bào thai</b>”) và thận, can tàng huyết, tỳ sinh huyết, tâm chủ huyết mạch.</li></ul>`,
checkTitle:"Khi khám, hỏi về lục phủ",
checklist:["Miệng đắng? Nôn ra nước đắng?","Tính tình: quyết đoán hay nhút nhát, dễ hoảng, mất ngủ khi có chuyện?","Ăn uống: chướng đầy, nuốt chua, đói mà không muốn ăn, hay chóng đói?","Đại tiện lỏng hay táo, có sôi bụng, đau bụng không? Tiểu nhiều hay ít?","Với người bệnh nặng: còn ăn uống được không (vị khí)?","Chóng mặt, ù tai, hoa mắt, uể oải (não tủy)? Kinh nguyệt, thai sản (tử cung)?"],
quiz:[
{q:"Vì sao lục phủ gọi là “phủ truyền hóa”?",o:[["Vì chứa tinh khí","Sai: tàng chứa tinh khí là đặc điểm của ngũ tạng."],["Vì chỉ chuyển tiếp mà không tàng chứa","Đúng."],["Vì đều thuộc dương","Sai: không phải lý do sách nêu."],["Vì đều nằm ở bụng","Sai."]],a:1,p:"50"},
{q:"Đởm vừa thuộc lục phủ vừa thuộc phủ kỳ hằng vì:",o:[["Bám vào can","Sai: đó là vị trí, không phải lý do."],["Vừa là túi rỗng, vừa chứa nước mật","Đúng."],["Chủ quyết đoán","Sai."],["Có kinh đi qua mắt","Sai."]],a:1,p:"50"},
{q:"Miệng đắng theo sách là do:",o:[["Tỳ nhiệt","Sai: tỳ nhiệt thì miệng ngọt (bài 1.15)."],["Đởm khí nghịch lên","Đúng: nước mật vị đắng."],["Vị âm hư","Sai."],["Tâm hỏa","Sai."]],a:1,p:"50"},
{q:"“Còn vị khí thì sống, mất vị khí thì chết” vì:",o:[["Vị là gốc của khí huyết; khí huyết nuôi tạng phủ, chân tay từ tinh vi thủy cốc","Đúng."],["Vị chứa tinh tiên thiên","Sai."],["Vị chủ thần minh","Sai."],["Vị là phủ trung tinh","Sai: đó là đởm."]],a:0,p:"51"},
{q:"Tiểu trường mất chức năng phân biệt thanh trọc gây:",o:[["Táo bón, tiểu nhiều","Sai."],["Tiểu ít, có khi bí đái, kèm đại tiện lỏng","Đúng."],["Miệng đắng","Sai."],["Nôn mửa","Sai."]],a:1,p:"51"},
{q:"Đại trường hư hàn gây:",o:[["Táo bón","Sai: táo bón là đại trường thực nhiệt."],["Sôi bụng, đau bụng, tiêu chảy","Đúng."],["Bí đái","Sai."],["Nuốt chua","Sai."]],a:1,p:"51"},
{q:"Hai công năng chính của tam tiêu:",o:[["Chứa mật và quyết đoán","Sai: đó là đởm."],["Chủ trì các khí và thông điều đường nước","Đúng."],["Chứa tinh và nạp khí","Sai: đó là thận."],["Thu nạp và làm chín nhừ thủy cốc","Sai: đó là vị (và trung tiêu)."]],a:1,p:"52"},
{q:"Theo Linh khu, hạ tiêu được ví như:",o:[["Sương mù","Sai: thượng tiêu."],["Bọt nước sủi","Sai: trung tiêu."],["Nước chảy (rãnh khơi thông)","Đúng: chủ đưa ra mà không nhận vào."],["Bể chứa","Sai."]],a:2,p:"52–53"},
{q:"Phủ kỳ hằng gồm:",o:[["Não, tủy, cốt, mạch, đởm, tử cung","Đúng."],["Vị, tiểu trường, đại trường, bàng quang, tam tiêu, đởm","Sai: đó là lục phủ."],["Tâm bào, não, tủy, cốt, mạch, tử cung","Sai: tâm bào không thuộc phủ kỳ hằng."],["Não, tủy, cốt, mạch, vị, tử cung","Sai."]],a:0,p:"53"}
],
case:{v:"Nam, 40 tuổi. Mấy ngày nay đại tiện lỏng nhiều lần, tiểu tiện ít hẳn. Miệng đắng, có lúc nôn ra nước đắng. Vốn tính nhát, gặp chuyện là mất ngủ, nơm nớp không yên.",
qs:["Đại tiện lỏng cùng lúc với tiểu ít: phủ nào, cơ chế gì?","Miệng đắng, nôn ra nước đắng: giải thích theo sách.","Tính nhát, gặp chuyện là mất ngủ, nơm nớp: liên quan phủ nào?"],
ans:`<p><b>1.</b> <b>Tiểu trường</b> mất chức năng phân biệt thanh trọc: thủy dịch không thấm vào bàng quang nên tiểu ít, cả thanh lẫn trọc dồn xuống đại trường nên đại tiện lỏng. <span class="pg">LL tr.51</span></p>
<p><b>2.</b> <b>Đởm khí nghịch</b> lên gây miệng đắng; mật tiết vào vị, <b>vị khí nghịch</b> thì nôn ra nước đắng. <span class="pg">LL tr.50</span></p>
<p><b>3.</b> <b>Đởm khí hư nhược</b>: bị kích thích từ ngoài thì dễ rối loạn, mất ngủ, sợ sệt, nơm nớp không yên. <span class="pg">LL tr.50</span></p>`},
cards:[["Lục phủ gồm những gì? Vì sao gọi là phủ truyền hóa?","Đởm, vị, đại trường, tiểu trường, bàng quang, tam tiêu; chỉ chuyển tiếp mà không tàng chứa."],["Đởm: tên gọi, chức năng?","Phủ trung tinh; chủ quyết đoán. Khí nghịch: miệng đắng. Khí hư: hay sợ, mất ngủ."],["Vị là gì?","Bể của thủy cốc, gốc của khí huyết. Còn vị khí thì sống, mất vị khí thì chết."],["Tiểu trường chủ gì? Khi bệnh?","Phân biệt thanh trọc. Bệnh: tiểu ít, bí đái kèm đại tiện lỏng."],["Đại trường: hư hàn / thực nhiệt?","Hư hàn: sôi bụng, đau bụng, tiêu chảy. Thực nhiệt: táo bón."],["Tam tiêu hai công năng?","Chủ trì các khí (đường của nguyên khí) và thông điều đường nước."],["Thượng, trung, hạ tiêu ví như?","Sương mù; bọt nước sủi; nước chảy."],["Phủ kỳ hằng?","Não, tủy, cốt, mạch, đởm, tử cung; hình giống phủ, tác dụng giống tạng."],["Não tủy hao kém?","Váng đầu, ù tai, hoa mắt, uể oải; nặng thì xây xẩm, ngã, hôn mê."],["Xung, nhâm với tử cung?","Xung là bể huyết, nhâm chủ bào thai."]],
terms:[["Lục phủ","六腑","liù fǔ"],["Phủ truyền hóa","传化之腑","chuán huà zhī fǔ"],["Phủ kỳ hằng","奇恒之腑","qí héng zhī fǔ"],["Phân biệt thanh trọc","泌别清浊","mì bié qīng zhuó"],["Thượng tiêu như sương mù…","上焦如雾，中焦如沤，下焦如渎","shàng jiāo rú wù, zhōng jiāo rú ōu, xià jiāo rú dú"],["Có vị khí thì sống","有胃气则生，无胃气则死","yǒu wèi qì zé shēng, wú wèi qì zé sǐ"],["Não là bể của tủy","脑为髓之海","nǎo wéi suǐ zhī hǎi"],["Xung là bể huyết, nhâm chủ bào thai","冲为血海，任主胞胎","chōng wéi xuè hǎi, rèn zhǔ bāo tāi"]],

"1.14":{id:"1.14",tang:1,title:"Quan hệ giữa ngũ tạng",han:"五脏之间的关系",src:SRC_LL+", tr.55–56",
hook:"Một người ăn kém, phân lỏng lâu ngày, rồi dần dần hồi hộp, hay quên, mất ngủ. Bệnh bắt đầu ở tạng nào, và vì sao lại lan sang tạng kia?",
reading:`
<p>Ngũ tạng nương tựa nhau, chế ước nhau. Bài này đi qua từng cặp theo sách; mỗi cặp nhớ <b>một mối nối</b> và <b>một hội chứng</b>. <span class="pg">tr.55–56</span></p>
<table><tr><th>Cặp</th><th>Mối nối</th><th>Khi rối loạn</th></tr>
<tr><td><b>Tâm – Thận</b></td><td>Tâm hỏa (dương trong dương), thận thủy (âm trong âm); <b>tâm thận giao nhau, thủy hỏa hỗ trợ</b></td><td>Tâm thận không giao hòa: <b>mất ngủ, hồi hộp, di tinh</b></td></tr>
<tr><td><b>Tâm – Phế</b></td><td>Tâm chủ huyết, phế chủ khí; khí thúc đẩy huyết, huyết đi kèm khí</td><td>Phế khí hư, tông khí không đủ: ứ huyết, <b>đau vùng ngực, tim đập rối loạn</b>. Tâm khí không đủ, huyết ứ: phế không tuyên giáng, <b>ho suyễn</b></td></tr>
<tr><td><b>Tâm – Tỳ</b></td><td>Tâm chủ huyết; tỳ sinh huyết, thống huyết</td><td>Tỳ hư không sinh huyết: <b>hồi hộp, hay quên, mất ngủ, sắc mặt xanh</b> (<b>tâm tỳ hư</b>). Tỳ không nhiếp huyết: xuất huyết</td></tr>
<tr><td><b>Tâm – Can</b></td><td>Can tàng huyết, tâm chủ huyết, phối hợp cho huyết tuần hành</td><td>Can tâm âm hư hoặc huyết hư: <b>hoảng hốt, hồi hộp, sắc mặt xanh, hoa mắt, chóng mặt, móng tay không nhuận</b></td></tr>
<tr><td><b>Can – Thận</b></td><td>Can tàng huyết, thận tàng tinh; tinh sinh huyết, huyết sinh tinh: <b>can thận tinh huyết đồng nguyên</b></td><td>Thủy suy không nuôi can mộc: <b>can âm suy, can dương vượng</b>. Can hỏa vượng lại hại thận âm</td></tr>

<p class="muted">Mẹo học: đọc theo cột giữa trước. Mỗi mối nối đều là một chức năng chị đã học ở bài 1.08–1.12 (tâm chủ huyết, tỳ sinh huyết, can tàng huyết, phế chủ khí, thận nạp khí…). Ghép hai chức năng lại là ra quan hệ.</p>`,

case:{v:"Nữ, 45 tuổi. Lâu nay ăn kém, mệt, phân lỏng. Mấy tháng gần đây thêm hồi hộp, hay quên, mất ngủ, sắc mặt xanh nhợt. Kinh nguyệt kéo dài nhiều ngày mới sạch.",
qs:["Bệnh bắt đầu ở tạng nào, lan sang tạng nào? Gọi tên theo sách.","Vì sao kinh nguyệt kéo dài?","Nếu một bệnh nhân nam khác cũng mất ngủ, hồi hộp nhưng kèm di tinh, chị nghĩ đến quan hệ nào?"],
ans:`<p><b>1.</b> Bắt đầu ở <b>tỳ</b> (ăn kém, mệt, phân lỏng: tỳ hư không vận hóa). Tỳ không sinh đủ huyết nên <b>tâm</b> huyết kém: hồi hộp, hay quên, mất ngủ, sắc mặt xanh. Sách gọi là <b>tâm tỳ hư</b>. <span class="pg">LL tr.55</span></p>
<p><b>2.</b> Tỳ hư <b>không nhiếp được huyết</b>, huyết đi sai đường. <span class="pg">LL tr.55</span> (Liên hệ bài 1.10: tỳ thống nhiếp huyết.)</p>
<p><b>3.</b> <b>Tâm thận không giao hòa</b>: thủy hỏa không hỗ trợ nhau, gây mất ngủ, hồi hộp, di tinh. <span class="pg">LL tr.55</span></p>`},
cards:[["Tâm – Thận: mối nối và bệnh?","Tâm thận giao nhau, thủy hỏa hỗ trợ. Không giao hòa: mất ngủ, hồi hộp, di tinh."],["Tâm – Phế: bệnh hai chiều?","Phế khí hư → ứ huyết, đau ngực, tim đập rối loạn. Tâm khí không đủ → phế không tuyên giáng, ho suyễn."],["Tâm tỳ hư là gì?","Tỳ hư không sinh huyết, tâm huyết kém: hồi hộp, hay quên, mất ngủ, sắc mặt xanh."],["Can tâm huyết hư biểu hiện?","Hoảng hốt, hồi hộp, sắc mặt xanh, hoa mắt, chóng mặt, móng không nhuận."],["Can thận tinh huyết đồng nguyên?","Can tàng huyết, thận tàng tinh; tinh sinh huyết, huyết sinh tinh."],["Thủy không nuôi mộc?","Can âm suy, can dương vượng; can hỏa vượng lại hại thận âm."],["Can tỳ bất hòa?","Ngực sườn đầy tức, không muốn ăn, đầy bụng, ợ hơi."],["Phế khí hư / tỳ khí hư?","Phế: thở ngắn, gấp, nói nhỏ, lười nói. Tỳ: mệt, ăn kém, ỉa lỏng."],["Phế – Thận; Thận – Tỳ?","Phế chủ khí, thận nạp khí (thận hư: đoản khí). Thận dương ôn tỳ (hư: ỉa chảy người già)."]],

"1.15":{id:"1.15",tang:1,title:"Quan hệ tạng – phủ, ngũ quan và các khiếu",han:"脏腑表里 · 五官九窍",src:SRC_LL+", tr.56–60",
hook:"Một người lở loét đầu lưỡi, bứt rứt, lại tiểu vàng đỏ, buốt rát. Lưỡi ở trên, bàng quang ở dưới. Sách nói sẽ chữa bằng cách “cho hỏa đi theo đường tiểu”. Vì sao?",
reading:`
<p><b>Giữa lục phủ</b> <span class="pg">tr.56–57</span>: phủ “<b>thực nhi bất mãn</b>” (đủ mà không đầy tràn). Bệnh cũng truyền giữa các phủ, ví dụ nhiệt ở bàng quang truyền tới tiểu trường làm đại tiện không thông, nhiệt bốc lên gây lở miệng; nhiệt ở đại trường chuyển đến vị gây ăn nhiều mà vẫn gầy.</p>
<p><b>Tạng phủ biểu lý tương hợp</b> <span class="pg">tr.57–59</span>: tạng là âm, thuộc lý; phủ là dương, thuộc biểu. Hai bên liên kết chủ yếu <b>qua đường kinh mạch</b>.</p>
<table><tr><th>Cặp</th><th>Khi bệnh</th><th>Gợi ý chữa (theo sách)</th></tr>
<tr><td><b>Tâm – Tiểu trường</b></td><td>Tâm hỏa vượng: mặt đỏ, vật vã, ngực nóng, lưỡi đỏ, loét. Chuyển xuống tiểu trường: tiểu đỏ, đái són, đái đau nóng, nặng thì đái ra máu</td><td><b>Lợi tiểu thanh tâm</b>: đưa tâm hỏa theo đường tiểu tiện ra ngoài</td></tr>
<tr><td><b>Can – Đởm</b></td><td>Đởm nhiệt: phiền táo, đắng miệng, dễ cáu, choáng váng, hoa mắt, đau sườn. Can nhiệt: miệng đắng, nôn ra nước mật đắng</td><td>Thuốc bình can thường thêm tả đởm hỏa, và ngược lại</td></tr>
<tr><td><b>Tỳ – Vị</b></td><td><b>Tỳ ưa táo ghét thấp, vị ưa thấp ghét táo; tỳ lấy thăng làm thuận, vị lấy giáng làm hòa.</b> Tỳ hư hạ hãm: ỉa chảy, sa sinh dục, sa trực tràng, rong huyết, băng kinh. Vị khí nghịch: nôn, nấc. Tỳ không vận hóa thủy thấp: mỏi mệt, phù, ỉa lỏng. Vị hỏa mạnh, vị âm hư: táo bón, loét miệng, chảy máu chân răng</td><td></td></tr>
<tr><td><b>Phế – Đại trường</b></td><td>Phế mất túc giáng: đại tiện không thông. Đại trường nhiệt uất: phế khí ủng tắc, ho, khạc đờm không ra, khó thở, nằm không yên</td><td>Tuyên phế hóa đàm không hiệu quả thì nghĩ đến <b>tả hạ trừ đàm</b> cho đờm theo đại tiện ra ngoài</td></tr>
<tr><td><b>Thận – Tam tiêu, Bàng quang</b></td><td>Thận khí không đủ: phù (<b>âm thủy</b>). Bàng quang khí hóa kém: đái dầm, tiểu dễ, dễ són đái. Phế không túc giáng: phù ở trên, không có nước tiểu ở dưới (<b>dương thủy</b>)</td><td></td></tr></table>
<p><b>Ngũ quan và cửu khiếu</b> <span class="pg">tr.59–60</span>: ngũ quan thông với tinh khí ngũ tạng; ngũ tạng yên hòa thì ngũ quan mới phát huy tác dụng.</p>
<ul><li><b>Mắt</b> (khiếu của can): can huyết hư thì mắt tối, hoa, nặng thì quáng gà. Năm phần của mắt ứng ngũ tạng: <b>con ngươi – thận, tròng đen – can, tròng trắng – phế, tia máu – tâm, mí mắt – tỳ</b>.</li>
<li><b>Tai</b> (thận, và tâm): thận hư thì ù, điếc; tâm mạch khí huyết không đủ thì thính lực giảm; can khí thịnh, can hỏa vượng cũng gây ù tai.</li>
<li><b>Mũi</b> (phế): phong hàn thì ngạt, chảy nước mũi, không ngửi rõ; nhiệt thịnh đốt phế thì <b>cánh mũi phập phồng</b>.</li>
<li><b>Miệng</b> (tỳ vị): <b>tỳ nhiệt thì miệng ngọt</b>, tỳ hư thì miệng nhạt, không biết vị; kinh khí tỳ vị kiệt thì môi mỏng gầy vêu.</li>
<li><b>Lưỡi</b> (tâm): tâm hỏa thịnh thì lưỡi đỏ thắm; tâm hỏa suy thì lưỡi nhợt; nhiệt tà ở kinh tâm thì lưỡi cứng.</li></ul>`,

{q:"Ho, khạc đờm không ra, kèm đại tiện không thông; tuyên phế hóa đàm không hiệu quả. Sách gợi ý:",o:[["Bổ phế","Sai."],["Tả hạ trừ đàm","Đúng: cho đờm trọc theo đại tiện ra ngoài."],["Phát hãn","Sai."],["Bổ thận nạp khí","Sai."]],a:1,p:"58"},
{q:"Phù ở trên, không có nước tiểu ở dưới do phế không túc giáng, sách gọi là:",o:[["Âm thủy","Sai: âm thủy do thận khí không đủ."],["Dương thủy","Đúng."],["Cổ trướng","Sai."],["Đàm ẩm","Sai."]],a:1,p:"59"},
{q:"Theo ngũ luân, tròng trắng của mắt thuộc:",o:[["Can","Sai: tròng đen thuộc can."],["Thận","Sai: con ngươi thuộc thận."],["Phế","Đúng."],["Tỳ","Sai: mí mắt thuộc tỳ."]],a:2,p:"60"},

case:{v:"Ca A: lở loét đầu lưỡi, bứt rứt, ngực nóng, mặt đỏ; tiểu vàng đỏ, buốt rát. Ca B: ho, đờm đặc khạc không ra, khó thở, nằm không yên; đã 4 ngày không đi ngoài.",
qs:["Ca A: cặp tạng phủ nào? Cơ chế?","Ca A: hướng chữa theo sách?","Ca B: cặp nào? Nếu thuốc tuyên phế hóa đàm không hiệu quả, sách gợi ý gì?"],
ans:`<p><b>1.</b> <b>Tâm – tiểu trường.</b> Tâm hỏa vượng (lưỡi loét, bứt rứt, mặt đỏ, ngực nóng) chuyển xuống tiểu trường (tiểu đỏ, buốt rát). <span class="pg">LL tr.57</span></p>
<p><b>2.</b> <b>Lợi tiểu thanh tâm</b>: nhờ tiểu trường gạn lọc thanh trọc, hỏa tà theo đường tiểu tiện ra ngoài. <span class="pg">LL tr.57</span></p>
<p><b>3.</b> <b>Phế – đại trường.</b> Đại trường nhiệt uất, đại tiện không thông làm phế khí ủng tắc. Tuyên phế hóa đàm không hiệu quả thì nghĩ đến <b>tả hạ trừ đàm</b>. <span class="pg">LL tr.58</span></p>`},
cards:[["Lục phủ “thực nhi bất mãn” là gì?","Đủ mà không đầy tràn."],["Tạng phủ biểu lý liên kết qua đâu?","Qua đường kinh mạch."],["Tâm hỏa chuyển xuống tiểu trường: triệu chứng, cách chữa?","Tiểu đỏ, đái són, đái nóng đau, nặng thì đái máu; lợi tiểu thanh tâm."],["Can – đởm trong điều trị?","Thuốc bình can thường thêm tả đởm hỏa và ngược lại."],["Tỳ – vị ưa ghét, thăng giáng?","Tỳ ưa táo ghét thấp, lấy thăng làm thuận. Vị ưa thấp ghét táo, lấy giáng làm hòa."],["Tỳ hư hạ hãm / vị khí nghịch / vị âm hư?","Hạ hãm: ỉa chảy, sa sinh dục, sa trực tràng, rong huyết. Nghịch: nôn, nấc. Âm hư: táo bón, loét miệng, chảy máu chân răng."],["Phế – đại trường trong điều trị?","Tuyên phế hóa đàm không hiệu quả thì tả hạ trừ đàm."],["Âm thủy / dương thủy?","Âm thủy: thận khí không đủ. Dương thủy: phế không túc giáng, phù ở trên, không có nước tiểu ở dưới."],["Ngũ luân của mắt?","Con ngươi – thận, tròng đen – can, tròng trắng – phế, tia máu – tâm, mí – tỳ."],["Miệng ngọt / nhạt / đắng?","Ngọt: tỳ nhiệt. Nhạt: tỳ hư. Đắng: đởm khí nghịch."]],
terms:[["Tạng phủ biểu lý","脏腑表里","zàng fǔ biǎo lǐ"],["Tâm di nhiệt ư tiểu trường","心移热于小肠","xīn yí rè yú xiǎo cháng"],["Tỳ hỉ táo ố thấp","脾喜燥恶湿","pí xǐ zào wù shī"],["Vị hỉ nhuận ố táo","胃喜润恶燥","wèi xǐ rùn wù zào"],["Tỳ khí hạ hãm","脾气下陷","pí qì xià xiàn"],["Dương thủy / Âm thủy","阳水 / 阴水","yáng shuǐ / yīn shuǐ"],["Ngũ luân","五轮","wǔ lún"],["Thực nhi bất mãn","实而不满","shí ér bù mǎn"]],

"1.16":{id:"1.16",tang:1,title:"Kinh lạc đại cương",han:"经络",src:SRC_LL+", tr.66–67, 79–83",
hook:"Ba người cùng đau đầu: một người đau đỉnh đầu, một người đau nửa đầu, một người đau sau gáy. Chỉ dựa vào vị trí đau, chị có biết bệnh liên quan tạng phủ nào không?",
reading:`
<p><b>Định nghĩa</b> <span class="pg">tr.66</span>: kinh lạc là tên chung của kinh mạch và lạc mạch. <b>Kinh</b> là đường thẳng, như cái khung, đi ở sâu; <b>lạc</b> là đường ngang, như cái lưới mắc vào khung, đi ở nông. Kinh lạc là đường vận hành của âm dương, khí huyết, tân dịch, nối cơ thể thành một chỉnh thể. Linh khu: “Kinh mạch là nơi khí huyết tuần hoàn để nuôi dưỡng âm dương, nhuận cân cốt, lợi quan tiết”.</p>
<p><b>Cấu tạo hệ kinh lạc</b> <span class="pg">tr.67, 79–82</span></p>
<ul><li><b>12 kinh chính</b>: ở tay 3 kinh âm (phế, tâm bào, tâm) và 3 kinh dương (đại trường, tam tiêu, tiểu trường); ở chân 3 kinh âm (tỳ, can, thận) và 3 kinh dương (vị, đởm, bàng quang). Mỗi kinh <b>thuộc</b> tạng (hay phủ) của mình và <b>liên lạc</b> với phủ (hay tạng) biểu lý. Ví dụ kinh thủ thái âm phế khởi ở trung tiêu, xuống liên lạc với đại trường, rồi thuộc vào phế.</li>
<li><b>8 mạch kỳ kinh</b>: đốc, nhâm, xung, đới, âm duy, dương duy, âm kiểu, dương kiểu.</li>
<li><b>12 kinh biệt</b> đi ra từ 12 kinh chính; <b>12 kinh cân</b> nối với đầu xương tứ chi, không vào phủ tạng; <b>15 biệt lạc</b> (từ 14 đường kinh và 1 tổng lạc); <b>tôn lạc</b> phân nhánh nhỏ từ biệt lạc; <b>phù lạc</b> nổi ở ngoài da.</li>
<li><b>Huyệt</b>: sách ghi 371 huyệt trên kinh (xem ⚠️) và khoảng 200 huyệt ngoài kinh.</li></ul>
<p><b>Vòng tuần hoàn khí huyết</b> <span class="pg">tr.82</span>: khép kín, bắt đầu từ phế:</p>
<p style="font-family:var(--serif)">Phế → Đại trường → Vị → Tỳ → Tâm → Tiểu trường → Bàng quang → Thận → Tâm bào → Tam tiêu → Đởm → Can → (về) Phế</p>
<p><b>Vai trò</b> <span class="pg">tr.83</span></p>
<ul><li><b>Sinh lý:</b> nơi khí huyết vận hành nuôi dưỡng; liên kết tạng, phủ, tứ chi, cửu khiếu, cân, mạch, xương, da thành khối thống nhất.</li>
<li><b>Bệnh lý:</b> kinh lạc trở ngại thì khí huyết không thông, dễ bị ngoại tà. Bệnh thường <b>truyền từ ngoài vào trong</b>: da, cơ nhục → tạng phủ, tức là <b>lạc mạch → kinh mạch → phủ tạng</b>. Bệnh tạng phủ cũng hiện ra trên đường kinh: vị nhiệt thì loét miệng; đau ngực do co thắt mạch vành ở tâm kinh.</li>
<li><b>Chẩn đoán (kinh lạc chẩn):</b> dựa vào đau, tức, chướng trên đường kinh. Ví dụ: <b>nhức đỉnh đầu – can; đau nửa đầu – đởm; đau sau gáy – bàng quang</b>.</li>
<li><b>Chữa bệnh:</b> Linh khu: kinh mạch “quyết định sống chết, chữa bách bệnh, điều hòa hư thực, không thể không thông”. Ứng dụng nhiều trong châm cứu, xoa bóp và <b>dùng thuốc</b>: học thuyết kinh lạc chỉ đạo <b>quy kinh</b> của thuốc. Ví dụ quế chi, ma hoàng vào phế nên chữa ho, cảm mạo; vào bàng quang nên có tác dụng lợi niệu.</li></ul>`,
checkTitle:"Khi khám, dùng kinh lạc để định vị",
checklist:["Đau ở đâu, lan theo đường nào (đỉnh đầu, nửa đầu, sau gáy, mặt trong hay ngoài chi)?","Điểm đau, tức, chướng có nằm trên đường đi của kinh nào?","Bệnh mới ở ngoài (da, cơ) hay đã vào trong (tạng phủ)?","Có dấu hiệu tạng phủ hiện ra trên đường kinh (loét miệng ở người vị nhiệt…)?","Khi chọn thuốc: vị thuốc quy kinh nào, có đúng tạng phủ đang bệnh không?"],
quiz:[
{q:"Theo sách, kinh và lạc khác nhau thế nào?",o:[["Kinh đi nông, lạc đi sâu","Sai: ngược lại."],["Kinh là đường thẳng, như khung, đi sâu; lạc là đường ngang, như lưới, đi nông","Đúng."],["Kinh chỉ có ở tay, lạc ở chân","Sai."],["Kinh chở khí, lạc chở huyết","Sai."]],a:1,p:"66"},
{q:"Vòng tuần hoàn khí huyết trong kinh mạch bắt đầu từ:",o:[["Kinh can","Sai: can là kinh cuối vòng."],["Kinh phế","Đúng: bắt đầu từ phế, cuối cùng đến can rồi trở về phế."],["Kinh tâm","Sai."],["Kinh thận","Sai."]],a:1,p:"82"},
{q:"Trong vòng tuần hoàn, kinh đứng ngay sau kinh vị là:",o:[["Đại trường","Sai: đại trường đứng trước vị."],["Tâm","Sai: tâm đứng sau tỳ."],["Tỳ","Đúng."],["Bàng quang","Sai."]],a:2,p:"82"},
{q:"12 kinh cân theo sách có đặc điểm:",o:[["Đi vào phủ tạng","Sai."],["Nối liền với các đầu xương ở tứ chi, không vào phủ tạng","Đúng."],["Nổi ở ngoài da","Sai: đó là phù lạc."],["Đi ra từ 14 đường kinh","Sai: đó là biệt lạc."]],a:1,p:"82"},
{q:"Bệnh thường truyền theo đường nào?",o:[["Từ tạng phủ ra da","Sai."],["Từ ngoài vào trong: lạc mạch → kinh mạch → phủ tạng","Đúng."],["Từ kinh âm sang kinh dương","Sai."],["Không theo quy luật","Sai."]],a:1,p:"83"},
{q:"Theo kinh lạc chẩn của sách, đau nửa đầu thuộc:",o:[["Can","Sai: nhức đỉnh đầu thuộc can."],["Đởm","Đúng."],["Bàng quang","Sai: đau sau gáy thuộc bàng quang."],["Vị","Sai."]],a:1,p:"83"},
{q:"“Quế chi, ma hoàng vào phế nên chữa ho, cảm mạo” minh họa khái niệm:",o:[["Quy kinh của thuốc","Đúng: học thuyết kinh lạc chỉ đạo quy kinh."],["Tính vị","Sai."],["Phối ngũ","Sai."],["Bào chế","Sai."]],a:0,p:"83"},
{q:"“Vị nhiệt thì loét miệng” minh họa:",o:[["Bệnh truyền từ ngoài vào trong","Sai."],["Bệnh tạng phủ biểu hiện trên đường kinh mạch đi qua","Đúng."],["Kinh lạc chẩn bằng máy","Sai."],["Tương sinh ngũ hành","Sai."]],a:1,p:"83"},
{q:"8 mạch kỳ kinh gồm:",o:[["Đốc, nhâm, xung, đới, âm duy, dương duy, âm kiểu, dương kiểu","Đúng."],["Đốc, nhâm và 6 kinh dương","Sai."],["12 kinh biệt","Sai."],["Tâm bào, tam tiêu và 6 kinh âm","Sai."]],a:0,p:"79–82"}
],
case:{v:"Ba bệnh nhân cùng đau đầu. Người A nhức vùng đỉnh đầu. Người B đau một bên, vùng thái dương, nửa đầu. Người C đau sau gáy, cứng gáy lan xuống vai.",
qs:["Theo kinh lạc chẩn của sách, mỗi người liên quan kinh nào?","Người A còn hay cáu, hoa mắt, tức sườn. Điều đó củng cố nhận định thế nào?","Biết bệnh ở kinh nào thì giúp gì cho việc chọn thuốc?"],
ans:`<p><b>1.</b> A: <b>can</b>; B: <b>đởm</b>; C: <b>bàng quang</b>. <span class="pg">LL tr.83</span></p>
<p><b>2.</b> Cáu gắt, hoa mắt, tức sườn đều là dấu hiệu can (bài 1.04, 1.09). Vị trí đau trên đường kinh và chức năng tạng cùng chỉ về can. <span class="pg">LL tr.28, 43–44</span></p>
<p><b>3.</b> Học thuyết kinh lạc chỉ đạo <b>quy kinh</b> của thuốc: chọn vị thuốc vào đúng kinh, đúng tạng phủ đang bệnh (ví dụ của sách: quế chi, ma hoàng vào phế, bàng quang). <span class="pg">LL tr.83</span> Quy kinh sẽ học kỹ ở Tầng 3 (bài 3.03).</p>`},

"1.17":{id:"1.17",tang:1,title:"Lục dâm (1): phong, hàn, thử",han:"六淫 · 风 寒 暑",src:SRC_LL+", tr.88–91",
hook:"Ba người cùng “cảm”: một người sợ lạnh, không ra mồ hôi, người đau mỏi; một người sốt, họng đỏ đau; một người giữa trưa hè sốt, mồ hôi đầm đìa, khát. Cùng là cảm, có phải cùng một tà?",
reading:`
<p><b>Ba nhóm nguyên nhân gây bệnh</b> <span class="pg">tr.88</span></p>
<ul><li><b>Ngoại nhân</b>: lục khí (phong, hàn, thử, thấp, táo, hỏa) khi thành tác nhân gây bệnh gọi là <b>lục dâm</b>.</li>
<li><b>Nội nhân</b>: <b>thất tình</b> (vui, giận, buồn, lo, nghĩ, kinh, sợ), gây bệnh khi quá mức hoặc khi chính khí suy giảm.</li>
<li><b>Bất nội ngoại nhân</b>: sang chấn, lao động, ăn uống, tình dục, trùng thú cắn…</li></ul>
<p><b>Đặc điểm chung của lục dâm</b> <span class="pg">tr.88–89</span>: từ ngoài vào, thường gây bệnh ngoại cảm, bệnh bì phu, kinh lạc, bệnh truyền nhiễm; hay <b>phối hợp</b> với nhau, trong đó <b>phong</b> xuất hiện nhiều nhất.</p>
<table><tr><th></th><th>Phong</th><th>Hàn</th><th>Thử</th></tr>
<tr><td>Chủ khí</td><td>Mùa xuân</td><td>Mùa đông</td><td>Mùa hạ (do hỏa nhiệt hóa ra)</td></tr>
<tr><td>Âm/dương</td><td>Dương tà</td><td>Âm tà</td><td>Dương tà</td></tr>
<tr><td>Tính chất</td><td>Đi <b>lên trên, ra ngoài</b>: bệnh ở đầu mặt, ở biểu (đau đầu, ra mồ hôi, sợ gió, mạch phù). <b>Di chuyển, đa biến</b>: đau khớp chạy chỗ, mẩn ngứa không cố định</td><td><b>Tổn dương khí</b> (gai rét, sợ lạnh; vào tỳ vị: bụng lạnh đau, nôn, phân nhão). <b>Ngưng trệ</b> gây đau tại chỗ. <b>Co rút</b>: tấu lý co lại nên sợ lạnh, sốt, <b>không ra mồ hôi</b>, đau mỏi, <b>mạch khẩn</b>; khớp co duỗi khó, tê</td><td>Hỏa nhiệt, <b>dễ thương âm</b>: sốt cao, phiền khát, ra mồ hôi, mạch hồng đại. <b>Thăng phát, dễ thương khí</b>: tấu lý khai mở, ra mồ hôi nhiều, tổn tân dịch: tâm phiền, tiểu đỏ, ít</td></tr></table>
<p><b>Phong</b> <span class="pg">tr.89</span></p>
<ul><li><b>Ngoại phong</b>: thương phong (sốt, sợ gió, ra mồ hôi, mạch phù hoãn, đau họng, ho, ngạt mũi); phong hàn (cảm lạnh, chảy nước mũi, sợ lạnh, sợ gió, mạch phù); phong nhiệt (sốt, sợ gió, họng đỏ đau, nước tiểu vàng, lưỡi đỏ, rêu vàng, mạch phù sác); phong thấp (khớp mạn tính, đau di chuyển); <b>phong thủy</b> (sốt, sợ gió, sau đó phù mi mắt, phù mặt, tiểu ít); phong chẩn (mày đay rải rác, ngứa).</li>
<li><b>Nội phong</b>: can huyết hư không nuôi cân mạch (<b>huyết hư sinh phong</b>), can dương thịnh sinh phong, <b>nhiệt cực sinh phong</b>. Gặp trong cơn tăng huyết áp dẫn đến tai biến mạch máu não, sốt cao co giật.</li></ul>
<p><b>Hàn</b> <span class="pg">tr.89–90</span>: <b>ngoại hàn</b> chia <b>thương hàn</b> (tổn thương phần cơ biểu) và <b>trúng hàn</b> (trực trúng vào tạng phủ). <b>Nội hàn</b> do dương khí suy giảm. Hai loại ảnh hưởng nhau: người dương hư nội hàn dễ cảm ngoại hàn; hàn tà tích tụ lại làm tổn dương khí.</p>
<ul><li>Cảm mạo phong hàn: sợ lạnh, sốt, không ra mồ hôi, đau đầu, đau mỏi khớp.</li>
<li><b>Hàn tý (thống tý)</b>: khớp đau dữ dội, chườm nóng dễ chịu, gặp lạnh đau tăng, co duỗi khó.</li>
<li>Nội hàn: sợ lạnh, chân tay lạnh, nôn ra nước trong, phân lỏng nát, mệt mỏi (tâm dương hư, thận dương hư, tỳ vị hư hàn…).</li></ul>
<p><b>Thử</b> <span class="pg">tr.90–91</span>: <b>thương thử</b> (nhẹ: sốt mùa hè, ra mồ hôi, tâm phiền, khát, mỏi mệt, tiểu ít); <b>trúng thử</b> (nặng: say nóng, say nắng, váng đầu, nôn, tức ngực; nặng thì bất tỉnh, khó thở, mồ hôi ra như tắm, chân tay lạnh); <b>thử thấp</b> (tâm phiền, khát, buồn nôn, ăn ít, tiểu ít, mỏi mệt, đại tiện nát; ỉa chảy mùa hè vì mùa hè thử thường kèm thấp).</p>`,

case:{v:"A: sợ lạnh nhiều, sốt nhẹ, không ra mồ hôi, đau đầu, đau mỏi khắp người. B: sốt, sợ gió, họng đỏ đau, nước tiểu vàng, rêu lưỡi vàng. C: giữa trưa hè làm ngoài trời, sốt, mồ hôi đầm đìa, khát, phiền, mệt, tiểu ít.",
qs:["Mỗi người bị tà gì? Dấu hiệu then chốt để phân biệt?","Người C đột nhiên váng đầu, nôn, rồi mồ hôi ra như tắm, chân tay lạnh. Nghĩ đến gì? Nhẹ hay nặng?","Vì sao người A không ra mồ hôi còn người C lại ra nhiều?"],
ans:`<p><b>1.</b> A: <b>phong hàn</b> (sợ lạnh nhiều, không mồ hôi, đau mỏi). B: <b>phong nhiệt</b> (họng đỏ đau, nước tiểu vàng, rêu vàng). C: <b>thương thử</b> (mùa hè, sốt, mồ hôi nhiều, khát, phiền, tiểu ít). <span class="pg">LL tr.89–91</span></p>
<p><b>2.</b> <b>Trúng thử</b>, thể nặng: say nắng, váng đầu, nôn, nặng thì bất tỉnh, mồ hôi ra như tắm, chân tay lạnh. <span class="pg">LL tr.91</span></p>
<p><b>3.</b> Hàn <b>co rút</b> làm tấu lý đóng lại nên không ra mồ hôi; thử <b>thăng phát</b> làm tấu lý khai mở nên ra nhiều mồ hôi. <span class="pg">LL tr.90–91</span> (Liên hệ bài 2.12 Vấn hàn nhiệt và 2.13 Vấn hãn.)</p>`},
cards:[["Ba nhóm nguyên nhân gây bệnh?","Ngoại nhân (lục dâm), nội nhân (thất tình), bất nội ngoại nhân (ăn uống, lao động, sang chấn, trùng thú…)."],["Đặc điểm chung lục dâm?","Từ ngoài vào; gây ngoại cảm, bệnh bì phu, kinh lạc, truyền nhiễm; hay phối hợp, phong nhiều nhất."],["Phong: chủ khí, âm dương, tính chất?","Mùa xuân; dương tà; đi lên, ra ngoài; di chuyển, đa biến."],["Nội phong do đâu?","Huyết hư sinh phong, can dương thịnh sinh phong, nhiệt cực sinh phong."],["Thương hàn / trúng hàn?","Thương hàn: tổn thương cơ biểu. Trúng hàn: trực trúng tạng phủ."],["Ba tính chất của hàn?","Âm tà tổn dương khí; ngưng trệ gây đau; co rút (tấu lý co, không mồ hôi, mạch khẩn)."],["Hàn tý (thống tý)?","Khớp đau dữ dội, chườm nóng dễ chịu, lạnh đau tăng."],["Thử: hai tính chất?","Hỏa nhiệt dễ thương âm; thăng phát dễ thương khí, ra nhiều mồ hôi."],["Thương thử / trúng thử / thử thấp?","Thương thử: nhẹ. Trúng thử: say nắng, nặng thì bất tỉnh. Thử thấp: phiền khát, buồn nôn, đại tiện nát."],["Phong thủy?","Sốt, sợ gió, rồi phù mi mắt, phù mặt, tiểu ít."]],

"1.18":{id:"1.18",tang:1,title:"Lục dâm (2): thấp, táo, hỏa",han:"湿 燥 火",src:SRC_LL+", tr.91–93",
hook:"Một người ở nhà ẩm thấp, đầu nặng như bó, người nặng nề, bệnh kéo dài mấy tháng không dứt. Vì sao bệnh do thấp lại hay dai dẳng như vậy?",
reading:`
<table><tr><th></th><th>Thấp</th><th>Táo</th><th>Hỏa (nhiệt)</th></tr>
<tr><td>Chủ khí</td><td>Cuối hạ (giữa hè và thu)</td><td>Cuối thu (bắt đầu lạnh, khô)</td><td></td></tr>
<tr><td>Ngoại / nội</td><td>Ngoại thấp: ở nơi ẩm thấp, lội nước, đi mưa. Nội thấp: tỳ kiện vận suy giảm. Hai loại ảnh hưởng nhau làm bệnh nặng hơn</td><td>Ngoại táo vào qua miệng mũi: <b>ôn táo</b>, <b>lương táo</b>. Nội táo: mồ hôi ra quá nhiều, tinh huyết hao kiệt làm tổn âm dịch</td><td>Nhiệt đa số là ngoại tà (phong nhiệt, thấp nhiệt, thử nhiệt). Hỏa đa số nội sinh (tâm hỏa, can hỏa vượng)</td></tr>
<tr><td>Tính chất</td><td><b>Nặng và đục</b>: đầu nặng, người nặng nề, tứ chi mỏi, da tê bì, khớp co duỗi khó, phân nhão, nước tiểu đục, khí hư nhiều, thấp chẩn chảy nước. <b>Dính ngưng</b>: bệnh kéo dài, dai dẳng, khó khỏi. <b>Âm tà</b>: cản trở khí (ngực bụng tức chướng, tiểu ít khó), tổn dương khí của tỳ (chướng bụng, phân lỏng, tiểu ít, phù)</td><td><b>Khô, tổn tân dịch</b>: miệng mũi khô, họng khô khát, da khô, táo bón, tiểu ít. <b>Dễ tổn phế</b> (phế ưa thanh túc, nhu nhuận; táo vào qua miệng mũi): ho khan, ít đờm, đờm dính khó khạc, có thể lẫn máu, khó thở, tức ngực</td><td><b>Dương tà, thượng thăng</b>: sốt cao, sợ nóng, phiền khát, ra mồ hôi, mạch hồng sác, tâm phiền, mất ngủ, miệng lưỡi viêm, đau đầu, mắt đỏ. <b>Tổn âm dịch</b>: khát, họng môi khô, táo bón, tiểu ít. <b>Sinh phong động huyết</b>: nhiệt cực sinh phong (sốt cao, mê sảng, co giật); bức huyết vong hành (xuất huyết dưới da, chảy máu cam, nôn máu, đại tiểu tiện ra máu, băng kinh)</td></tr></table>
<p><b>Các chứng thường gặp</b> <span class="pg">tr.91–93</span></p>
<ul><li><b>Thấp</b>: ngoại thấp gồm <b>phong thấp</b> (sốt, sợ gió, ra mồ hôi mà nhiệt không giải, đầu mình nặng nề, tứ chi đau tê), hàn thấp, thử thấp, thấp chẩn, thấp tý. Nội thấp: tỳ vị hư hàn, thủy thũng do tỳ thận dương hư, đới hạ (khí hư nhiều) do tỳ hư.</li>
<li><b>Táo</b>: <b>ôn táo</b> (sốt, hơi sợ gió, sợ lạnh, đau đầu, ít mồ hôi, khát, tâm phiền, mũi miệng khô, ho khan ít đờm, đờm có thể lẫn máu); <b>lương táo</b> (sợ lạnh, sốt, đau đầu, <b>không ra mồ hôi</b>, ho khan ít đờm, miệng mũi khô). Nội táo (“tân tổn”, “huyết táo”): miệng, họng, da, lông tóc khô, cơ nhục teo nhẽo, tiểu ít, táo bón.</li>
<li><b>Hỏa nhiệt</b>: ngoại cảm ôn nhiệt (sốt, hơi sợ gió sợ lạnh, đau đầu, họng sưng đau, khát, lưỡi đỏ, rêu vàng, mạch hồng sác). Nội thương: tâm hỏa vượng, can hỏa vượng, vị nhiệt; tổn phần âm sinh <b>hư hỏa</b> (thận, can, phế, tâm, vị âm hư): ngũ tâm phiền nhiệt, đạo hãn, mất ngủ, miệng họng khô, váng đầu, ù tai.</li></ul>
<p><b>Cần chú ý</b> <span class="pg">tr.93</span>: nội thấp, nội hàn, nội phong, nội nhiệt, nội táo <b>không phải lục dâm</b>, mà là biến hóa bệnh lý trong cơ thể. Biểu hiện giống nhau nhưng nguồn gốc và mức độ khác nhau.</p>`,

],
case:{v:"A: nữ, ở nhà thấp ẩm nhiều năm; đầu nặng như bó, người nặng nề, mỏi tứ chi, phân nhão, khí hư nhiều, bệnh dai dẳng nhiều tháng. B: mùa thu hanh khô, ho khan, ít đờm, đờm dính có lẫn máu, mũi họng khô, sốt, khát, tâm phiền.",
qs:["A bị tà gì? Kể các tính chất của tà đó thể hiện trong ca này.","B bị tà gì? Ôn hay lương? Căn cứ?","Nếu A có thêm ăn kém, chướng bụng, phù nhẹ, chị nghĩ thấp đã ảnh hưởng tạng nào?"],
ans:`<p><b>1.</b> <b>Thấp.</b> Nặng và đục: đầu nặng, người nặng nề, phân nhão, khí hư nhiều. Dính ngưng: bệnh dai dẳng. Nguồn: ngoại thấp do nơi ở ẩm thấp. <span class="pg">LL tr.91</span></p>
<p><b>2.</b> <b>Táo phạm phế</b>, thể <b>ôn táo</b>: sốt, khát, tâm phiền, mũi họng khô, ho khan, đờm lẫn máu (lương táo thì sợ lạnh, không ra mồ hôi). <span class="pg">LL tr.92</span></p>
<p><b>3.</b> <b>Tỳ</b>: thấp là âm tà dễ tổn dương khí của tỳ, gây chướng bụng, phân lỏng, tiểu ít, phù. Ngoại thấp và nội thấp ảnh hưởng nhau làm bệnh nặng hơn. <span class="pg">LL tr.91</span> (Liên hệ bài 1.10: thấp khốn tỳ.)</p>`},
cards:[["Thấp: chủ khí, ngoại và nội?","Cuối hạ. Ngoại thấp: ẩm ướt, lội nước, đi mưa. Nội thấp: tỳ kiện vận suy."],["Ba tính chất của thấp?","Nặng và đục; dính ngưng (dai dẳng); âm tà, cản trở khí, tổn tỳ dương."],["Táo: chủ khí, ngoại và nội?","Cuối thu. Ngoại táo qua miệng mũi (ôn táo, lương táo). Nội táo: mồ hôi quá nhiều, tinh huyết hao."],["Hai tính chất của táo?","Khô, tổn tân dịch; dễ tổn phế (ho khan, đờm dính, lẫn máu)."],["Ôn táo / lương táo?","Ôn: sốt, khát, phiền, ít mồ hôi, đờm có máu. Lương: sợ lạnh, không mồ hôi, ho khan."],["Nhiệt và hỏa khác nhau?","Nhiệt đa số ngoại tà; hỏa đa số nội sinh. Đều do dương mạnh sinh ra."],["Ba tính chất của hỏa nhiệt?","Dương tà thượng thăng; tổn âm dịch; sinh phong động huyết."],["Hư hỏa biểu hiện?","Ngũ tâm phiền nhiệt, đạo hãn, mất ngủ, miệng họng khô, váng đầu, ù tai."],["Nội thấp, nội hàn, nội phong… có phải lục dâm không?","Không; là biến hóa bệnh lý trong cơ thể, nguồn gốc và mức độ khác."]],
terms:[["Thấp tà","湿邪","shī xié"],["Táo tà","燥邪","zào xié"],["Hỏa nhiệt","火热","huǒ rè"],["Ôn táo / Lương táo","温燥 / 凉燥","wēn zào / liáng zào"],["Nhiệt cực sinh phong","热极生风","rè jí shēng fēng"],["Bức huyết vong hành","迫血妄行","pò xuè wàng xíng"],["Hư hỏa","虚火","xū huǒ"]],

"1.19":{id:"1.19",tang:1,title:"Thất tình",han:"七情",src:SRC_LL+", tr.88, 93–94",
hook:"Một người sau một cú sợ hãi đột ngột thì tiểu không tự chủ. Một người lo nghĩ nhiều tháng thì ăn không tiêu. Cảm xúc tác động vào thân thể bằng đường nào?",
reading:`
<p><b>Thất tình</b> là bảy loại cảm xúc: <b>hỷ</b> (vui mừng), <b>nộ</b> (giận dữ), <b>ưu</b> (lo lắng), <b>tư</b> (nghĩ), <b>bi</b> (buồn rầu), <b>khủng</b> (sợ hãi), <b>kinh</b> (kinh sợ). Bình thường không gây bệnh. Chỉ khi bị kích thích <b>quá mạnh hoặc kéo dài</b> mới làm rối loạn tạng phủ, khí huyết. <span class="pg">tr.93–94</span></p>
<p><b>Khác lục dâm:</b> lục dâm vào qua miệng mũi, bì phu; thất tình <b>ảnh hưởng trực tiếp nội tạng</b>, nên gọi là “<b>nội thương thất tình</b>”. Tình chí lấy tinh khí ngũ tạng làm cơ sở vật chất. <span class="pg">tr.94</span></p>
<p><b>Tình chí hại tạng</b> (Tố Vấn, Âm dương ứng tượng đại luận): giận quá hại <b>can</b>, mừng quá hại <b>tâm</b>, nghĩ quá hại <b>tỳ</b>, buồn quá hại <b>phế</b>, sợ quá hại <b>thận</b>.</p>
<table><tr><th>Tình chí</th><th>Ảnh hưởng đến khí</th><th>Giải thích của sách</th></tr>
<tr><td>Nộ (giận)</td><td>Khí thượng (xem ⚠️)</td><td></td></tr>
<tr><td>Hỷ (mừng)</td><td>Khí hoãn</td><td>Cười vui quá độ: tâm khí tán, thần không tàng ở tâm</td></tr>
<tr><td>Bi (buồn)</td><td>Khí tiêu</td><td>Phế khí tiêu, giảm sút ý chí</td></tr>
<tr><td>Khủng (sợ)</td><td>Khí hạ</td><td>Thận khí bất cố, khí hãm ở dưới, <b>nhị tiện mất điều chỉnh</b></td></tr>
<tr><td>Kinh (kinh sợ)</td><td>Khí loạn</td><td>Đột ngột kinh sợ: tâm mất chỗ dựa, thần mất chỗ tàng, hoảng loạn</td></tr>
<tr><td>Tư (nghĩ)</td><td>Khí kết</td><td>Khí ngưng trệ, chức năng vận hóa của tỳ giảm</td></tr></table>
<p><b>Ba tạng hay gặp nhất: tâm, can, tỳ</b> <span class="pg">tr.94</span></p>
<ul><li><b>Tâm</b> (tàng thần): đau vùng ngực, mất ngủ, ngủ không sâu, hay mê, hồi hộp trống ngực; nặng thì mê sảng, kích động.</li>
<li><b>Can</b> (sơ tiết): can khí uất, dễ cáu giận, đau mạng sườn, <b>thở dài thì dễ chịu</b>, “<b>mai hạch khí</b>” (cảm giác vướng ở họng), phụ nữ dễ rối loạn kinh nguyệt.</li>
<li><b>Tỳ</b> (vận hóa): ăn kém, bụng chướng đầy, rối loạn đại tiện.</li></ul>
<p>Thất tình có thể làm từng tạng phát bệnh riêng, hoặc nhiều tạng cùng lúc.</p>`,
checkTitle:"Khi khám, hỏi về tình chí",
checklist:["Gần đây có chuyện gì làm vui, giận, lo, buồn, sợ quá mức không? Kéo dài bao lâu?","Bệnh có nặng lên khi căng thẳng, cãi nhau, lo nghĩ không?","Thở dài có dễ chịu không? Có vướng họng như có hạt mắc không?","Ngủ: khó ngủ, ngủ không sâu, hay mê, hồi hộp?","Ăn uống, đại tiện thay đổi theo tâm trạng không?","Kinh nguyệt có rối loạn theo cảm xúc không?"],

{q:"Cười vui quá độ dẫn đến:",o:[["Phế khí tiêu","Sai: đó là buồn."],["Tâm khí tán, thần không tàng ở tâm","Đúng."],["Can khí uất","Sai."],["Thận khí bất cố","Sai."]],a:1,p:"94"},
{q:"Theo sách, thất tình gây bệnh hay gặp nhất ở ba tạng nào?",o:[["Tâm, can, tỳ","Đúng."],["Phế, thận, can","Sai."],["Tâm, phế, thận","Sai."],["Tỳ, phế, thận","Sai."]],a:0,p:"94"},
{q:"Dễ cáu giận, đau mạng sườn, thở dài thì dễ chịu, vướng họng như có hạt mắc là biểu hiện của:",o:[["Tâm","Sai."],["Can khí uất","Đúng: “mai hạch khí”."],["Tỳ","Sai."],["Thận","Sai."]],a:1,p:"94"},
{q:"Thất tình trở thành nguyên nhân gây bệnh khi:",o:[["Có bất kỳ cảm xúc nào","Sai: bình thường không gây bệnh."],["Kích thích quá mạnh hoặc kéo dài, hoặc chính khí suy giảm","Đúng."],["Chỉ khi gặp lục dâm","Sai."],["Chỉ ở người già","Sai."]],a:1,p:"94"}
],
case:{v:"Nữ, 38 tuổi, áp lực công việc kéo dài. Hay cáu, đau tức mạng sườn, hay thở dài, thở dài xong thì dễ chịu; cảm giác vướng ở họng như có hạt mắc, khạc không ra, nuốt không trôi. Kinh nguyệt thất thường. Dạo này lo nghĩ nhiều, ăn kém, bụng chướng.",
qs:["Những dấu hiệu nào thuộc can? Gọi tên theo sách.","Ăn kém, bụng chướng giải thích bằng tình chí nào, ảnh hưởng khí ra sao?","Một ông cụ sau cú sợ hãi đột ngột thì tiểu không tự chủ. Giải thích theo sách."],
ans:`<p><b>1.</b> Cáu giận, đau mạng sườn, thở dài thì dễ chịu, vướng họng như có hạt mắc (<b>mai hạch khí</b>), kinh nguyệt rối loạn: <b>can khí uất</b>. <span class="pg">LL tr.94</span></p>
<p><b>2.</b> <b>Tư</b> (lo nghĩ): <b>tư tắc khí kết</b>, khí ngưng trệ làm tỳ vận hóa kém, gây ăn kém, bụng chướng. Ở đây can và tỳ cùng phát bệnh (sách nói thất tình có thể làm nhiều tạng cùng bệnh). <span class="pg">LL tr.94</span></p>
<p><b>3.</b> <b>Khủng tắc khí hạ</b>: sợ hãi làm thận khí bất cố, khí hãm ở dưới, nhị tiện mất điều chỉnh. <span class="pg">LL tr.94</span></p>`},

"1.20":{id:"1.20",tang:1,title:"Đàm ẩm, huyết ứ, ăn uống, lao lực",han:"痰饮 · 瘀血",src:SRC_LL+", tr.95–96",
hook:"Một người không ho, không khạc ra đờm, nhưng sách vẫn bảo là có “đàm”. Đàm không nhìn thấy được thì dựa vào đâu mà nói có?",
reading:`
<p><b>Bất nội ngoại nhân</b> <span class="pg">tr.95</span></p>
<ul><li><b>Ăn uống</b> không hợp lý: no đói thất thường; ăn không sạch; quá nặng khẩu vị (nhiều thịt mỡ, phủ tạng, gia vị cay, rượu). Ảnh hưởng chức năng vận hóa, sinh bệnh.</li>
<li><b>Lao động</b>: bình thường giúp khí huyết lưu thông. <b>Lao lực quá độ</b> hoặc <b>tình dục quá độ</b> làm tinh, khí, huyết hao quá mức. Ngược lại <b>nghỉ ngơi quá nhiều</b>, không vận động làm khí huyết ngưng trệ, sức đề kháng giảm.</li>
<li><b>Chấn thương</b> (dao, gậy, tai nạn): ứ huyết sưng đau, chảy máu, gãy xương, có thể tổn thương tạng phủ. <b>Trùng thú cắn</b> (rắn độc, chó dại): nhẹ thì xây xát, nặng thì trúng độc, hôn mê, có thể tử vong.</li></ul>
<p><b>Đàm ẩm</b> <span class="pg">tr.95–96</span>: hiện tượng bệnh lý do sự phân bố, chuyển hóa tân dịch rối loạn, ngưng trệ. <b>Đàm</b> đục, đặc, dính; <b>ẩm</b> trong, loãng.</p>
<ul><li><b>Hữu hình</b>: nhìn thấy được, như đờm khạc ra trong khái thấu, háo suyễn.</li>
<li><b>Vô hình</b>: không bài xuất ra, chỉ thấy qua chứng trạng: hoa mắt, chóng mặt, choáng váng, buồn nôn, thậm chí mê sảng. Điều trị theo phép <b>hóa đàm, trừ ẩm</b> thì có hiệu quả.</li></ul>
<table><tr><th>Đàm ẩm ở</th><th>Biểu hiện</th></tr>
<tr><td>Phế</td><td>Ho, khạc đờm</td></tr><tr><td>Che lấp tâm khiếu</td><td>Tức ngực, tâm phiền, mê sảng</td></tr>
<tr><td>Vị</td><td>Đầy chướng bụng, ăn khó tiêu, lợm giọng buồn nôn</td></tr>
<tr><td>Kinh mạch, cân cốt</td><td>Loa lịch, đàm hạch, tay chân tê bì hay liệt</td></tr>
<tr><td>Thượng thăng lên đầu</td><td>Hoa mắt, chóng mặt, choáng váng</td></tr>
<tr><td>Hầu họng</td><td>Mai hạch khí</td></tr><tr><td>Tràn ra bì phu</td><td>Thủy thũng</td></tr></table>
<p><b>Huyết ứ</b> <span class="pg">tr.96</span>: huyết không lưu chuyển bình thường, ngưng trệ, hoặc thoát ra ngoài kinh mạch mà chưa tiêu tán. Nguyên nhân chủ yếu: <b>khí hư, khí trệ</b> (khí là động lực của huyết), hoặc <b>chấn thương</b> gây xuất huyết bên trong.</p>
<table><tr><th>Huyết ứ ở</th><th>Biểu hiện</th></tr>
<tr><td>Tâm</td><td>Đau tức vùng ngực, môi miệng xanh tím</td></tr><tr><td>Phế</td><td>Đau ngực, ho ra máu</td></tr>
<tr><td>Vị, trường</td><td>Nôn ra máu, đại tiện ra máu</td></tr><tr><td>Can</td><td>Đau mạng sườn, có thể nổi khối tích</td></tr>
<tr><td>Bào cung</td><td>Đau hạ vị, kinh nguyệt rối loạn, thống kinh, bế kinh, kinh sắc tím đen có cục, hoặc băng lậu</td></tr></table>`,
checkTitle:"Khi khám, hỏi để tìm đàm ẩm và huyết ứ",

case:{v:"Ca A: nam 50 tuổi, béo, hay ăn đồ béo ngọt, uống rượu. Thường hoa mắt, chóng mặt, buồn nôn, đầy bụng; buổi sáng ho khạc đờm đặc dính. Ca B: nữ 30 tuổi, mỗi kỳ kinh đau bụng dưới dữ dội, kinh sắc tím đen có cục.",
qs:["Ca A: nguyên nhân thuộc nhóm nào? Bệnh lý sinh ra là gì?","Ca A: phân biệt phần “hữu hình” và “vô hình” của bệnh, kèm vị trí theo sách.","Ca B: nghĩ đến gì? Theo sách, nguyên nhân thường do đâu?"],
ans:`<p><b>1.</b> <b>Bất nội ngoại nhân: ăn uống</b> quá nặng khẩu vị (béo ngọt, rượu) làm rối loạn vận hóa, tân dịch ngưng trệ thành <b>đàm ẩm</b>. <span class="pg">LL tr.95</span></p>
<p><b>2.</b> Hữu hình: đờm đặc dính khạc ra (đàm ở phế). Vô hình: hoa mắt, chóng mặt (đàm thượng thăng lên đầu), đầy bụng, buồn nôn (đàm đình ở vị). <span class="pg">LL tr.95–96</span></p>
<p><b>3.</b> <b>Huyết ứ ở bào cung.</b> Nguyên nhân chủ yếu: khí hư, khí trệ, hoặc chấn thương xuất huyết bên trong. <span class="pg">LL tr.96</span> Cách chọn pháp và bài thuốc sẽ học ở bài 2.30 (biện chứng khí huyết) và phần phụ khoa.</p>`},
cards:[["Ăn uống không hợp lý gồm?","No đói thất thường; không sạch; quá nặng khẩu vị (thịt mỡ, phủ tạng, cay, rượu)."],["Lao động thế nào thì gây bệnh?","Lao lực, tình dục quá độ (hao tinh khí huyết); nghỉ quá nhiều (khí huyết ngưng trệ)."],["Đàm và ẩm?","Đàm đục, đặc, dính; ẩm trong, loãng. Do tân dịch phân bố, chuyển hóa rối loạn."],["Đàm hữu hình / vô hình?","Hữu hình: đờm khạc ra. Vô hình: hoa mắt, chóng mặt, buồn nôn, mê sảng; chữa bằng hóa đàm, trừ ẩm."],["Đàm ở phế, tâm khiếu, vị?","Phế: ho khạc đờm. Tâm khiếu: tức ngực, phiền, mê sảng. Vị: đầy chướng, buồn nôn."],["Đàm ở kinh mạch, đầu, họng, bì phu?","Loa lịch, đàm hạch, tê bì; hoa mắt chóng mặt; mai hạch khí; thủy thũng."],["Huyết ứ là gì, do đâu?","Huyết ngưng trệ hoặc thoát ra ngoài mạch chưa tiêu; do khí hư, khí trệ, chấn thương."],["Huyết ứ ở tâm, phế, can?","Tâm: đau ngực, môi tím. Phế: đau ngực, ho máu. Can: đau sườn, khối tích."],["Huyết ứ ở bào cung?","Đau hạ vị, kinh rối loạn, thống kinh, bế kinh, kinh tím đen có cục, băng lậu."]],

"1.21":{id:"1.21",tang:1,title:"Phòng bệnh",han:"预防 · 治未病",src:SRC_LL+", tr.169–171",
hook:"Một nhân viên văn phòng ngồi máy tính 10 tiếng mỗi ngày, ít vận động, ăn mặn, ăn cay. Chưa có bệnh gì rõ ràng. Theo YHCT, chị sẽ dặn người này những gì?",
reading:`
<p><b>Đại cương</b> <span class="pg">tr.169</span>: Tố Vấn: “Bất trị khi đã bệnh, trị khi chưa bị bệnh”. Nội dung phòng bệnh gồm <b>hai vấn đề lớn</b>: <b>phòng bệnh khi chưa mắc bệnh</b> và <b>phòng bệnh khi đã mắc bệnh</b>.</p>
<p><b>Các danh y Việt Nam nêu cao thuật dưỡng sinh</b> <span class="pg">tr.169</span>: Tuệ Tĩnh (“Bế tinh, dưỡng khí, tồn thần; Thanh tâm, quả dục, thủ chân, luyện hình”); Hoàng Đôn Hòa (<i>Hoạt nhân toát yếu</i>: thanh tâm, tĩnh công, đạo dẫn); Đào Công Chính (<i>Bảo sinh diên thọ toản yếu</i>); Hải Thượng Lãn Ông (<i>Vệ sinh quyết yếu</i>).</p>
<p><b>1. Phòng bệnh khi chưa mắc bệnh</b>: <b>nâng cao chính khí</b> qua điều dưỡng tinh thần và rèn luyện thể lực. <span class="pg">tr.170–171</span></p>
<ul><li><b>Tu dưỡng tinh thần</b>: giận hại can, mừng hại tâm, lo hại tỳ, sợ hại thận, buồn hại phế, nên giữ tinh thần điềm tĩnh, thư thái, lạc quan, tránh tham vọng quá mức.</li>
<li><b>Thích ứng bốn mùa</b>: xuân dậy sớm, đi bách bộ; hè dậy sớm, luyện thở khí công; thu dậy lúc tảng sáng, giữ tinh thần yên bình; đông ngủ sớm dậy muộn, giữ ấm.</li>
<li><b>Ăn uống điều độ, tránh lạm dụng gia vị</b>: ăn nóng nhiều hại trường vị; béo ngọt nhiều dễ sinh mụn nhọt; <b>mặn nhiều làm mạch dễ ngưng trệ</b>; <b>cay nhiều làm gân cơ co cứng</b>; chua nhiều làm cơ bắp mềm nhẽo.</li>
<li><b>Lao động, nghỉ ngơi điều độ</b>: lao động đúng mức thì cường tráng; ít thì béo bệu, nê trệ; quá mức thì hao tổn, gầy mòn. <b>Nhìn lâu hại huyết, nằm lâu hại khí, ngồi lâu hại cơ nhục, đứng lâu hại cốt tủy, đi lâu hại cân.</b></li>
<li><b>Rèn luyện</b>: sinh hoạt nề nếp, khí công, dưỡng sinh… cho chính khí mạnh, tà khí không xâm nhập.</li>
<li><b>Phụ nữ</b>: khi hành kinh giữ ấm, kiêng thức ăn sống lạnh, không lao động nặng, không giao hợp, tinh thần thoải mái; khi có thai lao động nhẹ, ăn đầy đủ, không dùng thuốc bừa bãi; sau sinh giữ ấm, ăn đầy đủ. <b>Trẻ em</b>: ăn đủ, đúng giờ, giữ ấm mùa lạnh, thoáng mùa nóng, bú mẹ năm đầu.</li></ul>
<p><b>2. Phòng bệnh khi đã mắc bệnh</b> <span class="pg">tr.171</span>: <b>chẩn đoán sớm, điều trị ngay từ đầu</b> để ngăn bệnh từ nhẹ sang nặng, <b>từ biểu vào lý</b>, và ngăn biến chứng; chú ý chăm sóc, hộ lý; bệnh truyền nhiễm phải cách ly.</p>`,
checkTitle:"Khi tư vấn phòng bệnh, hỏi",
checklist:["Tinh thần: đang có căng thẳng, tham vọng, lo âu kéo dài?","Giờ ngủ, giờ dậy có hợp mùa không?","Khẩu vị thiên về mặn, cay, chua, béo ngọt hay ăn nóng?","Công việc: nhìn lâu, ngồi lâu, đứng lâu, đi lâu, hay nằm nhiều?","Phụ nữ: thói quen khi hành kinh, khi có thai, sau sinh?","Người đang bệnh nhẹ: đã điều trị sớm chưa, có nguy cơ chuyển nặng, vào lý?"],

{q:"“Ngồi lâu” theo sách làm tổn thương:",o:[["Huyết","Sai: nhìn lâu hại huyết."],["Khí","Sai: nằm lâu hại khí."],["Cơ nhục","Đúng."],["Cân","Sai: đi lâu hại cân."]],a:2,p:"171"},
{q:"“Nhìn lâu” theo sách hại:",o:[["Huyết","Đúng."],["Cốt tủy","Sai: đứng lâu hại cốt tủy."],["Cân","Sai."],["Khí","Sai."]],a:0,p:"171"},
{q:"Theo sách, ba tháng mùa đông nên:",o:[["Dậy sớm, đi bách bộ","Sai: đó là mùa xuân."],["Ngủ sớm dậy muộn, giữ ấm cơ thể","Đúng."],["Dậy lúc tảng sáng","Sai: đó là mùa thu."],["Dậy sớm, luyện thở khí công","Sai: đó là mùa hè."]],a:1,p:"170"},
{q:"Lao động ít theo sách làm cơ thể:",o:[["Cường tráng","Sai: đó là lao động đúng mức."],["Béo bệu, nê trệ","Đúng."],["Hao tổn, gầy mòn","Sai: đó là lao động quá mức."],["Không ảnh hưởng","Sai."]],a:1,p:"171"},
{q:"Khi hành kinh, phụ nữ nên:",o:[["Ăn đồ sống lạnh cho mát","Sai: phải kiêng sống lạnh."],["Giữ ấm, kiêng sống lạnh, không lao động nặng, tinh thần thoải mái","Đúng."],["Tập thể lực nặng","Sai."],["Uống thuốc bổ bất kỳ","Sai."]],a:1,p:"171"},
{q:"Mục tiêu của phòng bệnh khi đã mắc bệnh:",o:[["Chẩn đoán sớm, điều trị ngay, ngăn bệnh từ nhẹ sang nặng, từ biểu vào lý, ngăn biến chứng","Đúng."],["Chờ bệnh tự khỏi","Sai."],["Chỉ dùng dưỡng sinh","Sai."],["Chỉ cách ly","Sai: cách ly chỉ với bệnh truyền nhiễm."]],a:0,p:"171"}
],
case:{v:"Nhân viên văn phòng 35 tuổi, ngồi máy tính khoảng 10 tiếng mỗi ngày, ít vận động, hay ăn mặn và ăn cay, thường thức khuya. Chưa có bệnh rõ ràng. Gần đây bị cảm nhẹ, sợ gió, ngạt mũi nhưng định để tự khỏi.",
qs:["Theo sách, thói quen nào của người này đang hại gì?","Chị sẽ dặn người này những gì để phòng bệnh khi chưa mắc bệnh?","Với cơn cảm nhẹ hiện tại, theo nguyên tắc “phòng bệnh khi đã mắc bệnh” chị nói gì?"],
ans:`<p><b>1.</b> Ngồi lâu hại cơ nhục; nhìn lâu (màn hình) hại huyết; lao động thể lực ít làm béo bệu, nê trệ; ăn mặn nhiều làm mạch dễ ngưng trệ; ăn cay nhiều làm gân cơ co cứng. <span class="pg">LL tr.170–171</span></p>
<p><b>2.</b> Nâng cao chính khí: giữ tinh thần thư thái; ngủ dậy theo mùa; ăn uống điều độ, giảm mặn, giảm cay; xen kẽ nghỉ, vận động, rèn luyện (khí công, dưỡng sinh). <span class="pg">LL tr.170–171</span></p>
<p><b>3.</b> Không nên để tự khỏi: <b>chẩn đoán sớm, điều trị ngay từ đầu</b> để ngăn bệnh từ biểu vào lý, từ nhẹ sang nặng. <span class="pg">LL tr.171</span> (Liên hệ bài 1.05: chính khí tồn nội, tà bất khả can.)</p>`},
cards:[["Hai nội dung lớn của phòng bệnh?","Phòng bệnh khi chưa mắc bệnh; phòng bệnh khi đã mắc bệnh."],["Phòng bệnh khi chưa mắc: cốt lõi?","Nâng cao chính khí qua điều dưỡng tinh thần, rèn luyện thể lực."],["Ngủ dậy theo bốn mùa?","Xuân dậy sớm, đi bách bộ; hè dậy sớm, thở khí công; thu dậy lúc tảng sáng; đông ngủ sớm dậy muộn, giữ ấm."],["Ngũ vị thiên lệch hại gì?","Nóng: hại trường vị. Béo ngọt: mụn nhọt. Mặn: mạch ngưng trệ. Cay: gân cơ co cứng. Chua: cơ bắp mềm nhẽo."],["Nhìn, nằm, ngồi, đứng, đi lâu hại gì?","Huyết, khí, cơ nhục, cốt tủy, cân."],["Lao động ít / quá mức?","Ít: béo bệu, nê trệ. Quá mức: hao tổn, gầy mòn."],["Phụ nữ khi hành kinh?","Giữ ấm, kiêng sống lạnh, không lao động nặng, không giao hợp, tinh thần thoải mái."],["Phòng bệnh khi đã mắc?","Chẩn đoán sớm, điều trị ngay; ngăn nhẹ sang nặng, biểu vào lý, biến chứng; hộ lý; cách ly bệnh truyền nhiễm."],["Tác phẩm dưỡng sinh của Hải Thượng Lãn Ông theo sách?","Vệ sinh quyết yếu."]],

const SRC_CD="Chẩn đoán YHCT (ĐHYD TP.HCM 2021)";
Object.assign(LESSONS,{
"2.01":{id:"2.01",tang:2,title:"Đại cương chẩn đoán học",han:"中医诊断学概论",src:SRC_CD+", tr.3–16",
hook:"Một người đến khám vì đau lưng mạn tính. Chị có nên hỏi họ về đại tiện, tiểu tiện, cảm giác nóng lạnh không, dù những thứ đó chẳng liên quan gì đến lưng?",
reading:`
<p><b>Chẩn đoán YHCT</b> là quá trình thăm khám người bệnh để tìm ra bệnh lý dựa trên các học thuyết cơ bản; là <b>cầu nối từ lý luận cơ bản đến lâm sàng</b>. <span class="pg">tr.3</span></p>
<p><b>Quy trình gồm 2 giai đoạn</b> <span class="pg">tr.3–5</span></p>
<table><tr><th>Chẩn (thăm khám)</th><th>Đoán (phán đoán, quyết định)</th></tr>
<tr><td><b>Tứ chẩn</b>: <b>Vọng</b> (nhìn thần, sắc, lưỡi, chất tiết); <b>Văn</b> (nghe âm thanh, ngửi mùi); <b>Vấn</b> (hỏi người bệnh, người nhà: triệu chứng, nguyên nhân, tiền sử, môi trường, thói quen, thuốc đang dùng); <b>Thiết</b> (sờ, ấn, xem mạch)</td><td>1. Xác định triệu chứng có ý nghĩa: <b>cơ năng</b> (cảm giác chủ quan, chủ yếu qua vấn chẩn) và <b>thực thể</b> (dữ liệu khách quan như mặt nhợt, lưỡi đỏ, mạch hoạt, qua vọng, văn, thiết).<br>2. <b>Biện chứng</b>: xếp triệu chứng vào hội chứng (một “bức tranh” phản ánh rối loạn cụ thể). <b>Biện bệnh</b>: xác định bệnh danh</td></tr></table>
<p><b>Cơ sở lý luận (cách tư duy)</b> <span class="pg">tr.5–7</span></p>
<ul><li><b>So sánh</b> (“quy đạc kỳ hằng”: lấy cái bình thường đo cái biến hóa): một hơi thở (định tức) mạch đập 4 nhịp; nhanh hơn là sác, chậm hơn là trì.</li>
<li><b>Diễn dịch</b>: tức khắc (đặc điểm của nhiệt là sưng, nóng, đỏ, đau → chỗ nào sưng nóng đỏ đau là nhiệt); tam đoạn luận (âm hư sinh nội nhiệt; nhiệt nhiễu tâm thần dễ mất ngủ → người âm hư có thể mất ngủ).</li>
<li><b>Loại suy</b>: trời lạnh nước đóng băng → “huyết gặp hàn thì ngưng”; nước chảy chỗ trũng → thấp gây bệnh ở phía dưới; rút củi thì lửa hạ → “rút củi đáy nồi” (tả hạ trị nhiệt); nước đủ thuyền mới trôi → “tăng dịch thuyền trôi” chữa táo bón.</li>
<li><b>Xem ngoài biết trong</b>: “Hữu ư trung tất hình ư ngoại”; mỗi phần cơ thể phản ánh toàn thân, nên có thiệt chẩn.</li>
<li><b>Thăm dò, phản chứng</b>: đi từ kết quả về nguyên nhân: bổ can thấy sáng mắt → can liên quan mắt; bổ thận giảm ù tai → thận liên quan tai.</li>
<li>Và <b>quan sát vĩ mô</b>: kết hợp tự nhiên (thiên văn, khí tượng, địa lý, xã hội) với con người.</li></ul>
<p><b>Ba nguyên tắc chung</b> <span class="pg">tr.8–13</span></p>
<ol><li><b>Tiếp cận theo thiên nhân hợp nhất</b>: cơ thể là chỉnh thể (bệnh can hiện ra mắt, bệnh thận hiện ra tai); con người hợp nhất với môi trường tự nhiên, xã hội (khí hậu, địa lý, nghề nghiệp, áp lực sống).</li>
<li><b>Phối hợp tứ chẩn</b>: bốn phép bổ sung, kiểm tra lẫn nhau. Ví dụ đau gối: vấn (đau dữ dội, hạn chế vận động) + vọng (sưng đỏ) + thiết (nóng, cự án, mạch sác) → <b>nhiệt tý</b>.</li>
<li><b>Kết hợp biện chứng và biện bệnh</b>: <b>bệnh</b> là toàn bộ quá trình; <b>hội chứng</b> là một giai đoạn cụ thể. Một bệnh qua nhiều hội chứng, một hội chứng gặp ở nhiều bệnh. <b>Pháp trị dựa trên hội chứng.</b> Ví dụ tọa cốt phong: giai đoạn cấp là khí trệ huyết ứ (hành khí hoạt huyết); giai đoạn muộn là can thận âm hư (bổ can thận).</li></ol>
<p><b>Vấn chẩn của YHCT hỏi rộng</b> <span class="pg">tr.12</span>: người đau lưng mạn tính mà có lạnh hai chân, đại tiện lỏng, tiểu trong lượng nhiều thì những dấu hiệu “không liên quan” ấy lại giúp chẩn đoán <b>đau lưng thể thận dương hư</b>.</p>`,
checkTitle:"Trình tự một lần khám",
checklist:["Vọng: thần, sắc, hình thái, lưỡi, chất tiết","Văn: giọng nói, hơi thở, tiếng ho; mùi","Vấn: lý do đến khám, khởi phát, diễn tiến; rồi Thập vấn (kể cả những thứ “không liên quan”)","Thiết: mạch, sờ nắn vùng bệnh","Đoán: lọc triệu chứng có ý nghĩa → biện chứng (hội chứng) + biện bệnh (bệnh danh) → pháp trị theo hội chứng"],
quiz:[
{q:"Quy trình chẩn đoán YHCT gồm hai giai đoạn:",o:[["Vọng và Thiết","Sai: đó là hai trong tứ chẩn."],["Chẩn (thăm khám) và Đoán (phán đoán, quyết định)","Đúng."],["Biện bệnh và điều trị","Sai."],["Hỏi bệnh và xem mạch","Sai."]],a:1,p:"3"},
{q:"Triệu chứng cơ năng chủ yếu thu thập qua:",o:[["Vọng chẩn","Sai: vọng thu thập dấu hiệu thực thể."],["Vấn chẩn","Đúng: cơ năng là cảm giác chủ quan của người bệnh."],["Thiết chẩn","Sai."],["Văn chẩn","Sai."]],a:1,p:"4–5"},
{q:"“Đặc điểm của nhiệt là sưng, nóng, đỏ, đau → chỗ nào sưng nóng đỏ đau là nhiệt” là phương pháp:",o:[["Loại suy","Sai."],["So sánh","Sai."],["Diễn dịch","Đúng: diễn dịch tức khắc, từ tiền đề đến kết luận."],["Phản chứng","Sai."]],a:2,p:"6"},
{q:"Thấy nước chảy về chỗ trũng, suy ra thấp gây bệnh ở phía dưới. Đây là phương pháp:",o:[["Loại suy","Đúng."],["Diễn dịch","Sai."],["Phản chứng","Sai."],["Xem ngoài biết trong","Sai."]],a:0,p:"6"},
{q:"Bổ can thấy sáng mắt, suy ra can liên quan mắt. Đây là:",o:[["So sánh","Sai."],["Phản chứng","Đúng: đi từ kết quả về nguyên nhân."],["Loại suy","Sai."],["Diễn dịch","Sai."]],a:1,p:"7"},
{q:"Xem lưỡi mà phán đoán được bệnh toàn cơ thể dựa trên nguyên lý:",o:[["Xem ngoài biết trong","Đúng: “Hữu ư trung tất hình ư ngoại”."],["So sánh","Sai."],["Diễn dịch","Sai."],["Phản chứng","Sai."]],a:0,p:"7"},
{q:"Theo sách, pháp trị dựa chủ yếu vào:",o:[["Bệnh danh","Sai: nếu chỉ xác định bệnh thì rất khó chọn pháp trị."],["Hội chứng ở thời điểm thăm khám","Đúng."],["Tuổi người bệnh","Sai."],["Mạch đơn thuần","Sai."]],a:1,p:"13"},
{q:"Ví dụ tọa cốt phong của sách cho thấy điều gì?",o:[["Một bệnh chỉ có một hội chứng","Sai."],["Một bệnh qua nhiều giai đoạn có thể có các hội chứng khác nhau, nên pháp trị khác nhau","Đúng: cấp là khí trệ huyết ứ, muộn là can thận âm hư."],["Không cần biện bệnh","Sai."],["Tọa cốt phong luôn là can thận âm hư","Sai."]],a:1,p:"13"},
{q:"Theo Nội kinh (sách dẫn), một hơi thở mạch người bình thường đập:",o:[["2 nhịp","Sai."],["4 nhịp","Đúng: nhanh hơn là sác, chậm hơn là trì."],["6 nhịp","Sai."],["8 nhịp","Sai."]],a:1,p:"5–6"}
],
case:{v:"Nam, 55 tuổi, đến khám vì đau lưng âm ỉ nhiều năm. Hỏi thêm thì biết hai chân hay lạnh, đại tiện lỏng, tiểu trong và nhiều.",
qs:["Vì sao YHCT vẫn hỏi đại tiện, tiểu tiện, nóng lạnh ở người đau lưng?","Các dấu hiệu này gợi ý hội chứng gì theo sách?","Nếu sau 6 tháng điều trị, người này chuyển sang nóng trong, lòng bàn tay chân nóng, thì chẩn đoán và pháp trị có giữ nguyên không? Vì sao?"],
ans:`<p><b>1.</b> Vấn chẩn YHCT đánh giá rộng các chức năng cơ bản (nóng lạnh, đại tiểu tiện, mồ hôi, khát…); những triệu chứng “không liên quan” vẫn có giá trị biện chứng. <span class="pg">CĐ tr.12</span></p>
<p><b>2.</b> Đau lưng thể <b>thận dương hư</b>: lạnh hai chân, đại tiện lỏng, tiểu trong lượng nhiều. <span class="pg">CĐ tr.12</span> (Liên hệ bài 1.12: thận dương hư thì ngoại hàn.)</p>
<p><b>3.</b> <b>Không.</b> Bệnh (đau lưng) vẫn vậy nhưng <b>hội chứng</b> đã đổi (dấu hiệu âm hư sinh nội nhiệt); pháp trị dựa trên hội chứng nên phải đổi theo. <span class="pg">CĐ tr.13</span></p>`},
cards:[["Hai giai đoạn của chẩn đoán YHCT?","Chẩn (thăm khám bằng tứ chẩn) và Đoán (biện chứng, biện bệnh, quyết định)."],["Tứ chẩn?","Vọng (nhìn), Văn (nghe, ngửi), Vấn (hỏi), Thiết (sờ, xem mạch)."],["Triệu chứng cơ năng / thực thể?","Cơ năng: cảm giác chủ quan (qua vấn). Thực thể: dữ liệu khách quan (qua vọng, văn, thiết)."],["Biện chứng / biện bệnh?","Biện chứng: xếp triệu chứng vào hội chứng. Biện bệnh: xác định bệnh danh."],["“Quy đạc kỳ hằng” là phương pháp gì?","So sánh: lấy cái bình thường đo cái biến hóa."],["Ví dụ loại suy trong điều trị?","Rút củi đáy nồi (tả hạ trị nhiệt); tăng dịch thuyền trôi (chữa táo bón)."],["Phản chứng là gì? Ví dụ?","Đi từ kết quả về nguyên nhân: bổ can sáng mắt, bổ thận giảm ù tai."],["Ba nguyên tắc chung trong chẩn đoán?","Thiên nhân hợp nhất; phối hợp tứ chẩn; kết hợp biện chứng và biện bệnh."],["Bệnh và hội chứng khác nhau?","Bệnh: toàn bộ quá trình. Hội chứng: một giai đoạn. Pháp trị dựa trên hội chứng."]],
